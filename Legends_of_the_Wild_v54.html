// BATTLE SYSTEM
function startBattleWith(enemy, sizeClass, additionalEnemies = []){
    const activeReady=getActiveStudents().filter(s=>s.cid);

    // Combine main enemy with additional enemies
    const allEnemies = [enemy, ...additionalEnemies];

    state.battle={
        enemy: enemy, // Primary enemy for backwards compatibility
        enemies: allEnemies, // All enemies array
        currentEnemyIdx: 0, // Track which enemy is being targeted
        sizeClass: sizeClass,
        team: activeReady.map(s=>{
            const l=getLv(s.xp),st=getStats(s.cid,l,s.nature);
            // v54.4: HP PERSISTENCE - Use stored HP if available, otherwise full HP
            // Creatures DON'T auto-heal between battles - must Rest!
            const persistedHp = (s.curHp !== undefined && s.curHp > 0) ? Math.min(s.curHp, st.hp) : st.hp;
            const persistedFocus = (s.curFocus !== undefined) ? s.curFocus : STARTING_FOCUS;

            // v54.6: Copy buffs from student to battle member
            const battleBuffs = s.buffs ? [...s.buffs] : [];

            debugLog('COMBAT', `${s.name} enters battle | HP: ${persistedHp}/${st.hp} | Focus: ${persistedFocus} | Buffs: ${battleBuffs.length}`);

            return{...s,lv:l,curHp:persistedHp,maxHp:st.hp,st,def:false,cooldown:0,
                focus:persistedFocus,focusMax:MAX_FOCUS,focusRegen:FOCUS_REGEN_PER_TURN,
                buffs:battleBuffs};
        }),
        isMultiEnemy: allEnemies.length > 1
    };
    state.log=[];
    
    buildTurnOrder();
    currentScreen='battle';
    renderNav();
    
    // CRITICAL: Set initial processing state BEFORE first render
    const firstTurn = battleQueue[0];
    if(firstTurn?.type === 'enemy'){
        processing = true;
    } else {
        processing = false;
    }
    
    renderMain();
    updateMusic(); // Start battle music
    
    // Now execute first turn logic
    if(firstTurn?.type === 'enemy'){
        setTimeout(enemyAction, 800);
    }
}

function buildTurnOrder(){
    const b=state.battle;
    battleQueue=[];

    // v54.6: Reset item used tracking for new round
    b.itemUsedThisTurn = {};

    // Add all player team members
    b.team.forEach((m,i)=>{
        if(m.curHp>0) battleQueue.push({type:'player',idx:i,spd:m.st.spd});
    });

    // Add all enemies
    b.enemies.forEach((e,i)=>{
        if(e.hp>0) battleQueue.push({type:'enemy',idx:i,spd:e.spd});
    });

    battleQueue.sort((a,b)=>b.spd-a.spd);
    turnIdx=0;
}

function getAliveEnemies(){
    return state.battle.enemies.filter(e => e.hp > 0);
}

function getCurrentEnemy(){
    const alive = getAliveEnemies();
    if(!alive.length) return null;
    // Return the first alive enemy, or the targeted one if still alive
    const targeted = state.battle.enemies[state.battle.currentEnemyIdx];
    if(targeted && targeted.hp > 0) return targeted;
    return alive[0];
}

function nextTurn(){
    if(!state.battle)return;
    const b=state.battle;
    
    // CRITICAL SAFETY: If processing flag stuck for >5 seconds, force clear
    if(processing){
        const now = Date.now();
        if(!window.lastProcessingCheck){
            window.lastProcessingCheck = now;
            console.warn('nextTurn blocked: processing flag set, starting timeout...');
            setTimeout(() => {
                if(processing){
                    console.error('CRITICAL: Processing flag stuck for 5s, forcing clear!');
                    processing = false;
                    nextTurn(); // Retry turn
                }
            }, 5000);
            return;
        } else if(now - window.lastProcessingCheck > 5000){
            console.error('CRITICAL: Processing timeout exceeded, forcing clear!');
            processing = false;
            window.lastProcessingCheck = null;
        } else {
            console.warn('nextTurn blocked: summon animation in progress');
            return;
        }
    }
    window.lastProcessingCheck = null; // Clear timeout tracker
    
    // Check win/lose conditions
    const aliveEnemies = getAliveEnemies();
    if(aliveEnemies.length === 0){setTimeout(()=>endBattle(true),500);return}
    if(!b.team.some(m=>m.curHp>0)){setTimeout(()=>endBattle(false),500);return}
    
    if(turnIdx>=battleQueue.length){
        console.log('Turn order exhausted, rebuilding...');
        buildTurnOrder();
    }
    
    let cur=battleQueue[turnIdx];
    
    // SAFETY: Prevent infinite loop if no valid turns
    let safetyCounter = 0;
    while(cur?.type==='player'&&b.team[cur.idx]?.curHp<=0){
        turnIdx++;
        if(turnIdx>=battleQueue.length)buildTurnOrder();
        cur=battleQueue[turnIdx];
        safetyCounter++;
        if(safetyCounter > 20){
            console.error('CRITICAL: Infinite loop detected in turn skipping!');
            buildTurnOrder();
            cur=battleQueue[0];
            turnIdx=0;
            break;
        }
    }
    
    console.log(`Turn ${turnIdx}: ${cur?.type} ${cur?.idx} (processing=${processing})`);
    
    // Reduce cooldowns (special and heal)
    b.team.forEach(m=>{
        if(m.cooldown>0)m.cooldown--;
        if(m.healCooldown>0)m.healCooldown--;  // v54.6: heal cooldown
    });
    
    // FOCUS REGEN - At start of player's turn
    if(cur?.type==='player'){
        const m = b.team[cur.idx];
        if(m && m.curHp > 0){
            const oldFocus = m.focus;
            m.focus = Math.min(m.focusMax, m.focus + m.focusRegen);
            if(m.focus > oldFocus){
                state.log.push({t:'focus',m:`🔷 ${m.name} regains ${m.focus - oldFocus} Focus`});
            }
        }
    }
    
    processing=false;
    renderMain();
    
    if(cur?.type==='enemy'){
        processing=true;
        setTimeout(enemyAction,800);
    }
}

function renderBattle(m){
    if(!state.battle){currentScreen='adventure';renderAdventure(m);return}
    
    const b=state.battle;
    const enemy=getCurrentEnemy() || b.enemy;
    const cur=battleQueue[turnIdx];
    const isPlayer=cur?.type==='player';
    const activeIdx=isPlayer?cur.idx:-1;
    const activeMember=isPlayer?b.team[activeIdx]:null;
    
    // Check abilities
    const hasHeal=activeMember&&CREATURES[activeMember.cid]?.canHeal&&getMove(activeMember.cid,activeMember.lv,'heal');
    const hasSpec=activeMember&&getMove(activeMember.cid,activeMember.lv,'spec');
    const canSpec=hasSpec&&activeMember.cooldown===0;
    const buttonsDisabled = !isPlayer || processing;
    
    // Boss size class
    let sizeClass = 'wild';
    if(enemy.isBoss){
        if(enemy.tier === 4 || enemy.isCreator) sizeClass = 'nightmare';
        else if(enemy.tier === 3) sizeClass = 'tier3';
        else if(enemy.tier === 2) sizeClass = 'tier2';
        else sizeClass = 'tier1';
    }
    
    let html=`<div class="battle-container" id="battleArena" style="background-image:url('${G}/Backgrounds/${b.enemy.bg||'Backgrounds_DarkForest.png'}')">`;
    
    // Header
    html+=`<div class="battle-header">
        <div class="battle-type">${enemy.isBoss?'⚔️ BOSS BATTLE':'🗡️ Wild Encounter'}</div>
        ${processing ? `<button onclick="processing=false;nextTurn();renderMain();" style="background:#f87171;color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:.7rem;">⚠️ Unstuck</button>` : ''}
    </div>`;
    
    // ============================================
    // V43: TURN ORDER TRACKER - Top center (v54.1: Added names)
    // ============================================
    html+=`<div class="turn-order-bar">`;
    const upcomingTurns = battleQueue.slice(turnIdx, Math.min(turnIdx + 7, battleQueue.length));
    upcomingTurns.forEach((turn, offset) => {
        const isActive = offset === 0;
        const isKO = turn.type === 'player' ?
            b.team[turn.idx].curHp <= 0 :
            b.enemies[turn.idx].hp <= 0;

        let portraitClass = `turn-order-portrait ${turn.type}`;
        if(isActive) portraitClass += ' active';
        if(isKO) portraitClass += ' ko';

        const imgSrc = turn.type === 'player' ?
            getImg(b.team[turn.idx].cid, b.team[turn.idx].lv) :
            `${G}/${b.enemies[turn.idx].img}`;

        // v54.1: Get name for turn order display
        let turnName = '';
        if(turn.type === 'player'){
            const member = b.team[turn.idx];
            turnName = member.name || 'Hero';
        } else {
            turnName = b.enemies[turn.idx].name || 'Enemy';
        }
        // Truncate long names
        const displayName = turnName.length > 8 ? turnName.substring(0, 7) + '…' : turnName;

        html+=`<div class="${portraitClass}">
            <img src="${imgSrc}" onerror="this.style.opacity='0.3'">
            <span class="turn-order-name">${displayName}</span>
        </div>`;
    });
    html+=`</div>`;
    
    // ============================================
    // ARENA - Where combat happens
    // ============================================
    html+=`<div class="battle-arena">`;
    
    // LEFT - Player Party in staggered columns
    const partySize = b.team.length;
    const isSoloParty = partySize <= 2;
    const isSmallParty = partySize === 3;
    const isMediumParty = partySize > 3 && partySize <= 6;
    const isLargeParty = partySize > 6;
    const numColumns = partySize <= 3 ? 1 : partySize <= 6 ? 2 : 3;
    
    let partyClass = 'player-arena';
    if(isSoloParty) partyClass += ' solo-party';
    else if(isSmallParty) partyClass += ' small-party';
    else if(isMediumParty) partyClass += ' medium-party';
    else if(isLargeParty) partyClass += ' large-party';
    
    html+=`<div class="${partyClass}">`;
    
    // Distribute into columns
    const columns = [[],[],[]];
    b.team.forEach((tm, i) => {
        const colIdx = i % numColumns;
        columns[colIdx].push({...tm, idx: i});
    });
    
    // Render columns
    columns.forEach((col, colIdx) => {
        if(col.length === 0) return;
        const colClass = colIdx === 0 ? '' : colIdx === 1 ? ' col-2' : ' col-3';
        html+=`<div class="arena-column${colClass}">`;
        
        col.forEach(tm => {
            const c = CREATURES[tm.cid];
            const evoIdx = getEvo(tm.cid, tm.lv);
            const isActive = tm.idx === activeIdx;
            const isKO = tm.curHp <= 0;
            const isHealTarget = b.healTargetingMode && tm.curHp < tm.maxHp && tm.curHp > 0;
            
            let classes = 'arena-creature';
            if(isKO) classes += ' ko';
            if(isActive && !isKO) classes += ' active active-turn';
            if(isHealTarget) classes += ' heal-target';
            
            html+=`<div class="${classes}" id="arenaC${tm.idx}" ${isHealTarget?`onclick="selectHealTarget(${tm.idx})"`:''}">
                ${isActive && !isKO ? '<span class="active-arrow">▼</span>' : ''}
                
                <div class="ground-circle"></div>
                <div class="arena-frame evo${evoIdx+1}" id="c${tm.idx}">
                    <img src="${getImg(tm.cid, tm.lv)}" onerror="this.style.opacity='0.3'">
                </div>
                
                <!-- Minimalist HP/Focus bars below creature (Pokemon style - no numbers) -->
                <div class="creature-bars-minimal">
                    <div class="minimal-bar hp-minimal">
                        <div class="minimal-bar-fill hp-fill-minimal" style="width:${Math.max(0,(tm.curHp/tm.maxHp)*100)}%"></div>
                    </div>
                    <div class="minimal-bar focus-minimal">
                        <div class="minimal-bar-fill focus-fill-minimal" style="width:${Math.max(0,(tm.focus/tm.focusMax)*100)}%"></div>
                    </div>
                </div>
            </div>`;
        });
        html+=`</div>`;
    });
    html+=`</div>`;
    
    // RIGHT - Enemy Side with staggered columns (like players)
    const allEnemies = b.enemies || [enemy];
    const aliveEnemies = allEnemies.filter(e => e.hp > 0);
    const isTargeting = b.targetingMode;
    const boss = allEnemies.find(e => e.isBoss && e.hp > 0);
    const minions = allEnemies.filter(e => e.isMinion && e.hp > 0);
    const wildEnemies = allEnemies.filter(e => !e.isBoss && !e.isMinion && e.hp > 0);
    
    // When boss dies, minions become regular enemies for rendering purposes
    const remainingEnemies = boss ? wildEnemies : [...wildEnemies, ...minions];
    
    // ADAPTIVE ENEMY SIZING - Solo enemies are BIG, groups are smaller
    const totalNonBoss = remainingEnemies.length + (boss ? minions.length : 0);
    let wildSizeClass = 'wild';
    if(totalNonBoss === 1 && !boss) wildSizeClass = 'wild-solo'; // Solo enemy = BIG
    else if(totalNonBoss >= 4) wildSizeClass = 'wild-tiny';
    else if(totalNonBoss >= 2) wildSizeClass = 'wild-small';
    
    html+=`<div class="enemy-arena">`;
    
    // If there's a boss, render minions FIRST (they appear on left/front), then boss on right
    if(boss){
        // Minions column FIRST (appears to the LEFT of boss = in front)
        if(minions.length > 0){
            html+=`<div class="minion-column">`;
            minions.forEach(e => {
                const idx = allEnemies.indexOf(e);
                const hpPct = (e.hp/e.maxHp)*100;
                const chipPct = ((e.chipHp!==undefined?e.chipHp:e.hp)/e.maxHp)*100;
                
                html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${idx}" onclick="${isTargeting?`selectTarget(${idx})`:''}">
                    <div class="enemy-hp-float" style="min-width:60px">
                        <div class="enemy-name" style="font-size:.55rem">${e.name}</div>
                        <div class="enemy-hp-bar" style="height:5px" id="enemyHpBar${idx}">
                            <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                            <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                        </div>
                    </div>
                    <div class="enemy-frame minion" id="enemyImg${idx}">
                        <img src="${G}/${e.img}">
                    </div>
                </div>`;
            });
            html+=`</div>`;
        }
        
        // Boss on the RIGHT (back)
        const bossIdx = allEnemies.indexOf(boss);
        const hpPct = (boss.hp/boss.maxHp)*100;
        const chipPct = ((boss.chipHp!==undefined?boss.chipHp:boss.hp)/boss.maxHp)*100;
        
        html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${bossIdx}" onclick="${isTargeting?`selectTarget(${bossIdx})`:''}">
            <div class="enemy-hp-float">
                <div class="enemy-name">${boss.name} <span style="font-size:.55rem;color:#777">Lv${boss.lv}</span></div>
                <div class="enemy-hp-bar" id="enemyHpBar${bossIdx}">
                    <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                    <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                </div>
            </div>
            <div class="enemy-frame ${sizeClass}" id="enemyImg${bossIdx}">
                <img src="${G}/${boss.img}">
            </div>
        </div>`;
    } else {
        // No boss (wild encounter OR boss died with minions remaining)
        // Use remainingEnemies which includes minions when boss is dead
        const enemyCount = remainingEnemies.length;
        const numEnemyCols = enemyCount <= 2 ? 1 : enemyCount <= 4 ? 2 : 3;
        
        // Distribute into columns
        const enemyColumns = [[],[],[]];
        remainingEnemies.forEach((e, i) => {
            const colIdx = i % numEnemyCols;
            enemyColumns[colIdx].push({...e, idx: allEnemies.indexOf(e)});
        });
        
        // Render columns (in reverse order so first column is rightmost)
        for(let colIdx = numEnemyCols - 1; colIdx >= 0; colIdx--){
            const col = enemyColumns[colIdx];
            if(col.length === 0) continue;
            
            const colClass = colIdx === 0 ? '' : colIdx === 1 ? ' col-2' : ' col-3';
            html+=`<div class="enemy-column${colClass}">`;
            
            col.forEach(e => {
                const hpPct = (e.hp/e.maxHp)*100;
                const chipPct = ((e.chipHp!==undefined?e.chipHp:e.hp)/e.maxHp)*100;
                const frameClass = e.isMinion ? 'wild-small' : wildSizeClass;
                
                html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${e.idx}" onclick="${isTargeting?`selectTarget(${e.idx})`:''}">
                    <div class="enemy-hp-float">
                        <div class="enemy-name">${e.name} <span style="font-size:.5rem;color:#777">Lv${e.lv}</span></div>
                        <div class="enemy-hp-bar" id="enemyHpBar${e.idx}">
                            <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                            <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                        </div>
                    </div>
                    <div class="enemy-frame ${frameClass}" id="enemyImg${e.idx}">
                        <img src="${G}/${e.img}">
                    </div>
                </div>`;
            });
            html+=`</div>`;
        }
    }
    
    html+=`</div></div>`; // End enemy-arena and battle-arena
    
    // ============================================
    // V46: NEW COMBAT UI ONLY - Old UI completely removed
    // ============================================
    
    // Battle Log (bottom-left corner) - v54.6: Collapsible, default expanded
    html+=`<div class="battle-log${state.battleLogCollapsed?' collapsed':''}" id="battleLog" style="position:absolute;top:60px;right:20px;width:320px;z-index:50">
        <div class="battle-log-header" onclick="toggleBattleLog()">
            <span class="battle-log-title">📜 Combat Log</span>
            <span class="battle-log-toggle">▼</span>
        </div>
        <div class="battle-log-content">
            ${state.log.filter(e=>e.t!=='focus').slice(0, 20).reverse().map(e=>`<div class="log-entry log-${e.t}">${e.m}</div>`).join('')}
        </div>
    </div>`;
    
    
    // ============================================
    // MOVE BUTTONS - Now at absolute bottom (no party HUD)
    // ============================================
    if(activeMember && isPlayer){
        html+=`<div class="move-buttons-container">`;
        
        let atkName='Attack', defName='Defend', healName='Heal', specName='Special';
        let atkCost=0, defCost=0, healCost=0, specCost=0;
        const atkMove = getMove(activeMember.cid, activeMember.lv, 'atk');
        const defMove = getMove(activeMember.cid, activeMember.lv, 'def');
        const healMove = getMove(activeMember.cid, activeMember.lv, 'heal');
        const specMove = getMove(activeMember.cid, activeMember.lv, 'spec');
        if(atkMove){ atkName = atkMove.n; atkCost = atkMove.f || 0; }
        if(defMove){ defName = defMove.n; defCost = defMove.f || 0; }
        if(healMove){ healName = healMove.n; healCost = healMove.f || 0; }
        // v54.1: Dynamic special cost based on evolution, power, and AOE
        if(specMove){
            specName = specMove.n;
            const evoStage = getEvo(activeMember.cid, activeMember.lv);
            specCost = calculateSpecialCost(evoStage, specMove.p * 100, specMove.n, false);
        }
        
        const canAffordHeal = activeMember.focus >= healCost;
        const healOnCooldown = activeMember.healCooldown > 0;  // v54.6: heal cooldown
        const canAffordSpec = activeMember.focus >= specCost && activeMember.cooldown === 0;

        html+=`<button class="move-btn attack" ${buttonsDisabled?'disabled':''} onclick="doAction('atk')">

            </button>

                <span class="move-name">🛡️ ${defName}</span>
                <span class="move-cost">+10 FP</span>
            </button>`;

        if(hasHeal){
            // v54.6: Show heal cooldown or focus cost
            const healDisabled = buttonsDisabled || !canAffordHeal || healOnCooldown;
            const healCostText = healOnCooldown ? `⏱️ ${activeMember.healCooldown}` : `${healCost} FP`;
            const healCostClass = healOnCooldown ? ' cooldown' : (!canAffordHeal ? ' insufficient' : '');
            html+=`<button class="move-btn heal" ${healDisabled?'disabled':''} onclick="doAction('heal')">
                <span class="move-name">💚 ${healName}</span>
                <span class="move-cost${healCostClass}">${healCostText}</span>
            </button>`;
        }
        
        if(hasSpec){
            const specType = getSpecialType(specName);
            const typeLabel = specType.isAOE ? '<span class="aoe-label">AOE</span>' : '<span class="st-label">ST</span>';
            html+=`<button class="move-btn special" ${buttonsDisabled||!canAffordSpec?'disabled':''} onclick="doAction('spec')">
                <span class="move-name">⚡ ${specName} ${typeLabel}${activeMember.cooldown>0?' ('+activeMember.cooldown+')':''}</span>
                <span class="move-cost${activeMember.focus<specCost?' insufficient':''}">${specCost} FP</span>
            </button>`;
        }
        
        // ITEMS BUTTON - Show usable items count
        // v54.6: Items are free actions but limited to 1 per turn
        const usableItems = getUsableBattleItems(activeMember);
        const itemCount = usableItems.length;
        const itemUsedThisTurn = b.itemUsedThisTurn && b.itemUsedThisTurn[activeIdx];
        const itemsDisabled = buttonsDisabled || itemCount === 0 || itemUsedThisTurn;
        html+=`<button class="move-btn items ${itemsDisabled ? 'disabled' : ''}" ${itemsDisabled ? 'disabled' : ''} onclick="openBattleItems()">
            <span class="move-name">🎒 Items</span>
            <span class="move-cost">${itemUsedThisTurn ? 'Used' : itemCount + ' available'}</span>
        </button>`;
        
        html+=`</div>`; // End move-buttons-container
    }

    // v54.6: Targeting overlays - removed attack overlay (red glow on enemies is enough)
    // Just show a subtle cancel button for attack targeting
    if(b.targetingMode){
        html += `<div style="position:absolute;bottom:180px;left:50%;transform:translateX(-50%);z-index:45">
            <button onclick="cancelTargeting()" style="padding:6px 14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,100,100,.5);border-radius:6px;color:#f99;cursor:pointer;font-family:'Cinzel',serif;font-size:.8rem">Cancel</button>
        </div>`;
    }

    // Heal targeting mode
    if(b.healTargetingMode){
        html += `<div class="targeting-overlay" style="border-color:#4ade80">
            <div style="color:#4ade80;font-family:'Cinzel',serif;font-size:1.2rem">💚 Click an ally to heal!</div>
            <button onclick="cancelHealTargeting()" style="margin-top:10px;padding:8px 16px;background:rgba(100,255,100,.3);border:1px solid #4ade80;border-radius:8px;color:#fff;cursor:pointer;font-family:'Cinzel',serif">Cancel</button>
        </div>`;
    }

    html+=`</div>`; // End battle-container
    m.innerHTML=html;
    
    const logEl = document.getElementById('battleLog');
    if(logEl) logEl.scrollTop = logEl.scrollHeight;
}

function doAction(a){
    if(!state.battle)return;
    
    // Safety check: if processing is stuck, reset it
    const cur=battleQueue[turnIdx];
    if(cur?.type==='player' && processing){
        console.warn('Processing flag stuck - resetting for player turn');
        processing = false;
    }
    
    const b=state.battle;
    if(cur?.type!=='player'){
        console.warn('doAction called but not player turn');
        return;
    }
    
    const m=b.team[cur.idx];
    if(!m||m.curHp<=0){turnIdx++;nextTurn();return}
    
    // Define activeIdx for animations - this is cur.idx
    const activeIdx = cur.idx;
    
    const c=CREATURES[m.cid];
    const el=document.getElementById('c'+cur.idx);
    m.def=false;
    
    // Clear any existing targeting modes when switching actions
    if(a !== 'heal'){
        b.healTargetingMode = false;
        b.healerIdx = null;
        b.healAmount = null;
    }
    
    // For attack and special, check if multiple enemies - need target selection
    const aliveEnemies = b.enemies.filter(e => e.hp > 0);
    
    // Only enter targeting mode if multiple enemies AND no target selected yet
    if((a==='atk' || a==='spec') && aliveEnemies.length > 1 && b.selectedTarget === undefined){
        // Enter targeting mode
        b.targetingMode = a;
        processing = false;
        renderMain();
        return;
    }
    
    // SAFETY: If we have a selected target OR only one enemy, we should proceed
    // Reset processing to allow action to go through
    if(b.selectedTarget !== undefined || aliveEnemies.length === 1){
        processing = false;
    }
    
    if(processing) return;
    processing = true;
    
    // Get target (selected or first alive enemy)
    let targetIdx = 0;
    if(b.selectedTarget !== undefined && b.selectedTarget !== null){
        targetIdx = b.selectedTarget;
    } else {
        targetIdx = b.enemies.findIndex(e => e.hp > 0);
    }
    
    // CRITICAL: Validate target exists
    if(targetIdx < 0 || !b.enemies[targetIdx]){
        console.error('No valid target found, ending battle');
        processing = false;
        setTimeout(() => endBattle(true), 100);
        return;
    }
    
    let targetEnemy = b.enemies[targetIdx];

    // CRITICAL: Double-check target is alive
    if(targetEnemy.hp <= 0){
        console.error('Target is dead, skipping turn');
        processing = false;
        turnIdx++;
        renderMain();
        setTimeout(nextTurn, 300);
        return;
    }

    // v54.4: MINION SHIELD MECHANIC - Must kill minions before attacking boss!
    // If targeting boss and minions are alive, redirect to a random minion
    if(targetEnemy.isBoss && (a === 'atk' || a === 'spec')){
        const aliveMinions = b.enemies.filter(e => e.isMinion && e.hp > 0);
        if(aliveMinions.length > 0){
            // Redirect attack to random alive minion
            const redirectedMinion = aliveMinions[Math.floor(Math.random() * aliveMinions.length)];
            targetIdx = b.enemies.indexOf(redirectedMinion);
            targetEnemy = redirectedMinion;
            addLog(`🛡️ ${b.enemy.name} is shielded by minions! Attack redirected to ${redirectedMinion.name}!`, 'def');
            debugLog('COMBAT', `Minion shield active! Redirected attack from boss to ${redirectedMinion.name}`);
        }
    }

    b.selectedTarget = undefined;
    b.targetingMode = false;

    if(a==='atk'){
        const mv=getMove(m.cid,m.lv,'atk');
        const moveName = mv?.n || 'Attack';
        const element = mv?.e || CREATURES[m.cid]?.type?.toLowerCase() || 'default';
        
        // v54.6: Base damage: ATK * move power - enemy DEF reduction (balanced from 0.3 to 0.2)
        let baseDmg = m.st.atk * (mv?.p || 1);
        let defReduction = targetEnemy.def * 0.2;
        let d = Math.max(5, baseDmg - defReduction);
        d = Math.floor(d * (.9 + Math.random() * .2));

        // v54.6: Apply damage_buff from shop items
        const damageBuff = getBuffValue(m, 'damage_buff');
        if(damageBuff > 0) d = Math.floor(d * (1 + damageBuff));

        // BALANCED CRIT: 5% base + 0.1% per level (max ~10% at lv50)
        // v54.6: Add crit_buff from shop items
        const critBuff = getBuffValue(m, 'crit_buff');
        const critChance = Math.min(0.25, 0.05 + (m.lv * 0.001) + critBuff);
        const isCrit = Math.random() < critChance;
        if(isCrit) d = Math.floor(d * 1.5);
        
        // Show action banner
        showActionBanner(m.name||'Hero', moveName, d, 'attack', isCrit);
        
        // ATTACKER WINDUP + DASH ANIMATION
        const arenaCreature = document.getElementById('arenaC'+activeIdx);
        if(arenaCreature){
            arenaCreature.classList.add('anim-windup');
            setTimeout(()=>{
                arenaCreature.classList.remove('anim-windup');
                arenaCreature.classList.add('anim-dash-right');
                setTimeout(()=>arenaCreature.classList.remove('anim-dash-right'),250);
            }, 150);
        }
        
        const enemyEl = document.getElementById('enemyImg'+targetIdx);

        // v54.6: ENHANCED ATTACK ANIMATIONS - Type-based on move name
        // Determine attack animation type based on move name
        const attackAnimType = getAttackAnimationType(moveName, element);

        setTimeout(()=>{
            // Show element trail particles along projectile path
            showElementTrail(arenaCreature, enemyEl, element);

            // For beam-type attacks, show beam instead of projectile
            if(attackAnimType === 'beam'){
                showBeamAttack(arenaCreature, enemyEl, element);
            }

            fireProjectile(arenaCreature, enemyEl, element, ()=>{
                playSound(isCrit ? 'crit' : 'hit');

                // Store chip HP for delayed drain effect
                targetEnemy.chipHp = targetEnemy.hp;
                targetEnemy.hp = Math.max(0, targetEnemy.hp - d);

                // Show impact effect
                showImpactEffect(enemyEl, isCrit, element);

                // v54.6: Type-based attack animation matched to move name
                showAttackAnimationByType(enemyEl, moveName, element, isCrit);
                
                // TARGET SHAKE ANIMATION
                if(enemyEl){
                    enemyEl.classList.add(isCrit ? 'anim-crit-shake' : 'anim-hit-shake');
                    enemyEl.classList.add('anim-hit-flash');
                    setTimeout(()=>{
                        enemyEl.classList.remove('anim-hit-shake','anim-crit-shake','anim-hit-flash');
                    },300);
                }
                
                // HP BAR DAMAGE FLASH + UPDATE
                const hpBar = document.getElementById('enemyHpBar'+targetIdx);
                if(hpBar){
                    // Update HP bar width immediately
                    const hpFill = hpBar.querySelector('.enemy-hp-fill');
                    const chipFill = hpBar.querySelector('.enemy-hp-chip');
                    if(hpFill){
                        const newPct = (targetEnemy.hp / targetEnemy.maxHp) * 100;
                        hpFill.style.width = newPct + '%';
                    }
                    if(chipFill){
                        const chipPct = (targetEnemy.chipHp / targetEnemy.maxHp) * 100;
                        chipFill.style.width = chipPct + '%';
                    }
                    // Add damage flash animation
                    hpBar.classList.add('anim-damage');
                    setTimeout(()=>hpBar.classList.remove('anim-damage'),300);
                }
                
                // CRIT FLASH - white screen flash on any crit
                if(isCrit){
                    const flashDiv = document.createElement('div');
                    flashDiv.className = 'crit-flash';
                    document.body.appendChild(flashDiv);
                    setTimeout(()=>flashDiv.remove(), 300);
                }
                
                // SCREEN SHAKE only on VERY big hits
                if(isCrit && d > 100){
                    const arena = document.getElementById('battleArena');
                    if(arena){
                        arena.classList.add('screen-shake');
                        setTimeout(()=>arena.classList.remove('screen-shake'),300);
                    }
                }
                
                // FLOATING DAMAGE NUMBER
                showFloatingDamage(enemyEl, d, isCrit ? 'crit' : 'damage');
                
                // Add to battle log
                addLog(`${m.name||'Hero'} used ${moveName}! ${d} damage${isCrit?' (CRIT!)':''}`, 'dmg');
                
                // CRITICAL: Clear processing flag BEFORE checking for summon
                processing = false;
                
                // Check if boss should summon minions (at 40% HP)
                // This may set processing = true if summon happens
                checkBossMinionSummon();
                
                // CRITICAL: Only advance turn if NOT processing (e.g., summon animation started)
                // If processing is true, the summon callback will call nextTurn()
                if(!processing){
                    turnIdx++;
                    renderMain();
                    setTimeout(nextTurn, 500);
                }
            });

            // v54.6: BACKUP PROCESSING CLEARER - prevents stuck flag if animation callback fails
            setTimeout(() => {
                if(processing && state.battle) {
                    console.warn('Backup: clearing processing flag after attack animation');
                    processing = false;
                    if(state.battle && !document.querySelector('.action-banner')){
                        nextTurn();
                    }
                }
            }, 2500);
        }, 200);

    }else if(a==='def'){
        const mv=getMove(m.cid,m.lv,'def');
        const moveName = mv?.n || 'Defend';
        const creatureType = CREATURES[m.cid]?.type?.toLowerCase() || 'default';
        m.def=true;

        // Show action banner
        showActionBanner(m.name||'Hero', moveName, 0, 'defend');

        // Add to battle log
        addLog(`${m.name||'Hero'} used ${moveName}!`, 'def');

        if(el){
            el.classList.add('anim-defend');
            setTimeout(()=>el.classList.remove('anim-defend'),400);
        }

        // v54.6: Show defend animation based on move name
        const arenaCreature = document.getElementById('arenaC'+activeIdx);
        if(arenaCreature){
            showDefendAnimation(arenaCreature, moveName, creatureType);
        }

        // v54.6: DEFEND gives +10 Focus bonus (increased from +5 to make defending worthwhile)
        m.focus = Math.min(m.focusMax, m.focus + 10);
        addLog(`${m.name||'Hero'} braces and gains +10 Focus!`, 'def');

        turnIdx++;
        renderMain();
        setTimeout(nextTurn,500);
        
    }else if(a==='heal'){
        if(c.canHeal){
            const mv=getMove(m.cid,m.lv,'heal');
            if(mv){
                // v54.6: Check heal cooldown (2-turn cooldown like specials but shorter)
                if(m.healCooldown && m.healCooldown > 0){
                    addLog(`${m.name||'Hero'} can't heal yet! (${m.healCooldown} turns left)`, 'dmg');
                    processing = false;
                    renderMain();
                    return;
                }
                const healCost = mv.f || 0;
                // Check if enough focus
                if(m.focus < healCost){
                    addLog(`${m.name||'Hero'} doesn't have enough Focus! (Need ${healCost})`, 'dmg');
                    processing = false;
                    renderMain();
                    return;
                }
                processing = false; // Reset so heal targeting works
                showHealTargetSelection(cur.idx, mv);
                return;
            }
        }
        // Can't heal - do attack instead
        processing = false;
        doAction('atk');
        return;
        
    }else if(a==='spec'){
        const mv=getMove(m.cid,m.lv,'spec');
        if(mv&&m.cooldown===0){
            // v54.1: Dynamic special cost calculation
            const evoStage = getEvo(m.cid, m.lv);
            const specCost = calculateSpecialCost(evoStage, mv.p * 100, mv.n, false);
            // Check if enough focus
            if(m.focus < specCost){
                addLog(`${m.name||'Hero'} doesn't have enough Focus! (Need ${specCost})`, 'dmg');
                processing = false;
                renderMain();
                return;
            }

            // SPEND FOCUS
            m.focus -= specCost;

            const moveName = mv.n || 'Special';
            const element = mv.e || CREATURES[m.cid]?.type?.toLowerCase() || 'fire';

            // CHECK IF AOE OR SINGLE TARGET
            const specType = getSpecialType(moveName);
            const isAOE = specType.isAOE;
            const aoeMult = specType.mult; // 0.65 for AOE, 1.0 for ST

            m.cooldown = 4;

            // CHARGE UP animation
            const arenaCreature = document.getElementById('arenaC'+activeIdx);
            if(arenaCreature){
                arenaCreature.classList.add('anim-charge');
                setTimeout(()=>arenaCreature.classList.remove('anim-charge'), 500);
            }

            setTimeout(()=>{
                // SPECIAL DASH after charge
                if(arenaCreature){
                    arenaCreature.classList.add('anim-special-dash');
                    setTimeout(()=>arenaCreature.classList.remove('anim-special-dash'),350);
                }

                if(isAOE){
                    // ============================================
                    // v54.6: ENHANCED AOE SPECIAL - Hit ALL enemies
                    // ============================================
                    const aliveEnemies = b.enemies.filter(e => e.hp > 0);
                    let totalDamage = 0;

                    // Show AOE action banner
                    const baseDmgPreview = Math.floor(m.st.atk * 1.2 * Math.min(mv.p, 2.0) * aoeMult);
                    showActionBanner(m.name||'Hero', moveName + ' (AOE)', baseDmgPreview, 'special', true);

                    playSound('crit');

                    // Screen shake for AOE
                    const arena = document.getElementById('battleArena');
                    if(arena){
                        arena.classList.add('screen-shake');
                        setTimeout(()=>arena.classList.remove('screen-shake'),400);
                    }

                    // v54.6: Type-based AOE effects matched to move name
                    const aoeAnimType = getAttackAnimationType(moveName, element);

                    // Show initial AOE effect based on move name
                    if(aoeAnimType === 'lightning'){
                        // Lightning storm - strikes on all enemies
                        aliveEnemies.forEach((enemy, i) => {
                            const enemyEl = document.getElementById('enemyImg'+b.enemies.indexOf(enemy));
                            setTimeout(() => showLightningStrike(enemyEl), i * 100);
                        });
                    } else if(aoeAnimType === 'slam'){
                        // Earthquake - ground slam
                        const firstEnemyEl = document.getElementById('enemyImg'+b.enemies.indexOf(aliveEnemies[0]));
                        showGroundSlam(firstEnemyEl);
                    } else if(aoeAnimType === 'beam'){
                        // Beam sweep across all enemies
                        const firstEnemyEl = document.getElementById('enemyImg'+b.enemies.indexOf(aliveEnemies[0]));
                        showBeamAttack(arenaCreature, firstEnemyEl, element);
                    } else if(aoeAnimType === 'projectile' && (element === 'water' || moveName.toLowerCase().includes('tsunami') || moveName.toLowerCase().includes('wave') || moveName.toLowerCase().includes('flood') || moveName.toLowerCase().includes('tidal'))){
                        // v54.6: Water AOE - show wave animation sweeping across
                        showWaveAnimation('right');
                    }

                    // Hit each enemy with delay for visual effect
                    aliveEnemies.forEach((enemy, i) => {
                        const enemyIdx = b.enemies.indexOf(enemy);
                        const enemyEl = document.getElementById('enemyImg'+enemyIdx);

                        setTimeout(() => {
                            // Calculate damage for this enemy (with AOE reduction)
                            let baseDmg = m.st.atk * 1.2;
                            let bonusMult = Math.min(mv.p, 2.0);
                            let defReduction = enemy.def * 0.25;
                            let d = Math.floor((baseDmg * bonusMult * aoeMult - defReduction) * (.85 + Math.random() * .3));
                            d = Math.max(10, d);
                            totalDamage += d;

                            // Apply damage
                            enemy.chipHp = enemy.hp;
                            enemy.hp = Math.max(0, enemy.hp - d);

                            // v54.6: Type-based visual effects matched to move name
                            if(enemyEl){
                                showImpactEffect(enemyEl, true, element);
                                showElementEffect(enemyEl, element);
                                showAttackAnimationByType(enemyEl, moveName, element, true);
                                enemyEl.classList.add('anim-crit-shake','anim-hit-flash');
                                setTimeout(()=>enemyEl.classList.remove('anim-crit-shake','anim-hit-flash'),350);
                                showFloatingDamage(enemyEl, d, 'crit');
                            }

                            // HP BAR UPDATE
                            const hpBar = document.getElementById('enemyHpBar'+enemyIdx);
                            if(hpBar){
                                const hpFill = hpBar.querySelector('.enemy-hp-fill');
                                const chipFill = hpBar.querySelector('.enemy-hp-chip');
                                if(hpFill) hpFill.style.width = (enemy.hp / enemy.maxHp) * 100 + '%';
                                if(chipFill) chipFill.style.width = (enemy.chipHp / enemy.maxHp) * 100 + '%';
                            }
                        }, i * 150); // Stagger hits for visual effect
                    });

                    // After all hits complete
                    setTimeout(() => {
                        addLog(`⚡ ${m.name||'Hero'} used ${moveName}! Hit ${aliveEnemies.length} enemies for ${totalDamage} total damage!`, 'spec');

                        processing = false;
                        checkBossMinionSummon();

                        if(!processing){
                            turnIdx++;
                            renderMain();
                            setTimeout(nextTurn, 500);
                        }
                    }, aliveEnemies.length * 150 + 200);

                    // v54.6: BACKUP PROCESSING CLEARER for AOE special
                    setTimeout(() => {
                        if(processing && state.battle) {
                            console.warn('Backup: clearing processing flag after AOE special');
                            processing = false;
                            if(state.battle) nextTurn();
                        }
                    }, aliveEnemies.length * 150 + 2500);

                }else{
                    // ============================================
                    // v54.6: ENHANCED SINGLE TARGET SPECIAL
                    // ============================================
                    // Calculate damage
                    let baseDmg = m.st.atk * 1.2;
                    let bonusMult = Math.min(mv.p, 2.0);
                    let defReduction = targetEnemy.def * 0.25;
                    let d = Math.floor((baseDmg * bonusMult - defReduction) * (.85 + Math.random() * .3));
                    d = Math.max(10, d);

                    // Show action banner
                    showActionBanner(m.name||'Hero', moveName, d, 'special', true);

                    const enemyEl = document.getElementById('enemyImg'+targetIdx);

                    // v54.6: Type-based special animation matched to move name
                    const specialAnimType = getAttackAnimationType(moveName, element);
                    const isHighPower = mv.p >= 1.5 || specialAnimType === 'beam';

                    // Show element trail for all specials
                    showElementTrail(arenaCreature, enemyEl, element);

                    // Fire beam or projectile based on move name analysis
                    if(isHighPower || specialAnimType === 'beam'){
                        showBeamAttack(arenaCreature, enemyEl, element);
                    }

                    // Callback function for impact
                    const onSpecialImpact = () => {
                        playSound('crit');

                        targetEnemy.chipHp = targetEnemy.hp;
                        targetEnemy.hp = Math.max(0, targetEnemy.hp - d);

                        showImpactEffect(enemyEl, true, element);
                        showElementEffect(enemyEl, element);

                        // v54.6: Type-based special animation matched to move name
                        showAttackAnimationByType(enemyEl, moveName, element, true);

                        if(enemyEl){
                            enemyEl.classList.add('anim-crit-shake','anim-hit-flash');
                            setTimeout(()=>enemyEl.classList.remove('anim-crit-shake','anim-hit-flash'),350);
                        }

                        // HP BAR UPDATE
                        const hpBar = document.getElementById('enemyHpBar'+targetIdx);
                        if(hpBar){
                            const hpFill = hpBar.querySelector('.enemy-hp-fill');
                            const chipFill = hpBar.querySelector('.enemy-hp-chip');
                            if(hpFill) hpFill.style.width = (targetEnemy.hp / targetEnemy.maxHp) * 100 + '%';
                            if(chipFill) chipFill.style.width = (targetEnemy.chipHp / targetEnemy.maxHp) * 100 + '%';
                            hpBar.classList.add('anim-damage');
                            setTimeout(()=>hpBar.classList.remove('anim-damage'),300);
                        }

                        // Screen shake for big specials
                        if(d > 60){
                            const arena = document.getElementById('battleArena');
                            if(arena){
                                arena.classList.add('screen-shake');
                                setTimeout(()=>arena.classList.remove('screen-shake'),250);
                            }
                        }

                        showFloatingDamage(enemyEl, d, 'crit');
                        addLog(`⚡ ${m.name||'Hero'} used ${moveName}! ${d} damage!`, 'spec');

                        processing = false;
                        checkBossMinionSummon();

                        if(!processing){
                            turnIdx++;
                            renderMain();
                            setTimeout(nextTurn, 500);
                        }
                    };

                    // High power uses beam (delayed impact), low power uses projectile
                    if(isHighPower){
                        setTimeout(onSpecialImpact, 400); // Beam animation duration
                    } else {
                        fireProjectile(arenaCreature, enemyEl, element, onSpecialImpact);
                    }

                    // v54.6: BACKUP PROCESSING CLEARER for single-target special
                    setTimeout(() => {
                        if(processing && state.battle) {
                            console.warn('Backup: clearing processing flag after special');
                            processing = false;
                            if(state.battle) nextTurn();
                        }
                    }, 2500);
                }
            }, 500); // After charge animation
        }else{
            doAction('atk');
        }
    }
}

// FLOATING DAMAGE NUMBER DISPLAY
function showFloatingDamage(targetEl, amount, type='damage'){
    if(!targetEl) return;
    
    const float = document.createElement('div');
    float.className = `damage-float ${type}`;
    float.textContent = type === 'heal' ? `+${amount}` : `-${amount}`;
    
    // Position near the target
    const rect = targetEl.getBoundingClientRect();
    float.style.left = rect.left + rect.width/2 - 30 + 'px';
    float.style.top = rect.top + rect.height/3 + 'px';
    float.style.position = 'fixed';
    
    document.body.appendChild(float);
    
    // Clean up after animation - LONGER DURATION
    setTimeout(() => float.remove(), 1500);
}

// Show elemental effect on target
function showElementEffect(targetEl, element){
    if(!targetEl || !element) return;
    
    const effect = document.createElement('div');
    effect.className = `element-effect element-${element}`;
    
    const rect = targetEl.getBoundingClientRect();
    effect.style.left = rect.left + rect.width/2 - 50 + 'px';
    effect.style.top = rect.top + rect.height/2 - 50 + 'px';
    
    document.body.appendChild(effect);
    
    setTimeout(() => effect.remove(), 900);
}

// ============================================
// ITEM ANIMATION EFFECTS
// ============================================

function showItemAnimation(targetEl, itemEffect){
    if(!targetEl) return;
    
    const rect = targetEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    switch(itemEffect){
        case 'heal':
        case 'heal_focus':
            showHealingAnimation(centerX, centerY);
            break;
        case 'focus':

// Fire projectile from attacker to target
function fireProjectile(fromEl, toEl, element, onImpact){
    if(!fromEl || !toEl) {
        console.warn('fireProjectile: missing element', {fromEl, toEl});
        if(onImpact) onImpact();
        return;
    }
    
    const proj = document.createElement('div');
    proj.className = `projectile ${element || 'fire'}`;
    
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    
    // VALIDATE positions - if invalid, use fallback
    if(fromRect.width === 0 || fromRect.height === 0){
        console.error('fireProjectile: fromEl has no size', fromEl);
        if(onImpact) onImpact();
        return;
    }
    if(toRect.width === 0 || toRect.height === 0){
        console.error('fireProjectile: toEl has no size', toEl);
        if(onImpact) onImpact();
        return;
    }

    const startX = fromRect.left + fromRect.width/2;
    const startY = fromRect.top + fromRect.height/2;
    const endX = toRect.left + toRect.width/2;
    const endY = toRect.top + toRect.height/2;
    
    proj.style.left = startX + 'px';
    proj.style.top = startY + 'px';
    
    document.body.appendChild(proj);
    
    // Animate position
    const duration = 350;
    const startTime = performance.now();
    
    function animate(currentTime){
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Eased progress for smooth movement
        const eased = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        const currentX = startX + (endX - startX) * eased;
        const currentY = startY + (endY - startY) * eased;
        
        proj.style.left = currentX + 'px';
        proj.style.top = currentY + 'px';
        
        if(progress < 1){
            requestAnimationFrame(animate);
        } else {
            proj.remove();
            if(onImpact) onImpact();
        }
    }
    
    requestAnimationFrame(animate);
}

// v54.6: MOVE NAME ANIMATION MAPPING SYSTEM
// Analyzes move names to determine appropriate animations
// ============================================

// Get attack animation type based on move name
function getAttackAnimationType(moveName, element){
    const name = (moveName || '').toLowerCase();

    // v54.6: COMPOUND WORDS FIRST - Handle specific combinations before generic checks
    // Sandstorm, duststorm = earth, NOT lightning
    if(name.includes('sandstorm') || name.includes('duststorm') || name.includes('dust storm')){
        return 'slam';
    }
    // Firestorm, inferno storm = fire, NOT lightning
    if(name.includes('firestorm') || name.includes('fire storm') || name.includes('inferno')){
        return 'fire-burst';
    }
    // Snowstorm, blizzard = ice, NOT lightning
    if(name.includes('snowstorm') || name.includes('snow storm') || name.includes('blizzard')){
        return 'ice-shard';
    }
    // Hurricane, cyclone, gust = air/wind, use slash
    if(name.includes('hurricane') || name.includes('cyclone') || name.includes('gust') || name.includes('wind')){
        return 'slash';
    }

    // ICE/FROST attacks - use ice shard or beam
    if(name.includes('frost') || name.includes('ice') || name.includes('freeze') ||
       name.includes('arctic') || name.includes('glacial') || name.includes('snow') ||
       name.includes('frozen') || name.includes('icicle') || name.includes('cold') ||
       element === 'ice'){
        if(name.includes('beam') || name.includes('ray') || name.includes('blast') || name.includes('zero')){
            return 'beam';
        }
        return 'ice-shard';
    }

    // FIRE attacks - use fire burst
    if(name.includes('flame') || name.includes('fire') || name.includes('blaze') ||
       name.includes('ember') || name.includes('lava') || name.includes('molten') ||
       name.includes('scorch') || name.includes('burn') || name.includes('heat') ||
       name.includes('cinder') || name.includes('magma') || name.includes('meteor') ||
       element === 'fire'){
        return 'fire-burst';
    }

    // EARTH/SAND attacks - use ground slam (check BEFORE lightning to catch "sand" properly)
    if(name.includes('earth') || name.includes('rock') || name.includes('stone') ||
       name.includes('sand') || name.includes('ground') || name.includes('quake') ||
       name.includes('boulder') || name.includes('crystal') || name.includes('shard') ||
       name.includes('slam') || name.includes('stomp') || name.includes('crush') ||
       name.includes('smash') || name.includes('dune') || name.includes('desert') ||
       element === 'earth'){
        return 'slam';
    }

    // LIGHTNING attacks - use lightning strike (after earth check)
    if(name.includes('thunder') || name.includes('spark') || name.includes('volt') ||
       name.includes('lightning') || name.includes('static') || name.includes('electric') ||
       name.includes('jolt') || name.includes('shock') ||
       element === 'lightning'){
        return 'lightning';
    }

    // WATER attacks - use projectile
    if(name.includes('water') || name.includes('aqua') || name.includes('hydro') ||
       name.includes('wave') || name.includes('tide') || name.includes('splash') ||
       name.includes('whirlpool') || name.includes('tsunami') || name.includes('ocean') ||
       element === 'water'){
        return 'projectile';
    }

    // BITE/FANG attacks - use bite animation
    if(name.includes('bite') || name.includes('fang') || name.includes('nibble') ||
       name.includes('chomp') || name.includes('gnaw') || name.includes('devour')){
        return 'bite';
    }

    // BEAM/RAY attacks - use beam
    if(name.includes('beam') || name.includes('ray') || name.includes('cannon') ||
       name.includes('laser') || name.includes('blast')){
        return 'beam';
    }

    // SLASH/CLAW attacks - use multi-slash
    if(name.includes('claw') || name.includes('slash') || name.includes('strike') ||
       name.includes('cut') || name.includes('rend') || name.includes('tear') ||
       name.includes('swipe') || name.includes('rip') || name.includes('whip') ||
       name.includes('lash') || name.includes('antler')){
        return 'slash';
    }

    // PROJECTILE attacks - use element trail
    if(name.includes('shot') || name.includes('bolt') || name.includes('ball') ||
       name.includes('missile') || name.includes('arrow') || name.includes('needle') ||
       name.includes('barrage') || name.includes('spray')){
        return 'projectile';
    }

    // Physical attacks - use impact
    if(name.includes('punch') || name.includes('tackle') || name.includes('charge') ||
       name.includes('ram') || name.includes('bash') || name.includes('hit') ||
       name.includes('rush') || name.includes('rampage') || name.includes('stampede')){
        return 'impact';
    }

    // NATURE attacks - use slash
    if(name.includes('vine') || name.includes('leaf') || name.includes('thorn') ||
       name.includes('root') || name.includes('petal') || name.includes('spore') ||
       name.includes('branch') || name.includes('moss') || name.includes('photo') ||
       element === 'nature'){
        return 'slash';
    }

    // POISON attacks - use projectile
    if(name.includes('toxic') || name.includes('poison') || name.includes('venom') ||
       name.includes('plague') || name.includes('acid') || name.includes('fungal') ||
       element === 'poison'){
        return 'projectile';
    }

    // SHADOW/VOID attacks - use beam
    if(name.includes('shadow') || name.includes('dark') || name.includes('void') ||
       name.includes('nightmare') || name.includes('null') || name.includes('dimension') ||
       name.includes('mind') || name.includes('psychic') || name.includes('reality') ||
       element === 'shadow' || element === 'void'){
        return 'beam';
    }

    // LIGHT attacks - use beam
    if(name.includes('light') || name.includes('rainbow') || name.includes('spectrum') ||
       name.includes('prism') || name.includes('radiant') || name.includes('holy') ||
       element === 'light'){
        return 'beam';
    }

    // METAL attacks - use impact
    if(name.includes('steel') || name.includes('iron') || name.includes('metal') ||
       name.includes('gear') || name.includes('mecha') || name.includes('overclock') ||
       element === 'metal'){
        return 'impact';
    }

    // AIR attacks - use slash
    if(element === 'air') return 'slash';

    // BUG attacks - use slash
    if(name.includes('pincer') || name.includes('hive') || name.includes('beetle') ||
       name.includes('carapace') || element === 'bug'){
        return 'slash';
    }

    return 'slash'; // Default to slash
}

// Get defend animation type based on move name
function getDefendAnimationType(moveName, element){
    const name = (moveName || '').toLowerCase();

    // SHIELD type - hexagonal shield
    if(name.includes('shield') || name.includes('guard') || name.includes('wall') ||
       name.includes('barrier') || name.includes('block')){
        return {type: 'shield', element: element};
    }

    // BARRIER type - dome
    if(name.includes('veil') || name.includes('cover') || name.includes('protect')){
        return {type: 'barrier', element: element};
    }

    // EVASION type - phase/dodge
    if(name.includes('dodge') || name.includes('fade') || name.includes('phase') ||
       name.includes('cloak') || name.includes('evade') || name.includes('shift') ||
       name.includes('vanish')){
        return {type: 'evasion', element: element};
    }

    // HARDEN type - shell/armor/scales
    if(name.includes('shell') || name.includes('armor') || name.includes('scales') ||
       name.includes('carapace') || name.includes('harden') || name.includes('fortify') ||
       name.includes('brace') || name.includes('withdraw')){
        return {type: 'harden', element: element};
    }

    // Default based on element
    if(element === 'ice') return {type: 'barrier', element: 'ice'};
    if(element === 'fire') return {type: 'harden', element: 'fire'};
    if(element === 'shadow' || element === 'void') return {type: 'evasion', element: element};
    if(element === 'earth' || element === 'metal') return {type: 'harden', element: element};
    if(element === 'nature') return {type: 'barrier', element: 'nature'};

    return {type: 'shield', element: element}; // Default
}

// Get heal animation type based on move name
function getHealAnimationType(moveName, element){
    const name = (moveName || '').toLowerCase();

    // NATURE heal - vines/leaves
    if(name.includes('regenerate') || name.includes('photosynthesis') || name.includes('root') ||
       name.includes('bloom') || name.includes('nature') || name.includes('vine') ||
       name.includes('leaf') || name.includes('forest') || name.includes('spore') ||
       element === 'nature' || element === 'poison'){
        return 'nature';
    }

    // LIGHT heal - divine beam
    if(name.includes('light') || name.includes('dust') || name.includes('star') ||
       name.includes('divine') || name.includes('holy') || name.includes('celestial') ||
       name.includes('rainbow') || name.includes('prism') || name.includes('radiant') ||
       element === 'light'){
        return 'light';
    }

    // WATER heal - bubbles
    if(name.includes('tidal') || name.includes('aqua') || name.includes('water') ||
       name.includes('ocean') || name.includes('wave') || name.includes('bubble') ||
       name.includes('mist') || name.includes('hydro') || name.includes('snow') ||
       element === 'water' || element === 'ice'){
        return 'water';
    }

    // DRAIN heal - energy absorption
    if(name.includes('drain') || name.includes('absorb') || name.includes('steal') ||
       name.includes('siphon') || name.includes('leech') || name.includes('devour')){
        return 'drain';
    }

    // FIRE heal - ember/molten
    if(name.includes('molten') || name.includes('heat') || name.includes('ember') ||
       element === 'fire'){
        return 'generic'; // Fire uses generic with fire coloring
    }

    return 'generic'; // Default sparkle burst
}

function showDefendAnimation(targetEl, moveName, element){
    if(!targetEl) return;

    const defendInfo = getDefendAnimationType(moveName, element);
    const rect = targetEl.getBoundingClientRect();
    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;

    // v54.6: Calculate scale based on creature size (default 120px is base)
    const baseSize = 120;
    const creatureSize = Math.max(rect.width, rect.height);
    const scale = Math.max(0.6, Math.min(2.5, creatureSize / baseSize));

    if(defendInfo.type === 'shield'){
        showShieldDefend(centerX, centerY, defendInfo.element, scale);
    } else if(defendInfo.type === 'barrier'){
        showBarrierDefend(centerX, centerY, defendInfo.element, scale);
    } else if(defendInfo.type === 'evasion'){
        showEvasionDefend(centerX, centerY, scale);
    } else if(defendInfo.type === 'harden'){
        showHardenDefend(centerX, centerY, defendInfo.element, scale);
    }
}

    const rect = targetEl.getBoundingClientRect();

        case 'slam':
            showGroundSlam(targetEl);
            showSlamAttack(centerX, centerY + 40);
            break;
        case 'bite':

        case 'beam':

            break;
        case 'slash':
            showMultiSlash(targetEl, element);
            break;
        case 'projectile':
            // Projectile trails are handled in fireProjectile
            break;
        case 'impact':
            showSlamAttack(centerX, centerY);
            break;
        default:
            if(isCrit){
                showMultiSlash(targetEl, element);
            } else {
                showSlashEffect(targetEl, isCrit);
            }
    }
}

// SELECT TARGET - Called when clicking enemy during targeting mode
function selectTarget(enemyIdx){
    const b = state.battle;
    if(!b || !b.targetingMode) return;
    
    // Validate target is alive
    if(!b.enemies[enemyIdx] || b.enemies[enemyIdx].hp <= 0) return;
    
    b.selectedTarget = enemyIdx;
    const action = b.targetingMode;
    b.targetingMode = false;
    
    // CRITICAL: Reset processing before calling doAction
    processing = false;
    
    // Continue with the action
    doAction(action);
}

// Cancel targeting mode
function cancelTargeting(){
    const b = state.battle;
    if(b){
        b.targetingMode = false;
        b.selectedTarget = undefined;
    }
    processing = false;
    renderMain();
}

// Heal target selection system
// v54.6: Enhanced heal scaling with level bonus
function showHealTargetSelection(healerIdx, move){
    const b = state.battle;
    const healer = b.team[healerIdx];

    // v54.6: ENHANCED HEAL FORMULA
    // Base heal from move power, scaled by level
    const baseHealPct = move.p || 0.3;
    const baseHeal = healer.maxHp * baseHealPct;
    const levelBonus = 1 + (healer.lv * 0.015); // +1.5% per level (Level 30 = +45%)
    const healAmount = Math.floor(baseHeal * levelBonus);

    // Get allies who need healing (not full HP, not dead)
    const healableAllies = b.team.filter((t, i) => t.curHp > 0 && t.curHp < t.maxHp);

    if(healableAllies.length === 0){
        // No one needs healing, do attack instead
        addLog(`${healer.name||'Hero'}: No allies need healing!`,'info');
        doAction('atk');
        return;
    }

    // If only one ally needs healing, heal them automatically
    if(healableAllies.length === 1){
        const targetIdx = b.team.indexOf(healableAllies[0]);
        executeHeal(healerIdx, targetIdx, healAmount);
        return;
    }

    // Enter heal targeting mode - allies become clickable
    b.healTargetingMode = true;
    b.healerIdx = healerIdx;
    b.healAmount = healAmount;
    processing = false;
    renderMain();
}

    const b = state.battle;

    if(!target || target.curHp <= 0 || target.curHp >= target.maxHp) return;

    b.healTargetingMode = false;

}

// v54.6: Enhanced executeHeal with emergency bonus and improved animations
function executeHeal(healerIdx, targetIdx, healAmount){
    const b = state.battle;
    const healer = b.team[healerIdx];
    const target = b.team[targetIdx];
    const mv = getMove(healer.cid, healer.lv, 'heal');

    // SPEND FOCUS for heal
    const healCost = mv?.f || 0;
    healer.focus -= healCost;

    processing = true;

    // v54.6: EMERGENCY HEAL BONUS
    // +25% healing when target is below 30% HP (critically wounded)
    const isEmergency = target.curHp < target.maxHp * 0.3;
    const emergencyBonus = isEmergency ? 1.25 : 1.0;
    const finalHealAmount = Math.floor(healAmount * emergencyBonus);

    // HEALER ANIMATION
    const healerEl = document.getElementById('c' + healerIdx);
    if(healerEl){
        healerEl.classList.add('anim-heal');
        setTimeout(()=>healerEl.classList.remove('anim-heal'),550);
    }
    playSound('heal');

    // v54.6: Fix - use actualHeal to prevent exceeding maxHp
    const actualHeal = Math.min(finalHealAmount, target.maxHp - target.curHp);
    target.curHp = target.curHp + actualHeal;

    // TARGET HEAL ANIMATION
    const targetFrameEl = document.getElementById('c' + targetIdx);
    const targetEl = document.getElementById('m' + targetIdx);
    if(targetFrameEl){
        targetFrameEl.classList.add('anim-heal');
        setTimeout(()=>targetFrameEl.classList.remove('anim-heal'),550);
    }

    // HP BAR HEAL FLASH
    const hpBar = document.getElementById('hpBar' + targetIdx);
    if(hpBar){
        hpBar.classList.add('anim-heal');
        setTimeout(()=>hpBar.classList.remove('anim-heal'),300);
    }

    // v54.6: ENHANCED HEAL VISUAL EFFECTS - Type-based animations
    const arenaTarget = document.getElementById('arenaC' + targetIdx);
    const healMoveName = mv?.n || 'Heal';
    const healerType = CREATURES[healer.cid]?.type?.toLowerCase() || 'default';
    if(arenaTarget){
        // Use type-based heal animation that matches move name
        showHealAnimationByType(arenaTarget, healMoveName, healerType, isEmergency);
        // Also show original heal burst
        showHealEffect(arenaTarget);
    }

    // FLOATING HEAL NUMBER - use crit style for emergency heals
    if(targetEl) showFloatingDamage(targetEl, actualHeal, isEmergency ? 'crit' : 'heal');

    // Log with emergency indicator
    const emergencyText = isEmergency ? ' (EMERGENCY!)' : '';
    addLog(`💚 ${healer.name||'Hero'}: ${mv?.n||'Heal'} → ${target.name||'Ally'} +${actualHeal} HP!${emergencyText}`,'heal');

    // v54.6: Set heal cooldown (2 turns)
    healer.healCooldown = 2;

    turnIdx++;
    renderMain();
    setTimeout(nextTurn, 500);
}

}

function enemyAction(){
    if(!state.battle)return;
    const b=state.battle;
    const cur = battleQueue[turnIdx];
    
    // Get the specific enemy whose turn it is
    const enemyIdx = cur?.idx || 0;
    const enemy = b.enemies[enemyIdx];
    
    // Skip if this enemy is dead
    if(!enemy || enemy.hp <= 0){
        turnIdx++;
        processing = false; // CRITICAL: Clear before nextTurn
        nextTurn();
        return;
    }
    
    // FOCUS REGEN for enemies (hidden from player) - v54.1 uses constants
    if(enemy.focus !== undefined && enemy.focusMax){
        enemy.focus = Math.min(enemy.focusMax, enemy.focus + (enemy.focusRegen || FOCUS_REGEN_PER_TURN));
    }
    
    // Reduce special cooldown
    if(enemy.specialCooldown > 0) enemy.specialCooldown--;
    
    const alive = b.team.filter(m=>m.curHp>0);
    if(!alive.length){endBattle(false);return}
    
    const enemyEl = document.getElementById('enemyImg'+enemyIdx);
    const arena = document.getElementById('battleArena');
    
    // ============================================
    // v54.3: INTELLIGENT AI DECISION MAKING
    // ============================================
    // Enemies now make tactical decisions based on:
    // - Their HP status, focus levels, and available abilities
    // - Ally status (heal wounded allies)
    // - Target priorities (finish low HP enemies)
    // - Resource management (defend to charge focus)

    const hpPercent = enemy.hp / enemy.maxHp;
    const allEnemies = b.enemies.filter(e => e.hp > 0);
    const woundedAllies = allEnemies.filter(e => e.hp / e.maxHp < 0.5);
    const currentFocus = enemy.focus || 0;
    const maxFocus = enemy.focusMax || MAX_FOCUS;

    let actionType = 'basic'; // basic, special, heal, aoe, defend
    let healTarget = null;

    // Calculate costs for abilities
    const healCost = enemy.healAttack?.focusCost || 30;
    const spec = enemy.specialAttack;
    const specialCost = spec ? calculateSpecialCost(enemy.evoStage || 0, (spec.power || 1.5) * 100, spec.n || spec.name, false) : 100;
    const hasHealFocus = currentFocus >= healCost;
    const hasSpecialFocus = currentFocus >= specialCost;
    const focusNeededForSpecial = specialCost - currentFocus;
    const turnsToSpecial = Math.ceil(focusNeededForSpecial / (FOCUS_REGEN_PER_TURN + 5)); // +5 for defend bonus

    // ============================================
    // DECISION PRIORITY (smartest first)
    // ============================================

    // 1. EMERGENCY HEAL - Self at critical HP
    if(enemy.canHeal && enemy.healAttack && hasHealFocus && hpPercent < 0.25){
        if(Math.random() < 0.8){
            actionType = 'heal';
            healTarget = enemy;
        }
    }

    // 2. HEAL CRITICAL ALLY - Ally about to die
    if(actionType === 'basic' && enemy.canHeal && enemy.healAttack && hasHealFocus){
        const dyingAlly = woundedAllies.find(e => e !== enemy && e.hp / e.maxHp < 0.2);
        if(dyingAlly && Math.random() < 0.7){
            actionType = 'heal';
            healTarget = dyingAlly;
        }
    }

    // 3. FINISH LOW HP TARGET - Use special for kill shot
    if(actionType === 'basic' && enemy.hasSpecial && spec && enemy.specialCooldown === 0 && hasSpecialFocus){
        const lowestTarget = alive.reduce((a,b) => a.curHp < b.curHp ? a : b);
        const estimatedDmg = enemy.atk * (spec.power || 1.5) * 0.7;
        const canKill = lowestTarget.curHp < estimatedDmg;
        if(canKill){
            actionType = 'special';
        }
    }

    // 4. DEFEND TO CHARGE FOCUS - Strategic resource building
    // Defend if: has special but not enough focus, AND can reach it in 1-2 turns
    if(actionType === 'basic' && enemy.hasSpecial && spec && !hasSpecialFocus){
        if(turnsToSpecial <= 2 && Math.random() < 0.5){
            actionType = 'defend';
        }
    }

    // 5. DEFEND WHEN WOUNDED - Reduce incoming damage
    if(actionType === 'basic' && hpPercent < 0.35 && hpPercent > 0.15){
        // Lower HP = more likely to defend
        const defendChance = (1 - hpPercent) * 0.4;
        if(Math.random() < defendChance){
            actionType = 'defend';
        }
    }

    // 6. USE SPECIAL ATTACK - Ready and able
    if(actionType === 'basic' && enemy.hasSpecial && spec && enemy.specialCooldown === 0 && hasSpecialFocus){
        // Use special 40% of the time when available
        if(Math.random() < 0.4){
            actionType = 'special';
        }
    }

    // 7. AOE ATTACK - Boss ability when multiple targets
    if(actionType === 'basic' && enemy.isBoss && enemy.attacks?.a?.length && alive.length >= 2){
        // More likely with more targets
        const aoeChance = 0.2 + (alive.length * 0.08);
        if(Math.random() < aoeChance){
            actionType = 'aoe';
        }
    }

    // 8. HEAL SELF - Moderate HP
    if(actionType === 'basic' && enemy.canHeal && enemy.healAttack && hasHealFocus && hpPercent < 0.5){
        if(Math.random() < 0.4){
            actionType = 'heal';
            healTarget = enemy;
        }
    }

    // 9. BASIC ATTACK - Default fallback (already set)
    
    // Choose target for attacks
    const targetMember = alive[Math.floor(Math.random()*alive.length)];
    const targetMemberIdx = b.team.indexOf(targetMember);
    
    // ============================================
    // EXECUTE ACTION
    // ============================================

    if(actionType === 'heal'){
        // HEAL ACTION
        executeEnemyHeal(enemy, enemyIdx, healTarget, enemyEl);
        return;
    }

    if(actionType === 'defend'){
        // DEFEND ACTION - Enemy takes defensive stance, gains focus
        enemy.def = true; // Mark as defending (halves incoming damage)
        const focusGain = 5; // Bonus focus for defending
        enemy.focus = Math.min(maxFocus, currentFocus + focusGain);

        // Visual feedback
        if(enemyEl){
            enemyEl.classList.add('defending');
            setTimeout(()=> enemyEl.classList.remove('defending'), 500);
        }

        // Get defend move name if available
        const defName = enemy.moves?.def?.n || 'Guard';
        addLog(`🛡️ ${enemy.name} uses ${defName}! (+${focusGain} Focus)`, 'def');

        // Show floating text
        const floatEl = document.createElement('div');
        floatEl.className = 'floating-text defend';
        floatEl.textContent = 'DEFEND';
        floatEl.style.cssText = 'position:absolute;top:30%;left:50%;transform:translateX(-50%);color:#60a5fa;font-weight:bold;font-size:1.2rem;animation:floatUp 1s forwards;pointer-events:none;z-index:100';
        if(enemyEl?.parentElement) enemyEl.parentElement.appendChild(floatEl);
        setTimeout(()=> floatEl.remove(), 1000);

        turnIdx++;
        processing = false;
        renderMain();
        setTimeout(nextTurn, 600);
        return;
    }

    // TELEGRAPH PHASE (0.4s) for attacks
    if(actionType !== 'aoe'){
        const arenaTarget = document.getElementById('arenaC'+targetMemberIdx);
        const pmTarget = document.getElementById('pm'+targetMemberIdx);
        if(arenaTarget) arenaTarget.classList.add('targeted');
        if(pmTarget) pmTarget.classList.add('targeted');
        
        setTimeout(()=>{
            if(arenaTarget) arenaTarget.classList.remove('targeted');

        }, 400);
    }
    
    // Wait for telegraph, then attack
    setTimeout(()=>{
        // ENEMY DASH ANIMATION
        if(enemyEl){
            enemyEl.classList.add('anim-dash-left');

        }

        setTimeout(()=>{
