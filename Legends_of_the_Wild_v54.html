    100%{opacity:0}
}

/* Ground slam / earth crack effect */
.ground-slam{
    position:fixed;
    pointer-events:none;
    z-index:2400;
    width:200px;
    height:40px;
    animation:groundSlamAnim 500ms ease-out forwards;
}
.ground-slam::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(ellipse at center bottom,rgba(139,90,43,0.8) 0%,rgba(101,67,33,0.4) 50%,transparent 70%);
    animation:crackExpand 400ms ease-out forwards;
}
.ground-slam .crack-line{
    position:absolute;
    bottom:50%;
    height:3px;
    background:linear-gradient(90deg,transparent,#5d4037,#8d6e63,#5d4037,transparent);
    transform-origin:center bottom;
}
.ground-slam .crack-line:nth-child(1){left:50%;width:80px;transform:translateX(-50%) rotate(-15deg);animation:crackAppear 200ms 50ms ease-out forwards}
.ground-slam .crack-line:nth-child(2){left:30%;width:50px;transform:rotate(-35deg);animation:crackAppear 200ms 100ms ease-out forwards}
.ground-slam .crack-line:nth-child(3){left:60%;width:60px;transform:rotate(25deg);animation:crackAppear 200ms 150ms ease-out forwards}
@keyframes crackExpand{
    0%{transform:scaleX(0.3) scaleY(0.5);opacity:0}
    50%{transform:scaleX(1.2) scaleY(1);opacity:1}
    100%{transform:scaleX(1.5) scaleY(0.8);opacity:0}
}
@keyframes crackAppear{
    0%{opacity:0;transform:scaleX(0)}
    50%{opacity:1;transform:scaleX(1)}
    100%{opacity:0;transform:scaleX(1.2)}
}

/* Beam attack effect */
.beam-attack{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    height:20px;
    background:linear-gradient(90deg,
        rgba(255,255,255,0.3) 0%,
        rgba(255,255,255,0.9) 10%,
        rgba(255,255,255,1) 50%,
        rgba(255,255,255,0.9) 90%,
        rgba(255,255,255,0.3) 100%);
    border-radius:10px;
    transform-origin:left center;
    animation:beamFire 400ms ease-out forwards;
}
.beam-attack.fire{background:linear-gradient(90deg,transparent,#ff6b00,#ff9500,#ffcc00,#ff9500,#ff6b00,transparent);box-shadow:0 0 30px #ff6b00}
.beam-attack.ice{background:linear-gradient(90deg,transparent,#4fc3f7,#81d4fa,#e1f5fe,#81d4fa,#4fc3f7,transparent);box-shadow:0 0 30px #4fc3f7}
.beam-attack.lightning{background:linear-gradient(90deg,transparent,#ffc107,#ffeb3b,#fff9c4,#ffeb3b,#ffc107,transparent);box-shadow:0 0 30px #ffeb3b}
.beam-attack.nature{background:linear-gradient(90deg,transparent,#4caf50,#81c784,#c8e6c9,#81c784,#4caf50,transparent);box-shadow:0 0 30px #4caf50}
.beam-attack.shadow,.beam-attack.void{background:linear-gradient(90deg,transparent,#7b1fa2,#9c27b0,#ce93d8,#9c27b0,#7b1fa2,transparent);box-shadow:0 0 30px #9c27b0}
.beam-attack.water{background:linear-gradient(90deg,transparent,#0288d1,#4fc3f7,#b3e5fc,#4fc3f7,#0288d1,transparent);box-shadow:0 0 30px #0288d1}
@keyframes beamFire{
    0%{transform:scaleX(0);opacity:0.5}
    30%{transform:scaleX(1);opacity:1}
    70%{transform:scaleX(1);opacity:1}
    100%{transform:scaleX(1);opacity:0}
}

/* ============================================
   v54.6: STATUS EFFECT ANIMATIONS
   Visual indicators for debuffs/buffs
   ============================================ */

/* Burn status - orange flicker */
.status-burn{
    animation:burnFlicker 500ms infinite;
}
@keyframes burnFlicker{
    0%,100%{filter:brightness(1) sepia(0)}
    25%{filter:brightness(1.2) sepia(0.3) hue-rotate(-10deg)}
    50%{filter:brightness(1.1) sepia(0.2)}
    75%{filter:brightness(1.3) sepia(0.4) hue-rotate(-15deg)}
}

/* Burn particles */
.burn-particles{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
}
.burn-particle{
    position:absolute;
    width:8px;
    height:8px;
    background:radial-gradient(circle,#ff6b00,#ff4500);
    border-radius:50%;
    animation:burnFloat 1s infinite ease-out;
    box-shadow:0 0 6px #ff6b00;
}
.burn-particle:nth-child(1){left:20%;animation-delay:0s}
.burn-particle:nth-child(2){left:50%;animation-delay:0.3s}
.burn-particle:nth-child(3){left:80%;animation-delay:0.6s}
@keyframes burnFloat{
    0%{bottom:10%;opacity:1;transform:scale(1)}
    100%{bottom:90%;opacity:0;transform:scale(0.3)}
}

/* Poison status - purple drip */
.status-poison{
    animation:poisonPulse 800ms infinite;
}
@keyframes poisonPulse{
    0%,100%{filter:brightness(1) hue-rotate(0deg)}
    50%{filter:brightness(0.9) hue-rotate(280deg) saturate(1.3)}
}

/* Poison drip particles */
.poison-drip{
    position:absolute;
    width:6px;
    height:10px;
    background:linear-gradient(180deg,#9c27b0,#7b1fa2);
    border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;
    animation:poisonDrip 1.2s infinite ease-in;
    box-shadow:0 0 8px #9c27b0;
}
@keyframes poisonDrip{
    0%{top:20%;opacity:0;transform:scale(0.5)}
    20%{opacity:1;transform:scale(1)}
    100%{top:110%;opacity:0;transform:scale(0.7)}
}

/* Freeze status - ice shimmer */
.status-freeze{
    animation:freezeShiver 200ms infinite;
    filter:brightness(1.1) saturate(0.7) hue-rotate(180deg);
}
@keyframes freezeShiver{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-2px)}
    75%{transform:translateX(2px)}
}

/* Ice crystals overlay */
.ice-crystals{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    background:
        radial-gradient(ellipse at 20% 30%,rgba(179,229,252,0.6) 0%,transparent 30%),
        radial-gradient(ellipse at 80% 40%,rgba(129,212,250,0.5) 0%,transparent 25%),
        radial-gradient(ellipse at 50% 80%,rgba(179,229,252,0.4) 0%,transparent 35%);
    animation:iceSparkleOverlay 1s infinite;
}
@keyframes iceSparkleOverlay{
    0%,100%{opacity:0.7}
    50%{opacity:1}
}

/* Stun status - stars circling */
.status-stun{
    animation:stunDaze 300ms infinite;
}
@keyframes stunDaze{
    0%,100%{transform:rotate(0deg)}
    25%{transform:rotate(-3deg)}
    75%{transform:rotate(3deg)}
}

/* Stun stars container */
.stun-stars{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    width:60px;
    height:30px;
    animation:starsOrbit 1s linear infinite;
}
.stun-star{
    position:absolute;
    font-size:1.2rem;
    animation:starTwinkle 0.5s infinite alternate;
}
.stun-star:nth-child(1){left:0;top:50%;animation-delay:0s}
.stun-star:nth-child(2){left:50%;top:0;transform:translateX(-50%);animation-delay:0.15s}
.stun-star:nth-child(3){right:0;top:50%;animation-delay:0.3s}
@keyframes starsOrbit{
    0%{transform:translateX(-50%) rotate(0deg)}
    100%{transform:translateX(-50%) rotate(360deg)}
}
@keyframes starTwinkle{
    0%{opacity:0.5;transform:scale(0.8)}
    100%{opacity:1;transform:scale(1.2)}
}

/* Buff glow - colored outline */
.status-buff-atk{
    filter:drop-shadow(0 0 8px rgba(248,113,113,0.8)) drop-shadow(0 0 16px rgba(248,113,113,0.4));
    animation:buffPulseRed 1s infinite;
}
.status-buff-def{
    filter:drop-shadow(0 0 8px rgba(96,165,250,0.8)) drop-shadow(0 0 16px rgba(96,165,250,0.4));
    animation:buffPulseBlue 1s infinite;
}
.status-buff-spd{
    filter:drop-shadow(0 0 8px rgba(74,222,128,0.8)) drop-shadow(0 0 16px rgba(74,222,128,0.4));
    animation:buffPulseGreen 1s infinite;
}
@keyframes buffPulseRed{
    0%,100%{filter:drop-shadow(0 0 8px rgba(248,113,113,0.8))}
    50%{filter:drop-shadow(0 0 16px rgba(248,113,113,1)) drop-shadow(0 0 24px rgba(248,113,113,0.5))}
}
@keyframes buffPulseBlue{
    0%,100%{filter:drop-shadow(0 0 8px rgba(96,165,250,0.8))}
    50%{filter:drop-shadow(0 0 16px rgba(96,165,250,1)) drop-shadow(0 0 24px rgba(96,165,250,0.5))}
}
@keyframes buffPulseGreen{
    0%,100%{filter:drop-shadow(0 0 8px rgba(74,222,128,0.8))}
    50%{filter:drop-shadow(0 0 16px rgba(74,222,128,1)) drop-shadow(0 0 24px rgba(74,222,128,0.5))}
}

/* Weaken debuff - darkened appearance */
.status-weaken{
    filter:brightness(0.7) saturate(0.6);
    animation:weakenPulse 1.5s infinite;
}
@keyframes weakenPulse{
    0%,100%{filter:brightness(0.7) saturate(0.6)}
    50%{filter:brightness(0.6) saturate(0.5)}
}

/* Protect buff - shimmering shield */
.status-protect{
    position:relative;
}
.status-protect::after{
    content:'';
    position:absolute;
    inset:-5px;
    border:2px solid rgba(96,165,250,0.6);
    border-radius:12px;
    animation:protectShimmer 1.5s infinite;
    pointer-events:none;
}
@keyframes protectShimmer{
    0%,100%{border-color:rgba(96,165,250,0.4);box-shadow:0 0 10px rgba(96,165,250,0.2)}
    50%{border-color:rgba(96,165,250,0.8);box-shadow:0 0 20px rgba(96,165,250,0.5)}
}

/* ============================================
   v54.6: ENHANCED HEAL ANIMATIONS
   Rising sparkles, nature wrap, light pillar
   ============================================ */

/* Heal sparkles rising */
.heal-sparkles{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:150px;
}
.heal-sparkle{
    position:absolute;
    width:8px;
    height:8px;
    background:radial-gradient(circle,#4ade80,#22c55e);
    border-radius:50%;
    box-shadow:0 0 10px #4ade80;
    animation:sparkleRise 1s ease-out forwards;
}
@keyframes sparkleRise{
    0%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-120px) scale(0.3)}
}

/* Light pillar for heals */
.light-pillar{
    position:fixed;
    pointer-events:none;
    z-index:2400;
    width:80px;
    height:200px;
    background:linear-gradient(180deg,
        rgba(74,222,128,0) 0%,
        rgba(74,222,128,0.3) 20%,
        rgba(134,239,172,0.6) 50%,
        rgba(74,222,128,0.3) 80%,
        rgba(74,222,128,0) 100%);
    animation:pillarDescend 800ms ease-out forwards;
}
@keyframes pillarDescend{
    0%{opacity:0;transform:translateY(-50px)}
    30%{opacity:1;transform:translateY(0)}
    70%{opacity:1}
    100%{opacity:0}
}

/* Critical heal burst */
.crit-heal-burst{
    position:fixed;
    pointer-events:none;
    z-index:2550;
    width:120px;
    height:120px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(74,222,128,0.8) 0%,rgba(34,197,94,0.4) 50%,transparent 70%);
    animation:critHealPop 600ms ease-out forwards;
}
@keyframes critHealPop{
    0%{transform:scale(0);opacity:1}
    50%{transform:scale(1.5);opacity:0.8}
    100%{transform:scale(2);opacity:0}
}

/* ============================================
   v54.6: DEFEND ANIMATIONS BY MOVE TYPE
   Shield, Barrier, Evasion, Harden variants
   ============================================ */

/* SHIELD TYPE - Hexagonal shield materializing */
.defend-shield{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:100px;
}
.defend-shield .hex{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,rgba(96,165,250,0.2),rgba(96,165,250,0.5));
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    border:3px solid rgba(96,165,250,0.8);
    animation:shieldMaterialize 500ms ease-out forwards;
    box-shadow:0 0 20px rgba(96,165,250,0.5),inset 0 0 30px rgba(96,165,250,0.3);
}
.defend-shield .hex-glow{
    position:absolute;
    width:120%;
    height:120%;
    top:-10%;
    left:-10%;
    background:radial-gradient(circle,rgba(96,165,250,0.4) 0%,transparent 70%);
    animation:shieldGlow 500ms ease-out forwards;
}
@keyframes shieldMaterialize{
    0%{opacity:0;transform:scale(0.3) rotate(-30deg)}
    50%{opacity:1;transform:scale(1.1) rotate(5deg)}
    100%{opacity:0.8;transform:scale(1) rotate(0deg)}
}
@keyframes shieldGlow{
    0%{opacity:0;transform:scale(0.5)}
    50%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(1.5)}
}

/* BARRIER TYPE - Translucent dome */
.defend-barrier{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:120px;
    height:80px;
    border:3px solid rgba(147,197,253,0.6);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:linear-gradient(180deg,rgba(147,197,253,0.3) 0%,rgba(96,165,250,0.1) 100%);
    animation:barrierForm 600ms ease-out forwards;
    box-shadow:0 0 25px rgba(96,165,250,0.4),inset 0 -10px 30px rgba(255,255,255,0.2);
}
@keyframes barrierForm{
    0%{opacity:0;transform:scaleY(0.2) scaleX(0.5)}
    40%{opacity:1;transform:scaleY(1.1) scaleX(1.05)}
    100%{opacity:0.7;transform:scaleY(1) scaleX(1)}
}

/* EVASION TYPE - Fade/Phase effect */
.defend-evasion{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:80px;
    height:100px;
}
.defend-evasion .ghost{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,rgba(167,139,250,0.4),rgba(139,92,246,0.2));
    border-radius:40%;
    animation:evasionPhase 500ms ease-out forwards;
    filter:blur(3px);
}
.defend-evasion .ghost:nth-child(2){animation-delay:100ms;opacity:0.6}
.defend-evasion .ghost:nth-child(3){animation-delay:200ms;opacity:0.3}
@keyframes evasionPhase{
    0%{opacity:0.8;transform:translateX(0)}
    50%{opacity:0.5;transform:translateX(20px)}
    100%{opacity:0;transform:translateX(40px)}
}

/* HARDEN TYPE - Shell/Armor glow */
.defend-harden{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:100px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(251,191,36,0.6) 0%,rgba(245,158,11,0.3) 50%,transparent 70%);
    animation:hardenGlow 600ms ease-out forwards;
}
.defend-harden::before{
    content:'';
    position:absolute;
    inset:10px;
    border:4px solid rgba(251,191,36,0.8);
    border-radius:50%;
    animation:hardenRing 600ms ease-out forwards;
}
@keyframes hardenGlow{
    0%{opacity:0;transform:scale(0.5)}
    50%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(1)}
}
@keyframes hardenRing{
    0%{opacity:0;transform:scale(0.3);border-width:8px}
    50%{opacity:1;transform:scale(1);border-width:4px}
    100%{opacity:0;transform:scale(1.3);border-width:1px}
}

/* ELEMENTAL DEFEND VARIANTS */
.defend-fire{background:radial-gradient(circle,rgba(251,146,60,0.6) 0%,rgba(239,68,68,0.3) 50%,transparent 70%)}
.defend-fire::before{border-color:rgba(251,146,60,0.8)}
.defend-ice{background:radial-gradient(circle,rgba(147,197,253,0.6) 0%,rgba(96,165,250,0.3) 50%,transparent 70%)}
.defend-ice::before{border-color:rgba(147,197,253,0.8)}
.defend-nature{background:radial-gradient(circle,rgba(74,222,128,0.6) 0%,rgba(34,197,94,0.3) 50%,transparent 70%)}
.defend-nature::before{border-color:rgba(74,222,128,0.8)}
.defend-shadow{background:radial-gradient(circle,rgba(167,139,250,0.6) 0%,rgba(139,92,246,0.3) 50%,transparent 70%)}
.defend-shadow::before{border-color:rgba(167,139,250,0.8)}

/* ============================================
   v54.6: HEAL ANIMATIONS BY MOVE TYPE
   Nature, Light, Water, Drain variants
   ============================================ */

/* NATURE HEAL - Vines and leaves rising */
.heal-nature{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:150px;
}
.heal-nature .vine{
    position:absolute;
    width:4px;
    height:0;
    background:linear-gradient(180deg,#22c55e,#16a34a);
    border-radius:2px;
    bottom:0;
    animation:vineGrow 800ms ease-out forwards;
}
.heal-nature .vine:nth-child(1){left:20%;animation-delay:0ms}
.heal-nature .vine:nth-child(2){left:50%;animation-delay:100ms}
.heal-nature .vine:nth-child(3){left:80%;animation-delay:200ms}
.heal-nature .leaf{
    position:absolute;
    width:16px;
    height:12px;
    background:radial-gradient(ellipse,#4ade80,#22c55e);
    border-radius:0 70% 0 70%;
    animation:leafFloat 1s ease-out forwards;
}
@keyframes vineGrow{
    0%{height:0;opacity:0}
    50%{height:80px;opacity:1}
    100%{height:100px;opacity:0}
}
@keyframes leafFloat{
    0%{opacity:0;transform:translateY(50px) rotate(0deg)}
    50%{opacity:1;transform:translateY(-20px) rotate(45deg)}
    100%{opacity:0;transform:translateY(-80px) rotate(90deg)}
}

/* LIGHT HEAL - Divine light beam */
.heal-light{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:60px;
    height:200px;
}
.heal-light .beam{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(180deg,
        rgba(253,224,71,0) 0%,
        rgba(253,224,71,0.4) 20%,
        rgba(250,204,21,0.7) 50%,
        rgba(253,224,71,0.4) 80%,
        rgba(253,224,71,0) 100%);
    animation:lightBeamDescend 700ms ease-out forwards;
}
.heal-light .rays{
    position:absolute;
    width:200%;
    height:50%;
    left:-50%;
    top:25%;
    background:radial-gradient(ellipse at center,rgba(253,224,71,0.5) 0%,transparent 70%);
    animation:raysExpand 700ms ease-out forwards;
}
@keyframes lightBeamDescend{
    0%{opacity:0;transform:translateY(-100px)}
    30%{opacity:1;transform:translateY(0)}
    70%{opacity:1}
    100%{opacity:0}
}
@keyframes raysExpand{
    0%{opacity:0;transform:scale(0.3)}
    50%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.5)}
}

/* WATER HEAL - Bubble wrap effect */
.heal-water{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:100px;
}
.heal-water .bubble{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.8),rgba(96,165,250,0.4),rgba(59,130,246,0.2));
    border:2px solid rgba(147,197,253,0.6);
    animation:bubbleRise 1s ease-out forwards;
}
.heal-water .bubble:nth-child(1){width:30px;height:30px;left:10%;bottom:0;animation-delay:0ms}
.heal-water .bubble:nth-child(2){width:20px;height:20px;left:40%;bottom:10%;animation-delay:150ms}
.heal-water .bubble:nth-child(3){width:25px;height:25px;left:70%;bottom:5%;animation-delay:300ms}
.heal-water .bubble:nth-child(4){width:15px;height:15px;left:55%;bottom:15%;animation-delay:200ms}
@keyframes bubbleRise{
    0%{opacity:0;transform:translateY(0) scale(0.5)}
    30%{opacity:1;transform:translateY(-20px) scale(1)}
    70%{opacity:1;transform:translateY(-60px) scale(1.1)}
    100%{opacity:0;transform:translateY(-100px) scale(0.8)}
}

/* DRAIN HEAL - Energy absorption */
.heal-drain{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:120px;
    height:120px;
}
.heal-drain .particle{
    position:absolute;
    width:10px;
    height:10px;
    background:radial-gradient(circle,#a855f7,#7c3aed);
    border-radius:50%;
    box-shadow:0 0 10px #a855f7;
    animation:drainAbsorb 800ms ease-in forwards;
}
@keyframes drainAbsorb{
    0%{opacity:1;transform:translate(var(--start-x),var(--start-y)) scale(1)}
    100%{opacity:0;transform:translate(0,0) scale(0.3)}
}

/* GENERIC HEAL - Sparkle burst */
.heal-generic{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:100px;
    height:100px;
}
.heal-generic .sparkle{
    position:absolute;
    width:8px;
    height:8px;
    background:radial-gradient(circle,#4ade80,#22c55e);
    border-radius:50%;
    box-shadow:0 0 8px #4ade80;
    animation:sparkleHeal 800ms ease-out forwards;
}
@keyframes sparkleHeal{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--end-x),var(--end-y)) scale(0.3)}
}

/* ============================================
   v54.6: ATTACK ANIMATION VARIANTS
   Bite, Physical, Elemental effects
   ============================================ */

/* BITE ATTACK - Chomping jaws */
.attack-bite{
    position:fixed;
    pointer-events:none;
    z-index:2550;
    width:80px;
    height:80px;
}
.attack-bite .jaw{
    position:absolute;
    width:100%;
    height:40%;
    background:linear-gradient(180deg,#374151,#1f2937);
    border-radius:0 0 40% 40%;
}
.attack-bite .jaw.top{
    top:0;
    transform-origin:center top;
    animation:jawBiteTop 300ms ease-in-out forwards;
    border-radius:40% 40% 0 0;
}
.attack-bite .jaw.bottom{
    bottom:0;
    transform-origin:center bottom;
    animation:jawBiteBottom 300ms ease-in-out forwards;
}
.attack-bite .tooth{
    position:absolute;
    width:8px;
    height:12px;
    background:#f5f5f5;
    clip-path:polygon(50% 100%,0 0,100% 0);
}
@keyframes jawBiteTop{
    0%{transform:rotate(-30deg)}
    50%{transform:rotate(10deg)}
    100%{transform:rotate(0deg)}
}
@keyframes jawBiteBottom{
    0%{transform:rotate(30deg)}
    50%{transform:rotate(-10deg)}
    100%{transform:rotate(0deg)}
}

/* PHYSICAL SLAM - Ground impact */
.attack-slam{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:150px;
    height:60px;
}
.attack-slam .impact{
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(ellipse at center bottom,rgba(251,191,36,0.6) 0%,rgba(245,158,11,0.3) 40%,transparent 70%);
    animation:slamImpact 400ms ease-out forwards;
}
.attack-slam .debris{
    position:absolute;
    width:12px;
    height:12px;
    background:#78716c;
    border-radius:30%;
    animation:debrisFly 500ms ease-out forwards;
}
@keyframes slamImpact{
    0%{transform:scaleX(0.3) scaleY(0.5);opacity:0}
    30%{transform:scaleX(1.2) scaleY(1);opacity:1}
    100%{transform:scaleX(1.5) scaleY(0.8);opacity:0}
}
@keyframes debrisFly{
    0%{opacity:1;transform:translate(0,0) rotate(0deg)}
    100%{opacity:0;transform:translate(var(--fly-x),var(--fly-y)) rotate(360deg)}
}

/* ICE SHARD ATTACK */
.attack-ice-shard{
    position:fixed;
    pointer-events:none;
    z-index:2550;
    width:100px;
    height:100px;
}
.attack-ice-shard .shard{
    position:absolute;
    width:15px;
    height:40px;
    background:linear-gradient(180deg,#e0f2fe,#7dd3fc,#38bdf8);
    clip-path:polygon(50% 0%,100% 100%,0% 100%);
    animation:shardStrike 350ms ease-out forwards;
    box-shadow:0 0 15px rgba(56,189,248,0.6);
}
.attack-ice-shard .shard:nth-child(1){left:20%;top:10%;transform:rotate(-15deg);animation-delay:0ms}
.attack-ice-shard .shard:nth-child(2){left:45%;top:0;transform:rotate(0deg);animation-delay:50ms}
.attack-ice-shard .shard:nth-child(3){left:70%;top:10%;transform:rotate(15deg);animation-delay:100ms}
@keyframes shardStrike{
    0%{opacity:0;transform:translateY(-30px) rotate(var(--rot,0deg))}
    30%{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}
    70%{opacity:1}
    100%{opacity:0}
}

/* FIRE BURST ATTACK */
.attack-fire-burst{
    position:fixed;
    pointer-events:none;
    z-index:2550;
    width:100px;
    height:100px;
}
.attack-fire-burst .flame{
    position:absolute;
    width:30px;
    height:50px;
    background:radial-gradient(ellipse at bottom,#fbbf24 0%,#f97316 40%,#ef4444 70%,transparent 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation:flameBurst 500ms ease-out forwards;
}
.attack-fire-burst .flame:nth-child(1){left:10%;bottom:20%;animation-delay:0ms}
.attack-fire-burst .flame:nth-child(2){left:40%;bottom:10%;animation-delay:50ms;width:40px;height:60px}
.attack-fire-burst .flame:nth-child(3){left:70%;bottom:25%;animation-delay:100ms}
@keyframes flameBurst{
    0%{opacity:0;transform:scaleY(0.3)}
    30%{opacity:1;transform:scaleY(1.2)}
    70%{opacity:1;transform:scaleY(1)}
    100%{opacity:0;transform:scaleY(0.8) translateY(-20px)}
}

/* ============================================
   ACTION BANNER - Replaces scroll log
   Shows current action with icon and fades
   ============================================ */
.action-banner{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(135deg,rgba(0,0,0,.85),rgba(20,20,40,.9));
    border:2px solid var(--gold);
    border-radius:16px;
    padding:16px 32px;
    display:flex;align-items:center;gap:14px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s
}
.action-banner.show{opacity:1;animation:bannerPop .3s ease-out}
@keyframes bannerPop{
    0%{transform:translate(-50%,-50%) scale(.8);opacity:0}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.action-banner img{width:32px;height:32px}
.action-banner .action-user{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold)}
.action-banner .action-name{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#fff}
.action-banner .action-result{font-size:1.1rem;font-weight:700}
.action-banner .action-result.dmg{color:#ff6b6b}
.action-banner .action-result.heal{color:#4ade80}
.action-banner .action-result.def{color:#60a5fa}

/* Battle Action Buttons - Game UI Style */
.battle-actions{display:flex;justify-content:center;gap:12px;padding:15px;flex-wrap:wrap}
.battle-btn{
    display:flex;flex-direction:column;align-items:center;
    padding:12px 20px;min-width:85px;
    background:linear-gradient(180deg,rgba(40,40,60,.9),rgba(20,20,40,.95));
    border:2px solid rgba(255,255,255,.2);
    border-radius:12px;
    cursor:pointer;
    transition:all .2s
}
.battle-btn:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(255,255,255,.5)}
.battle-btn:disabled{opacity:.3;cursor:not-allowed}
.battle-btn .btn-icon{font-size:1.4rem;margin-bottom:4px}
.battle-btn .btn-icon-img{width:32px;height:32px;object-fit:contain;margin-bottom:4px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.battle-btn .btn-icon-svg{width:28px;height:28px;margin-bottom:4px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.battle-btn.defend .btn-icon-svg{color:#60a5fa}
.battle-btn .btn-label{font-family:'Cinzel',serif;font-size:.75rem;color:#fff}
.battle-btn.attack{border-color:#f87171}.battle-btn.attack:hover:not(:disabled){background:linear-gradient(180deg,#7f1d1d,#450a0a);box-shadow:0 0 20px rgba(248,113,113,.4)}
.battle-btn.defend{border-color:#60a5fa}.battle-btn.defend:hover:not(:disabled){background:linear-gradient(180deg,#1e3a5f,#0c1929);box-shadow:0 0 20px rgba(96,165,250,.4)}
.battle-btn.heal{border-color:#4ade80}.battle-btn.heal:hover:not(:disabled){background:linear-gradient(180deg,#14532d,#052e16);box-shadow:0 0 20px rgba(74,222,128,.4)}
.battle-btn.special{border-color:#fbbf24}.battle-btn.special:hover:not(:disabled){background:linear-gradient(180deg,#78350f,#451a03);box-shadow:0 0 20px rgba(251,191,36,.4)}

/* Battle Log - Chat style vertical stacking */
.battle-log{
    background:rgba(0,0,0,.85);

    margin:0 15px 15px;
    border-radius:10px;
    max-height:200px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;

.log-entry{

}

.log-entry.log-def{border-left-color:#60a5fa;color:#93c5fd}
.log-entry.log-spec{border-left-color:#fbbf24;color:#fde047}
.log-entry.log-info{border-left-color:#94a3b8;color:#cbd5e1}
.log-entry.log-enemy{border-left-color:#f87171;color:#fca5a5;background:rgba(127,29,29,.2)}
.log-entry.log-crit{border-left-color:#ff0000;color:#ff6666;background:rgba(200,0,0,.3);font-weight:bold}

/* Heal Target Overlay */
.heal-target-overlay{text-align:center}
.heal-targets{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:15px 0}
.heal-target-btn{
    background:rgba(0,0,0,.5);
    border:2px solid var(--green);
    border-radius:12px;
    padding:12px 16px;
    min-width:120px;
    cursor:pointer;
    transition:.2s;
    color:var(--txt)
}
.heal-target-btn:hover:not(:disabled){background:var(--green);color:#111;transform:scale(1.05)}
.heal-target-btn:disabled{opacity:.4;cursor:not-allowed;border-color:#666}
.heal-target-btn.full{border-color:#666}
.heal-target-name{font-family:'Cinzel',serif;font-weight:600;margin-bottom:5px}
.heal-target-hp{font-size:.75rem;color:var(--txt-dim)}
.heal-target-bar{height:8px;background:rgba(0,0,0,.3);border-radius:4px;margin-top:5px;overflow:hidden}
.heal-target-bar div{height:100%;background:var(--green);transition:.3s}
.full-tag{display:block;font-size:.7rem;color:#888;margin-top:5px}

.battle-log{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;margin:10px;max-height:120px;overflow-y:auto}
.log-title{font-size:.75rem;color:var(--gold);border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:5px;margin-bottom:5px}
.log-entry{font-size:.7rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.log-entry.dmg{color:var(--red)}.log-entry.heal{color:var(--green)}.log-entry.spec{color:var(--gold)}.log-entry.def{color:var(--blue)}.log-entry.boss{color:#c080ff}.log-entry.story{color:var(--ice)}

/* Story Log */
.story-log{max-height:60vh;overflow-y:auto;padding:12px}
.story-entry{background:linear-gradient(90deg,rgba(0,0,0,.2),transparent);border-left:3px solid var(--gold);padding:12px;margin-bottom:12px;border-radius:0 10px 10px 0}

.trophy-card{

}
.trophy-card.locked{opacity:.3;border-color:rgba(255,255,255,.1)}
.trophy-img{width:90px;height:90px;margin:0 auto}
.trophy-img img{width:100%;height:100%;object-fit:contain}
.trophy-name{font-family:'Cinzel',serif;font-size:.8rem;color:var(--gold);margin-top:8px}
.trophy-date{font-size:.65rem;color:var(--txt-muted)}

.bestiary-card p{font-size:.7rem;color:var(--txt-muted)}
.small-img{width:55px;height:55px;margin:0 auto 8px}

.locked-silhouette{

/* Teacher Panel */

}
.control-box select:focus,.control-box input:focus{outline:none;border-color:var(--gold)}

.btn-primary{background:var(--gold);color:#111}
.btn-secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-lt)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#111}
.btn-sm{padding:6px 10px;font-size:.75rem}

/* Teacher Shop Management */
.shop-section{background:linear-gradient(160deg,rgba(37,34,48,.95),rgba(28,26,36,.95));border-color:rgba(232,184,74,.3)}

.redemptions-list{display:flex;flex-direction:column;gap:12px;max-height:400px;overflow-y:auto}

.redemption-card{
    background:rgba(0,0,0,.3);
    border:2px solid rgba(251,191,36,.4);
    border-radius:10px;
    padding:12px;
    transition:all .2s;
}

.redemption-card.completed{
    border-color:rgba(74,222,128,.4);
    opacity:.7;
}

.redemption-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.redemption-student{
    font-family:'Cinzel',serif;
    color:var(--gold-lt);
    font-weight:600;
}

.redemption-time{
    font-size:.7rem;
    color:var(--txt-dim);
}

.redemption-reward{
    font-size:1.1rem;
    color:var(--txt);
    margin-bottom:6px;
    font-weight:600;
}

.redemption-cost{
    font-size:.85rem;
    color:var(--txt-muted);
    margin-bottom:4px;
}

.redemption-notes{
    font-size:.8rem;
    color:var(--txt-dim);
    font-style:italic;
    margin-top:6px;
}

.classroom-reward-card{
    background:rgba(0,0,0,.3);
    border:2px solid rgba(167,139,250,.4);
    border-radius:12px;
    padding:15px;
    display:flex;
    gap:15px;
    align-items:start;
    margin-bottom:12px;
}

.classroom-reward-card.funded{
    border-color:rgba(74,222,128,.6);
    box-shadow:0 0 20px rgba(74,222,128,.2);
}

.classroom-reward-card .reward-icon{
    font-size:3rem;
    flex-shrink:0;
}

.classroom-reward-card .reward-info{
    flex:1;
}

.classroom-reward-card .reward-name{
    font-family:'Cinzel',serif;
    font-size:1rem;
    color:var(--txt);
    margin-bottom:8px;
    font-weight:600;
}

.reward-progress-bar{
    width:100%;
    height:10px;
    background:rgba(0,0,0,.5);
    border-radius:5px;
    overflow:hidden;
    margin-bottom:6px;
}

.reward-progress-fill{
    height:100%;
    background:linear-gradient(90deg,#a78bfa,#8b5cf6);
    transition:width .5s ease;
}

.reward-progress-text{
    font-size:.85rem;
    color:var(--gold);
    margin-bottom:6px;
}

.reward-contributors{
    font-size:.75rem;
    color:var(--txt-dim);
    line-height:1.4;
}

.purchase-log{
    max-height:300px;
    overflow-y:auto;
}

.purchase-entry{
    background:rgba(0,0,0,.2);
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
    border-left:3px solid rgba(232,184,74,.4);
}

.purchase-time{
    font-size:.7rem;
    color:var(--txt-dim);
    margin-bottom:4px;
}

.purchase-details{
    font-size:.85rem;
    color:var(--txt);
}

.purchase-details strong{
    color:var(--gold-lt);
}

/* Attendance */
.attendance-list{max-height:320px;overflow-y:auto;margin:12px 0}
.attendance-item{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(0,0,0,.15);border-radius:8px;margin-bottom:6px}
.attendance-item input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:var(--gold)}
.attendance-item label{flex:1;font-size:.9rem;cursor:pointer;color:var(--txt)}
.attendance-item .creature-mini{width:35px;height:35px}
.attendance-item .creature-mini img{width:100%;height:100%;object-fit:contain}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:1000;padding:24px}
.overlay.active{display:flex}
.overlay-content{text-align:center;padding:24px;max-width:520px;max-height:90vh;overflow-y:auto}
.victory-text{font-family:'Uncial Antiqua',cursive;font-size:2.2rem;color:var(--gold);text-shadow:0 0 40px var(--gold)}
.defeat-text{font-family:'Uncial Antiqua',cursive;font-size:2.2rem;color:var(--red);text-shadow:0 0 40px var(--red)}
.overlay-msg{color:var(--txt-dim);margin:14px 0;font-size:.95rem}
.evo-creature{width:150px;height:150px;margin:0 auto}
.evo-creature img{width:100%;height:100%;object-fit:contain;animation:evolve 2s}
@keyframes evolve{0%{transform:scale(1)}50%{transform:scale(1.6);filter:brightness(2.5)}100%{transform:scale(1)}}
.evo-text{font-family:'Uncial Antiqua',cursive;font-size:1.4rem;color:var(--gold-lt);margin-top:14px}

/* Level Up Overlay */
#levelUpOverlay .overlay-content{
    position:relative;
    background:linear-gradient(135deg,rgba(40,30,60,.98),rgba(25,18,40,.98));
    border:2px solid var(--gold);
    border-radius:20px;
    box-shadow:0 0 60px rgba(232,184,74,.4),inset 0 0 80px rgba(232,184,74,.1);
    padding:40px 35px;
    max-width:420px;
    width:90vw;
}
.levelup-glow{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center,rgba(232,184,74,.15) 0%,transparent 70%);
    pointer-events:none;
    animation:levelupPulse 2s ease-in-out infinite;
}
@keyframes levelupPulse{
    0%,100%{opacity:0.6}
    50%{opacity:1}
}
.levelup-creature{
    width:180px;
    height:180px;
    margin:0 auto 20px;
    animation:levelupBounce 0.8s ease-out;
}
@keyframes levelupBounce{
    0%{transform:scale(0.3) translateY(-50px);opacity:0}
    60%{transform:scale(1.2) translateY(0);opacity:1}
    100%{transform:scale(1) translateY(0);opacity:1}
}
.levelup-creature img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 30px rgba(232,184,74,.6));
}
.levelup-text{
    font-family:'Uncial Antiqua',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 0 40px var(--gold),0 0 20px var(--gold);
    margin:10px 0;
}
.levelup-name{
    font-family:'Fredoka One',cursive;
    font-size:1.3rem;
    color:var(--txt);
    margin:8px 0;
}
.levelup-level{
    font-family:'Cinzel',serif;
    font-size:1.1rem;
    color:var(--gold);
    margin:5px 0 20px;
}
.levelup-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin:25px 0;
}
.stat-change{
    background:rgba(0,0,0,.3);
    border:1px solid rgba(232,184,74,.3);
    border-radius:10px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.stat-label{
    font-family:'Cinzel',serif;
    font-size:0.75rem;
    color:var(--txt-muted);
    text-transform:uppercase;
    letter-spacing:1px;
    min-width:32px;
}
/* Color-coded stat labels */
.stat-change:nth-child(1) .stat-label{color:#4ade80} /* HP = Green */
.stat-change:nth-child(1) .stat-new{color:#4ade80}
.stat-change:nth-child(2) .stat-label{color:#f87171} /* ATK = Red */
.stat-change:nth-child(2) .stat-new{color:#f87171}
.stat-change:nth-child(3) .stat-label{color:#60a5fa} /* DEF = Blue */
.stat-change:nth-child(3) .stat-new{color:#60a5fa}
.stat-change:nth-child(4) .stat-label{color:#fbbf24} /* SPD = Yellow */
.stat-change:nth-child(4) .stat-new{color:#fbbf24}
.stat-old{
    font-size:0.9rem;
    color:var(--txt-dim);
}
.stat-arrow{
    font-size:0.8rem;
    color:var(--gold);
}
.stat-new{
    font-family:'Cinzel',serif;
    font-size:1rem;
    font-weight:700;
}

/* Large Intro Screen - Creator takes up 80% */
#introOverlay .overlay-content{
    width:90%;
    max-width:700px;
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    background:linear-gradient(180deg,rgba(30,25,45,.98) 0%,rgba(20,15,35,.98) 100%);
    border:3px solid var(--gold);
    box-shadow:0 0 60px rgba(255,200,50,.3),inset 0 0 100px rgba(255,200,50,.05)
}
.intro-creator{width:220px;height:220px;margin:0 auto 24px;filter:drop-shadow(0 0 50px rgba(255,200,50,.5))}
.intro-creator img{width:100%;height:100%;object-fit:contain;animation:floatCreator 3s infinite ease-in-out}
@keyframes floatCreator{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.intro-title{font-family:'Uncial Antiqua',cursive;font-size:2rem;color:var(--gold-lt);margin-bottom:16px;text-shadow:0 0 30px rgba(255,200,50,.5)}
.intro-text{font-size:1rem;line-height:1.8;color:var(--txt);margin-bottom:24px;max-width:550px}
.intro-text p{margin-bottom:12px}

@media(max-width:600px){
    .students-grid.s2,.students-grid.s3{grid-template-columns:1fr}
    .team-member{min-width:85px}
    .creature-name-hero{font-size:1.4rem}
}

/* ============================================
   LEVEL UP CELEBRATION
   ============================================ */
.levelup-overlay{
    position:fixed;inset:0;z-index:2000;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.85);
    animation:levelupFadeIn .3s ease-out;
}
@keyframes levelupFadeIn{from{opacity:0}to{opacity:1}}

.levelup-container{
    text-align:center;
    position:relative;
    animation:levelupBounce .6s cubic-bezier(.36,1.4,.6,1);
}
@keyframes levelupBounce{
    0%{transform:scale(0) rotate(-10deg)}
    50%{transform:scale(1.1) rotate(5deg)}
    100%{transform:scale(1) rotate(0)}
}

.levelup-ring{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:150px;height:150px;
    border:3px solid var(--gold);
    border-radius:50%;
    animation:ringExpand 1s ease-out forwards;
}
@keyframes ringExpand{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1}
    100%{transform:translate(-50%,-50%) scale(3);opacity:0}
}

.levelup-text{
    font-family:'Uncial Antiqua',cursive;
    font-size:2.5rem;
    color:var(--gold-lt);
    text-shadow:0 0 30px var(--gold),0 0 60px var(--gold);
    animation:levelupGlow 1s ease-in-out infinite alternate;
}
@keyframes levelupGlow{
    from{text-shadow:0 0 30px var(--gold),0 0 60px var(--gold)}
    to{text-shadow:0 0 50px var(--gold-lt),0 0 100px var(--gold)}
}

.levelup-level{
    font-family:'Fredoka One',sans-serif;
    font-size:4rem;
    color:#fff;
    text-shadow:0 0 40px rgba(255,255,255,.8);
    animation:levelPop .5s cubic-bezier(.36,1.4,.6,1) .3s both;
}
@keyframes levelPop{
    0%{transform:scale(0);opacity:0}
    100%{transform:scale(1);opacity:1}
}

/* Duplicate removed - using grid layout from line 2201 */

.levelup-stat{
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.3);
    border-radius:10px;padding:8px 16px;
}
.levelup-stat-label{font-size:.65rem;color:#888}
.levelup-stat-value{font-family:'Fredoka One',sans-serif;font-size:1.3rem;color:var(--green)}
.levelup-stat-value::before{content:'+';}

/* ============================================
   XP/COIN GAIN POPUPS
   ============================================ */
.gain-popup{
    position:fixed;
    font-family:'Fredoka One',sans-serif;
    font-size:1.4rem;
    padding:8px 16px;
    border-radius:20px;
    pointer-events:none;
    z-index:1500;
    animation:gainPopup 1.5s ease-out forwards;
}
.gain-popup.xp{
    background:linear-gradient(135deg,#9333ea,#7c3aed);
    color:#fff;
    box-shadow:0 4px 20px rgba(147,51,234,.5);
}
.gain-popup.coins{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:#fff;
    box-shadow:0 4px 20px rgba(245,158,11,.5);
}
.gain-popup.xp::before{content:'✨ +';}
.gain-popup.coins::before{content:'🪙 +';}

@keyframes gainPopup{
    0%{transform:translateY(0) scale(0.5);opacity:0}
    20%{transform:translateY(-10px) scale(1.1);opacity:1}
    80%{transform:translateY(-50px) scale(1);opacity:1}
    100%{transform:translateY(-80px) scale(0.8);opacity:0}
}

/* ============================================
   EVOLUTION SEQUENCE
   ============================================ */
.evo-sequence{
    position:fixed;inset:0;z-index:3000;
    display:flex;align-items:center;justify-content:center;
    background:#000;
}
.evo-stage{
    text-align:center;
    position:relative;
}
.evo-old-creature,.evo-new-creature{
    width:200px;height:200px;
    position:relative;
    margin:0 auto;
}
.evo-old-creature img,.evo-new-creature img{
    width:100%;height:100%;object-fit:contain;
}
.evo-glow{
    position:absolute;inset:-50px;
    background:radial-gradient(circle,rgba(255,255,255,.8) 0%,transparent 70%);
    animation:evoGlow 2s ease-in-out;
}
@keyframes evoGlow{
    0%{transform:scale(0);opacity:0}
    50%{transform:scale(1.5);opacity:1}
    100%{transform:scale(2);opacity:0}
}
.evo-particles{
    position:absolute;inset:-100px;
    pointer-events:none;
}
.evo-particle{
    position:absolute;
    width:8px;height:8px;
    background:var(--gold);
    border-radius:50%;
    animation:evoParticle 1.5s ease-out forwards;
}
@keyframes evoParticle{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.evo-flash{
    position:fixed;inset:0;
    background:#fff;
    animation:evoFlash .5s ease-out forwards;
    pointer-events:none;
}
@keyframes evoFlash{
    0%{opacity:1}
    100%{opacity:0}
}
.evo-morph{animation:evoMorph 1s ease-in-out}
@keyframes evoMorph{
    0%{filter:brightness(1) blur(0)}
    40%{filter:brightness(3) blur(10px);transform:scale(1.2)}
    60%{filter:brightness(5) blur(15px);transform:scale(0.8)}
    100%{filter:brightness(1) blur(0);transform:scale(1)}
}
.evo-reveal{animation:evoReveal .8s cubic-bezier(.36,1.4,.6,1)}
@keyframes evoReveal{
    0%{transform:scale(0) rotate(-180deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}
}
.evo-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 0 30px var(--gold);
    animation:evoTitle 1s ease-out .5s both;
}
@keyframes evoTitle{
    from{transform:translateY(30px);opacity:0}
    to{transform:translateY(0);opacity:1}
}
.evo-newname{
    font-family:'Fredoka One',sans-serif;
    font-size:1.8rem;
    color:#fff;
    margin-top:10px;
    animation:evoTitle 1s ease-out .7s both;
}
.evo-stats-compare{
    display:flex;justify-content:center;gap:25px;margin-top:25px;
    animation:evoTitle 1s ease-out .9s both;
}
.evo-stat-box{text-align:center}
.evo-stat-label{font-size:.75rem;color:#888}
.evo-stat-arrow{color:var(--green);margin:0 8px}
.evo-stat-old{color:#888;text-decoration:line-through}
.evo-stat-new{color:var(--green);font-weight:bold}

/* Confetti */
.confetti-container{
    position:fixed;inset:0;pointer-events:none;z-index:2500;overflow:hidden;
}
.confetti{
    position:absolute;
    width:10px;height:10px;
    animation:confettiFall 3s linear forwards;
}
@keyframes confettiFall{
    0%{transform:translateY(-100px) rotate(0deg);opacity:1}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ============================================
   SCREEN TRANSITIONS
   ============================================ */
.screen-transition{
    animation:screenFadeIn .35s ease-out;
}
@keyframes screenFadeIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

/* Card stagger animation - only on initial load via class */
.card.animate-in{animation:cardAppear .4s ease-out both}
.students-grid.animate-cards .card:nth-child(1){animation-delay:.03s}
.students-grid.animate-cards .card:nth-child(2){animation-delay:.06s}
.students-grid.animate-cards .card:nth-child(3){animation-delay:.09s}
.students-grid.animate-cards .card:nth-child(4){animation-delay:.12s}
.students-grid.animate-cards .card:nth-child(5){animation-delay:.15s}
.students-grid.animate-cards .card:nth-child(6){animation-delay:.18s}

@keyframes cardAppear{
    from{opacity:0;transform:translateY(20px) scale(0.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* Battle enter animation - only on initial enter */
.battle-container.animate-in{animation:battleEnter .4s ease-out}
@keyframes battleEnter{
    from{opacity:0;transform:scale(0.97)}
    to{opacity:1;transform:scale(1)}
}

/* Stat icon images - Preserve natural aspect ratio */
.mini-stat .stat-icon-img{
    height:20px; /* Fixed height only */
    width:auto; /* Let width scale naturally */
    object-fit:contain;
    margin-right:4px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
    vertical-align:middle;
}


/* ============================================
   SHOP SYSTEM STYLES
   ============================================ */

.shop-container{
    max-width:1400px;
    margin:0 auto;
    padding:20px;
}

/* Shop Header */
.shop-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.4);
    padding:20px 30px;
    border-radius:15px;
    border:1px solid rgba(232,184,74,.3);
    margin-bottom:25px;
}

.shop-student-selector{
    display:flex;
    align-items:center;
    gap:12px;
}

.shop-student-selector label{
    font-family:'Cinzel',serif;
    color:var(--gold);
    font-size:1rem;
}

.shop-select{
    font-family:'Cinzel',serif;
    background:rgba(0,0,0,.6);
    color:var(--txt);
    border:2px solid rgba(232,184,74,.4);
    padding:10px 20px;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    transition:all .2s;
}

.shop-select:hover{
    border-color:var(--gold);
    box-shadow:0 0 15px rgba(232,184,74,.3);
}

.shop-coins{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(232,184,74,.1);
    padding:12px 25px;
    border-radius:12px;
    border:2px solid var(--gold);
}

.coin-icon{
    font-size:2rem;
}

.coin-amount{
    font-family:'Fredoka One',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 2px 8px rgba(232,184,74,.6);
}

.coin-label{
    font-family:'Cinzel',serif;
    color:var(--gold);
    font-size:.9rem;
}

/* Category Tabs */
.shop-categories{
    display:flex;
    gap:12px;
    margin-bottom:25px;
    justify-content:center;
}

.shop-cat-btn{
    font-family:'Cinzel',serif;
    background:rgba(0,0,0,.5);
    color:var(--txt-muted);
    border:2px solid rgba(255,255,255,.2);
    padding:15px 30px;
    border-radius:12px;
    font-size:1rem;
    cursor:pointer;
    transition:all .2s;
}

.shop-cat-btn:hover{
    border-color:rgba(232,184,74,.5);
    color:var(--txt);
    transform:translateY(-2px);
}

.shop-cat-btn.active{
    background:linear-gradient(135deg,rgba(232,184,74,.2),rgba(212,168,75,.1));
    border-color:var(--gold);
    color:var(--gold-lt);
    box-shadow:0 0 20px rgba(232,184,74,.3);
}

/* Items Grid */
.shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:10px;
}

/* Item Card */
.shop-item-card{
    position:relative;
    background:linear-gradient(135deg,rgba(30,25,45,.95),rgba(20,15,35,.98));
    border:2px solid;
    border-radius:15px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:all .3s;
    cursor:default;
}

.shop-item-card:hover:not(.locked){
    transform:translateY(-5px);
    box-shadow:0 10px 30px currentColor !important;
}

.shop-item-card.locked{
    opacity:0.5;
    filter:grayscale(0.7);
}

/* Rarity Badge */
.shop-item-rarity{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 20px;
    border-radius:20px;
    font-family:'Cinzel',serif;
    font-size:.75rem;
    font-weight:700;
    color:#000;
    text-transform:uppercase;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
}

.shop-item-lock{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(0,0,0,.8);
    padding:6px 12px;
    border-radius:8px;
    font-size:.75rem;
    color:var(--txt-dim);
}

/* Item Content */
.shop-item-icon{
    font-size:4rem;
    margin:10px 0 15px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
}

.shop-item-name{
    font-family:'Fredoka One',cursive;
    font-size:1.2rem;
    color:var(--txt);
    text-align:center;
    margin-bottom:8px;
}

.shop-item-desc{
    font-size:.85rem;
    color:var(--txt-muted);
    text-align:center;
    margin-bottom:15px;
    min-height:40px;
    line-height:1.4;
}

/* Classroom Reward Progress */
.shop-classroom-progress{
    width:100%;
    margin-bottom:15px;
}

.shop-progress-bar{
    width:100%;
    height:12px;
    background:rgba(0,0,0,.5);
    border-radius:6px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    margin-bottom:8px;
}

.shop-progress-fill{
    height:100%;
    background:linear-gradient(90deg,#4ade80,#22c55e);
    border-radius:6px;
    transition:width .5s ease;
    box-shadow:0 0 10px rgba(74,222,128,.5);
}

.shop-progress-text{
    font-size:.85rem;
    color:var(--gold);
    text-align:center;
    font-family:'Cinzel',serif;
}

.shop-contributors{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:8px;
}

.shop-contributors span{
    width:28px;
    height:28px;
    background:rgba(232,184,74,.2);
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cinzel',serif;
    font-size:.75rem;
    color:var(--gold-lt);
    font-weight:700;
}

/* Price */
.shop-item-price{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
}

.price-amount{
    font-family:'Fredoka One',cursive;
    font-size:1.5rem;
    color:var(--gold-lt);
}

.price-coin{
    font-size:1.8rem;
}

/* Buy Button */
.shop-buy-btn{
    width:100%;
    font-family:'Cinzel',serif;
    font-size:1rem;
    padding:12px 24px;
    background:linear-gradient(135deg,var(--gold),var(--gold-lt));
    color:#000;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:all .2s;
    box-shadow:0 4px 15px rgba(232,184,74,.3);
}

.shop-buy-btn:hover:not(.disabled){
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(232,184,74,.5);
    background:linear-gradient(135deg,var(--gold-lt),var(--gold));
}

.shop-buy-btn.disabled{
    background:rgba(100,100,100,.4);
    color:rgba(255,255,255,.3);
    cursor:not-allowed;
    box-shadow:none;
}

/* ============================================
   BATTLE ARENA STYLES (v54.3)
   ============================================ */

/* Arena Screen - Mode Selection */
.arena-screen{padding:20px;max-width:1200px;margin:0 auto}
.arena-header{text-align:center;margin-bottom:30px}
.arena-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:2.5rem;
    color:var(--gold);
    text-shadow:0 0 30px rgba(232,184,74,.5),0 4px 15px rgba(0,0,0,.5);
    margin-bottom:10px;
    animation:arenaTitlePulse 2s ease-in-out infinite;
}
@keyframes arenaTitlePulse{
    0%,100%{text-shadow:0 0 30px rgba(232,184,74,.5),0 4px 15px rgba(0,0,0,.5)}
    50%{text-shadow:0 0 50px rgba(232,184,74,.8),0 4px 20px rgba(0,0,0,.5)}
}
.arena-subtitle{color:var(--txt-dim);font-size:1.1rem;font-style:italic}
.arena-section-title{
    font-family:'Cinzel',serif;
    font-size:1.4rem;
    color:var(--gold-lt);
    margin-bottom:20px;
    text-align:center;
}
.arena-notice{
    text-align:center;
    padding:40px;
    background:rgba(255,100,100,.1);
    border:2px solid rgba(255,100,100,.3);
    border-radius:15px;
    margin:20px 0;
}
.arena-notice h3{color:var(--red);margin-bottom:10px}

/* Mode Selection Grid */
.arena-mode-select{margin-bottom:40px}
.arena-modes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    max-width:950px;
    margin:0 auto;
}
.arena-mode-card{
    background:linear-gradient(135deg,rgba(50,40,70,.9),rgba(30,25,45,.9));
    border:2px solid rgba(232,184,74,.3);
    border-radius:15px;
    padding:25px 20px;
    text-align:center;
    cursor:pointer;
    transition:all .3s ease;
    position:relative;
    overflow:hidden;
}
.arena-mode-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 0%,rgba(232,184,74,.15),transparent 60%);
    opacity:0;
    transition:opacity .3s;
}
.arena-mode-card:hover{
    border-color:var(--gold);
    transform:translateY(-5px);
    box-shadow:0 10px 30px rgba(232,184,74,.3);
}
.arena-mode-card:hover::before{opacity:1}
.arena-mode-card.disabled{
    opacity:.5;
    cursor:not-allowed;
    filter:grayscale(.5);
}
.arena-mode-card.disabled:hover{
    transform:none;
    box-shadow:none;
    border-color:rgba(232,184,74,.3);
}
.mode-icon{font-size:3rem;margin-bottom:10px}
.mode-name{
    font-family:'Cinzel',serif;
    font-size:1.3rem;
    color:var(--gold-lt);
    margin-bottom:8px;
}
.mode-desc{color:var(--txt-dim);font-size:.9rem}
.mode-disabled-reason{
    display:block;
    margin-top:10px;
    color:var(--red);
    font-size:.8rem;
}

/* Team Selection */
.arena-team-select{margin-bottom:30px}
.team-select-info{text-align:center;color:var(--txt-dim);margin-bottom:20px}
.team-slots{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:30px;
    flex-wrap:wrap;
}
.team-slot{
    width:120px;
    height:150px;
    background:rgba(40,35,60,.8);
    border:2px dashed rgba(232,184,74,.4);
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:all .3s;
    cursor:pointer;
    position:relative;
}
.team-slot.filled{
    border-style:solid;
    border-color:var(--gold);
    background:linear-gradient(135deg,rgba(50,45,75,.9),rgba(35,30,55,.9));
}
.team-slot.filled:hover{border-color:var(--red)}
.team-slot.filled:hover .slot-remove{opacity:1}
.slot-img{width:70px;height:70px;object-fit:contain}
.slot-name{font-size:.85rem;color:var(--txt);margin-top:5px;text-align:center}
.slot-level{font-size:.75rem;color:var(--gold)}
.slot-remove{
    position:absolute;
    top:5px;
    right:5px;
    color:var(--red);
    font-size:1.2rem;
    opacity:0;
    transition:opacity .2s;
}
.slot-placeholder{
    font-size:3rem;
    color:rgba(232,184,74,.4);
}
.team-slot.empty{cursor:default}

/* Available Fighters */
.available-fighters{margin-bottom:20px}
.available-fighters h3{
    text-align:center;
    color:var(--txt-dim);
    margin-bottom:15px;
    font-size:1rem;
}
.fighters-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
    max-height:300px;
    overflow-y:auto;
    padding:10px;
}
.fighter-card{
    background:linear-gradient(135deg,rgba(45,40,65,.9),rgba(30,25,45,.9));
    border:2px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    transition:all .2s;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.fighter-card:hover{
    border-color:var(--gold);
    transform:scale(1.03);
    box-shadow:0 5px 20px rgba(232,184,74,.3);
}
.fighter-img-wrap{width:60px;height:60px;margin-bottom:8px}
.fighter-img{width:100%;height:100%;object-fit:contain}
.fighter-info{text-align:center;width:100%}
.fighter-name{font-size:.9rem;color:var(--txt);font-weight:600;margin-bottom:3px}
.fighter-level{font-size:.75rem;color:var(--gold);margin-bottom:5px}
.fighter-stats{
    display:flex;
    justify-content:center;
    gap:8px;
    font-size:.7rem;
    color:var(--txt-dim);
    margin-bottom:3px;
}
.fighter-record{font-size:.7rem;color:var(--txt-muted)}

/* Navigation Buttons */
.team-select-buttons,.confirm-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}
.arena-btn{
    padding:12px 30px;
    font-family:'Cinzel',serif;
    font-size:1rem;
    border:2px solid;
    border-radius:10px;
    cursor:pointer;
    transition:all .2s;
}
.arena-btn.back{
    background:rgba(100,100,100,.3);
    border-color:rgba(255,255,255,.2);
    color:var(--txt-dim);
}
.arena-btn.back:hover{
    background:rgba(100,100,100,.5);
    border-color:rgba(255,255,255,.4);
}
.arena-btn.next{
    background:linear-gradient(135deg,rgba(232,184,74,.3),rgba(180,140,50,.3));
    border-color:var(--gold);
    color:var(--gold-lt);
}
.arena-btn.next:hover{
    background:linear-gradient(135deg,rgba(232,184,74,.5),rgba(180,140,50,.5));
    box-shadow:0 5px 20px rgba(232,184,74,.3);
}
.arena-btn.next.disabled{
    opacity:.5;
    cursor:not-allowed;
}
.arena-btn.fight{
    background:linear-gradient(135deg,#e74c3c,#c0392b);
    border-color:#e74c3c;
    color:#fff;
    font-size:1.2rem;
    padding:15px 40px;
    animation:fightBtnPulse 1.5s ease-in-out infinite;
}
@keyframes fightBtnPulse{
    0%,100%{box-shadow:0 0 20px rgba(231,76,60,.4)}
    50%{box-shadow:0 0 40px rgba(231,76,60,.7)}
}
.arena-btn.fight:hover{
    transform:scale(1.05);
    box-shadow:0 0 50px rgba(231,76,60,.6);
}

/* Confirm Screen */
.arena-matchup{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    margin:30px 0;
    flex-wrap:wrap;
}
.vs-badge{
    font-family:'Uncial Antiqua',cursive;
    font-size:2.5rem;
    color:var(--red);
    text-shadow:0 0 20px rgba(255,80,80,.5);
    animation:vsPulse 1s ease-in-out infinite;
}
@keyframes vsPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.2)}
}
.matchup-team{text-align:center}
.team-label{
    font-family:'Cinzel',serif;
    font-size:1.2rem;
    margin-bottom:15px;
}
.team-1 .team-label{color:#e74c3c}
.team-2 .team-label{color:#3498db}
.matchup-fighters{display:flex;gap:15px;justify-content:center}
.matchup-fighter{text-align:center}
.fighter-frame{
    width:100px;
    height:100px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--gold);
    margin-bottom:8px;
}
.fighter-frame img{width:100%;height:100%;object-fit:contain}
.matchup-name{font-size:.9rem;color:var(--txt)}
.matchup-level{font-size:.75rem;color:var(--gold)}

/* FFA Layout */
.ffa-fighters{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}
.ffa-fighter{text-align:center}
.fighter-label{margin-top:8px;font-size:.9rem;color:var(--txt)}

/* Leaderboard */
.arena-leaderboard{
    background:linear-gradient(135deg,rgba(40,35,60,.8),rgba(25,20,40,.8));
    border:2px solid rgba(232,184,74,.2);
    border-radius:15px;
    padding:25px;
    margin-top:30px;
}
.leaderboard-list{display:flex;flex-direction:column;gap:10px}
.leaderboard-entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:rgba(0,0,0,.3);
    border-radius:10px;
    transition:all .2s;
}
.leaderboard-entry:hover{background:rgba(232,184,74,.1)}
.leaderboard-entry.champion{
    background:linear-gradient(135deg,rgba(232,184,74,.2),rgba(180,140,50,.1));
    border:1px solid var(--gold);
}
.lb-rank{font-size:1.5rem}
.lb-img{width:50px;height:50px;border-radius:50%;object-fit:contain;border:2px solid rgba(255,255,255,.2)}
.champion .lb-img{border-color:var(--gold)}
.lb-info{flex:1}
.lb-name{font-size:1rem;color:var(--txt);font-weight:600}
.lb-stats{font-size:.8rem;color:var(--txt-dim)}
.lb-streak{font-size:1.1rem;color:var(--gold)}
.leaderboard-empty{
    text-align:center;
    padding:30px;
    color:var(--txt-dim);
    font-style:italic;
}

/* Arena Battle Screen */
.arena-battle-container{
    height:80vh;
    max-height:80vh;
    background-size:cover;
    background-position:center;
    border-radius:15px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.arena-battle-container::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.6) 100%);
    pointer-events:none;
    z-index:0;
}
.arena-battle-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.5),rgba(0,0,0,.8));
    position:relative;
    z-index:10;
}
.arena-battle-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:1.5rem;
    color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.5);
}
.arena-forfeit-btn{
    background:rgba(200,50,50,.3);
    border:2px solid rgba(200,50,50,.5);
    color:#fff;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Cinzel',serif;
    font-size:.85rem;
    transition:all .2s;
}
.arena-forfeit-btn:hover{
    background:rgba(200,50,50,.5);
    border-color:rgba(200,50,50,.8);
}

/* Turn Order Bar */
.arena-turn-bar{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
    background:rgba(0,0,0,.5);
    position:relative;
    z-index:10;
}
.arena-turn-portrait{
    width:50px;
    height:60px;
    border-radius:8px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.3);
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:all .3s;
    background:rgba(0,0,0,.5);
}
.arena-turn-portrait img{
    width:35px;
    height:35px;
    object-fit:contain;
}
.arena-turn-portrait .turn-name{
    font-size:.6rem;
    color:var(--txt-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
    text-align:center;
    padding:0 2px;
}
.arena-turn-portrait.active{
    border-color:var(--gold);
    transform:scale(1.15);
    box-shadow:0 0 15px rgba(232,184,74,.5);
}
.arena-turn-portrait.team0{border-left:3px solid #e74c3c}
.arena-turn-portrait.team1{border-left:3px solid #3498db}
.arena-turn-portrait.ffa{border-left:3px solid #9b59b6}
.arena-turn-portrait.ko{opacity:.4;filter:grayscale(.8)}

/* Battlefield */
.arena-battlefield{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    padding:20px;
    position:relative;
    z-index:5;
}
.arena-team-side{
    display:flex;
    flex-direction:column;
    gap:20px;
    align-items:center;
}
.red-team .arena-fighter{border-left:4px solid #e74c3c}
.blue-team .arena-fighter{border-left:4px solid #3498db}

.arena-fighter,.ffa-fighter{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
    background:rgba(0,0,0,.4);
    border-radius:15px;
    border:2px solid rgba(255,255,255,.15);
    transition:all .3s;
    cursor:default;
}
.arena-fighter.active,.ffa-fighter.active{
    border-color:var(--gold);
    box-shadow:0 0 25px rgba(232,184,74,.4);
    animation:activeFighterPulse 1.5s ease-in-out infinite;
}
@keyframes activeFighterPulse{
    0%,100%{box-shadow:0 0 25px rgba(232,184,74,.4)}
    50%{box-shadow:0 0 40px rgba(232,184,74,.6)}
}
.arena-fighter.ko,.ffa-fighter.ko{
    opacity:.4;
    filter:grayscale(.7);
}
.arena-fighter.targetable,.ffa-fighter.targetable{
    cursor:pointer;
    animation:targetableGlow 0.8s ease-in-out infinite;
}
.active-indicator{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold);
    font-size:1.5rem;
    animation:bounceArrow 0.6s ease-in-out infinite;
}
.fighter-creature{
    width:90px;
    height:90px;
    margin-bottom:10px;
}
.fighter-creature img{
    width:100%;
    height:100%;
    object-fit:contain;
    animation:creatureIdle 2s ease-in-out infinite;
}
.fighter-hud{
    width:100%;
    text-align:center;
}
.fighter-hud-name{
    font-size:.85rem;
    color:var(--txt);
    margin-bottom:5px;
    font-weight:600;
}
.fighter-hp-bar,.fighter-focus-bar{
    height:8px;
    background:rgba(0,0,0,.5);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:4px;
}
.fighter-hp-fill{
    height:100%;
    background:linear-gradient(90deg,#e74c3c,#c0392b);
    transition:width .3s;
}
.fighter-focus-fill{
    height:100%;
    background:linear-gradient(90deg,#3498db,#2980b9);
    transition:width .3s;
}
.fighter-focus-bar{height:5px}

/* VS Center Badge */
.arena-vs-center{
    font-family:'Uncial Antiqua',cursive;
    font-size:3rem;
    color:var(--gold);
    text-shadow:0 0 30px rgba(232,184,74,.5);
    animation:vsPulse 1.5s ease-in-out infinite;
}

/* FFA Arena Layout */
.ffa-arena{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    max-width:600px;
}

/* Combat Log */
.arena-log{
    position:absolute;
    bottom:100px;
    left:20px;
    width:350px;
    max-height:200px;
    overflow-y:auto;
    background:rgba(0,0,0,.7);
    border-radius:10px;
    padding:10px;
    z-index:20;
}
.arena-log-entry{
    font-size:.8rem;
    padding:5px 8px;
    margin-bottom:4px;
    border-radius:5px;
    background:rgba(255,255,255,.05);
}
.arena-log-entry.log-atk{border-left:3px solid #e74c3c}
.arena-log-entry.log-def{border-left:3px solid #3498db}
.arena-log-entry.log-heal{border-left:3px solid #2ecc71}
.arena-log-entry.log-spec{border-left:3px solid #f39c12}
.arena-log-entry.log-focus{border-left:3px solid #9b59b6}

/* Action Bar */
.arena-action-bar{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.95));
    padding:15px 25px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:30;
}
.action-fighter-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.action-name{
    font-family:'Cinzel',serif;
    font-size:1.1rem;
    color:var(--gold-lt);
}
.action-focus{
    font-size:.9rem;
    color:#3498db;
}
.arena-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}
.arena-action-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:12px 20px;
    min-width:100px;
    background:linear-gradient(135deg,rgba(60,55,85,.9),rgba(40,35,60,.9));
    border:2px solid rgba(255,255,255,.2);
    border-radius:12px;
    cursor:pointer;
    transition:all .2s;
}
.arena-action-btn:hover{
    border-color:var(--gold);
    transform:translateY(-3px);
    box-shadow:0 5px 20px rgba(232,184,74,.3);
}
.arena-action-btn.disabled{
    opacity:.5;
    cursor:not-allowed;
}
.arena-action-btn.disabled:hover{
    transform:none;
    box-shadow:none;
    border-color:rgba(255,255,255,.2);
}
.arena-action-btn .btn-icon{font-size:1.5rem}
.arena-action-btn .btn-label{
    font-family:'Cinzel',serif;
    font-size:.85rem;
    color:var(--txt);
}
.arena-action-btn .btn-cost{
    font-size:.7rem;
    color:var(--txt-dim);
}
.arena-action-btn.attack:hover{border-color:#e74c3c;box-shadow:0 5px 20px rgba(231,76,60,.3)}
.arena-action-btn.defend:hover{border-color:#3498db;box-shadow:0 5px 20px rgba(52,152,219,.3)}
.arena-action-btn.heal:hover{border-color:#2ecc71;box-shadow:0 5px 20px rgba(46,204,113,.3)}
.arena-action-btn.special:hover{border-color:#f39c12;box-shadow:0 5px 20px rgba(243,156,18,.3)}

/* Targeting Overlay */
.targeting-overlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);
    padding:20px 40px;
    border-radius:15px;
    border:2px solid var(--gold);
    z-index:40;
    animation:targetingPop .3s ease-out;
}
@keyframes targetingPop{
    0%{transform:translate(-50%,-50%) scale(.8);opacity:0}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.targeting-text{
    font-family:'Cinzel',serif;
    font-size:1.3rem;
    color:var(--gold);
}

/* Damage/Heal Popups */
.arena-dmg-popup,.arena-heal-popup{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    font-family:'Cinzel',serif;
    font-size:1.5rem;
    font-weight:bold;
    animation:damageFloatUp 1s ease-out forwards;
    z-index:100;
    pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.8);
}
.arena-dmg-popup{color:#e74c3c}
.arena-dmg-popup.crit{color:#ff6b6b;font-size:2rem}
.arena-heal-popup{color:#2ecc71}

/* Animation classes */
.attack-anim{animation:arenaAttack .5s ease-out}
@keyframes arenaAttack{
    0%{transform:translateX(0)}
    30%{transform:translateX(30px)}
    100%{transform:translateX(0)}
}
.hit-shake{animation:hitShake .3s ease-out}
.defend-glow{animation:defendGlow .5s ease-out}
@keyframes defendGlow{
    0%{box-shadow:0 0 0 rgba(52,152,219,0)}
    50%{box-shadow:0 0 30px rgba(52,152,219,.8)}
    100%{box-shadow:0 0 0 rgba(52,152,219,0)}
}
.heal-glow{animation:healGlowArena .6s ease-out}
@keyframes healGlowArena{
    0%{box-shadow:0 0 0 rgba(46,204,113,0)}
    50%{box-shadow:0 0 40px rgba(46,204,113,.8)}
    100%{box-shadow:0 0 0 rgba(46,204,113,0)}
}
.special-charge{animation:specialChargeArena .4s ease-out}
@keyframes specialChargeArena{
    0%{filter:brightness(1);transform:scale(1)}
    50%{filter:brightness(1.5);transform:scale(1.1)}
    100%{filter:brightness(1);transform:scale(1)}
}

/* Victory Overlay */
.arena-victory-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10000;
    opacity:0;
    transition:opacity .3s;
}
.arena-victory-overlay.active{opacity:1}
.arena-victory-content{
    position:relative;
    text-align:center;
    z-index:10001;
}
.fireworks-canvas{
    position:fixed;
    inset:0;
    z-index:10000;
    pointer-events:none;
}
.arena-victory-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:4rem;
    color:var(--gold);
    text-shadow:0 0 50px rgba(232,184,74,.8),0 0 100px rgba(232,184,74,.5);
    margin-bottom:30px;
    animation:victoryTitleBounce 1s ease-out;
}
.arena-victory-title.draw{color:#9b59b6;text-shadow:0 0 50px rgba(155,89,182,.8)}
@keyframes victoryTitleBounce{
    0%{transform:scale(0);opacity:0}
    50%{transform:scale(1.2)}
    100%{transform:scale(1);opacity:1}
}
.arena-victory-subtitle{
    font-size:1.3rem;
    color:var(--txt-dim);
    margin-bottom:20px;
}
.victory-champions{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:30px 0;
}
.victory-champion{
    text-align:center;
    animation:championAppear .6s ease-out backwards;
}
.victory-champion:nth-child(2){animation-delay:.2s}
.victory-champion:nth-child(3){animation-delay:.4s}
@keyframes championAppear{
    0%{transform:translateY(50px);opacity:0}
    100%{transform:translateY(0);opacity:1}
}
.champion-frame{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid var(--gold);
    margin:0 auto 15px;
    box-shadow:0 0 30px rgba(232,184,74,.5);
    animation:championPulse 2s ease-in-out infinite;
}
@keyframes championPulse{
    0%,100%{box-shadow:0 0 30px rgba(232,184,74,.5)}
    50%{box-shadow:0 0 50px rgba(232,184,74,.8)}
}
.champion-img{
    width:100%;
    height:100%;
    object-fit:contain;
    animation:victoryBounce 1s ease-in-out infinite;
}
.champion-name{
    font-family:'Cinzel',serif;
    font-size:1.3rem;
    color:var(--txt);
    margin-bottom:5px;
}
.champion-title{
    font-size:1rem;
    color:var(--gold);
    font-weight:bold;
}
.victory-stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:20px 0;
}
.stat-item{
    font-size:1.1rem;
    color:var(--txt);
    background:rgba(255,255,255,.1);
    padding:10px 20px;
    border-radius:10px;
}
.arena-victory-btn{
    margin-top:30px;
    padding:15px 50px;
    font-family:'Cinzel',serif;
    font-size:1.2rem;
    background:linear-gradient(135deg,var(--gold),#c9a227);
    border:none;
    border-radius:12px;
    color:#1a1520;
    cursor:pointer;
    transition:all .2s;
}
.arena-victory-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(232,184,74,.5);
}

/* Responsive adjustments */
@media(max-width:768px){
    .arena-title{font-size:1.8rem}
    .arena-modes-grid{grid-template-columns:1fr 1fr}
    .arena-mode-card{padding:15px}
    .mode-icon{font-size:2rem}
    .fighters-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
    .arena-battlefield{gap:30px;flex-wrap:wrap}
    .fighter-creature{width:70px;height:70px}
    .arena-log{width:250px;bottom:120px}
    .arena-actions{gap:8px}
    .arena-action-btn{min-width:80px;padding:10px 15px}
    .arena-victory-title{font-size:2.5rem}
    .champion-frame{width:100px;height:100px}
}

/* Toast notification */
.toast{
    position:fixed;
    top:80px;
    right:20px;
    background:rgba(0,0,0,.95);
    border:2px solid;
    padding:15px 25px;
    border-radius:12px;
    font-family:'Cinzel',serif;
    font-size:1rem;
    z-index:10000;
    animation:toastSlide .3s ease-out;
    box-shadow:0 8px 30px rgba(0,0,0,.8);
}

@keyframes toastSlide{
    from{transform:translateX(400px);opacity:0}
    to{transform:translateX(0);opacity:1}
}

.toast.success{
    border-color:#4ade80;
    color:#4ade80;
}

.toast.error{
    border-color:#f87171;
    color:#f87171;
}

/* ============================================
   INVENTORY SYSTEM STYLES
   ============================================ */

/* Inventory Button on Cards */
.inventory-btn{

    background:rgba(232,184,74,.15);
    color:var(--gold);
    border:2px solid rgba(232,184,74,.4);
    padding:10px 16px;
    border-radius:10px;
    font-size:.9rem;
    cursor:pointer;
    transition:all .2s;
    font-weight:600;
}

.inventory-btn:hover{
    background:rgba(232,184,74,.25);
    border-color:var(--gold);
    transform:translateY(-2px);
    box-shadow:0 4px 15px rgba(232,184,74,.3);
}

/* Inventory Modal Overlay */
.inventory-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10000;
    animation:fadeIn .2s ease-out;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.inventory-modal{
    background:linear-gradient(135deg,rgba(30,25,45,.98),rgba(20,15,35,.98));
    border:2px solid var(--gold);
    border-radius:20px;
    max-width:900px;
    width:90vw;
    max-height:80vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.9);

}

@keyframes modalSlide{
    from{transform:translateY(-50px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

.inventory-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

.inventory-header h2{

}

.inventory-close{

}

.inventory-empty h3{

}

.inventory-empty p{

.inventory-grid::-webkit-scrollbar-thumb:hover{

.inventory-item-qty{

    font-size:1rem;
    padding:5px 12px;

.inventory-item-name{

.inventory-use-btn{

/* ============================================
   ITEM ANIMATION EFFECTS
   ============================================ */

/* Healing Animations */
.item-heal-burst{
    position:fixed;
    width:100px;
    height:100px;
    background:radial-gradient(circle, rgba(74,222,128,.8) 0%, rgba(74,222,128,.4) 40%, transparent 70%);
    border-radius:50%;
    transform:translate(-50%, -50%);
    animation:healBurst .8s ease-out;
    pointer-events:none;
    z-index:9999;
}

@keyframes healBurst{
    0%{transform:translate(-50%, -50%) scale(0); opacity:1}
    50%{transform:translate(-50%, -50%) scale(1.2); opacity:.8}
    100%{transform:translate(-50%, -50%) scale(2); opacity:0}
}

.item-heal-particle{
    position:fixed;
    width:8px;
    height:8px;
    background:#4ade80;
    border-radius:50%;
    box-shadow:0 0 10px #4ade80;
    transform:translate(-50%, -50%);
    animation:healParticle 1s ease-out;
    pointer-events:none;
    z-index:9999;
}

@keyframes healParticle{
    0%{
        left:var(--start-x, 0);
        top:var(--start-y, 0);
        opacity:1;
        transform:translate(-50%, -50%) scale(1);
    }
    100%{
        left:var(--end-x, 0);
        top:var(--end-y, 0);
        opacity:0;
        transform:translate(-50%, -50%) scale(0);
    }
}

/* Focus Animations */
.item-focus-spiral{
    position:fixed;
    width:120px;
    height:120px;
    border:3px solid #60a5fa;
    border-radius:50%;
    transform:translate(-50%, -50%);
    box-shadow:0 0 20px #60a5fa, inset 0 0 20px #60a5fa;
    animation:focusSpiral 1s ease-out;
    pointer-events:none;
    z-index:9999;
}

@keyframes focusSpiral{
    0%{
        transform:translate(-50%, -50%) scale(0) rotate(0deg);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translate(-50%, -50%) scale(1.5) rotate(720deg);
        opacity:0;
    }
}

.item-focus-glow{
    position:fixed;
    width:80px;
    height:80px;
    background:radial-gradient(circle, rgba(96,165,250,.6) 0%, transparent 70%);
    border-radius:50%;
    transform:translate(-50%, -50%);
    animation:focusGlow 1s ease-out;
    pointer-events:none;
    z-index:9998;
}

@keyframes focusGlow{
    0%, 100%{transform:translate(-50%, -50%) scale(.8); opacity:0}
    50%{transform:translate(-50%, -50%) scale(1.2); opacity:1}
}

/* Revive Animations */
.item-revive-ray{
    position:fixed;
    width:4px;
    height:100px;
    background:linear-gradient(to top, transparent, #fbbf24, #f59e0b);
    transform-origin:bottom center;
    animation:reviveRay 1.2s ease-out;
    pointer-events:none;
    z-index:9999;
    box-shadow:0 0 15px #fbbf24;
}

@keyframes reviveRay{
    0%{
        height:0;
        opacity:0;
        transform:translateX(-50%) translateY(0) rotate(var(--rotation, 0deg));
    }
    30%{
        opacity:1;
    }
    50%{
        height:120px;
    }
    100%{
        height:150px;
        opacity:0;
        transform:translateX(-50%) translateY(-60px) rotate(var(--rotation, 0deg));
    }
}

.item-revive-star{
    position:fixed;
    width:60px;
    height:60px;
    transform:translate(-50%, -50%);
    animation:reviveStar 1.2s ease-out;
    pointer-events:none;
    z-index:9999;
}

.item-revive-star::before,
.item-revive-star::after{
    content:'';
    position:absolute;
    inset:0;
    background:#fbbf24;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    box-shadow:0 0 30px #fbbf24;
}

.item-revive-star::after{
    animation:starRotate 1.2s ease-out;
}

@keyframes reviveStar{
    0%{
        transform:translate(-50%, -50%) scale(0) rotate(0deg);
        opacity:0;
    }
    30%{
        opacity:1;
    }
    50%{
        transform:translate(-50%, -50%) scale(1.2) rotate(180deg);
    }
    100%{
