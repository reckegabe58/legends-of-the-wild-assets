function getUsableBattleItems(member){
    if(!member || !member.id) return [];
    
    const student = state.students.find(s => s.id === member.id);
    if(!student || !student.inventory) return [];
    
    const b = state.battle;
    if(!b) return [];
    
    // Get items from inventory
    const items = Object.entries(student.inventory)
        .filter(([id, qty]) => qty > 0)
        .map(([id, qty]) => {
            const item = SHOP_ITEMS.find(i => i.id === id);
            return {id, qty, item};
        })
        .filter(x => x.item && x.item.type === 'consumable') // Only consumables in battle
        .filter(x => {
            // Filter by battle-usability
            const effect = x.item.effect.type;
            
            // Always usable in battle
            if(['heal', 'focus', 'heal_focus', 'defend_buff', 'crit_buff', 'damage_buff', 'party_shield', 'focus_regen_buff'].includes(effect)){
                return true;
            }
            
            // Revive only if there are KO'd allies
            if(effect === 'revive'){
                return b.team.some(m => m.curHp <= 0);
            }
            
            // Others not usable in battle
            return false;
        });
    
    return items;
}

function openBattleItems(){
    if(!state.battle || processing){
        if(processing) showErrorFeedback(null, '⏳ Wait for turn to finish!');
        return;
    }
    
    const cur = battleQueue[turnIdx];
    if(!cur || cur.type !== 'player'){
        showErrorFeedback(null, '❌ Not your turn!');
        return;
    }
    
    const activeMember = state.battle.team[cur.idx];
    if(!activeMember) return;
    
    const items = getUsableBattleItems(activeMember);
    if(items.length === 0){
        showErrorFeedback(null, '❌ No usable items in battle!');
        return;
    }
    
    const student = state.students.find(s => s.id === activeMember.id);
    if(!student) return;
    
    let html = `
        <div class="battle-items-overlay" onclick="closeBattleItems(event)">
            <div class="battle-items-modal" onclick="event.stopPropagation()">
                <div class="battle-items-header">
                    <h3>🎒 Use Item</h3>
                    <button class="battle-items-close" onclick="closeBattleItems()">✕</button>
                </div>
                
                <div class="battle-items-grid">
                    ${items.map(({id, qty, item}) => {
                        const rarity = RARITY[item.rarity];
                        
                        return `
                            <div class="battle-item-card" style="border-color:${rarity.color}" onclick="selectBattleItem('${id}')">
                                <div class="battle-item-qty">×${qty}</div>
                                <div class="battle-item-icon">${item.icon}</div>
                                <div class="battle-item-name">${item.name}</div>
                                <div class="battle-item-desc">${item.desc}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeBattleItems(event){
    if(event && event.target.className !== 'battle-items-overlay' && event.target.className !== 'battle-items-close') return;
    const overlay = document.querySelector('.battle-items-overlay');
    if(overlay) overlay.remove();
}

function selectBattleItem(itemId){
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    const effect = item.effect.type;
    
    // Close items menu
    closeBattleItems();
    
    // If needs target selection, open target selector
    if(['heal', 'heal_focus', 'revive'].includes(effect)){
        openBattleItemTargetSelector(itemId);
    } else {
        // Apply immediately to self or party
        useBattleItem(itemId, null);
    }
}

function openBattleItemTargetSelector(itemId){
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    const b = state.battle;
    const effect = item.effect.type;
    
    // Filter targets based on item
    let targets = [];
    if(effect === 'revive'){
        targets = b.team.filter(m => m.curHp <= 0);
    } else {
        targets = b.team.filter(m => m.curHp > 0);
    }
    
    let html = `
        <div class="battle-items-overlay" onclick="closeBattleItemTargets(event)">
            <div class="battle-items-modal" onclick="event.stopPropagation()">
                <div class="battle-items-header">
                    <h3>Select Target</h3>
                    <button class="battle-items-close" onclick="closeBattleItemTargets()">✕</button>
                </div>
                
                <div class="battle-target-grid">
                    ${targets.map((m, idx) => {
                        const realIdx = b.team.indexOf(m);
                        const hpPct = (m.curHp / m.maxHp) * 100;
                        
                        return `
                            <div class="battle-target-card" onclick="useBattleItem('${itemId}', ${realIdx})">
                                <div class="battle-target-portrait">
                                    <img src="${getImg(m.cid, m.lv)}" alt="${m.name}">
                                </div>
                                <div class="battle-target-name">${m.name || 'Legend'}</div>
                                <div class="battle-target-hp">
                                    <div class="battle-target-hp-bar">
                                        <div class="battle-target-hp-fill" style="width:${hpPct}%"></div>
                                    </div>
                                    <div class="battle-target-hp-text">${m.curHp} / ${m.maxHp}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeBattleItemTargets(event){
    if(event && event.target.className !== 'battle-items-overlay' && event.target.className !== 'battle-items-close') return;
    const overlay = document.querySelector('.battle-items-overlay');
    if(overlay) overlay.remove();
}

function useBattleItem(itemId, targetIdx){
    const b = state.battle;
    if(!b) return;
    
    const cur = battleQueue[turnIdx];
    if(!cur || cur.type !== 'player') return;
    
    const activeMember = b.team[cur.idx];
    const student = state.students.find(s => s.id === activeMember.id);
    if(!student || !student.inventory[itemId]) return;
    
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    // Close any overlays
    closeBattleItemTargets();
    closeBattleItems();
    
    // Apply effect
    const effect = item.effect;
    const target = targetIdx !== null ? b.team[targetIdx] : activeMember;
    
    switch(effect.type){
        case 'heal':
            const healAmount = Math.floor(target.maxHp * effect.value);
            target.chipHp = target.curHp;
            target.curHp = Math.min(target.maxHp, target.curHp + healAmount);
            
            const healTargetEl = document.getElementById('arenaC' + targetIdx);
            if(healTargetEl){
                showItemAnimation(healTargetEl, 'heal');
                showFloatingDamage(healTargetEl, healAmount, 'heal');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} +${healAmount} HP`, 'heal');
            playSound('heal');
            break;
            
        case 'focus':
            target.focus = Math.min(target.focusMax, target.focus + effect.value);
            
            const focusTargetEl = document.getElementById('arenaC' + (targetIdx !== null ? targetIdx : cur.idx));
            if(focusTargetEl){
                showItemAnimation(focusTargetEl, 'focus');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! +${effect.value} Focus`, 'info');
            playSound('heal');
            break;
            
        case 'heal_focus':
            const hpHeal = Math.floor(target.maxHp * effect.hpPercent);
            target.chipHp = target.curHp;
            target.curHp = Math.min(target.maxHp, target.curHp + hpHeal);
            target.focus = Math.min(target.focusMax, target.focus + effect.focus);
            
            const comboTargetEl = document.getElementById('arenaC' + targetIdx);
            if(comboTargetEl){
                showItemAnimation(comboTargetEl, 'heal_focus');
                showFloatingDamage(comboTargetEl, hpHeal, 'heal');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} +${hpHeal} HP, +${effect.focus} Focus`, 'heal');
            playSound('heal');
            break;
            
        case 'revive':
            const reviveAmount = Math.floor(target.maxHp * effect.value);
            target.curHp = reviveAmount;
            target.chipHp = 0;
            
            const reviveTargetEl = document.getElementById('arenaC' + targetIdx);
            if(reviveTargetEl){
                reviveTargetEl.classList.remove('knocked-out');
                showItemAnimation(reviveTargetEl, 'revive');
                
                // Delay floating text so animation is visible first
                setTimeout(() => {
                    showFloatingDamage(reviveTargetEl, 'REVIVED!', 'heal');
                }, 300);
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} revived with ${reviveAmount} HP!`, 'heal');
            playSound('victory');
            break;
            
        case 'defend_buff':
        case 'crit_buff':
        case 'damage_buff':
        case 'party_shield':
        case 'focus_regen_buff':
            // Store buff on member (will be used in combat calculations)
            if(!activeMember.buffs) activeMember.buffs = {};
            activeMember.buffs[effect.type] = {value: effect.value, turns: effect.turns || 1};
            
            const buffTargetEl = document.getElementById('arenaC' + cur.idx);
            if(buffTargetEl){
                showItemAnimation(buffTargetEl, effect.type);
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! Buff applied!`, 'info');
            playSound('heal');
            break;
    }
    
    // Consume item
    student.inventory[itemId]--;
    if(student.inventory[itemId] <= 0){
        delete student.inventory[itemId];
    }

    save();

    // v54.6: Items are now FREE ACTIONS - don't end turn, just refresh UI
    // Player can still attack/defend/heal/special after using an item
    // Mark that an item was used this turn (optional: to prevent multiple items)
    if(!b.itemUsedThisTurn) b.itemUsedThisTurn = {};
    b.itemUsedThisTurn[cur.idx] = true;

    renderMain();
}

    Object.entries(CREATURES).forEach(([id,c])=>{
        const creatureDiscovered = discovered[id];
        const evoCount = c.imgs.length;

        if(!creatureDiscovered){
            // Not discovered - show locked silhouette
            html+=`<div class="bestiary-card locked">
                <div class="small-img"><div class="locked-silhouette">?</div></div>
                <h4>???</h4>
                <p style="color:#666">Not discovered</p>
            </div>`;
        } else {
            // Discovered - show unlocked evolutions
            const unlockedEvos = Object.keys(creatureDiscovered).map(Number).sort((a,b)=>a-b);
            const highestEvo = Math.max(...unlockedEvos);
            const evoName = c.names ? c.names[highestEvo] : c.name;
            const evoImg = c.imgs[highestEvo];

            // Count total evolutions for this creature
            const totalEvos = c.imgs.length;
            const discoveredEvos = unlockedEvos.length;

            html+=`<div class="bestiary-card">
                <div class="small-img"><img src="${G}/Player_Creatures/${evoImg}"></div>
                <h4>${evoName}</h4>
                <p>${c.type}${c.canHeal?' <img src="'+G+'/Icons/Icon_Health.png" style="width:14px;height:14px;vertical-align:middle">':''}</p>
                <p style="font-size:.6rem;color:var(--purple-lt)">Evolutions: ${discoveredEvos}/${totalEvos}</p>
            </div>`;
        }
    });

    html+=`</div>`;
    m.innerHTML=html;
}

// v54.1: Discover a creature/evolution for the bestiary
function discoverCreature(creatureId, evoStage){
    if(!creatureId) return;
    if(!state.discoveredCreatures) state.discoveredCreatures = {};
    if(!state.discoveredCreatures[creatureId]){
        state.discoveredCreatures[creatureId] = {};
    }
    if(!state.discoveredCreatures[creatureId][evoStage]){
        state.discoveredCreatures[creatureId][evoStage] = true;
        save();
        return true; // New discovery
    }
    return false; // Already discovered
}

function completeRedemption(redemptionId){
    const redemption = state.realRewardLog.find(r => r.id === redemptionId);
    if(!redemption) return;
    
    if(confirm(`Mark "${redemption.rewardName}" for ${redemption.studentName} as complete?`)){
        redemption.completed = true;
        redemption.completedAt = new Date().toLocaleString();
        
        showToast(`✅ Marked ${redemption.rewardName} as complete!`, 'success');

        renderMain();
    }
}

function saveEconomySettings(){
    const coinMult = parseFloat(document.getElementById('coinMultiplier').value);
    const rewardMult = parseFloat(document.getElementById('rewardMultiplier').value);
    
    if(isNaN(coinMult) || isNaN(rewardMult)){
        showToast('❌ Invalid values!', 'error');
        return;
    }
    
    state.shopConfig.coinEconomyMultiplier = coinMult;
    state.shopConfig.realRewardPriceMultiplier = rewardMult;
    
    showToast('✅ Economy settings saved!', 'success');
    save();
}

function redeemClassroomReward(rewardId){
    const reward = CLASSROOM_REWARDS.find(r => r.id === rewardId);
    if(!reward) return;
    
    const contrib = state.classroomRewards[rewardId];
    if(!contrib) return;
    
    const total = contrib.contributions.reduce((sum, c) => sum + c.amount, 0);
    const price = getItemPrice(reward);
    
    if(total < price){
        showToast('❌ Not fully funded yet!', 'error');
        return;
    }
    
    if(confirm(`Redeem "${reward.name}" for the class?\n\nThis will log the redemption and reset contributions.`)){
        // Create redemption log entry
        state.realRewardLog.push({
            id: Date.now().toString(),
            studentId: 'CLASS',
            studentName: 'Whole Class',
            rewardId: reward.id,
            rewardName: reward.name,
            cost: price,
            timestamp: new Date().toLocaleString(),
            completed: false,
            notes: `Contributors: ${contrib.contributions.map(c => c.name).join(', ')}`
        });
        
        // Reset classroom reward
        delete state.classroomRewards[rewardId];
        
        showToast(`🎉 ${reward.name} redeemed for the class!`, 'success');
        playSound('victory');
        save();
        renderMain();
    }
}

// ADVENTURE SYSTEM - New Boss-Gated Progression
function startAdventure(){
    initAudio();
    state.adventureCount++;
    
    const avgLv = getAvgLevel();
    const ch = getCurrentChapter();
    const chData = CHAPTERS[ch];
    
    // Calculate boss encounter chance based on level vs chapter expectations
    const bossChanceInfo = calculateBossChance(avgLv, ch);
    
    // Check if special boss (Nightmare/Creator) is available - but it's still RANDOM chance
    const specialBoss = checkSpecialBossAvailable();
    if(specialBoss){
        // Special bosses have their own chance to appear (not forced!)
        const specialChance = bossChanceInfo.specialChance;
        if(Math.random() * 100 < specialChance){
            triggerSpecialBoss(specialBoss);
            return;
        }
    }
    
    // Determine event type with dynamic boss chance
    const roll = Math.random() * 100;
    let eventType;
    
    // Event distribution adjusts based on boss chance
    const bossChance = bossChanceInfo.tierBossChance;
    const wildChance = Math.max(30, 55 - bossChance * 0.5); // Wild decreases as boss increases
    const treasureChance = 15;
    const specialEventChance = 15;
    
    if(roll < wildChance) eventType = 'wild';
    else if(roll < wildChance + treasureChance) eventType = 'treasure';
    else if(roll < wildChance + treasureChance + specialEventChance) eventType = 'special';
    else eventType = 'boss';
    
    // Check if boss is available and party can fight it
    if(eventType === 'boss'){
        const available = getAvailableBosses().filter(b => canFightBoss(b.id));
        if(!available.length) eventType = 'wild';
    }
    
    // Execute event
    if(eventType === 'wild') startWildEncounter(avgLv, ch);
    else if(eventType === 'treasure') treasureEvent(ch, avgLv);
    else if(eventType === 'special') specialEvent(ch, avgLv);
    else if(eventType === 'boss') startBossEncounter(ch);
}

// Calculate boss encounter chances based on party level vs chapter
function calculateBossChance(avgLv, chapter){
    // Get the tier for current chapter
    const tierForChapter = chapter <= 1 ? 1 : chapter <= 2 ? 2 : 3;
    
    // Get expected level range for this tier's bosses
    const tierBosses = tierForChapter === 1 ? TIER1_BOSSES : tierForChapter === 2 ? TIER2_BOSSES : TIER3_BOSSES;
    const avgBossLv = tierBosses.reduce((sum, bid) => sum + BOSSES[bid].lv, 0) / tierBosses.length;
    
    // How over-leveled is the party?
    const levelRatio = avgLv / avgBossLv;
    
    // Base chance starts low, increases as party levels
    // At 50% of boss level: 5% chance
    // At 100% of boss level: 15% chance
    // At 150% of boss level: 35% chance
    // At 200%+ of boss level: 60% chance (soft cap to force progression)
    let tierBossChance;
    if(levelRatio < 0.5) tierBossChance = 3;
    else if(levelRatio < 0.75) tierBossChance = 5 + (levelRatio - 0.5) * 40;  // 5-15%
    else if(levelRatio < 1.0) tierBossChance = 15 + (levelRatio - 0.75) * 40; // 15-25%
    else if(levelRatio < 1.25) tierBossChance = 25 + (levelRatio - 1.0) * 40; // 25-35%
    else if(levelRatio < 1.5) tierBossChance = 35 + (levelRatio - 1.25) * 60; // 35-50%
    else tierBossChance = Math.min(70, 50 + (levelRatio - 1.5) * 40);         // 50-70% cap
    
    // Special boss (Nightmare) chance - only if tier is complete
    // Starts at 10%, scales up to 50% if way over-leveled
    let specialChance = 0;
    const specialAvailable = checkSpecialBossAvailable();
    if(specialAvailable){
        const nightmarePhase = specialAvailable.phase || 0;
        const nightmareLv = BOSSES[specialAvailable.id]?.lv || 25;
        const specialRatio = avgLv / nightmareLv;
        
        if(specialRatio < 0.8) specialChance = 10;
        else if(specialRatio < 1.0) specialChance = 10 + (specialRatio - 0.8) * 50;  // 10-20%
        else if(specialRatio < 1.3) specialChance = 20 + (specialRatio - 1.0) * 50;  // 20-35%
        else specialChance = Math.min(60, 35 + (specialRatio - 1.3) * 50);           // 35-60% cap
    }
    
    // Count remaining bosses - higher chance if fewer remain
    const remaining = getRemainingTierBosses(tierForChapter).length;
    if(remaining === 1) tierBossChance *= 1.3; // 30% bonus for last boss
    if(remaining === 0 && specialAvailable) specialChance *= 1.5; // 50% bonus for Nightmare
    
    return {
        tierBossChance: Math.min(70, tierBossChance),
        specialChance: Math.min(60, specialChance),
        levelRatio: levelRatio,
        tierForChapter: tierForChapter
    };
}

// Check if a special boss (Nightmare/Creator) is available
function checkSpecialBossAvailable(){
    // Check Nightmare phases in order - only available if previous tier complete
    for(let p = 0; p <= 4; p++){
        if(canFightNightmarePhase(p)){
            return {type: 'nightmare', phase: p, id: `nightmare_p${p}`};
        }
    }
    // Check Creator (post-game)
    if(canFightCreator()){
        return {type: 'creator', id: 'the_creator'};
    }
    return null;
}

// Trigger special boss encounter with dramatic narrative
function triggerSpecialBoss(special){
    const boss = BOSSES[special.id];
    const ch = getCurrentChapter();
    
    let narrative, title;
    
    if(special.type === 'nightmare'){
        const phaseNarratives = {
            0: `The final Tier 1 boss has fallen... but something stirs in the void!\n\nThe ground shakes. The sky darkens. From between worlds, ancient darkness awakens...\n\n${boss.intro}\n\nDefeat The Eternal Nightmare to unlock Chapter 2!`,
            1: `With all Tier 2 bosses vanquished, the Nightmare returns!\n\nIt has grown stronger, fed by the darkness you've fought.\n\n${boss.intro}\n\nDefeat this form to reach Chapter 3!`,
            2: `The Tier 3 horrors have fallen, but the Nightmare ascends!\n\nIt tears through dimensions, revealing its true terrible form.\n\n${boss.intro}\n\nOnly by defeating this can you reach Chapter 4!`,
            3: `The Nightmare nears its final form!\n\nReality itself begins to unravel. This is your greatest challenge yet.\n\n${boss.intro}\n\nVictory here opens the path to the Final Chapter!`,
            4: `THIS IS IT. THE FINAL BATTLE.\n\nThe Eternal Nightmare reveals its ultimate form: APOCALYPSE.\n\n${boss.intro}\n\nDefeat this to save reality... but something waits beyond...`
        };
        narrative = phaseNarratives[special.phase];
        title = special.phase === 4 ? '💀 THE APOCALYPSE' : `🌑 THE NIGHTMARE AWAKENS`;
    } else if(special.type === 'creator'){
        narrative = `THE APOCALYPSE HAS BEEN DEFEATED.\n\nBut as the void clears, a figure appears—one you've seen before.\n\n"Well done, young Legends. You have surpassed all my expectations. But there is one final test..."\n\n${boss.intro}\n\nTHIS IS THE ULTIMATE CHALLENGE.`;
        title = '👑 THE CREATOR AWAITS';
    }
    
    addStoryLog(`⚠️ ${title}`, 'chapter');
    addStoryLog(boss.intro, 'battle');
    
    const bossEnemy = createBossEnemy(special.id, boss, ch);
    
    // Store minion data for later spawning at 40% HP
    bossEnemy.minionPool = BOSS_MINIONS[special.id] || [];
    bossEnemy.minionsSpawned = false;

        startBattleWith(bossEnemy, special.type === 'creator' ? 'nightmare' : `tier${boss.tier}`);
    });
}

// Create boss enemy object with optional scaling
function createBossEnemy(id, boss, chapter){
    // Get party info for scaling
    const activeParty = getActiveStudents().filter(s => s.cid);
    const partySize = activeParty.length;
    const avgLv = getAvgLevel();
    const partyPower = getPartyPower();

    // v54.4: PROGRESSIVE DIFFICULTY - bosses get harder as more are defeated
    // Total bosses defeated provides a global difficulty increase
    const totalDefeated = state.defeated ? state.defeated.length : 0;
    const timesThisBossDefeated = state.defeated ? state.defeated.filter(d => d === id).length : 0;

    // Progressive scale: +5% per boss defeated, +15% per time this specific boss defeated
    const progressiveScale = 1 + (totalDefeated * 0.05) + (timesThisBossDefeated * 0.15);

    // Base scale from chapter progression
    let scale = progressiveScale;
    if(chapter >= 4 && boss.tier <= 3){
        scale += (chapter - 3) * 0.3;
    }

    // LEVEL SCALING - boss scales if party is higher level than expected
    const levelRatio = avgLv / boss.lv;
    const levelMultiplier = levelRatio > 1 ? 1 + (levelRatio - 1) * 0.5 : 1;

    // Apply base scaling
    const baseHP = Math.floor(boss.hp * scale * levelMultiplier);
    const baseATK = Math.floor(boss.atk * scale * levelMultiplier);
    const baseDEF = Math.floor(boss.def * scale * levelMultiplier * 0.8);
    const baseSPD = Math.max(boss.spd || 25, 20);

    // NEW ADAPTIVE PARTY SCALING
    const scaled = scaleBoss(baseHP, baseATK, baseDEF, baseSPD);

    // v54.4: Ensure boss attack is VERY threatening (minimum 30% of average party HP)
    const avgPartyHP = activeParty.reduce((sum, s) => {
        const st = getStats(s.cid, getLv(s.xp), s.nature);
        return sum + st.hp;
    }, 0) / Math.max(1, partySize);
    const minBossAtk = Math.floor(avgPartyHP * 0.30);
    const finalAtk = Math.max(minBossAtk, scaled.atk);

    // Speed includes level bonus
    const finalSpd = Math.floor(scaled.spd + boss.lv * 0.5);

    debugLog('BOSS', `Creating ${boss.name} | Progressive Scale: ${progressiveScale.toFixed(2)} (${totalDefeated} bosses defeated) | Party: ${partySize} | HP: ${scaled.hp} | ATK: ${finalAtk} | SPD: ${finalSpd}`);
    
    return {
        id: id,
        name: boss.name,
        type: boss.type,
        hp: scaled.hp,
        maxHp: scaled.hp,
        atk: finalAtk,
        def: scaled.def,
        spd: finalSpd,
        lv: Math.floor(boss.lv * levelMultiplier),
        img: boss.img,
        isBoss: true,
        tier: boss.tier,
        xp: Math.floor(boss.xp * (scale * levelMultiplier)),
        coins: Math.floor(boss.coins * (scale * levelMultiplier)),
        attacks: boss.atks,
        bg: boss.bg,
        weak: boss.weak,
        isCreator: boss.isCreator,
        phase: boss.phase,
        partyScaled: partySize
    };
}

// Regular boss encounter
function startBossEncounter(chapter){
    const available = getAvailableBosses().filter(b => canFightBoss(b.id));
    if(!available.length){
        startWildEncounter(getAvgLevel(), chapter);
        return;
    }
    
    const boss = available[Math.floor(Math.random() * available.length)];
    const bossData = BOSSES[boss.id];
    
    // DM narrative for boss approach
    const approachNarratives = [
        `The air grows heavy. An ancient presence stirs...`,
        `Your creatures sense danger. Something powerful approaches!`,
        `The path darkens. A legendary foe blocks your way...`,
        `Reality shivers. A boss-level threat emerges!`
    ];
    const approach = approachNarratives[Math.floor(Math.random() * approachNarratives.length)];
    
    addStoryLog(`⚠️ BOSS: ${bossData.name}!`, 'chapter');
    addStoryLog(bossData.intro, 'battle');
    
    const bossEnemy = createBossEnemy(boss.id, bossData, chapter);
    
    // Store minion data for later spawning at 40% HP
    bossEnemy.minionPool = BOSS_MINIONS[boss.id] || [];
    bossEnemy.minionsSpawned = false;
    
    // Show remaining bosses in tier
    const remaining = getRemainingTierBosses(bossData.tier);
    const remainingText = remaining.length > 1 ? 
        `\n\n📊 ${remaining.length - 1} more Tier ${bossData.tier} boss(es) remaining after this one.` : 
        remaining.length === 1 ? `\n\n⚡ This is the LAST Tier ${bossData.tier} boss! Defeat it to unlock the next Nightmare phase!` : '';
    
    showEventOverlay(`💀 BOSS BATTLE!`, `${approach}\n\n${bossData.intro}${remainingText}`, 'red', () => {
        startBattleWith(bossEnemy, 'tier' + bossData.tier);
    });
}

// Spawn minions for boss battles
function spawnBossMinions(bossId, tier, chapter){
    const minionPool = BOSS_MINIONS[bossId];
    if(!minionPool || !minionPool.length) return [];
    
    const avgLv = getAvgLevel();
    const partySize = getActiveStudents().filter(s=>s.cid).length;
    
    // Spawn 1-3 minions based on party size
    const numMinions = Math.min(Math.max(1, Math.floor(partySize / 2)), 3);
    const minions = [];
    
    for(let i = 0; i < numMinions; i++){
        const minionId = minionPool[Math.floor(Math.random() * minionPool.length)];
        const minionData = MINIONS[minionId];
        if(!minionData) continue;
        
        // Scale minion stats based on party level
        const minionLv = Math.max(avgLv - 5, tier * 5);
        const lvScale = 1 + (minionLv - 1) * 0.08;
        
        minions.push({
            id: minionId,
            name: minionData.name,
            type: minionData.type,
            lv: minionLv,
            hp: Math.floor(minionData.base.hp * lvScale * (0.8 + partySize * 0.1)),
            maxHp: Math.floor(minionData.base.hp * lvScale * (0.8 + partySize * 0.1)),
            atk: Math.floor(minionData.base.atk * lvScale),
            def: Math.floor(minionData.base.def * lvScale),
            spd: Math.floor(minionData.base.spd * lvScale),
            xp: Math.floor(20 + minionLv * 3),
            coins: Math.floor(10 + minionLv * 2),
            img: minionData.img,
            isMinion: true,
            attacks: ['Minion Strike', 'Quick Attack', 'Slash']
        });
    }
    
    return minions;
}

// v54.1 Phase 6: Check if boss should summon minions (at 40% and 20% HP)
function checkBossMinionSummon(){
    const b = state.battle;
    if(!b) return;

    // Find the boss in enemies array
    const boss = b.enemies.find(e => e.isBoss);
    if(!boss) return;

    // Track summon waves (0 = none, 1 = first wave at 40%, 2 = second wave at 20%)
    if(boss.summonWaves === undefined) boss.summonWaves = 0;

    const hpPercent = boss.hp / boss.maxHp;

    // PHASE 6: RE-SUMMON MECHANIC
    // First summon at 40% HP, second summon at 20% HP
    let shouldSummon = false;
    let waveNumber = 0;

    if(hpPercent <= 0.2 && boss.summonWaves < 2){
        shouldSummon = true;
        waveNumber = 2;
    } else if(hpPercent <= 0.4 && boss.summonWaves < 1){
        shouldSummon = true;
        waveNumber = 1;
    }

    if(!shouldSummon) return;

    // Update summon wave tracker
    boss.summonWaves = waveNumber;

    // Check if boss has minions to spawn
    const minionPool = boss.minionPool;

    // BOSSES WITHOUT MINIONS: Self-heal instead of summoning
    if(!minionPool || !minionPool.length){
        // v54.1: Wave-based heal amounts (first wave = 25%, second wave = 15%)
        const healPercent = waveNumber === 1 ? 0.25 : 0.15;
        const healAmount = Math.floor(boss.maxHp * healPercent);
        const actualHeal = Math.min(healAmount, boss.maxHp - boss.hp);
        boss.hp = Math.min(boss.maxHp, boss.hp + healAmount);

        // Show heal animation and message
        const bossEl = document.getElementById('enemyImg0');
        if(bossEl){
            bossEl.classList.add('anim-heal');
            setTimeout(() => bossEl.classList.remove('anim-heal'), 550);
            showFloatingDamage(bossEl, actualHeal, 'heal');
        }

        const healMsg = waveNumber === 2 ?
            `💚 ${boss.name} desperately channels remaining energy!` :
            `💚 ${boss.name} channels dark energy and heals itself!`;
        playSound('heal');
        addLog(healMsg, 'enemy');
        renderMain();
        return;
    }

    // v54.3: Party-aware minion spawning
    const avgLv = getAvgLevel();
    const partySize = getPartySize();
    const partyTier = getPartyTier();

    // Wave 1: Full minion count based on party size
    // Wave 2: Fewer but elite (30% stronger)
    const isWave2 = waveNumber === 2;
    const baseMinions = isWave2 ? 1 : 2;
    const numMinions = getBossMinionCount(baseMinions);
    const wave2Multiplier = isWave2 ? 1.3 : 1.0;

    console.log(`Boss Summon: Wave ${waveNumber}, Party ${partySize} (${partyTier}), spawning ${numMinions} minions`);

    const newMinions = [];
    for(let i = 0; i < numMinions; i++){
        const minionId = minionPool[Math.floor(Math.random() * minionPool.length)];
        const minionData = MINIONS[minionId];
        if(!minionData) continue;

        const minionLv = Math.max(avgLv - 5, 10);
        const lvScale = 1 + (minionLv - 1) * 0.08;

        // Apply party-adaptive scaling to minions
        const baseHP = Math.floor(minionData.base.hp * lvScale * wave2Multiplier);
        const baseATK = Math.floor(minionData.base.atk * lvScale * wave2Multiplier);
        const baseDEF = Math.floor(minionData.base.def * lvScale);
        const baseSPD = Math.floor(minionData.base.spd * lvScale);

        const scaled = scaleBossMinion(baseHP, baseATK, baseDEF, baseSPD);

        // v54.1: Elite prefix for wave 2 minions
        const minionName = isWave2 ? `Elite ${minionData.name}` : minionData.name;

        newMinions.push({
            id: minionId,
            name: minionName,
            type: minionData.type,
            lv: minionLv,
            hp: scaled.hp,
            maxHp: scaled.hp,
            atk: scaled.atk,
            def: scaled.def,
            spd: scaled.spd,
            xp: Math.floor((20 + minionLv * 3) * wave2Multiplier),
            coins: Math.floor((10 + minionLv * 2) * wave2Multiplier),
            img: minionData.img,
            isMinion: true,
            isElite: isWave2,
            attacks: ['Minion Strike', 'Quick Attack', 'Slash']
        });
    }
    
    if(newMinions.length > 0){
        // CRITICAL: Set processing flag to block ALL turn advancement during summon
        processing = true;

        // Show summon animation BEFORE adding minions
        showSummonAnimation(boss.name, newMinions, () => {
            // Add minions to battle after animation
            b.enemies.push(...newMinions);

            // Add minions to turn order with correct indices
            newMinions.forEach((m, i) => {
                const enemyIdx = b.enemies.length - newMinions.length + i;
                battleQueue.push({type:'enemy', idx: enemyIdx, spd: m.spd});
            });

            // Re-sort turn order by speed
            battleQueue.sort((a,b) => b.spd - a.spd);

            // v54.1: Wave-specific summon messages
            if(isWave2){
                addLog(`⚡ ${boss.name} calls upon elite reinforcements!`, 'enemy');
                addLog(`👹 ${newMinions.length} ELITE minion(s) enter the battle!`, 'enemy');
            } else {
                addLog(`💀 ${boss.name} summons reinforcements!`, 'enemy');
                addLog(`👹 ${newMinions.length} minion(s) join the fight!`, 'enemy');
            }
            
            // Force re-render to show new minions
            renderMain();
            
            // CRITICAL: Advance turn and clear processing
            turnIdx++;
            processing = false;
            
            // Trigger next turn after delay (avoids recursion)
            setTimeout(() => {
                if(!processing){ // Double-check processing isn't stuck
                    nextTurn();
                }
            }, 600);
        });
    }
}

// Summon Animation Display
function showSummonAnimation(bossName, minions, callback){
    const overlay = document.createElement('div');
    overlay.className = 'summon-overlay';
    overlay.id = 'summonOverlay';
    
    let creaturesHtml = minions.map(m => `
        <div class="summon-creature">
            <img src="${G}/${m.img}" onerror="this.src='${G}/UI_Elements/Icon_Attack.png'">
        </div>
    `).join('');
    
    overlay.innerHTML = `
        <div class="summon-title">⚠️ ${bossName} Summons Reinforcements! ⚠️</div>
        <div class="summon-portal"></div>
        <div class="summon-creatures">${creaturesHtml}</div>
    `;
    
    document.body.appendChild(overlay);
    playSound('hit'); // Play a sound effect
    
    // Remove overlay and execute callback after animation
    setTimeout(() => {
        overlay.style.animation = 'summonFadeIn .3s ease-out reverse';
        setTimeout(() => {
            overlay.remove();
            if(!state.battle) return;
            if(callback) callback();
        }, 300);
    }, 2000); // Show for 2 seconds
}

function startWildEncounter(avgLv,chapter){
    const regions={1:'forest',2:'volcano',3:'ice',4:'void',5:'void'};
    const region=regions[chapter]||'forest';
    
    // Get wild creatures for this region from new WILD_ENCOUNTERS
    const regionCreatures = WILD_ENCOUNTERS[region] || WILD_ENCOUNTERS.forest;
    if(!regionCreatures.length){treasureEvent(chapter,avgLv);return}
    
    // v54.3: Party-aware enemy count using new scaling system
    const partySize = getPartySize();
    const numEnemies = getWildEnemyCount(chapter);

    // Log party tier for debugging
    console.log(`Wild Encounter: Party size ${partySize} (${getPartyTier()}), ${numEnemies} enemies`);
    
    // ============================================
    // BUILD CREATURE POOL - BALANCED MIX
    // ============================================
    // RULE: Regional creatures should appear frequently
    // Player creatures are rare elite encounters
    
    // Start with regional creatures (weighted 3x to appear more often)
    let creaturePool = [];
    regionCreatures.forEach(c => {
        // Add each regional creature 3 times for weighting
        creaturePool.push({...c, isRegional: true});
        creaturePool.push({...c, isRegional: true});
        creaturePool.push({...c, isRegional: true});
    });
    
    // Add player creatures as RARE elite encounters (only 1 copy each)
    Object.entries(CREATURES).forEach(([cid, c]) => {
        
        // EVO 1: Available early game (before first evolution threshold + buffer)
        const evo1MaxLv = c.evAt ? c.evAt[0] + 3 : 18;
        if(avgLv <= evo1MaxLv){
            creaturePool.push({
                id: 'feral_' + cid,
                name: 'Feral ' + (c.names ? c.names[0] : c.name),
                type: c.type,
                base: {...c.base},
                img: 'Player_Creatures/' + c.imgs[0],
                isPlayerCreature: true,
                evoStage: 1
            });
        }
        
        // EVO 2: Mid game (around first evolution threshold)
        if(c.evAt && c.evAt[0] && avgLv >= c.evAt[0] - 3 && avgLv <= (c.evAt[1] ? c.evAt[1] + 5 : 30)){
            const evo2Growth = Math.floor(c.evAt[0] * 0.6);
            creaturePool.push({
                id: 'wild_' + cid + '_evo2',
                name: 'Wild ' + (c.names ? c.names[1] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo2Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo2Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo2Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo2Growth)
                },
                img: 'Player_Creatures/' + c.imgs[1],
                isPlayerCreature: true,
                evoStage: 2,
                canHeal: c.canHeal // Inherit healing ability
            });
        }
        
        // EVO 3: Late game
        if(c.evAt && c.evAt[1] && c.imgs[2] && avgLv >= c.evAt[1] - 3 && avgLv <= (c.evAt[2] ? c.evAt[2] + 5 : 45)){
            const evo3Growth = Math.floor(c.evAt[1] * 0.6);
            creaturePool.push({
                id: 'wild_' + cid + '_evo3',
                name: 'Wild ' + (c.names ? c.names[2] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo3Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo3Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo3Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo3Growth)
                },
                img: 'Player_Creatures/' + c.imgs[2],
                isPlayerCreature: true,
                evoStage: 3,
                canHeal: c.canHeal
            });
        }
        
        // EVO 4: End game
        if(c.evAt && c.evAt[2] && c.imgs[3] && avgLv >= c.evAt[2] - 2){
            const evo4Growth = Math.floor(c.evAt[2] * 0.55);
            creaturePool.push({
                id: 'wild_' + cid + '_evo4',
                name: 'Wild ' + (c.names ? c.names[3] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo4Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo4Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo4Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo4Growth)
                },
                img: 'Player_Creatures/' + c.imgs[3],
                isPlayerCreature: true,
                evoStage: 4,
                canHeal: c.canHeal
            });
        }
    });
    
    // ============================================
    // v54.3: MULTI-BOSS ENCOUNTER SYSTEM
    // ============================================
    // Chapter 3: 10% chance for 2 Tier 1 bosses
    // Chapter 4: 12% chance for 2 Tier 1/2 bosses
    // Chapter 5: 15% chance for 2-3 bosses of any tier

    let multiBossEncounter = false;
    let bossesToFight = [];

    // Check for multi-boss encounter first (higher priority)
    if(chapter >= 3){
        let multiBossChance = 0;
        let maxBosses = 2;
        let eligibleTiers = [];

        if(chapter === 3){
            multiBossChance = 0.10;
            maxBosses = 2;
            eligibleTiers = [TIER1_BOSSES];
        } else if(chapter === 4){
            multiBossChance = 0.12;
            maxBosses = 2;
            eligibleTiers = [TIER1_BOSSES, TIER2_BOSSES];
        } else if(chapter >= 5){
            multiBossChance = 0.15;
            maxBosses = Math.random() < 0.3 ? 3 : 2; // 30% chance for 3 bosses
            eligibleTiers = [TIER1_BOSSES, TIER2_BOSSES, TIER3_BOSSES];
        }

        if(Math.random() < multiBossChance){
            // Collect all eligible defeated bosses
            let eligibleBosses = [];
            eligibleTiers.forEach(tierList => {
                tierList.forEach(bid => {
                    if(state.defeated.includes(bid) && BOSSES[bid]){
                        const tier = TIER1_BOSSES.includes(bid) ? 1 : TIER2_BOSSES.includes(bid) ? 2 : 3;
                        eligibleBosses.push({id: bid, ...BOSSES[bid], tier: tier});
                    }
                });
            });

            // Need at least 2 defeated bosses for multi-boss
            if(eligibleBosses.length >= 2){
                multiBossEncounter = true;
                // Shuffle and pick
                eligibleBosses.sort(() => Math.random() - 0.5);
                bossesToFight = eligibleBosses.slice(0, Math.min(maxBosses, eligibleBosses.length));
            }
        }
    }

    // If multi-boss encounter triggered
    if(multiBossEncounter && bossesToFight.length >= 2){
        const lvScale = 1 + (avgLv - bossesToFight[0].lv) * 0.03;
        const partyScale = 1 + (partySize - 1) * 0.1;
        // Multi-boss = each boss is weaker (60% stats)
        const multiBossNerf = 0.6;

        const scaledBosses = bossesToFight.map((boss, idx) => ({
            ...boss,
            id: boss.id + '_multi' + idx,
            name: `${boss.name}`,
            lv: Math.max(boss.lv, avgLv - 5),
            hp: Math.floor(boss.hp * lvScale * partyScale * multiBossNerf),
            maxHp: Math.floor(boss.hp * lvScale * partyScale * multiBossNerf),
            atk: Math.floor(boss.atk * lvScale * partyScale * multiBossNerf),
            def: Math.floor(boss.def * lvScale * multiBossNerf),
            spd: boss.spd,
            xp: Math.floor(boss.xp * 0.6),
            coins: Math.floor(boss.coins * 0.6),
            img: boss.img,
            isBoss: true,
            isMultiBoss: true,
            attacks: boss.atks,
            minionPool: [] // No minions in multi-boss fights
        }));

        const bossNames = scaledBosses.map(b => b.name).join(' & ');
        const narratives = [
            `The ground trembles as not one, but ${scaledBosses.length} monstrous forms emerge! ${bossNames} have formed an unholy alliance!`,
            `Your worst nightmare comes true - ${bossNames} attack TOGETHER! This will be your greatest challenge yet!`,
            `"Alone we fell. Together, we shall CRUSH you!" ${bossNames} roar in unison as they charge!`,
            `The defeated bosses have learned from their failures. ${bossNames} combine their powers against you!`
        ];
        const narrative = narratives[Math.floor(Math.random() * narratives.length)];

        addStoryLog(`💀💀 MULTI-BOSS ENCOUNTER: ${bossNames}!`, 'battle');

        showEventOverlay(`💀💀 ${scaledBosses.length} BOSSES ATTACK!`, narrative, 'red', ()=>{
            // First boss is main, rest are additional enemies
            startBattleWith(scaledBosses[0], 'tier' + bossesToFight[0].tier, scaledBosses.slice(1));
        });
        return;
    }

    // ============================================
    // SINGLE REVENGE BOSS ENCOUNTER
    // ============================================
    // Chapter 2+ can encounter defeated Tier 1 bosses
    // Chapter 3+ can encounter defeated Tier 1 & 2 bosses
    // Chapter 4+ can encounter all defeated bosses
    // 15% chance to encounter a previous boss instead of regular enemies

    const previousBossEncounter = Math.random() < 0.15;
    let bossToFight = null;

    if(previousBossEncounter && chapter >= 2){
        // Get defeated bosses from previous tiers
        let eligibleBosses = [];

        if(chapter >= 2){
            // Add defeated Tier 1 bosses
            TIER1_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 1});
                }
            });
        }
        if(chapter >= 3){
            // Add defeated Tier 2 bosses
            TIER2_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 2});
                }
            });
        }
        if(chapter >= 4){
            // Add defeated Tier 3 bosses
            TIER3_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 3});
                }
            });
        }

        if(eligibleBosses.length > 0){
            bossToFight = eligibleBosses[Math.floor(Math.random() * eligibleBosses.length)];
        }
    }
    
    // If we're doing a previous boss encounter
    if(bossToFight){
        // Scale boss to current party level
        const lvScale = 1 + (avgLv - bossToFight.lv) * 0.04; // 4% per level difference
        const partyScale = 1 + (partySize - 1) * 0.12;
        
        const scaledBoss = {
            ...bossToFight,
            id: bossToFight.id,
            name: `Vengeful ${bossToFight.name}`,
            lv: Math.max(bossToFight.lv, avgLv - 3),
            hp: Math.floor(bossToFight.hp * lvScale * partyScale * 0.7), // 70% HP (weakened)
            maxHp: Math.floor(bossToFight.hp * lvScale * partyScale * 0.7),
            atk: Math.floor(bossToFight.atk * lvScale * partyScale * 0.8), // 80% ATK
            def: Math.floor(bossToFight.def * lvScale * 0.8),
            spd: bossToFight.spd,
            xp: Math.floor(bossToFight.xp * 0.5), // Half XP (already defeated once)
            coins: Math.floor(bossToFight.coins * 0.5),
            img: bossToFight.img,
            isBoss: true,
            isRevenge: true, // Mark as revenge encounter
            attacks: bossToFight.atks,
            minionPool: BOSS_MINIONS[bossToFight.id] || []
        };
        
        // Show special narrative
        const narratives = [
            `The shadows stir with familiar malice... ${bossToFight.name} has returned, seeking REVENGE!`,
            `A chill runs down your spine. You've fought this evil before... ${bossToFight.name} rises again!`,
            `"You thought you defeated me?" ${bossToFight.name} emerges from the darkness, wounded but furious!`,
            `The ${bossToFight.name} has been hunting you since your last encounter. Now it attacks!`
        ];
        const narrative = narratives[Math.floor(Math.random() * narratives.length)];
        
        let sizeClass = 'tier1';
        if(bossToFight.tier === 2) sizeClass = 'tier2';
        else if(bossToFight.tier === 3) sizeClass = 'tier3';

        // v54.3: Fixed parameter order - callback before image
        showEventOverlay('💀 REVENGE ENCOUNTER!', narrative, 'red', ()=>{
            startBattleWith(scaledBoss, sizeClass);
        }, bossToFight.img);
        return;
    }
    
    // ============================================
    // CREATE ENEMIES WITH BALANCED SCALING
    // ============================================
    const enemies = [];
    const usedCreatures = [];
    
    for(let i = 0; i < numEnemies; i++){
        let creature;
        let attempts = 0;
        
        // Try to get different creatures
        do {
            creature = creaturePool[Math.floor(Math.random()*creaturePool.length)];
            attempts++;
        } while(usedCreatures.includes(creature.id) && attempts < 10 && creaturePool.length > 1);
        
        usedCreatures.push(creature.id);
        
        const wildLv = Math.max(1, avgLv + Math.floor(Math.random()*5) - 2 + (chapter >= 4 ? chapter * 2 : 0));
        
        // ============================================
        // NEW ADAPTIVE SCALING SYSTEM
        // ============================================
        // Enemy count scaling (more enemies = slightly weaker each)
        const enemyCountScale = numEnemies === 1 ? 1.0 :
                                numEnemies === 2 ? 0.80 :
                                numEnemies === 3 ? 0.70 :
                                numEnemies === 4 ? 0.60 : 0.55;
        
        const isPlayerCreatureEnemy = creature.isPlayerCreature;
        const isRegional = creature.isRegional;
        
        // Level scaling
        const levelScale = isPlayerCreatureEnemy 
            ? (1 + (wildLv - 1) * 0.05)   // 5% per level for evolved creatures
            : (1 + (wildLv - 1) * 0.12);  // 12% per level for regional wilds
        
        // APPLY PARTY SCALING using new system
        const baseHP = Math.floor(creature.base.hp * levelScale * enemyCountScale * 1.6); // Was 1.3 - increased to 1.6 (23% more HP)
        const baseATK = Math.floor(creature.base.atk * levelScale * enemyCountScale);
        const baseDEF = Math.floor(creature.base.def * levelScale * enemyCountScale);
        const baseSPD = creature.base.spd || 18;
        
        // Scale to party size with new adaptive formulas
        const scaled = scaleWildEnemy(baseHP, baseATK, baseDEF, baseSPD);
        
        // Final stats with difficulty multiplier - buffed for longer fights
        const difficultyMult = isPlayerCreatureEnemy ? 1.4 : 1.6; // Was 1.25/1.4 - increased
        const finalHp = Math.floor(scaled.hp * difficultyMult);
        const finalAtk = Math.floor(scaled.atk * difficultyMult);
        const finalDef = Math.floor(scaled.def * difficultyMult * 1.1); // 10% more defense
        const scaledSpd = scaled.spd + (isPlayerCreatureEnemy ? Math.floor(wildLv * 0.2) : Math.floor(wildLv * 0.25));
        
        // XP/Coins - REDUCED for slower progression
        const xpMult = isPlayerCreatureEnemy ? 1.2 : 0.8; // Reduced from 1.5/1.0
        const wildXP = Math.floor((15 + Math.pow(wildLv, 1.6) * 1.8) * xpMult / numEnemies); // Reduced from 25 + lv^1.8 * 2.5
        const wildCoins = Math.floor((10 + wildLv * 3) / numEnemies); // Slightly reduced
        
        // ============================================
        // ENEMY ABILITIES - Use creature's moves if available
        // ============================================
        const hasSpecial = wildLv >= 8 || isPlayerCreatureEnemy || creature.moves?.spec;
        const canHealAbility = creature.canHeal || creature.moves?.heal || (Math.random() < 0.25 && wildLv >= 12);
        
        // Build attack data from creature's moves OR fallback to type-based
        let attackList, specialAttack, healAttack, attackElement;
        
        if(creature.moves){
            // Use creature's defined moves
            attackList = [creature.moves.atk.n];
            attackElement = creature.moves.atk.e || creature.type.toLowerCase();
            
            if(creature.moves.spec && hasSpecial){
                specialAttack = {
                    name: creature.moves.spec.n, 
                    power: creature.moves.spec.p, 
                    cooldown: 3,
                    element: creature.moves.spec.e
                };
            }
            
            if(creature.moves.heal && canHealAbility){
                healAttack = {
                    name: creature.moves.heal.n, 
                    power: creature.moves.heal.p
                };
            }
        } else if(isPlayerCreatureEnemy){
            // Player creature fallback
            attackList = ['Tackle','Slash','Feral Strike'];
            attackElement = creature.type.toLowerCase();
            specialAttack = {name: 'Wild Fury', power: 1.8, cooldown: 3, element: creature.type.toLowerCase()};
            healAttack = creature.canHeal ? {name: 'Natural Recovery', power: 0.3} : null;
        } else {
            // Generic type-based fallback (shouldn't happen with new data)
            const typeAttacks = {
                'Nature': {basic:'Vine Whip', special:'Nature\'s Wrath', heal:'Forest Mend', elem:'nature'},
                'Poison': {basic:'Toxic Spit', special:'Plague Burst', heal:'Toxic Recovery', elem:'poison'},
                'Shadow': {basic:'Dark Slash', special:'Shadow Blast', heal:'Dark Drain', elem:'shadow'},
                'Earth': {basic:'Rock Slam', special:'Earthquake', heal:'Stone Shell', elem:'earth'},
                'Fire': {basic:'Flame Bite', special:'Inferno', heal:'Flame Shield', elem:'fire'},
                'Ice': {basic:'Frost Bite', special:'Blizzard', heal:'Frozen Barrier', elem:'ice'},
                'Void': {basic:'Void Strike', special:'Void Collapse', heal:'Void Drain', elem:'void'},
                'Water': {basic:'Aqua Jet', special:'Tidal Wave', heal:'Aqua Heal', elem:'water'},
                'Lightning': {basic:'Shock', special:'Lightning Storm', heal:'Static Charge', elem:'lightning'}
            };
            const typeData = typeAttacks[creature.type] || typeAttacks['Nature'];
            attackList = [typeData.basic];
            attackElement = typeData.elem;
            specialAttack = hasSpecial ? {name: typeData.special, power: 1.6, cooldown: 3, element: typeData.elem, focusCost: 40} : null;
            healAttack = canHealAbility ? {name: typeData.heal, power: 0.25} : null;
        }

        // ============================================
        // ELITE ENEMY SYSTEM (Chapter 3+)
        // ============================================
        // Elite enemies are stronger variants with ★ in name
        let isElite = false;
        let eliteHpMult = 1.0;
        let eliteAtkMult = 1.0;
        let eliteXpMult = 1.0;

        if(chapter >= 3){
            // Elite chance increases with chapter: 15% ch3, 20% ch4, 25% ch5
            const eliteChance = 0.10 + (chapter - 2) * 0.05;

            if(Math.random() < eliteChance){
                isElite = true;
                // Elite stat multipliers scale with chapter
                eliteHpMult = 1.25 + (chapter - 3) * 0.1;   // 1.25x ch3, 1.35x ch4, 1.45x ch5
                eliteAtkMult = 1.20 + (chapter - 3) * 0.08; // 1.20x ch3, 1.28x ch4, 1.36x ch5
                eliteXpMult = 1.5; // 50% more XP for elite kills
            }
        }

        // Apply elite multipliers
        const enemyHp = Math.floor(finalHp * eliteHpMult);
        const enemyAtk = Math.floor(finalAtk * eliteAtkMult);
        const enemyXp = Math.floor(wildXP * eliteXpMult);

        // Build enemy name with elite star prefix
        let enemyName = creature.name;
        if(isElite){
            enemyName = '★ ' + enemyName;
        }
        if(usedCreatures.filter(u=>u===creature.id).length > 1){
            enemyName += ` #${usedCreatures.filter(u=>u===creature.id).length}`;
        }

        enemies.push({
            id: creature.id + '_' + i,
            name: enemyName,
            type: creature.type,
            hp: enemyHp,
            maxHp: enemyHp,
            atk: enemyAtk,
            def: finalDef,
            spd: scaledSpd,
            lv: wildLv,
            img: creature.img,
            isWild: true,
            isElite: isElite,
            isPlayerCreature: isPlayerCreatureEnemy,
            isRegional: isRegional,
            evoStage: creature.evoStage || 0,
            xp: enemyXp,
            coins: wildCoins,
            attacks: attackList,
            attackElement: attackElement,
            // Focus system for specials (v54.1)
            focus: STARTING_FOCUS,
            focusMax: MAX_FOCUS,
            focusRegen: FOCUS_REGEN_PER_TURN,
            // Abilities
            hasSpecial: hasSpecial && specialAttack,
            specialAttack: specialAttack,
            specialCooldown: 0,
            canHeal: canHealAbility && healAttack,
            healAttack: healAttack,
            moves: creature.moves // Keep reference for defense move name
        });
    }
    
    // Bonus XP for multi-enemy fights
    if(numEnemies > 1){
        const bonusXP = Math.floor(15 * numEnemies * (1 + avgLv * 0.06));
        enemies.forEach(e => e.xp += Math.floor(bonusXP / numEnemies));
    }
    
    // DM Narrative
    const narratives = DM_NARRATIVES.wild[region] || DM_NARRATIVES.wild.forest;

    // Check for elite enemies
    const eliteCount = enemies.filter(e => e.isElite).length;

    let narrative;
    if(numEnemies === 1){
        narrative = narratives[Math.floor(Math.random()*narratives.length)](enemies[0].name, enemies[0].lv);
        if(enemies[0].isElite){
            narrative += ' This one radiates unusual power!';
        }
    } else {
        const names = enemies.map(e => e.name).join(', ');
        const multiNarratives = [
            `The party is surrounded! ${numEnemies} enemies emerge from all directions: ${names}!`,
            `A pack of wild creatures blocks your path! ${names} attack together!`,
            `Danger from all sides! The team must face ${names} at once!`,
            `The wilds grow more dangerous. ${numEnemies} foes appear: ${names}!`
        ];
        narrative = multiNarratives[Math.floor(Math.random()*multiNarratives.length)];
        if(eliteCount > 0){
            narrative += ` Watch out - ${eliteCount === 1 ? 'one of them is' : eliteCount + ' of them are'} elite!`;
        }
    }
    
    const enemyList = enemies.map(e => `${e.name} (Lv ${e.lv})`).join('\n• ');
    addStoryLog(`⚔️ ${numEnemies > 1 ? 'Multiple enemies' : 'Wild ' + enemies[0].name} encountered!`,'battle');
    
    showEventOverlay(
        numEnemies > 1 ? `⚔️ ${numEnemies} Enemies Attack!` : `⚔️ Wild Encounter!`, 
        narrative + (numEnemies > 1 ? `\n\n• ${enemyList}` : ''), 
        numEnemies > 2 ? 'red' : 'blue', 
        () => {
            // For now, fight first enemy (multi-enemy battle system coming)
            startBattleWith(enemies[0], 'wild', enemies.slice(1));
        }
    );
}

function treasureEvent(chapter=1, avgLv=1){
    // Coins SCALE with level!
    // Lv5 = ~30 coins, Lv15 = ~70 coins, Lv30 = ~150 coins, Lv50 = ~280 coins
    const baseCoins = 15 + Math.floor(Math.random() * 15);
    const scaledCoins = Math.floor(baseCoins + Math.pow(avgLv, 1.4) * 1.5);
    
    getActiveStudents().forEach(s=>{s.coins=(s.coins||0)+scaledCoins});
    
    const chapterNarratives = DM_NARRATIVES.treasure[chapter] || DM_NARRATIVES.treasure[1];
    const narrative = chapterNarratives[Math.floor(Math.random()*chapterNarratives.length)](scaledCoins);
    
    addStoryLog('💰 '+narrative,'victory');
    showEventOverlay('💰 Treasure Found!', narrative, 'gold');
    save();
}

function specialEvent(chapter=1, avgLv=1){
    // 5% chance of RARE Creator Blessing event!
    if(Math.random() < 0.05){
        creatorBlessingEvent(avgLv);
        return;
    }
    
    const eventTypes = ['blessing', 'wisdom', 'training', 'luck'];
    const eventType = eventTypes[Math.floor(Math.random()*eventTypes.length)];
    
    let title, effect, narrative;
    
    // XP SCALES with party level!
    // Lv5 = ~25 XP, Lv15 = ~80 XP, Lv30 = ~200 XP, Lv50 = ~400 XP
    const xpReward = Math.floor(15 + Math.pow(avgLv, 1.5) * 1.5);
    const coinReward = Math.floor(20 + avgLv * 2);
    
    if(eventType === 'luck'){
        const narratives = DM_NARRATIVES.special.luck;
        narrative = narratives[Math.floor(Math.random()*narratives.length)](coinReward);
        title = '🍀 Lucky Encounter!';
        effect = () => { getActiveStudents().forEach(s => { s.coins = (s.coins||0) + coinReward; }); };
    } else {
        const narratives = DM_NARRATIVES.special[eventType];
        narrative = narratives[Math.floor(Math.random()*narratives.length)](xpReward);
        title = eventType === 'blessing' ? '✨ Divine Blessing!' : 
                eventType === 'wisdom' ? '📚 Ancient Wisdom!' : '⚔️ Training Session!';
        effect = () => { getActiveStudents().forEach(s => addXP(s.id, xpReward)); };
    }
    
    addStoryLog(title + ' - ' + narrative, 'special');
    effect();
    showEventOverlay(title, narrative, 'purple');
    save();
}

// RARE Creator Blessing Event - XP SCALES with level!
function creatorBlessingEvent(avgLv){
    // Scaling multiplier based on level
    const scaledXP = Math.floor(50 + Math.pow(avgLv, 1.6) * 2);
    const scaledCoins = Math.floor(50 + avgLv * 5);
    
    const rareRewards = [
        {
            name: '🌟 Stardust Blessing',
            desc: 'The Creator touches each creature with cosmic energy!',
            effect: () => { getActiveStudents().forEach(s => addXP(s.id, scaledXP)); },
            reward: `+${scaledXP} XP to all!`
        },
        {
            name: '💎 Crystal Heart',
            desc: 'A rare crystal appears, radiating power!',
            effect: () => { getActiveStudents().forEach(s => { s.coins = (s.coins||0) + scaledCoins; addXP(s.id, Math.floor(scaledXP * 0.5)); }); },
            reward: `+${scaledCoins} 🪙 & +${Math.floor(scaledXP * 0.5)} XP to all!`
        },
        {
            name: '⭐ Level Up Boost',
            desc: 'Time seems to accelerate for your creatures!',
            effect: () => { getActiveStudents().forEach(s => addXP(s.id, Math.floor(scaledXP * 1.5))); },
            reward: `+${Math.floor(scaledXP * 1.5)} XP to all!`
        },
        {
            name: '🔮 Ancient Artifact',
            desc: 'An artifact from the beginning of time!',
            effect: () => { getActiveStudents().forEach(s => { s.coins = (s.coins||0) + scaledCoins * 2; }); },
            reward: `+${scaledCoins * 2} 🪙 to all!`
        }
    ];
    
    const reward = rareRewards[Math.floor(Math.random() * rareRewards.length)];
    
    const narrative = `Reality shimmers and warps. A familiar figure materializes before you...
