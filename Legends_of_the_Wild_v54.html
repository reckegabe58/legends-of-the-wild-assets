function enemyAction(){
    if(!state.battle)return;
    const b=state.battle;
    const cur = battleQueue[turnIdx];
    
    // Get the specific enemy whose turn it is
    const enemyIdx = cur?.idx || 0;
    const enemy = b.enemies[enemyIdx];
    
    // Skip if this enemy is dead
    if(!enemy || enemy.hp <= 0){
        turnIdx++;
        processing = false; // CRITICAL: Clear before nextTurn
        nextTurn();
        return;
    }
    
    // FOCUS REGEN for enemies (hidden from player)
    if(enemy.focus !== undefined && enemy.focusMax){
        enemy.focus = Math.min(enemy.focusMax, enemy.focus + (enemy.focusRegen || 15));
    }
    
    // Reduce special cooldown
    if(enemy.specialCooldown > 0) enemy.specialCooldown--;
    
    const alive = b.team.filter(m=>m.curHp>0);
    if(!alive.length){endBattle(false);return}
    
    const enemyEl = document.getElementById('enemyImg'+enemyIdx);
    const arena = document.getElementById('battleArena');
    
    // ============================================
    // SMART AI DECISION MAKING
    // ============================================
    const hpPercent = enemy.hp / enemy.maxHp;
    const allEnemies = b.enemies.filter(e => e.hp > 0);
    const woundedAllies = allEnemies.filter(e => e.hp / e.maxHp < 0.5);
    
    let actionType = 'basic'; // basic, special, heal, aoe
    let healTarget = null;
    
    // Decision priority:
    // 1. Heal if we can AND (self low HP OR ally very low)
    // 2. Use special if ready AND (enemy low HP for kill OR random 30%)
    // 3. AOE if boss with AOE ability AND multiple targets AND random
    // 4. Basic attack
    
    // Check if should heal
    if(enemy.canHeal && enemy.healAttack){
        // Heal self if below 40%
        if(hpPercent < 0.4 && Math.random() < 0.7){
            actionType = 'heal';
            healTarget = enemy;
        }
        // Heal wounded ally if any below 30%
        else if(woundedAllies.length > 0){
            const criticalAlly = woundedAllies.find(e => e.hp / e.maxHp < 0.3);
            if(criticalAlly && Math.random() < 0.5){
                actionType = 'heal';
                healTarget = criticalAlly;
            }
        }
    }
    
    // Check if should use special
    if(actionType === 'basic' && enemy.hasSpecial && enemy.specialAttack && enemy.specialCooldown === 0){
        // Check focus requirement
        const specialCost = enemy.specialAttack.focusCost || 40;
        const hasFocus = !enemy.focus || enemy.focus >= specialCost;
        
        if(hasFocus){
            const lowestTarget = alive.reduce((a,b) => a.curHp < b.curHp ? a : b);
            const canKill = lowestTarget.curHp < enemy.atk * enemy.specialAttack.power * 0.8;
            
            // Use special for kill shot OR 35% random chance
            if(canKill || Math.random() < 0.35){
                actionType = 'special';
            }
        }
    }
    
    // Check for AOE (bosses only)
    if(actionType === 'basic' && enemy.isBoss && enemy.attacks?.a?.length && alive.length >= 2){
        if(Math.random() < 0.3){
            actionType = 'aoe';
        }
    }
    
    // Choose target for attacks
    const targetMember = alive[Math.floor(Math.random()*alive.length)];
    const targetMemberIdx = b.team.indexOf(targetMember);
    
    // ============================================
    // EXECUTE ACTION
    // ============================================
    
    if(actionType === 'heal'){
        // HEAL ACTION
        executeEnemyHeal(enemy, enemyIdx, healTarget, enemyEl);
        return;
    }
    
    // TELEGRAPH PHASE (0.4s) for attacks
    if(actionType !== 'aoe'){
        const arenaTarget = document.getElementById('arenaC'+targetMemberIdx);
        const pmTarget = document.getElementById('pm'+targetMemberIdx);
        if(arenaTarget) arenaTarget.classList.add('targeted');
        if(pmTarget) pmTarget.classList.add('targeted');
        
        setTimeout(()=>{
            if(arenaTarget) arenaTarget.classList.remove('targeted');
            if(pmTarget) pmTarget.classList.remove('targeted');
        }, 400);
    }
    
    // Wait for telegraph, then attack
    setTimeout(()=>{
        // ENEMY DASH ANIMATION
        if(enemyEl){
            enemyEl.classList.add('anim-dash-left');
            setTimeout(()=>enemyEl.classList.remove('anim-dash-left'),250);
        }
        playSound('hit');
        
        setTimeout(()=>{
            if(actionType === 'aoe'){
                // AOE attack
                const atkName = enemy.attacks.a[Math.floor(Math.random()*enemy.attacks.a.length)];
                
                if(arena){
                    arena.classList.add('screen-shake');
                    setTimeout(()=>arena.classList.remove('screen-shake'),300);
                }
                
                addLog(`💥 ${enemy.name}: ${atkName}!`,'enemy');
                alive.forEach((t,i)=>{
                    t.chipHp = t.curHp;
                    let d = Math.max(5, enemy.atk * 0.5 - (t.st.def * 0.15));
                    d = Math.floor(d * (0.7 + Math.random() * 0.3));
                    if(t.def) d = Math.floor(d * 0.5);
                    t.curHp = Math.max(0, t.curHp - d);
                    
                    const idx = b.team.indexOf(t);
                    const targetEl = document.getElementById('c'+idx);
                    const arenaCreature = document.getElementById('arenaC'+idx);
                    if(arenaCreature) arenaCreature.classList.add('hit-recoil');
                    if(targetEl) targetEl.classList.add('anim-hit-shake');
                    setTimeout(()=>{
                        if(arenaCreature) arenaCreature.classList.remove('hit-recoil');
                        if(targetEl) targetEl.classList.remove('anim-hit-shake');
                    },250);
                    
                    if(arenaCreature) showFloatingDamage(arenaCreature, d, 'damage');
                });
                addLog(`Everyone takes damage!`,'dmg');

                turnIdx++;
                processing = false;
                renderMain();
                setTimeout(nextTurn, 800);

            } else if(actionType === 'special'){
                // SPECIAL ATTACK
                const t = targetMember;
                const spec = enemy.specialAttack;
                
                // DEDUCT FOCUS COST
                const specialCost = spec.focusCost || 40;
                if(enemy.focus !== undefined){
                    enemy.focus = Math.max(0, enemy.focus - specialCost);
                }
                
                const idx = targetMemberIdx;
                const arenaCreature = document.getElementById('arenaC'+idx);
                const targetEl = document.getElementById('c'+idx);
                
                // FIRE SPECIAL PROJECTILE FROM ENEMY TO PLAYER
                const element = spec.element || enemy.attackElement || 'energy';
                fireProjectile(enemyEl, arenaCreature || targetEl, element, ()=>{
                    t.chipHp = t.curHp;
                    let d = Math.max(15, Math.floor(enemy.atk * spec.power) - (t.st.def * 0.15));
                    d = Math.floor(d * (0.9 + Math.random() * 0.2));
                    if(t.def) d = Math.floor(d * 0.6);
                    t.curHp = Math.max(0, t.curHp - d);
                    
                    enemy.specialCooldown = spec.cooldown || 3;
                    
                    // Strong visual feedback
                    if(arenaCreature) arenaCreature.classList.add('hit-recoil');
                    if(targetEl) targetEl.classList.add('anim-crit-shake');
                    setTimeout(()=>{
                        if(arenaCreature) arenaCreature.classList.remove('hit-recoil');
                        if(targetEl) targetEl.classList.remove('anim-crit-shake');
                    },300);
                    
                    if(arena){
                        arena.classList.add('screen-shake');
                        setTimeout(()=>arena.classList.remove('screen-shake'),200);
                    }
                    
                    showFloatingDamage(arenaCreature || targetEl, d, 'crit');
                    
                    // Show element effect for special
                    if(spec.element){
                        showElementEffect(arenaCreature || targetEl, spec.element);
                    }
                    
                    addLog(`⚡ ${enemy.name} used ${spec.name}! ${t.name||'Hero'} -${d}`,'enemy');
                    if(t.curHp<=0) addLog(`${t.name||'Hero'} is down!`,'dmg');
                    
                    turnIdx++;
                    processing = false; // CRITICAL: Clear before nextTurn
                    renderMain();
                    setTimeout(nextTurn, 800);
                });
                
            } else {
                // BASIC ATTACK
                const t = targetMember;
                const atkList = enemy.isBoss ? enemy.attacks?.s : enemy.attacks;
                const atkName = atkList ? atkList[Math.floor(Math.random()*atkList.length)] : 'Attack';
                
                const idx = targetMemberIdx;
                const arenaCreature = document.getElementById('arenaC'+idx);
                const targetEl = document.getElementById('c'+idx);
                
                // FIRE PROJECTILE FROM ENEMY TO PLAYER
                const element = enemy.attackElement || 'physical';
                fireProjectile(enemyEl, arenaCreature || targetEl, element, ()=>{
                    t.chipHp = t.curHp;
                    let d = Math.max(10, enemy.atk - (t.st.def * 0.2));
                    d = Math.floor(d * (0.8 + Math.random() * 0.4));
                    if(t.def){ d = Math.floor(d * 0.5); addLog(`${t.name||'Hero'} blocks!`,'def'); }
                    t.curHp = Math.max(0, t.curHp - d);
                    
                    // VISUAL EFFECTS - Impact + Slash
                    showImpactFlash(arenaCreature || targetEl);
                    showSlashEffect(arenaCreature || targetEl, false);
                    
                    if(arenaCreature) arenaCreature.classList.add('hit-recoil');
                    if(targetEl) targetEl.classList.add('anim-hit-shake');
                    setTimeout(()=>{
                        if(arenaCreature) arenaCreature.classList.remove('hit-recoil');
                        if(targetEl) targetEl.classList.remove('anim-hit-shake');
                    },250);
                    
                    const hpBar = document.getElementById('pmHpBar'+idx);
                    if(hpBar){
                        hpBar.classList.add('anim-damage');
                        setTimeout(()=>hpBar.classList.remove('anim-damage'),300);
                    }
                    
                    showFloatingDamage(arenaCreature || targetEl, d, 'damage');
                    
                    // Show element effect
                    if(enemy.attackElement){
                        setTimeout(() => showElementEffect(arenaCreature || targetEl, enemy.attackElement), 80);
                    }
                    
                    addLog(`${enemy.name} used ${atkName}! ${t.name||'Hero'} -${d}`,'enemy');
                    if(t.curHp<=0) addLog(`${t.name||'Hero'} is down!`,'dmg');
                    
                    turnIdx++;
                    processing = false; // CRITICAL: Clear before nextTurn
                    renderMain();
                    setTimeout(nextTurn, 800);
                });
            }
        }, 350); // SLOWER - was 200
    }, 500); // SLOWER - was 400
}

// Enemy heal action
function executeEnemyHeal(enemy, enemyIdx, target, enemyEl){
    const heal = enemy.healAttack;
    const healAmount = Math.floor(target.maxHp * heal.power);
    const actualHeal = Math.min(healAmount, target.maxHp - target.hp);
    
    // Animation
    if(enemyEl){
        enemyEl.classList.add('anim-heal');
        setTimeout(()=>enemyEl.classList.remove('anim-heal'),550);
    }
    playSound('heal');
    
    target.hp = Math.min(target.maxHp, target.hp + healAmount);
    
    // Show floating heal number on healed target
    const targetEl = document.getElementById('enemyImg' + state.battle.enemies.indexOf(target));
    if(targetEl) showFloatingDamage(targetEl, actualHeal, 'heal');
    
    const selfHeal = target === enemy;
    addLog(`💚 ${enemy.name} used ${heal.name}!${selfHeal ? '' : ' Healed ' + target.name}`, 'heal');
    
    turnIdx++;
    processing = false; // CRITICAL: Clear before nextTurn
    renderMain();
    setTimeout(nextTurn, 600);
}

function endBattle(won){
    const b=state.battle;
    stopMusic(); // Stop battle music
    window.lastProcessingCheck = null; // Clean up processing watchdog

    // Calculate total rewards from all enemies
    const totalXP = b.enemies.reduce((sum, e) => sum + (e.xp || 0), 0);
    const totalCoins = b.enemies.reduce((sum, e) => sum + (e.coins || 0), 0);
    const enemyNames = b.enemies.map(e => e.name).join(', ');
    const primaryEnemy = b.enemy;
    
    if(won){
        playSound('victory');
        
        // Track level-ups for sequential display
        const levelUps = [];
        
        // Award XP and coins
        const activeStudents=getActiveStudents();
        activeStudents.forEach(s=>{
            const oL=getLv(s.xp);
            
            // Apply XP boost if active
            let xpGain = totalXP;
            if(s.xpBoostAdventures && s.xpBoostAdventures > 0){
                xpGain *= 2; // 2x multiplier from XP Booster item
                s.xpBoostAdventures--;
                addLog(`⭐ ${s.name} has 2x XP boost! (${s.xpBoostAdventures} adventures remaining)`, 'info');
            }
            
            // Apply coin boost if active
            let coinGain = totalCoins;
            if(s.coinBoostAdventures && s.coinBoostAdventures > 0){
                coinGain = Math.floor(coinGain * 1.2); // 20% boost from Coin Magnet
                s.coinBoostAdventures--;
            }
            
            // Apply economy multiplier
            coinGain = Math.floor(coinGain * state.shopConfig.coinEconomyMultiplier);
            
            s.xp += xpGain;
            s.coins = (s.coins||0) + coinGain;
            state.totalXP += xpGain;
            const nL=getLv(s.xp);
            
            // Track level-up data
            if(nL>oL && s.cid){
                const oldStats = getStats(s.cid, oL);
                const newStats = getStats(s.cid, nL);
                const oE=getEvo(s.cid,oL);
                const nE=getEvo(s.cid,nL);
                
                levelUps.push({
                    student: s,
                    oldLevel: oL,
                    newLevel: nL,
                    oldStats: oldStats,
                    newStats: newStats,
                    evolved: nE > oE,
                    oldEvo: oE,
                    newEvo: nE
                });
            }
        });
        
        // Sort level-ups: highest new level first, then by turn order
        levelUps.sort((a, b) => {
            if(b.newLevel !== a.newLevel) return b.newLevel - a.newLevel;
            // Same level - sort by position in active students (turn order)
            const aIdx = activeStudents.findIndex(s => s.id === a.student.id);
            const bIdx = activeStudents.findIndex(s => s.id === b.student.id);
            return aIdx - bIdx;
        });
        
        // Store for sequential display after victory overlay
        state.pendingLevelUps = levelUps;
        
        // Record boss defeats
        b.enemies.forEach(enemy => {
            if(enemy.isBoss && !state.defeated.includes(enemy.id)){
                state.defeated.push(enemy.id);
                addStoryLog(`🏆 VICTORY! ${enemy.name} has been defeated!`,'victory');
                
                // Special messages for Nightmare phases
                if(enemy.id && enemy.id.includes('nightmare')){
                    const phase = enemy.phase !== undefined ? enemy.phase : parseInt(enemy.id.split('_p')[1]);
                    const phaseMessages = {
                        0: "The Eternal Nightmare retreats... for now. Chapter 2 awaits!",
                        1: "The Nightmare's tentacles recede. Chapter 3 is unlocked!",
                        2: "A thousand eyes close in defeat. Chapter 4 opens!",
                        3: "Reality stabilizes! The path to the Final Chapter is clear!",
                        4: "THE APOCALYPSE HAS BEEN AVERTED! But wait... something stirs..."
                    };
                    if(phaseMessages[phase]) addStoryLog(`🌟 ${phaseMessages[phase]}`,'chapter');
                }
                
                // Special message for Creator
                if(enemy.isCreator){
                    addStoryLog("👑 INCREDIBLE! You have defeated THE CREATOR! The ultimate victory is yours!", 'chapter');
                }
            }
        });
        
        if(!primaryEnemy.isBoss){
            const count = b.enemies.length;
            addStoryLog(`✅ The team defeated ${count > 1 ? count + ' enemies' : 'the wild ' + primaryEnemy.name}!`,'victory');
        }
        
        showVictoryOverlay(primaryEnemy, totalXP, totalCoins, b.enemies.length);
        
    }else{
        playSound('defeat');
        
        // Lose some coins
        getActiveStudents().forEach(s=>{
            s.coins=Math.max(0,(s.coins||0)-10);
        });
        
        state.challengeLocked=true;
        addStoryLog(`💀 The team was defeated by ${enemyNames}... They must regroup!`,'battle');
        
        showDefeatOverlay(primaryEnemy);
    }
    
    state.battle=null;
    save();
}

function showEvolutionSequence(student, oldLv, newLv){

    const newEvo = getEvo(student.cid, newLv);

    const newStats = getStats(student.cid, newLv);

    const newName = c.names ? c.names[newEvo] : c.name;
    
    const overlay = document.createElement('div');
    overlay.className = 'evo-sequence';
    overlay.id = 'evoSequence';
    
    // Stage 1: Show old creature

        <div class="intro-text">${STORY_INTRO.replace(/\n\n/g,'</p><p style="margin-top:10px">')}</div>
        <button class="btn btn-primary" onclick="startJourney()">Begin Your Journey</button>
    `;
    document.getElementById('introOverlay').classList.add('active');
}

function startJourney(){
    state.introSeen=true;
    addStoryLog("Mr. Gabe, The Creator, has called forth new Legends to face the coming darkness...",'chapter');
    addStoryLog(CHAPTERS[1].name+" - "+CHAPTERS[1].desc,'chapter');
    save();
    closeOverlay('intro');
    renderMain();
}

// SAVE/LOAD UI
function saveGame(){save();alert('✅ Game Saved!')}
function loadGame(){load();renderMain();alert('✅ Game Loaded!')}
function resetGame(){
    if(!confirm('⚠️ Reset ALL progress? This cannot be undone!'))return;
    state={students:[],activeIds:[],quests:{},totalXP:0,defeated:[],battle:null,log:[],storyLog:[],chapter:1,adventureCount:0,challengeLocked:false,introSeen:false};
    nextId=1;
    localStorage.removeItem('legendsWildV6');
    renderMain();
    alert('Game Reset!');
}

// INIT
document.addEventListener('DOMContentLoaded',()=>{
    load();
    renderNav();
    renderMain();
    
    // Show intro if first time
    if(!state.introSeen&&state.students.length===0){
        setTimeout(showIntro,500);
    }
    
    console.log('🎮 Legends of the Wild v6.0 - Adventure Update!');
});
</script>
</body>
</html>
