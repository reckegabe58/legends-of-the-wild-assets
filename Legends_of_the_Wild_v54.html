// Create boss enemy object with optional scaling
function createBossEnemy(id, boss, chapter){
    // Get party info for scaling
    const activeParty = getActiveStudents().filter(s => s.cid);
    const partySize = activeParty.length;
    const avgLv = getAvgLevel();
    const partyPower = getPartyPower();
    
    // Base scale from chapter progression
    let scale = 1;
    if(chapter >= 4 && boss.tier <= 3){
        const timesDefeated = state.defeated.filter(d => d === id).length;
        scale = 1 + (chapter - 3) * 0.3 + timesDefeated * 0.2;
    }
    
    // LEVEL SCALING - boss scales if party is higher level than expected
    const levelRatio = avgLv / boss.lv;
    const levelMultiplier = levelRatio > 1 ? 1 + (levelRatio - 1) * 0.5 : 1;
    
    // Apply base scaling
    const baseHP = Math.floor(boss.hp * scale * levelMultiplier);
    const baseATK = Math.floor(boss.atk * scale * levelMultiplier);
    const baseDEF = Math.floor(boss.def * scale * levelMultiplier * 0.8);
    const baseSPD = Math.max(boss.spd || 25, 20);
    
    // NEW ADAPTIVE PARTY SCALING
    const scaled = scaleBoss(baseHP, baseATK, baseDEF, baseSPD);
    
    // Ensure boss attack is threatening (minimum 25% of average party HP)
    const avgPartyHP = activeParty.reduce((sum, s) => {
        const st = getStats(s.cid, getLv(s.xp));
        return sum + st.hp;
    }, 0) / Math.max(1, partySize);
    const minBossAtk = Math.floor(avgPartyHP * 0.25);
    const finalAtk = Math.max(minBossAtk, scaled.atk);
    
    // Speed includes level bonus
    const finalSpd = Math.floor(scaled.spd + boss.lv * 0.5);
    
    console.log(`Boss ${boss.name}: Party ${partySize}, HP ${scaled.hp}, ATK ${finalAtk}, SPD ${finalSpd}`);
    
    return {
        id: id,
        name: boss.name,
        type: boss.type,
        hp: scaled.hp,
        maxHp: scaled.hp,
        atk: finalAtk,
        def: scaled.def,
        spd: finalSpd,
        lv: Math.floor(boss.lv * levelMultiplier),
        img: boss.img,
        isBoss: true,
        tier: boss.tier,
        xp: Math.floor(boss.xp * (scale * levelMultiplier)),
        coins: Math.floor(boss.coins * (scale * levelMultiplier)),
        attacks: boss.atks,
        bg: boss.bg,
        weak: boss.weak,
        isCreator: boss.isCreator,
        phase: boss.phase,
        partyScaled: partySize
    };
}

// Regular boss encounter
function startBossEncounter(chapter){
    const available = getAvailableBosses().filter(b => canFightBoss(b.id));
    if(!available.length){
        startWildEncounter(getAvgLevel(), chapter);
        return;
    }
    
    const boss = available[Math.floor(Math.random() * available.length)];
    const bossData = BOSSES[boss.id];
    
    // DM narrative for boss approach
    const approachNarratives = [
        `The air grows heavy. An ancient presence stirs...`,
        `Your creatures sense danger. Something powerful approaches!`,
        `The path darkens. A legendary foe blocks your way...`,
        `Reality shivers. A boss-level threat emerges!`
    ];
    const approach = approachNarratives[Math.floor(Math.random() * approachNarratives.length)];
    
    addStoryLog(`⚠️ BOSS: ${bossData.name}!`, 'chapter');
    addStoryLog(bossData.intro, 'battle');
    
    const bossEnemy = createBossEnemy(boss.id, bossData, chapter);
    
    // Store minion data for later spawning at 40% HP
    bossEnemy.minionPool = BOSS_MINIONS[boss.id] || [];
    bossEnemy.minionsSpawned = false;
    
    // Show remaining bosses in tier
    const remaining = getRemainingTierBosses(bossData.tier);
    const remainingText = remaining.length > 1 ? 
        `\n\n📊 ${remaining.length - 1} more Tier ${bossData.tier} boss(es) remaining after this one.` : 
        remaining.length === 1 ? `\n\n⚡ This is the LAST Tier ${bossData.tier} boss! Defeat it to unlock the next Nightmare phase!` : '';
    
    showEventOverlay(`💀 BOSS BATTLE!`, `${approach}\n\n${bossData.intro}${remainingText}`, 'red', () => {
        startBattleWith(bossEnemy, 'tier' + bossData.tier);
    });
}

// Spawn minions for boss battles
function spawnBossMinions(bossId, tier, chapter){
    const minionPool = BOSS_MINIONS[bossId];
    if(!minionPool || !minionPool.length) return [];
    
    const avgLv = getAvgLevel();
    const partySize = getActiveStudents().filter(s=>s.cid).length;
    
    // Spawn 1-3 minions based on party size
    const numMinions = Math.min(Math.max(1, Math.floor(partySize / 2)), 3);
    const minions = [];
    
    for(let i = 0; i < numMinions; i++){
        const minionId = minionPool[Math.floor(Math.random() * minionPool.length)];
        const minionData = MINIONS[minionId];
        if(!minionData) continue;
        
        // Scale minion stats based on party level
        const minionLv = Math.max(avgLv - 5, tier * 5);
        const lvScale = 1 + (minionLv - 1) * 0.08;
        
        minions.push({
            id: minionId,
            name: minionData.name,
            type: minionData.type,
            lv: minionLv,
            hp: Math.floor(minionData.base.hp * lvScale * (0.8 + partySize * 0.1)),
            maxHp: Math.floor(minionData.base.hp * lvScale * (0.8 + partySize * 0.1)),
            atk: Math.floor(minionData.base.atk * lvScale),
            def: Math.floor(minionData.base.def * lvScale),
            spd: Math.floor(minionData.base.spd * lvScale),
            xp: Math.floor(20 + minionLv * 3),
            coins: Math.floor(10 + minionLv * 2),
            img: minionData.img,
            isMinion: true,
            attacks: ['Minion Strike', 'Quick Attack', 'Slash']
        });
    }
    
    return minions;
}

// Check if boss should summon minions (at 40% HP)
function checkBossMinionSummon(){
    const b = state.battle;
    if(!b) return;
    
    // Find the boss in enemies array
    const boss = b.enemies.find(e => e.isBoss);
    if(!boss || boss.minionsSpawned) return;
    
    // Check if boss is at or below 40% HP
    const hpPercent = boss.hp / boss.maxHp;
    if(hpPercent > 0.4) return;
    
    // Check if boss has minions to spawn
    const minionPool = boss.minionPool;
    if(!minionPool || !minionPool.length) return;
    
    // Mark as spawned so we don't do it again
    boss.minionsSpawned = true;
    
    // Generate minions - MORE minions for bigger parties
    const avgLv = getAvgLevel();
    const partySize = b.team.filter(t => t.curHp > 0).length;
    
    // Base 2 minions, +1 for every 2 party members above 2
    const baseMinions = 2;
    const bonusMinions = Math.floor(Math.max(0, partySize - 2) / 2);
    const numMinions = Math.min(baseMinions + bonusMinions, 4); // Cap at 4
    
    const newMinions = [];
    for(let i = 0; i < numMinions; i++){
        const minionId = minionPool[Math.floor(Math.random() * minionPool.length)];
        const minionData = MINIONS[minionId];
        if(!minionData) continue;
        
        const minionLv = Math.max(avgLv - 5, 10);
        const lvScale = 1 + (minionLv - 1) * 0.08;
        
        // Apply party-adaptive scaling to minions
        const baseHP = Math.floor(minionData.base.hp * lvScale);
        const baseATK = Math.floor(minionData.base.atk * lvScale);
        const baseDEF = Math.floor(minionData.base.def * lvScale);
        const baseSPD = Math.floor(minionData.base.spd * lvScale);
        
        const scaled = scaleBossMinion(baseHP, baseATK, baseDEF, baseSPD);
        
        newMinions.push({
            id: minionId,
            name: minionData.name,
            type: minionData.type,
            lv: minionLv,
            hp: scaled.hp,
            maxHp: scaled.hp,
            atk: scaled.atk,
            def: scaled.def,
            spd: scaled.spd,
            xp: Math.floor(20 + minionLv * 3),
            coins: Math.floor(10 + minionLv * 2),
            img: minionData.img,
            isMinion: true,
            attacks: ['Minion Strike', 'Quick Attack', 'Slash']
        });
    }
    
    if(newMinions.length > 0){
        // CRITICAL: Set processing flag to block ALL turn advancement during summon
        processing = true;
        
        // Show summon animation BEFORE adding minions
        showSummonAnimation(boss.name, newMinions, () => {
            // Add minions to battle after animation
            b.enemies.push(...newMinions);
            
            // Add minions to turn order with correct indices
            newMinions.forEach((m, i) => {
                const enemyIdx = b.enemies.length - newMinions.length + i;
                battleQueue.push({type:'enemy', idx: enemyIdx, spd: m.spd});
            });
            
            // Re-sort turn order by speed
            battleQueue.sort((a,b) => b.spd - a.spd);
            
            // Show summon message in log
            addLog(`💀 ${boss.name} summons reinforcements!`, 'enemy');
            addLog(`👹 ${newMinions.length} minion(s) join the fight!`, 'enemy');
            
            // Force re-render to show new minions
            renderMain();
            
            // CRITICAL: Advance turn and clear processing
            turnIdx++;
            processing = false;
            
            // Trigger next turn after delay (avoids recursion)
            setTimeout(() => {
                if(!processing){ // Double-check processing isn't stuck
                    nextTurn();
                }
            }, 600);
        });
    }
}

// Summon Animation Display
function showSummonAnimation(bossName, minions, callback){
    const overlay = document.createElement('div');
    overlay.className = 'summon-overlay';
    overlay.id = 'summonOverlay';
    
    let creaturesHtml = minions.map(m => `
        <div class="summon-creature">
            <img src="${G}/${m.img}" onerror="this.src='${G}/UI_Elements/Icon_Attack.png'">
        </div>
    `).join('');
    
    overlay.innerHTML = `
        <div class="summon-title">⚠️ ${bossName} Summons Reinforcements! ⚠️</div>
        <div class="summon-portal"></div>
        <div class="summon-creatures">${creaturesHtml}</div>
    `;
    
    document.body.appendChild(overlay);
    playSound('hit'); // Play a sound effect
    
    // Remove overlay and execute callback after animation
    setTimeout(() => {
        overlay.style.animation = 'summonFadeIn .3s ease-out reverse';
        setTimeout(() => {
            overlay.remove();
            if(!state.battle) return;
            if(callback) callback();
        }, 300);
    }, 2000); // Show for 2 seconds
}

function startWildEncounter(avgLv,chapter){
    const regions={1:'forest',2:'volcano',3:'ice',4:'void',5:'void'};
    const region=regions[chapter]||'forest';
    
    // Get wild creatures for this region from new WILD_ENCOUNTERS
    const regionCreatures = WILD_ENCOUNTERS[region] || WILD_ENCOUNTERS.forest;
    if(!regionCreatures.length){treasureEvent(chapter,avgLv);return}
    
    // Get party info for balanced enemy count
    const partySize = getActiveStudents().filter(s=>s.cid).length;
    
    // BALANCED enemy count formula
    // Base enemies by chapter, modified by party size
    let baseEnemies = 1;
    if(chapter >= 2) baseEnemies = 1;
    if(chapter >= 3) baseEnemies = 2;
    if(chapter >= 4) baseEnemies = 2;
    if(chapter >= 5) baseEnemies = 3;
    
    // Party size bonus: +1 enemy per 2 extra players
    const partySizeBonus = Math.floor((partySize - 1) / 2);
    
    // Level bonus: every 15 levels = potential +1 enemy
    const levelBonus = Math.floor(avgLv / 20);
    
    // Calculate max enemies (HARD CAP at 5)
    const maxEnemies = Math.min(5, baseEnemies + partySizeBonus + levelBonus);
    const minEnemies = Math.max(1, maxEnemies - 2);
    
    // Randomize within range
    let numEnemies = minEnemies + Math.floor(Math.random() * (maxEnemies - minEnemies + 1));
    
    // ============================================
    // BUILD CREATURE POOL - BALANCED MIX
    // ============================================
    // RULE: Regional creatures should appear frequently
    // Player creatures are rare elite encounters
    
    // Start with regional creatures (weighted 3x to appear more often)
    let creaturePool = [];
    regionCreatures.forEach(c => {
        // Add each regional creature 3 times for weighting
        creaturePool.push({...c, isRegional: true});
        creaturePool.push({...c, isRegional: true});
        creaturePool.push({...c, isRegional: true});
    });
    
    // Add player creatures as RARE elite encounters (only 1 copy each)
    Object.entries(CREATURES).forEach(([cid, c]) => {
        
        // EVO 1: Available early game (before first evolution threshold + buffer)
        const evo1MaxLv = c.evAt ? c.evAt[0] + 3 : 18;
        if(avgLv <= evo1MaxLv){
            creaturePool.push({
                id: 'feral_' + cid,
                name: 'Feral ' + (c.names ? c.names[0] : c.name),
                type: c.type,
                base: {...c.base},
                img: 'Player_Creatures/' + c.imgs[0],
                isPlayerCreature: true,
                evoStage: 1
            });
        }
        
        // EVO 2: Mid game (around first evolution threshold)
        if(c.evAt && c.evAt[0] && avgLv >= c.evAt[0] - 3 && avgLv <= (c.evAt[1] ? c.evAt[1] + 5 : 30)){
            const evo2Growth = Math.floor(c.evAt[0] * 0.6);
            creaturePool.push({
                id: 'wild_' + cid + '_evo2',
                name: 'Wild ' + (c.names ? c.names[1] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo2Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo2Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo2Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo2Growth)
                },
                img: 'Player_Creatures/' + c.imgs[1],
                isPlayerCreature: true,
                evoStage: 2,
                canHeal: c.canHeal // Inherit healing ability
            });
        }
        
        // EVO 3: Late game
        if(c.evAt && c.evAt[1] && c.imgs[2] && avgLv >= c.evAt[1] - 3 && avgLv <= (c.evAt[2] ? c.evAt[2] + 5 : 45)){
            const evo3Growth = Math.floor(c.evAt[1] * 0.6);
            creaturePool.push({
                id: 'wild_' + cid + '_evo3',
                name: 'Wild ' + (c.names ? c.names[2] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo3Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo3Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo3Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo3Growth)
                },
                img: 'Player_Creatures/' + c.imgs[2],
                isPlayerCreature: true,
                evoStage: 3,
                canHeal: c.canHeal
            });
        }
        
        // EVO 4: End game
        if(c.evAt && c.evAt[2] && c.imgs[3] && avgLv >= c.evAt[2] - 2){
            const evo4Growth = Math.floor(c.evAt[2] * 0.55);
            creaturePool.push({
                id: 'wild_' + cid + '_evo4',
                name: 'Wild ' + (c.names ? c.names[3] : c.name),
                type: c.type,
                base: {
                    hp: Math.floor(c.base.hp + c.grow.hp * evo4Growth),
                    atk: Math.floor(c.base.atk + c.grow.atk * evo4Growth),
                    def: Math.floor(c.base.def + c.grow.def * evo4Growth),
                    spd: Math.floor(c.base.spd + c.grow.spd * evo4Growth)
                },
                img: 'Player_Creatures/' + c.imgs[3],
                isPlayerCreature: true,
                evoStage: 4,
                canHeal: c.canHeal
            });
        }
    });
    
    // ============================================
    // ADD DEFEATED BOSSES FROM PREVIOUS TIERS
    // ============================================
    // Chapter 2+ can encounter defeated Tier 1 bosses
    // Chapter 3+ can encounter defeated Tier 1 & 2 bosses
    // Chapter 4+ can encounter all defeated bosses
    // 15% chance to encounter a previous boss instead of regular enemies
    
    const previousBossEncounter = Math.random() < 0.15;
    let bossToFight = null;
    
    if(previousBossEncounter && chapter >= 2){
        // Get defeated bosses from previous tiers
        let eligibleBosses = [];
        
        if(chapter >= 2){
            // Add defeated Tier 1 bosses
            TIER1_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 1});
                }
            });
        }
        if(chapter >= 3){
            // Add defeated Tier 2 bosses
            TIER2_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 2});
                }
            });
        }
        if(chapter >= 4){
            // Add defeated Tier 3 bosses
            TIER3_BOSSES.forEach(bid => {
                if(state.defeated.includes(bid) && BOSSES[bid]){
                    eligibleBosses.push({id: bid, ...BOSSES[bid], tier: 3});
                }
            });
        }
        
        if(eligibleBosses.length > 0){
            bossToFight = eligibleBosses[Math.floor(Math.random() * eligibleBosses.length)];
        }
    }
    
    // If we're doing a previous boss encounter
    if(bossToFight){
        // Scale boss to current party level
        const lvScale = 1 + (avgLv - bossToFight.lv) * 0.04; // 4% per level difference
        const partyScale = 1 + (partySize - 1) * 0.12;
        
        const scaledBoss = {
            ...bossToFight,
            id: bossToFight.id,
            name: `Vengeful ${bossToFight.name}`,
            lv: Math.max(bossToFight.lv, avgLv - 3),
            hp: Math.floor(bossToFight.hp * lvScale * partyScale * 0.7), // 70% HP (weakened)
            maxHp: Math.floor(bossToFight.hp * lvScale * partyScale * 0.7),
            atk: Math.floor(bossToFight.atk * lvScale * partyScale * 0.8), // 80% ATK
            def: Math.floor(bossToFight.def * lvScale * 0.8),
            spd: bossToFight.spd,
            xp: Math.floor(bossToFight.xp * 0.5), // Half XP (already defeated once)
            coins: Math.floor(bossToFight.coins * 0.5),
            img: bossToFight.img,
            isBoss: true,
            isRevenge: true, // Mark as revenge encounter
            attacks: bossToFight.atks,
            minionPool: BOSS_MINIONS[bossToFight.id] || []
        };
        
        // Show special narrative
        const narratives = [
            `The shadows stir with familiar malice... ${bossToFight.name} has returned, seeking REVENGE!`,
            `A chill runs down your spine. You've fought this evil before... ${bossToFight.name} rises again!`,
            `"You thought you defeated me?" ${bossToFight.name} emerges from the darkness, wounded but furious!`,
            `The ${bossToFight.name} has been hunting you since your last encounter. Now it attacks!`
        ];
        const narrative = narratives[Math.floor(Math.random() * narratives.length)];
        
        let sizeClass = 'tier1';
        if(bossToFight.tier === 2) sizeClass = 'tier2';
        else if(bossToFight.tier === 3) sizeClass = 'tier3';
        
        showEventOverlay('💀 REVENGE ENCOUNTER!', narrative, 'red', bossToFight.img, ()=>{
            startBattleWith(scaledBoss, sizeClass);
        });
        return;
    }
    
    // ============================================
    // CREATE ENEMIES WITH BALANCED SCALING
    // ============================================
    const enemies = [];
    const usedCreatures = [];
    
    for(let i = 0; i < numEnemies; i++){
        let creature;
        let attempts = 0;
        
        // Try to get different creatures
        do {
            creature = creaturePool[Math.floor(Math.random()*creaturePool.length)];
            attempts++;
        } while(usedCreatures.includes(creature.id) && attempts < 10 && creaturePool.length > 1);
        
        usedCreatures.push(creature.id);
        
        const wildLv = Math.max(1, avgLv + Math.floor(Math.random()*5) - 2 + (chapter >= 4 ? chapter * 2 : 0));
        
        // ============================================
        // NEW ADAPTIVE SCALING SYSTEM
        // ============================================
        // Enemy count scaling (more enemies = slightly weaker each)
        const enemyCountScale = numEnemies === 1 ? 1.0 :
                                numEnemies === 2 ? 0.80 :
                                numEnemies === 3 ? 0.70 :
                                numEnemies === 4 ? 0.60 : 0.55;
        
        const isPlayerCreatureEnemy = creature.isPlayerCreature;
        const isRegional = creature.isRegional;
        
        // Level scaling
        const levelScale = isPlayerCreatureEnemy 
            ? (1 + (wildLv - 1) * 0.05)   // 5% per level for evolved creatures
            : (1 + (wildLv - 1) * 0.12);  // 12% per level for regional wilds
        
        // APPLY PARTY SCALING using new system
        const baseHP = Math.floor(creature.base.hp * levelScale * enemyCountScale * 1.6); // Was 1.3 - increased to 1.6 (23% more HP)
        const baseATK = Math.floor(creature.base.atk * levelScale * enemyCountScale);
        const baseDEF = Math.floor(creature.base.def * levelScale * enemyCountScale);
        const baseSPD = creature.base.spd || 18;
        
        // Scale to party size with new adaptive formulas
        const scaled = scaleWildEnemy(baseHP, baseATK, baseDEF, baseSPD);
        
        // Final stats with difficulty multiplier - buffed for longer fights
        const difficultyMult = isPlayerCreatureEnemy ? 1.4 : 1.6; // Was 1.25/1.4 - increased
        const finalHp = Math.floor(scaled.hp * difficultyMult);
        const finalAtk = Math.floor(scaled.atk * difficultyMult);
        const finalDef = Math.floor(scaled.def * difficultyMult * 1.1); // 10% more defense
        const scaledSpd = scaled.spd + (isPlayerCreatureEnemy ? Math.floor(wildLv * 0.2) : Math.floor(wildLv * 0.25));
        
        // XP/Coins - REDUCED for slower progression
        const xpMult = isPlayerCreatureEnemy ? 1.2 : 0.8; // Reduced from 1.5/1.0
        const wildXP = Math.floor((15 + Math.pow(wildLv, 1.6) * 1.8) * xpMult / numEnemies); // Reduced from 25 + lv^1.8 * 2.5
        const wildCoins = Math.floor((10 + wildLv * 3) / numEnemies); // Slightly reduced
        
        // ============================================
        // ENEMY ABILITIES - Use creature's moves if available
        // ============================================
        const hasSpecial = wildLv >= 8 || isPlayerCreatureEnemy || creature.moves?.spec;
        const canHealAbility = creature.canHeal || creature.moves?.heal || (Math.random() < 0.25 && wildLv >= 12);
        
        // Build attack data from creature's moves OR fallback to type-based
        let attackList, specialAttack, healAttack, attackElement;
        
        if(creature.moves){
            // Use creature's defined moves
            attackList = [creature.moves.atk.n];
            attackElement = creature.moves.atk.e || creature.type.toLowerCase();
            
            if(creature.moves.spec && hasSpecial){
                specialAttack = {
                    name: creature.moves.spec.n, 
                    power: creature.moves.spec.p, 
                    cooldown: 3,
                    element: creature.moves.spec.e
                };
            }
            
            if(creature.moves.heal && canHealAbility){
                healAttack = {
                    name: creature.moves.heal.n, 
                    power: creature.moves.heal.p
                };
            }
        } else if(isPlayerCreatureEnemy){
            // Player creature fallback
            attackList = ['Tackle','Slash','Feral Strike'];
            attackElement = creature.type.toLowerCase();
            specialAttack = {name: 'Wild Fury', power: 1.8, cooldown: 3, element: creature.type.toLowerCase()};
            healAttack = creature.canHeal ? {name: 'Natural Recovery', power: 0.3} : null;
        } else {
            // Generic type-based fallback (shouldn't happen with new data)
            const typeAttacks = {
                'Nature': {basic:'Vine Whip', special:'Nature\'s Wrath', heal:'Forest Mend', elem:'nature'},
                'Poison': {basic:'Toxic Spit', special:'Plague Burst', heal:'Toxic Recovery', elem:'poison'},
                'Shadow': {basic:'Dark Slash', special:'Shadow Blast', heal:'Dark Drain', elem:'shadow'},
                'Earth': {basic:'Rock Slam', special:'Earthquake', heal:'Stone Shell', elem:'earth'},
                'Fire': {basic:'Flame Bite', special:'Inferno', heal:'Flame Shield', elem:'fire'},
                'Ice': {basic:'Frost Bite', special:'Blizzard', heal:'Frozen Barrier', elem:'ice'},
                'Void': {basic:'Void Strike', special:'Void Collapse', heal:'Void Drain', elem:'void'},
                'Water': {basic:'Aqua Jet', special:'Tidal Wave', heal:'Aqua Heal', elem:'water'},
                'Lightning': {basic:'Shock', special:'Lightning Storm', heal:'Static Charge', elem:'lightning'}
            };
            const typeData = typeAttacks[creature.type] || typeAttacks['Nature'];
            attackList = [typeData.basic];
            attackElement = typeData.elem;
            specialAttack = hasSpecial ? {name: typeData.special, power: 1.6, cooldown: 3, element: typeData.elem, focusCost: 40} : null;
            healAttack = canHealAbility ? {name: typeData.heal, power: 0.25} : null;
        }
        
        enemies.push({
            id: creature.id + '_' + i,
            name: creature.name + (usedCreatures.filter(u=>u===creature.id).length > 1 ? ` #${usedCreatures.filter(u=>u===creature.id).length}` : ''),
            type: creature.type,
            hp: finalHp,
            maxHp: finalHp,
            atk: finalAtk,
            def: finalDef,
            spd: scaledSpd,
            lv: wildLv,
            img: creature.img,
            isWild: true,
            isPlayerCreature: isPlayerCreatureEnemy,
            isRegional: isRegional,
            evoStage: creature.evoStage || 0,
            xp: wildXP,
            coins: wildCoins,
            attacks: attackList,
            attackElement: attackElement,
            // Focus system for specials
            focus: 50, // Start with 50 focus
            focusMax: 100,
            focusRegen: 15, // Regen 15 per turn
            // Abilities
            hasSpecial: hasSpecial && specialAttack,
            specialAttack: specialAttack,
            specialCooldown: 0,
            canHeal: canHealAbility && healAttack,
            healAttack: healAttack,
            moves: creature.moves // Keep reference for defense move name
        });
    }
    
    // Bonus XP for multi-enemy fights
    if(numEnemies > 1){
        const bonusXP = Math.floor(15 * numEnemies * (1 + avgLv * 0.06));
        enemies.forEach(e => e.xp += Math.floor(bonusXP / numEnemies));
    }
    
    // DM Narrative
    const narratives = DM_NARRATIVES.wild[region] || DM_NARRATIVES.wild.forest;
    
    let narrative;
    if(numEnemies === 1){
        narrative = narratives[Math.floor(Math.random()*narratives.length)](enemies[0].name, enemies[0].lv);
    } else {
        const names = enemies.map(e => e.name).join(', ');
        const multiNarratives = [
            `The party is surrounded! ${numEnemies} enemies emerge from all directions: ${names}!`,
            `A pack of wild creatures blocks your path! ${names} attack together!`,
            `Danger from all sides! The team must face ${names} at once!`,
            `The wilds grow more dangerous. ${numEnemies} foes appear: ${names}!`
        ];
        narrative = multiNarratives[Math.floor(Math.random()*multiNarratives.length)];
    }
    
    const enemyList = enemies.map(e => `${e.name} (Lv ${e.lv})`).join('\n• ');
    addStoryLog(`⚔️ ${numEnemies > 1 ? 'Multiple enemies' : 'Wild ' + enemies[0].name} encountered!`,'battle');
    
    showEventOverlay(
        numEnemies > 1 ? `⚔️ ${numEnemies} Enemies Attack!` : `⚔️ Wild Encounter!`, 
        narrative + (numEnemies > 1 ? `\n\n• ${enemyList}` : ''), 
        numEnemies > 2 ? 'red' : 'blue', 
        () => {
            // For now, fight first enemy (multi-enemy battle system coming)
            startBattleWith(enemies[0], 'wild', enemies.slice(1));
        }
    );
}

// BATTLE SYSTEM
function startBattleWith(enemy, sizeClass, additionalEnemies = []){
    const activeReady=getActiveStudents().filter(s=>s.cid);
    
    // Combine main enemy with additional enemies
    const allEnemies = [enemy, ...additionalEnemies];
    
    state.battle={
        enemy: enemy, // Primary enemy for backwards compatibility
        enemies: allEnemies, // All enemies array
        currentEnemyIdx: 0, // Track which enemy is being targeted
        sizeClass: sizeClass,
        team: activeReady.map(s=>{
            const l=getLv(s.xp),st=getStats(s.cid,l);
            return{...s,lv:l,curHp:st.hp,maxHp:st.hp,st,def:false,cooldown:0,
                focus:50,focusMax:100,focusRegen:10}; // FOCUS SYSTEM
        }),
        isMultiEnemy: allEnemies.length > 1
    };
    state.log=[];
    
    buildTurnOrder();
    currentScreen='battle';
    renderNav();
    
    // CRITICAL: Set initial processing state BEFORE first render
    const firstTurn = battleQueue[0];
    if(firstTurn?.type === 'enemy'){
        processing = true;
    } else {
        processing = false;
    }
    
    renderMain();
    updateMusic(); // Start battle music
    
    // Now execute first turn logic
    if(firstTurn?.type === 'enemy'){
        setTimeout(enemyAction, 800);
    }
}

function buildTurnOrder(){
    const b=state.battle;
    battleQueue=[];
    
    // Add all player team members
    b.team.forEach((m,i)=>{
        if(m.curHp>0) battleQueue.push({type:'player',idx:i,spd:m.st.spd});
    });
    
    // Add all enemies
    b.enemies.forEach((e,i)=>{
        if(e.hp>0) battleQueue.push({type:'enemy',idx:i,spd:e.spd});
    });
    
    battleQueue.sort((a,b)=>b.spd-a.spd);
    turnIdx=0;
}

function getAliveEnemies(){
    return state.battle.enemies.filter(e => e.hp > 0);
}

function getCurrentEnemy(){
    const alive = getAliveEnemies();
    if(!alive.length) return null;
    // Return the first alive enemy, or the targeted one if still alive
    const targeted = state.battle.enemies[state.battle.currentEnemyIdx];
    if(targeted && targeted.hp > 0) return targeted;
    return alive[0];
}

function nextTurn(){
    if(!state.battle)return;
    const b=state.battle;
    
    // CRITICAL SAFETY: If processing flag stuck for >5 seconds, force clear
    if(processing){
        const now = Date.now();
        if(!window.lastProcessingCheck){
            window.lastProcessingCheck = now;
            console.warn('nextTurn blocked: processing flag set, starting timeout...');
            setTimeout(() => {
                if(processing){
                    console.error('CRITICAL: Processing flag stuck for 5s, forcing clear!');
                    processing = false;
                    nextTurn(); // Retry turn
                }
            }, 5000);
            return;
        } else if(now - window.lastProcessingCheck > 5000){
            console.error('CRITICAL: Processing timeout exceeded, forcing clear!');
            processing = false;
            window.lastProcessingCheck = null;
        } else {
            console.warn('nextTurn blocked: summon animation in progress');
            return;
        }
    }
    window.lastProcessingCheck = null; // Clear timeout tracker
    
    // Check win/lose conditions
    const aliveEnemies = getAliveEnemies();
    if(aliveEnemies.length === 0){setTimeout(()=>endBattle(true),500);return}
    if(!b.team.some(m=>m.curHp>0)){setTimeout(()=>endBattle(false),500);return}
    
    if(turnIdx>=battleQueue.length){
        console.log('Turn order exhausted, rebuilding...');
        buildTurnOrder();
    }
    
    let cur=battleQueue[turnIdx];
    
    // SAFETY: Prevent infinite loop if no valid turns
    let safetyCounter = 0;
    while(cur?.type==='player'&&b.team[cur.idx]?.curHp<=0){
        turnIdx++;
        if(turnIdx>=battleQueue.length)buildTurnOrder();
        cur=battleQueue[turnIdx];
        safetyCounter++;
        if(safetyCounter > 20){
            console.error('CRITICAL: Infinite loop detected in turn skipping!');
            buildTurnOrder();
            cur=battleQueue[0];
            turnIdx=0;
            break;
        }
    }
    
    console.log(`Turn ${turnIdx}: ${cur?.type} ${cur?.idx} (processing=${processing})`);
    
    // Reduce cooldowns
    b.team.forEach(m=>{if(m.cooldown>0)m.cooldown--});
    
    // FOCUS REGEN - At start of player's turn
    if(cur?.type==='player'){
        const m = b.team[cur.idx];
        if(m && m.curHp > 0){
            const oldFocus = m.focus;
            m.focus = Math.min(m.focusMax, m.focus + m.focusRegen);
            if(m.focus > oldFocus){
                state.log.push({t:'focus',m:`🔷 ${m.name} regains ${m.focus - oldFocus} Focus`});
            }
        }
    }
    
    processing=false;
    renderMain();
    
    if(cur?.type==='enemy'){
        processing=true;
        setTimeout(enemyAction,800);
    }
}

function renderBattle(m){
    if(!state.battle){currentScreen='adventure';renderAdventure(m);return}
    
    const b=state.battle;
    const enemy=getCurrentEnemy() || b.enemy;
    const cur=battleQueue[turnIdx];
    const isPlayer=cur?.type==='player';
    const activeIdx=isPlayer?cur.idx:-1;
    const activeMember=isPlayer?b.team[activeIdx]:null;
    
    // Check abilities
    const hasHeal=activeMember&&CREATURES[activeMember.cid]?.canHeal&&getMove(activeMember.cid,activeMember.lv,'heal');
    const hasSpec=activeMember&&getMove(activeMember.cid,activeMember.lv,'spec');
    const canSpec=hasSpec&&activeMember.cooldown===0;
    const buttonsDisabled = !isPlayer || processing;
    
    // Boss size class
    let sizeClass = 'wild';
    if(enemy.isBoss){
        if(enemy.tier === 4 || enemy.isCreator) sizeClass = 'nightmare';
        else if(enemy.tier === 3) sizeClass = 'tier3';
        else if(enemy.tier === 2) sizeClass = 'tier2';
        else sizeClass = 'tier1';
    }
    
    let html=`<div class="battle-container" id="battleArena" style="background-image:url('${G}/Backgrounds/${enemy.bg||'Backgrounds_DarkForest.png'}')">`;
    
    // Header
    html+=`<div class="battle-header">
        <div class="battle-type">${enemy.isBoss?'⚔️ BOSS BATTLE':'🗡️ Wild Encounter'}</div>
        ${processing ? `<button onclick="processing=false;nextTurn();renderMain();" style="background:#f87171;color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:.7rem;">⚠️ Unstuck</button>` : ''}
    </div>`;
    
    // ============================================
    // V43: TURN ORDER TRACKER - Top center
    // ============================================
    html+=`<div class="turn-order-bar">`;
    const upcomingTurns = battleQueue.slice(turnIdx, Math.min(turnIdx + 7, battleQueue.length));
    upcomingTurns.forEach((turn, offset) => {
        const isActive = offset === 0;
        const isKO = turn.type === 'player' ? 
            b.team[turn.idx].curHp <= 0 : 
            b.enemies[turn.idx].hp <= 0;
        
        let portraitClass = `turn-order-portrait ${turn.type}`;
        if(isActive) portraitClass += ' active';
        if(isKO) portraitClass += ' ko';
        
        const imgSrc = turn.type === 'player' ? 
            getImg(b.team[turn.idx].cid, b.team[turn.idx].lv) :
            `${G}/${b.enemies[turn.idx].img}`;
        
        html+=`<div class="${portraitClass}">
            <img src="${imgSrc}" onerror="this.style.opacity='0.3'">
        </div>`;
    });
    html+=`</div>`;
    
    // ============================================
    // ARENA - Where combat happens
    // ============================================
    html+=`<div class="battle-arena">`;
    
    // LEFT - Player Party in staggered columns
    const partySize = b.team.length;
    const isSoloParty = partySize <= 2;
    const isSmallParty = partySize === 3;
    const isMediumParty = partySize > 3 && partySize <= 6;
    const isLargeParty = partySize > 6;
    const numColumns = partySize <= 3 ? 1 : partySize <= 6 ? 2 : 3;
    
    let partyClass = 'player-arena';
    if(isSoloParty) partyClass += ' solo-party';
    else if(isSmallParty) partyClass += ' small-party';
    else if(isMediumParty) partyClass += ' medium-party';
    else if(isLargeParty) partyClass += ' large-party';
    
    html+=`<div class="${partyClass}">`;
    
    // Distribute into columns
    const columns = [[],[],[]];
    b.team.forEach((tm, i) => {
        const colIdx = i % numColumns;
        columns[colIdx].push({...tm, idx: i});
    });
    
    // Render columns
    columns.forEach((col, colIdx) => {
        if(col.length === 0) return;
        const colClass = colIdx === 0 ? '' : colIdx === 1 ? ' col-2' : ' col-3';
        html+=`<div class="arena-column${colClass}">`;
        
        col.forEach(tm => {
            const c = CREATURES[tm.cid];
            const evoIdx = getEvo(tm.cid, tm.lv);
            const isActive = tm.idx === activeIdx;
            const isKO = tm.curHp <= 0;
            const isHealTarget = b.healTargetingMode && tm.curHp < tm.maxHp && tm.curHp > 0;
            
            let classes = 'arena-creature';
            if(isKO) classes += ' ko';
            if(isActive && !isKO) classes += ' active active-turn';
            if(isHealTarget) classes += ' heal-target';
            
            html+=`<div class="${classes}" id="arenaC${tm.idx}" ${isHealTarget?`onclick="selectHealTarget(${tm.idx})"`:''}">
                ${isActive && !isKO ? '<span class="active-arrow">▼</span>' : ''}
                
                <div class="ground-circle"></div>
                <div class="arena-frame evo${evoIdx+1}" id="c${tm.idx}">
                    <img src="${getImg(tm.cid, tm.lv)}" onerror="this.style.opacity='0.3'">
                </div>
                
                <!-- Minimalist HP/Focus bars below creature (Pokemon style - no numbers) -->
                <div class="creature-bars-minimal">
                    <div class="minimal-bar hp-minimal">
                        <div class="minimal-bar-fill hp-fill-minimal" style="width:${Math.max(0,(tm.curHp/tm.maxHp)*100)}%"></div>
                    </div>
                    <div class="minimal-bar focus-minimal">
                        <div class="minimal-bar-fill focus-fill-minimal" style="width:${Math.max(0,(tm.focus/tm.focusMax)*100)}%"></div>
                    </div>
                </div>
            </div>`;
        });
        html+=`</div>`;
    });
    html+=`</div>`;
    
    // RIGHT - Enemy Side with staggered columns (like players)
    const allEnemies = b.enemies || [enemy];
    const aliveEnemies = allEnemies.filter(e => e.hp > 0);
    const isTargeting = b.targetingMode;
    const boss = allEnemies.find(e => e.isBoss && e.hp > 0);
    const minions = allEnemies.filter(e => e.isMinion && e.hp > 0);
    const wildEnemies = allEnemies.filter(e => !e.isBoss && !e.isMinion && e.hp > 0);
    
    // When boss dies, minions become regular enemies for rendering purposes
    const remainingEnemies = boss ? wildEnemies : [...wildEnemies, ...minions];
    
    // ADAPTIVE ENEMY SIZING - Solo enemies are BIG, groups are smaller
    const totalNonBoss = remainingEnemies.length + (boss ? minions.length : 0);
    let wildSizeClass = 'wild';
    if(totalNonBoss === 1 && !boss) wildSizeClass = 'wild-solo'; // Solo enemy = BIG
    else if(totalNonBoss >= 4) wildSizeClass = 'wild-tiny';
    else if(totalNonBoss >= 2) wildSizeClass = 'wild-small';
    
    html+=`<div class="enemy-arena">`;
    
    // If there's a boss, render minions FIRST (they appear on left/front), then boss on right
    if(boss){
        // Minions column FIRST (appears to the LEFT of boss = in front)
        if(minions.length > 0){
            html+=`<div class="minion-column">`;
            minions.forEach(e => {
                const idx = allEnemies.indexOf(e);
                const hpPct = (e.hp/e.maxHp)*100;
                const chipPct = ((e.chipHp!==undefined?e.chipHp:e.hp)/e.maxHp)*100;
                
                html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${idx}" onclick="${isTargeting?`selectTarget(${idx})`:''}">
                    <div class="enemy-hp-float" style="min-width:60px">
                        <div class="enemy-name" style="font-size:.55rem">${e.name}</div>
                        <div class="enemy-hp-bar" style="height:5px" id="enemyHpBar${idx}">
                            <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                            <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                        </div>
                    </div>
                    <div class="enemy-frame minion" id="enemyImg${idx}">
                        <img src="${G}/${e.img}">
                    </div>
                </div>`;
            });
            html+=`</div>`;
        }
        
        // Boss on the RIGHT (back)
        const bossIdx = allEnemies.indexOf(boss);
        const hpPct = (boss.hp/boss.maxHp)*100;
        const chipPct = ((boss.chipHp!==undefined?boss.chipHp:boss.hp)/boss.maxHp)*100;
        
        html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${bossIdx}" onclick="${isTargeting?`selectTarget(${bossIdx})`:''}">
            <div class="enemy-hp-float">
                <div class="enemy-name">${boss.name} <span style="font-size:.55rem;color:#777">Lv${boss.lv}</span></div>
                <div class="enemy-hp-bar" id="enemyHpBar${bossIdx}">
                    <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                    <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                </div>
            </div>
            <div class="enemy-frame ${sizeClass}" id="enemyImg${bossIdx}">
                <img src="${G}/${boss.img}">
            </div>
        </div>`;
    } else {
        // No boss (wild encounter OR boss died with minions remaining)
        // Use remainingEnemies which includes minions when boss is dead
        const enemyCount = remainingEnemies.length;
        const numEnemyCols = enemyCount <= 2 ? 1 : enemyCount <= 4 ? 2 : 3;
        
        // Distribute into columns
        const enemyColumns = [[],[],[]];
        remainingEnemies.forEach((e, i) => {
            const colIdx = i % numEnemyCols;
            enemyColumns[colIdx].push({...e, idx: allEnemies.indexOf(e)});
        });
        
        // Render columns (in reverse order so first column is rightmost)
        for(let colIdx = numEnemyCols - 1; colIdx >= 0; colIdx--){
            const col = enemyColumns[colIdx];
            if(col.length === 0) continue;
            
            const colClass = colIdx === 0 ? '' : colIdx === 1 ? ' col-2' : ' col-3';
            html+=`<div class="enemy-column${colClass}">`;
            
            col.forEach(e => {
                const hpPct = (e.hp/e.maxHp)*100;
                const chipPct = ((e.chipHp!==undefined?e.chipHp:e.hp)/e.maxHp)*100;
                const frameClass = e.isMinion ? 'wild-small' : wildSizeClass;
                
                html+=`<div class="enemy-unit${isTargeting?' targetable':''}" id="enemy${e.idx}" onclick="${isTargeting?`selectTarget(${e.idx})`:''}">
                    <div class="enemy-hp-float">
                        <div class="enemy-name">${e.name} <span style="font-size:.5rem;color:#777">Lv${e.lv}</span></div>
                        <div class="enemy-hp-bar" id="enemyHpBar${e.idx}">
                            <div class="enemy-hp-chip" style="width:${chipPct}%"></div>
                            <div class="enemy-hp-fill" style="width:${hpPct}%"></div>
                        </div>
                    </div>
                    <div class="enemy-frame ${frameClass}" id="enemyImg${e.idx}">
                        <img src="${G}/${e.img}">
                    </div>
                </div>`;
            });
            html+=`</div>`;
        }
    }
    
    html+=`</div></div>`; // End enemy-arena and battle-arena
    
    // ============================================
    // V46: NEW COMBAT UI ONLY - Old UI completely removed
    // ============================================
    
    // Battle Log (bottom-left corner)
    html+=`<div class="battle-log" id="battleLog" style="position:absolute;bottom:20px;left:20px;max-width:400px;z-index:50;background:rgba(0,0,0,.85);padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15)">
        ${state.log.slice(-5).map(e=>`<div class="log-entry log-${e.t}">${e.m}</div>`).join('')}
    </div>`;
    
    
    // ============================================
    // MOVE BUTTONS - Now at absolute bottom (no party HUD)
    // ============================================
    if(activeMember && isPlayer){
        html+=`<div class="move-buttons-container">`;
        
        let atkName='Attack', defName='Defend', healName='Heal', specName='Special';
        let atkCost=0, defCost=0, healCost=0, specCost=0;
        const atkMove = getMove(activeMember.cid, activeMember.lv, 'atk');
        const defMove = getMove(activeMember.cid, activeMember.lv, 'def');
        const healMove = getMove(activeMember.cid, activeMember.lv, 'heal');
        const specMove = getMove(activeMember.cid, activeMember.lv, 'spec');
        if(atkMove){ atkName = atkMove.n; atkCost = atkMove.f || 0; }
        if(defMove){ defName = defMove.n; defCost = defMove.f || 0; }
        if(healMove){ healName = healMove.n; healCost = healMove.f || 0; }
        if(specMove){ specName = specMove.n; specCost = specMove.f || 0; }
        
        const canAffordHeal = activeMember.focus >= healCost;
        const canAffordSpec = activeMember.focus >= specCost && activeMember.cooldown === 0;
        
        html+=`<button class="move-btn attack" ${buttonsDisabled?'disabled':''} onclick="doAction('atk')">
                <span class="move-name">⚔️ ${atkName}</span>
            </button>
            <button class="move-btn defend" ${buttonsDisabled?'disabled':''} onclick="doAction('def')">
                <span class="move-name">🛡️ ${defName}</span>
                <span class="move-cost">+5 FP</span>
            </button>`;
            
        if(hasHeal){
            html+=`<button class="move-btn heal" ${buttonsDisabled||!canAffordHeal?'disabled':''} onclick="doAction('heal')">
                <span class="move-name">💚 ${healName}</span>
                <span class="move-cost${!canAffordHeal?' insufficient':''}">${healCost} FP</span>
            </button>`;
        }
        
        if(hasSpec){
            html+=`<button class="move-btn special" ${buttonsDisabled||!canAffordSpec?'disabled':''} onclick="doAction('spec')">
                <span class="move-name">⚡ ${specName}${activeMember.cooldown>0?' ('+activeMember.cooldown+')':''}</span>
                <span class="move-cost${activeMember.focus<specCost?' insufficient':''}">${specCost} FP</span>
            </button>`;
        }
        
        // ITEMS BUTTON - Show usable items count
        const usableItems = getUsableBattleItems(activeMember);
        const itemCount = usableItems.length;
        html+=`<button class="move-btn items ${itemCount === 0 ? 'disabled' : ''}" ${buttonsDisabled || itemCount === 0 ? 'disabled' : ''} onclick="openBattleItems()">
            <span class="move-name">🎒 Items</span>
            <span class="move-cost">${itemCount} available</span>
        </button>`;
        
        html+=`</div>`; // End move-buttons-container
    }
    
    html+=`</div>`; // End battle-container
    m.innerHTML=html;
    
    const logEl = document.getElementById('battleLog');
    if(logEl) logEl.scrollTop = logEl.scrollHeight;
}

function doAction(a){
    if(!state.battle)return;
    
    // Safety check: if processing is stuck, reset it
    const cur=battleQueue[turnIdx];
    if(cur?.type==='player' && processing){
        console.warn('Processing flag stuck - resetting for player turn');
        processing = false;
    }
    
    const b=state.battle;
    if(cur?.type!=='player'){
        console.warn('doAction called but not player turn');
        return;
    }
    
    const m=b.team[cur.idx];
    if(!m||m.curHp<=0){turnIdx++;nextTurn();return}
    
    // Define activeIdx for animations - this is cur.idx
    const activeIdx = cur.idx;
    
    const c=CREATURES[m.cid];
    const el=document.getElementById('c'+cur.idx);
    m.def=false;
    
    // Clear any existing targeting modes when switching actions
    if(a !== 'heal'){
        b.healTargetingMode = false;
        b.healerIdx = null;
        b.healAmount = null;
    }
    
    // For attack and special, check if multiple enemies - need target selection
    const aliveEnemies = b.enemies.filter(e => e.hp > 0);
    
    // Only enter targeting mode if multiple enemies AND no target selected yet
    if((a==='atk' || a==='spec') && aliveEnemies.length > 1 && b.selectedTarget === undefined){
        // Enter targeting mode
        b.targetingMode = a;
        processing = false;
        renderMain();
        return;
    }
    
    // SAFETY: If we have a selected target OR only one enemy, we should proceed
    // Reset processing to allow action to go through
    if(b.selectedTarget !== undefined || aliveEnemies.length === 1){
        processing = false;
    }
    
    if(processing) return;
    processing = true;
    
    // Get target (selected or first alive enemy)
    let targetIdx = 0;
    if(b.selectedTarget !== undefined && b.selectedTarget !== null){
        targetIdx = b.selectedTarget;
    } else {
        targetIdx = b.enemies.findIndex(e => e.hp > 0);
    }
    
    // CRITICAL: Validate target exists
    if(targetIdx < 0 || !b.enemies[targetIdx]){
        console.error('No valid target found, ending battle');
        processing = false;
        setTimeout(() => endBattle(true), 100);
        return;
    }
    
    const targetEnemy = b.enemies[targetIdx];
    
    // CRITICAL: Double-check target is alive
    if(targetEnemy.hp <= 0){
        console.error('Target is dead, skipping turn');
        processing = false;
        turnIdx++;
        renderMain();
        setTimeout(nextTurn, 300);
        return;
    }
    
    b.selectedTarget = undefined;
    b.targetingMode = false;
    
    if(a==='atk'){
        const mv=getMove(m.cid,m.lv,'atk');
        const moveName = mv?.n || 'Attack';
        const element = mv?.e || CREATURES[m.cid]?.type?.toLowerCase() || 'default';
        
        // Base damage: ATK * move power - enemy DEF reduction
        let baseDmg = m.st.atk * (mv?.p || 1);
        let defReduction = targetEnemy.def * 0.3;
        let d = Math.max(5, baseDmg - defReduction);
        d = Math.floor(d * (.9 + Math.random() * .2));
        
        // BALANCED CRIT: 5% base + 0.1% per level (max ~10% at lv50)
        const critChance = Math.min(0.10, 0.05 + (m.lv * 0.001));
        const isCrit = Math.random() < critChance;
        if(isCrit) d = Math.floor(d * 1.5);
        
        // Show action banner
        showActionBanner(m.name||'Hero', moveName, d, 'attack', isCrit);
        
        // ATTACKER WINDUP + DASH ANIMATION
        const arenaCreature = document.getElementById('arenaC'+activeIdx);
        if(arenaCreature){
            arenaCreature.classList.add('anim-windup');
            setTimeout(()=>{
                arenaCreature.classList.remove('anim-windup');
                arenaCreature.classList.add('anim-dash-right');
                setTimeout(()=>arenaCreature.classList.remove('anim-dash-right'),250);
            }, 150);
        }
        
        const enemyEl = document.getElementById('enemyImg'+targetIdx);
        
        // Fire projectile for ranged-looking attacks
        setTimeout(()=>{
            fireProjectile(arenaCreature, enemyEl, element, ()=>{
                playSound(isCrit ? 'crit' : 'hit');
                
                // Store chip HP for delayed drain effect
                targetEnemy.chipHp = targetEnemy.hp;
                targetEnemy.hp = Math.max(0, targetEnemy.hp - d);
                
                // Show impact effect
                showImpactEffect(enemyEl, isCrit, element);
                showSlashEffect(enemyEl, isCrit);
                
                // TARGET SHAKE ANIMATION
                if(enemyEl){
                    enemyEl.classList.add(isCrit ? 'anim-crit-shake' : 'anim-hit-shake');
                    enemyEl.classList.add('anim-hit-flash');
                    setTimeout(()=>{
                        enemyEl.classList.remove('anim-hit-shake','anim-crit-shake','anim-hit-flash');
                    },300);
                }
                
                // HP BAR DAMAGE FLASH + UPDATE
                const hpBar = document.getElementById('enemyHpBar'+targetIdx);
                if(hpBar){
                    // Update HP bar width immediately
                    const hpFill = hpBar.querySelector('.enemy-hp-fill');
                    const chipFill = hpBar.querySelector('.enemy-hp-chip');
                    if(hpFill){
                        const newPct = (targetEnemy.hp / targetEnemy.maxHp) * 100;
                        hpFill.style.width = newPct + '%';
                    }
                    if(chipFill){
                        const chipPct = (targetEnemy.chipHp / targetEnemy.maxHp) * 100;
                        chipFill.style.width = chipPct + '%';
                    }
                    // Add damage flash animation
                    hpBar.classList.add('anim-damage');
                    setTimeout(()=>hpBar.classList.remove('anim-damage'),300);
                }
                
                // CRIT FLASH - white screen flash on any crit
                if(isCrit){
                    const flashDiv = document.createElement('div');
                    flashDiv.className = 'crit-flash';
                    document.body.appendChild(flashDiv);
                    setTimeout(()=>flashDiv.remove(), 300);
                }
                
                // SCREEN SHAKE only on VERY big hits
                if(isCrit && d > 100){
                    const arena = document.getElementById('battleArena');
                    if(arena){
                        arena.classList.add('screen-shake');
                        setTimeout(()=>arena.classList.remove('screen-shake'),300);
                    }
                }
                
                // FLOATING DAMAGE NUMBER
                showFloatingDamage(enemyEl, d, isCrit ? 'crit' : 'damage');
                
                // Add to battle log
                addLog(`${m.name||'Hero'} used ${moveName}! ${d} damage${isCrit?' (CRIT!)':''}`, 'dmg');
                
                // CRITICAL: Clear processing flag BEFORE checking for summon
                processing = false;
                
                // Check if boss should summon minions (at 40% HP)
                // This may set processing = true if summon happens
                checkBossMinionSummon();
                
                // CRITICAL: Only advance turn if NOT processing (e.g., summon animation started)
                // If processing is true, the summon callback will call nextTurn()
                if(!processing){
                    turnIdx++;
                    renderMain();
                    setTimeout(nextTurn, 500);
                }
            });
        }, 200);
        
    }else if(a==='def'){
        const mv=getMove(m.cid,m.lv,'def');
        const moveName = mv?.n || 'Defend';
        m.def=true;
        
        // Show action banner
        showActionBanner(m.name||'Hero', moveName, 0, 'defend');
        
        // Add to battle log
        addLog(`${m.name||'Hero'} used ${moveName}!`, 'def');
        
        if(el){
            el.classList.add('anim-defend');
            setTimeout(()=>el.classList.remove('anim-defend'),400);
        }
        
        // DEFEND gives +5 Focus bonus
        m.focus = Math.min(m.focusMax, m.focus + 5);
        addLog(`${m.name||'Hero'} braces and gains +5 Focus!`, 'def');
        
        turnIdx++;
        renderMain();
        setTimeout(nextTurn,400);
        
    }else if(a==='heal'){
        if(c.canHeal){
            const mv=getMove(m.cid,m.lv,'heal');
            if(mv){
                const healCost = mv.f || 0;
                // Check if enough focus
                if(m.focus < healCost){
                    addLog(`${m.name||'Hero'} doesn't have enough Focus! (Need ${healCost})`, 'dmg');
                    processing = false;
                    renderMain();
                    return;
                }
                processing = false; // Reset so heal targeting works
                showHealTargetSelection(cur.idx, mv);
                return;
            }
        }
        // Can't heal - do attack instead
        processing = false;
        doAction('atk');
        return;
        
    }else if(a==='spec'){
        const mv=getMove(m.cid,m.lv,'spec');
        if(mv&&m.cooldown===0){
            const specCost = mv.f || 0;
            // Check if enough focus
            if(m.focus < specCost){
                addLog(`${m.name||'Hero'} doesn't have enough Focus! (Need ${specCost})`, 'dmg');
                processing = false;
                renderMain();
                return;
            }
            
            // SPEND FOCUS
            m.focus -= specCost;
            
            const moveName = mv.n || 'Special';
            const element = mv.e || CREATURES[m.cid]?.type?.toLowerCase() || 'fire';
            
            // Calculate damage first so we can show it
            // REBALANCED: Reduced from ATK×1.5 to ATK×1.2, capped bonus at 2.0
            let baseDmg = m.st.atk * 1.2; // Was 1.5 - too strong
            let bonusMult = Math.min(mv.p, 2.0); // Was 2.5 - capped lower
            let defReduction = targetEnemy.def * 0.25; // Was 0.2 - more DEF reduction
            let d = Math.floor((baseDmg * bonusMult - defReduction) * (.85 + Math.random() * .3));
            d = Math.max(10, d);
            
            // Show action banner
            showActionBanner(m.name||'Hero', moveName, d, 'special', true);
            
            // CHARGE UP animation
            const arenaCreature = document.getElementById('arenaC'+activeIdx);
            if(arenaCreature){
                arenaCreature.classList.add('anim-charge');
                setTimeout(()=>arenaCreature.classList.remove('anim-charge'), 500);
            }
            
            m.cooldown = 4;
            
            setTimeout(()=>{
                // SPECIAL DASH after charge
                if(arenaCreature){
                    arenaCreature.classList.add('anim-special-dash');
                    setTimeout(()=>arenaCreature.classList.remove('anim-special-dash'),350);
                }
                
                const enemyEl = document.getElementById('enemyImg'+targetIdx);
                
                // Fire BIG projectile
                fireProjectile(arenaCreature, enemyEl, element, ()=>{
                    playSound('crit');
                    
                    targetEnemy.chipHp = targetEnemy.hp;
                    targetEnemy.hp = Math.max(0, targetEnemy.hp - d);
                    
                    // BIG impact effect for specials
                    showImpactEffect(enemyEl, true, element);
                    showElementEffect(enemyEl, element);
                    
                    // Strong shake for specials
                    if(enemyEl){
                        enemyEl.classList.add('anim-crit-shake','anim-hit-flash');
                        setTimeout(()=>enemyEl.classList.remove('anim-crit-shake','anim-hit-flash'),350);
                    }
                    
                    // HP BAR UPDATE
                    const hpBar = document.getElementById('enemyHpBar'+targetIdx);
                    if(hpBar){
                        const hpFill = hpBar.querySelector('.enemy-hp-fill');
                        const chipFill = hpBar.querySelector('.enemy-hp-chip');
                        if(hpFill){
                            const newPct = (targetEnemy.hp / targetEnemy.maxHp) * 100;
                            hpFill.style.width = newPct + '%';
                        }
                        if(chipFill){
                            const chipPct = (targetEnemy.chipHp / targetEnemy.maxHp) * 100;
                            chipFill.style.width = chipPct + '%';
                        }
                        hpBar.classList.add('anim-damage');
                        setTimeout(()=>hpBar.classList.remove('anim-damage'),300);
                    }
                    
                    // Screen shake for big specials
                    if(d > 80){
                        const arena = document.getElementById('battleArena');
                        if(arena){
                            arena.classList.add('screen-shake');
                            setTimeout(()=>arena.classList.remove('screen-shake'),250);
                        }
                    }
                    
                    showFloatingDamage(enemyEl, d, 'crit');
                    
                    // Add to battle log
                    addLog(`⚡ ${m.name||'Hero'} used ${moveName}! ${d} damage!`, 'spec');
                    
                    // CRITICAL: Clear processing flag BEFORE checking for summon
                    processing = false;
                    
                    // Check if boss should summon minions (at 40% HP)
                    // This may set processing = true if summon happens
                    checkBossMinionSummon();
                    
                    // CRITICAL: Only advance turn if NOT processing (summon animation started)
                    if(!processing){
                        turnIdx++;
                        renderMain();
                        setTimeout(nextTurn, 500);
                    }
                });
            }, 500); // After charge animation
        }else{
            doAction('atk');
        }
    }
}

// Fire projectile from attacker to target
function fireProjectile(fromEl, toEl, element, onImpact){
    if(!fromEl || !toEl) {
        console.warn('fireProjectile: missing element', {fromEl, toEl});
        if(onImpact) onImpact();
        return;
    }
    
    const proj = document.createElement('div');
    proj.className = `projectile ${element || 'fire'}`;
    
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    
    // VALIDATE positions - if invalid, use fallback
    if(fromRect.width === 0 || fromRect.height === 0){
        console.error('fireProjectile: fromEl has no size', fromEl);
        if(onImpact) onImpact();
        return;
    }
    if(toRect.width === 0 || toRect.height === 0){
        console.error('fireProjectile: toEl has no size', toEl);
        if(onImpact) onImpact();
        return;
    }

    const startX = fromRect.left + fromRect.width/2;
    const startY = fromRect.top + fromRect.height/2;
    const endX = toRect.left + toRect.width/2;
    const endY = toRect.top + toRect.height/2;
    
    proj.style.left = startX + 'px';
    proj.style.top = startY + 'px';
    
    document.body.appendChild(proj);
    
    // Animate position
    const duration = 350;
    const startTime = performance.now();
    
    function animate(currentTime){
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Eased progress for smooth movement
        const eased = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        const currentX = startX + (endX - startX) * eased;
        const currentY = startY + (endY - startY) * eased;
        
        proj.style.left = currentX + 'px';
        proj.style.top = currentY + 'px';
        
        if(progress < 1){
            requestAnimationFrame(animate);
        } else {
            proj.remove();
            if(onImpact) onImpact();
        }
    }
    
    requestAnimationFrame(animate);
}

// Heal target selection system
function showHealTargetSelection(healerIdx, move){
    const b = state.battle;
    const healer = b.team[healerIdx];
    const healAmount = Math.floor(healer.maxHp * move.p);
    
    // Get allies who need healing (not full HP, not dead)
    const healableAllies = b.team.filter((t, i) => t.curHp > 0 && t.curHp < t.maxHp);
    
    if(healableAllies.length === 0){
        // No one needs healing, do attack instead
        addLog(`${healer.name||'Hero'}: No allies need healing!`,'info');
        doAction('atk');
        return;
    }
    
    // If only one ally needs healing, heal them automatically
    if(healableAllies.length === 1){
        const targetIdx = b.team.indexOf(healableAllies[0]);
        executeHeal(healerIdx, targetIdx, healAmount);
        return;
    }
    
    // Enter heal targeting mode - allies become clickable
    b.healTargetingMode = true;
    b.healerIdx = healerIdx;
    b.healAmount = healAmount;
    processing = false;
    renderMain();
}

// Select ally for healing (called when clicking party member during heal targeting)
function selectHealTarget(allyIdx){
    const b = state.battle;
    if(!b || !b.healTargetingMode) return;
    
    const target = b.team[allyIdx];
    if(!target || target.curHp <= 0 || target.curHp >= target.maxHp) return;
    
    const healerIdx = b.healerIdx;
    const healAmount = b.healAmount;
    b.healTargetingMode = false;
    b.healerIdx = null;
    b.healAmount = null;
    
    executeHeal(healerIdx, allyIdx, healAmount);
}

function executeHeal(healerIdx, targetIdx, healAmount){
    const b = state.battle;
    const healer = b.team[healerIdx];
    const target = b.team[targetIdx];
    const mv = getMove(healer.cid, healer.lv, 'heal');
    
    // SPEND FOCUS for heal
    const healCost = mv?.f || 0;
    healer.focus -= healCost;
    
    processing = true;
    
    // HEALER ANIMATION
    const healerEl = document.getElementById('c' + healerIdx);
    if(healerEl){
        healerEl.classList.add('anim-heal');
        setTimeout(()=>healerEl.classList.remove('anim-heal'),550);
    }
    playSound('heal');
    
    const actualHeal = Math.min(healAmount, target.maxHp - target.curHp);
    target.curHp = Math.min(target.maxHp, target.curHp + healAmount);
    
    // TARGET HEAL ANIMATION
    const targetFrameEl = document.getElementById('c' + targetIdx);
    const targetEl = document.getElementById('m' + targetIdx);
    if(targetFrameEl){
        targetFrameEl.classList.add('anim-heal');
        setTimeout(()=>targetFrameEl.classList.remove('anim-heal'),550);
    }
    
    // HP BAR HEAL FLASH
    const hpBar = document.getElementById('hpBar' + targetIdx);
    if(hpBar){
        hpBar.classList.add('anim-heal');
        setTimeout(()=>hpBar.classList.remove('anim-heal'),300);
    }
    
    // HEAL VISUAL EFFECT
    const arenaTarget = document.getElementById('arenaC' + targetIdx);
    if(arenaTarget) showHealEffect(arenaTarget);
    
    // FLOATING HEAL NUMBER
    if(targetEl) showFloatingDamage(targetEl, actualHeal, 'heal');
    
    addLog(`💚 ${healer.name||'Hero'}: ${mv?.n||'Heal'} → ${target.name||'Ally'} +${actualHeal} HP!`,'heal');
    turnIdx++;
    renderMain();
    setTimeout(nextTurn, 500);
}
