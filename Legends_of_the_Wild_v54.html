// Enemy heal action
function executeEnemyHeal(enemy, enemyIdx, target, enemyEl){
    const heal = enemy.healAttack;
    const healAmount = Math.floor(target.maxHp * heal.power);
    const actualHeal = Math.min(healAmount, target.maxHp - target.hp);

    // DEDUCT FOCUS COST (prevents heal spam)
    const healCost = heal.focusCost || 30;
    if(enemy.focus !== undefined){
        enemy.focus = Math.max(0, enemy.focus - healCost);
    }

    // Animation
    if(enemyEl){
        enemyEl.classList.add('anim-heal');
        setTimeout(()=>enemyEl.classList.remove('anim-heal'),550);
    }
    playSound('heal');

    target.hp = Math.min(target.maxHp, target.hp + healAmount);
    
    // v54.6: Show floating heal number on healed target (optimized - use enemyIdx if self-heal)
    const targetIdx = (target === enemy) ? enemyIdx : state.battle.enemies.indexOf(target);
    const healTargetEl = document.getElementById('enemyImg' + targetIdx);
    if(healTargetEl) showFloatingDamage(healTargetEl, actualHeal, 'heal');
    
    const selfHeal = target === enemy;
    addLog(`💚 ${enemy.name} used ${heal.name}!${selfHeal ? '' : ' Healed ' + target.name}`, 'heal');
    
    turnIdx++;
    processing = false; // CRITICAL: Clear before nextTurn
    renderMain();
    setTimeout(nextTurn, 600);
}

function endBattle(won){
    const b=state.battle;
    stopMusic(); // Stop battle music
    window.lastProcessingCheck = null; // Clean up processing watchdog

    // v54.4: HP PERSISTENCE - Save HP/Focus back to student objects
    // HP carries over between battles - no free healing!
    if(b && b.team){
        b.team.forEach(member => {
            const student = state.students.find(s => s.id === member.id);
            if(student){
                // Store current HP (even if 0 - they're knocked out)
                student.curHp = member.curHp;
                student.curFocus = member.focus;

                // v54.6: Decrement buff battle counters and remove expired buffs
                if(student.buffs && student.buffs.length > 0){
                    student.buffs = student.buffs.filter(buff => {
                        if(buff.battles !== undefined){
                            buff.battles--;
                            return buff.battles > 0;
                        }
                        return true; // Keep turn-based buffs (handled per-turn)
                    });
                }

                debugLog('COMBAT', `${student.name} exits battle | HP: ${student.curHp}/${member.maxHp} | Focus: ${student.curFocus}`);
            }
        });
    }

    // Calculate total rewards from all enemies
    const totalXP = b.enemies.reduce((sum, e) => sum + (e.xp || 0), 0);
    const totalCoins = b.enemies.reduce((sum, e) => sum + (e.coins || 0), 0);
    const enemyNames = b.enemies.map(e => e.name).join(', ');
    const primaryEnemy = b.enemy;

    if(won){
        playSound('victory');

        // Track level-ups for sequential display
        const levelUps = [];

        // Award XP and coins
        const activeStudents=getActiveStudents();

        // SPLIT COINS EQUALLY among party (prevents inflation with large parties)
        const coinShare = Math.floor(totalCoins / Math.max(1, activeStudents.length));

        activeStudents.forEach(s=>{
            const oL=getLv(s.xp);

            // Apply XP boost if active
            let xpGain = totalXP;
            if(s.xpBoostAdventures && s.xpBoostAdventures > 0){
                xpGain *= 2; // 2x multiplier from XP Booster item
                s.xpBoostAdventures--;
                addLog(`⭐ ${s.name} has 2x XP boost! (${s.xpBoostAdventures} adventures remaining)`, 'info');
            }

            // Apply coin boost if active (applies to their SHARE)
            let coinGain = coinShare;
            if(s.coinBoostAdventures && s.coinBoostAdventures > 0){
                coinGain = Math.floor(coinGain * 1.2); // 20% boost from Coin Magnet
                s.coinBoostAdventures--;
            }

            // Apply economy multiplier
            coinGain = Math.floor(coinGain * state.shopConfig.coinEconomyMultiplier);

            s.xp += xpGain;
            s.coins = (s.coins||0) + coinGain;
            state.totalXP += xpGain;
            const nL=getLv(s.xp);
            
            // Track level-up data
            if(nL>oL && s.cid){
                const oldStats = getStats(s.cid, oL, s.nature);
                const newStats = getStats(s.cid, nL, s.nature);
                const oE=getEvo(s.cid,oL);
                const nE=getEvo(s.cid,nL);

                // v54.1: Track discovery for bestiary
                discoverCreature(s.cid, nE);

                levelUps.push({
                    student: s,
                    oldLevel: oL,
                    newLevel: nL,
                    oldStats: oldStats,
                    newStats: newStats,
                    evolved: nE > oE,
                    oldEvo: oE,
                    newEvo: nE
                });
            }
        });
        
        // Sort level-ups: highest new level first, then by turn order
        levelUps.sort((a, b) => {
            if(b.newLevel !== a.newLevel) return b.newLevel - a.newLevel;
            // Same level - sort by position in active students (turn order)
            const aIdx = activeStudents.findIndex(s => s.id === a.student.id);
            const bIdx = activeStudents.findIndex(s => s.id === b.student.id);
            return aIdx - bIdx;
        });
        
        // Store for sequential display after victory overlay
        state.pendingLevelUps = levelUps;
        
        // Record boss defeats
        b.enemies.forEach(enemy => {
            if(enemy.isBoss && !state.defeated.includes(enemy.id)){
                state.defeated.push(enemy.id);
                addStoryLog(`🏆 VICTORY! ${enemy.name} has been defeated!`,'victory');
                
                // Special messages for Nightmare phases
                if(enemy.id && enemy.id.includes('nightmare')){
                    const phase = enemy.phase !== undefined ? enemy.phase : parseInt(enemy.id.split('_p')[1]);
                    const phaseMessages = {
                        0: "The Eternal Nightmare retreats... for now. Chapter 2 awaits!",
                        1: "The Nightmare's tentacles recede. Chapter 3 is unlocked!",
                        2: "A thousand eyes close in defeat. Chapter 4 opens!",
                        3: "Reality stabilizes! The path to the Final Chapter is clear!",
                        4: "THE APOCALYPSE HAS BEEN AVERTED! But wait... something stirs..."
                    };
                    if(phaseMessages[phase]) addStoryLog(`🌟 ${phaseMessages[phase]}`,'chapter');
                }
                
                // Special message for Creator
                if(enemy.isCreator){
                    addStoryLog("👑 INCREDIBLE! You have defeated THE CREATOR! The ultimate victory is yours!", 'chapter');
                }
            }
        });
        
        if(!primaryEnemy.isBoss){
            const count = b.enemies.length;
            addStoryLog(`✅ The team defeated ${count > 1 ? count + ' enemies' : 'the wild ' + primaryEnemy.name}!`,'victory');
        }
        
        showVictoryOverlay(primaryEnemy, totalXP, totalCoins, b.enemies.length);
        
    }else{
        playSound('defeat');
        
        // Lose some coins
        getActiveStudents().forEach(s=>{
            s.coins=Math.max(0,(s.coins||0)-10);
        });
        
        state.challengeLocked=true;
        addStoryLog(`💀 The team was defeated by ${enemyNames}... They must regroup!`,'battle');
        
        showDefeatOverlay(primaryEnemy);
    }
    
    state.battle=null;
    save();
}

function showVictoryOverlay(enemy, totalXP, totalCoins, enemyCount){
    const extraText = enemyCount > 1 ? `<p style="color:#aaa;font-size:.9rem">${enemyCount} enemies defeated!</p>` : '';
    document.querySelector('#victoryOverlay .overlay-content').innerHTML=`
        <h1 class="victory-text">VICTORY!</h1>
        <p class="overlay-msg">${enemy.name}${enemyCount > 1 ? ' and allies' : ''} defeated!</p>
        ${extraText}
        <p style="color:var(--gold)">+${totalXP} XP | +${totalCoins} 🪙 each!</p>
        <button class="btn btn-primary" style="margin-top:15px" onclick="closeVictory()">Continue</button>
    `;
    document.getElementById('victoryOverlay').classList.add('active');
}

function showDefeatOverlay(enemy){
    document.querySelector('#defeatOverlay .overlay-content').innerHTML=`
        <h1 class="defeat-text">DEFEATED</h1>
        <p class="overlay-msg">${enemy.name} was too strong...</p>
        <p style="color:var(--red)">-10 🪙 each. Complete a challenge to continue!</p>
        <button class="btn btn-primary" style="margin-top:15px" onclick="closeDefeat()">Continue</button>
    `;
    document.getElementById('defeatOverlay').classList.add('active');
}

function closeVictory(){
    closeOverlay('victory');
    
    // Check if there are pending level-ups to display
    if(state.pendingLevelUps && state.pendingLevelUps.length > 0){
        showNextLevelUp();
    } else {
        currentScreen='adventure';
        renderNav();
        renderMain();
    }
}

function showNextLevelUp(){
    // Close previous level-up overlay if it's open
    const overlay = document.getElementById('levelUpOverlay');
    if(overlay) overlay.classList.remove('active');
    
    if(!state.pendingLevelUps || state.pendingLevelUps.length === 0){
        // All level-ups shown, return to adventure
        state.pendingLevelUps = null;
        currentScreen='adventure';
        renderNav();
        renderMain();
        return;
    }
    
    // Get next level-up
    const levelUp = state.pendingLevelUps.shift();
    const s = levelUp.student;
    const c = CREATURES[s.cid];
    
    // If actually evolved, show full evolution sequence instead
    if(levelUp.evolved){
        showEvolutionSequence(s, levelUp.oldLevel, levelUp.newLevel);
        return; // Evolution sequence will call showNextLevelUp() when done
    }
    
    // Show normal level-up overlay (no evolution)
    const evoText = '';
    
    document.querySelector('#levelUpOverlay .overlay-content').innerHTML=`
        <div class="levelup-glow"></div>
        <div class="levelup-creature">
            <img src="${getImg(s.cid, levelUp.newLevel)}" style="width:180px;height:180px;object-fit:contain">
        </div>
        <h1 class="levelup-text">LEVEL UP!</h1>
        <p class="levelup-name">${s.name || c.names[levelUp.newEvo]}</p>
        <p class="levelup-level">Lv ${levelUp.oldLevel} → Lv ${levelUp.newLevel}</p>
        ${evoText}
        <div class="levelup-stats">
            <div class="stat-change">
                <span class="stat-label">HP</span>
                <span class="stat-old">${levelUp.oldStats.hp}</span>
                <span class="stat-arrow">→</span>
                <span class="stat-new">${levelUp.newStats.hp}</span>
            </div>
            <div class="stat-change">
                <span class="stat-label">ATK</span>
                <span class="stat-old">${levelUp.oldStats.atk}</span>
                <span class="stat-arrow">→</span>
                <span class="stat-new">${levelUp.newStats.atk}</span>
            </div>
            <div class="stat-change">
                <span class="stat-label">DEF</span>
                <span class="stat-old">${levelUp.oldStats.def}</span>
                <span class="stat-arrow">→</span>
                <span class="stat-new">${levelUp.newStats.def}</span>
            </div>
            <div class="stat-change">
                <span class="stat-label">SPD</span>
                <span class="stat-old">${levelUp.oldStats.spd}</span>
                <span class="stat-arrow">→</span>
                <span class="stat-new">${levelUp.newStats.spd}</span>
            </div>
        </div>
        <button class="btn btn-primary" style="margin-top:20px" onclick="showNextLevelUp()">Continue</button>
    `;
    
    document.getElementById('levelUpOverlay').classList.add('active');
    playSound('levelup');
}
function closeDefeat(){closeOverlay('defeat');currentScreen='adventure';renderNav();renderMain()}
function addLog(m,t=''){state.log.unshift({m,t});if(state.log.length>50)state.log.pop()}

// ============================================
// ANIMATION SYSTEM - Helper Functions
// ============================================

// Show XP or coin gain popup
function showGainPopup(amount, type='xp', x, y){
    const el = document.createElement('div');
    el.className = `gain-popup ${type}`;
    el.textContent = amount + (type==='xp' ? ' XP' : '');
    el.style.left = (x || window.innerWidth/2 - 50) + 'px';
    el.style.top = (y || window.innerHeight/2) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
}

// Show level up celebration
function showLevelUpCelebration(name, oldLv, newLv, oldStats, newStats){
    const overlay = document.createElement('div');
    overlay.className = 'levelup-overlay';
    overlay.id = 'levelupCelebration';
    
    overlay.innerHTML = `
        <div class="levelup-container">
            <div class="levelup-ring"></div>
            <div class="levelup-ring" style="animation-delay:.2s"></div>
            <div class="levelup-ring" style="animation-delay:.4s"></div>
            <div class="levelup-text">LEVEL UP!</div>
            <div class="levelup-level">${newLv}</div>
            <div style="color:#888;margin-top:10px">${name || 'Hero'}</div>
            <div class="levelup-stats">
                <div class="levelup-stat">
                    <div class="levelup-stat-label">HP</div>
                    <div class="levelup-stat-value">${newStats.hp - oldStats.hp}</div>
                </div>
                <div class="levelup-stat">
                    <div class="levelup-stat-label">ATK</div>
                    <div class="levelup-stat-value">${newStats.atk - oldStats.atk}</div>
                </div>
                <div class="levelup-stat">
                    <div class="levelup-stat-label">DEF</div>
                    <div class="levelup-stat-value">${newStats.def - oldStats.def}</div>
                </div>
                <div class="levelup-stat">
                    <div class="levelup-stat-label">SPD</div>
                    <div class="levelup-stat-value">${newStats.spd - oldStats.spd}</div>
                </div>
            </div>
        </div>
    `;
    
    document.body.appendChild(overlay);
    spawnConfetti();
    
    // Auto-close after 2.5s or on click
    overlay.onclick = () => overlay.remove();
    setTimeout(() => overlay.remove(), 2500);
}

// Spawn confetti particles
function spawnConfetti(){
    const container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);
    
    const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#9b59b6','#ff9ff3'];
    
    for(let i = 0; i < 50; i++){
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.animationDuration = (2 + Math.random()) + 's';
        container.appendChild(confetti);
    }
    
    setTimeout(() => container.remove(), 3500);
}

// Enhanced Evolution Sequence
function showEvolutionSequence(student, oldLv, newLv){
    const c = CREATURES[student.cid];
    const oldEvo = getEvo(student.cid, oldLv);
    const newEvo = getEvo(student.cid, newLv);
    const oldImg = getImg(student.cid, oldLv);
    const newImg = getImg(student.cid, newLv);
    const oldStats = getStats(student.cid, oldLv, student.nature);
    const newStats = getStats(student.cid, newLv, student.nature);
    
    // Get evolution names
    const oldName = c.names ? c.names[oldEvo] : c.name;
    const newName = c.names ? c.names[newEvo] : c.name;
    
    const overlay = document.createElement('div');
    overlay.className = 'evo-sequence';
    overlay.id = 'evoSequence';
    
    // Stage 1: Show old creature
    overlay.innerHTML = `
        <div class="evo-stage" id="evoStage">
            <div class="evo-old-creature" id="evoCreature">
                <img src="${oldImg}">
            </div>
            <div class="evo-particles" id="evoParticles"></div>
        </div>
    `;
    document.body.appendChild(overlay);
    
    // Stage 2: Glow and particles (after 1s)
    setTimeout(() => {
        const creature = document.getElementById('evoCreature');
        if(!creature) return;
        creature.innerHTML += '<div class="evo-glow"></div>';
        const img = creature.querySelector('img');
        if(img) img.classList.add('evo-morph');
        
        // Spawn particles
        const particles = document.getElementById('evoParticles');
        if(particles){
            for(let i = 0; i < 20; i++){
                const p = document.createElement('div');
                p.className = 'evo-particle';
                const angle = (i / 20) * Math.PI * 2;
                const dist = 100 + Math.random() * 100;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.animationDelay = Math.random() * 0.5 + 's';
                particles.appendChild(p);
            }
        }
    }, 1000);
    
    // Stage 3: Flash and reveal (after 2s)
    setTimeout(() => {
        overlay.innerHTML += '<div class="evo-flash"></div>';
        playSound('levelup');
    }, 2000);
    
    // Stage 4: Show new creature (after 2.5s)
    setTimeout(() => {
        const stage = document.getElementById('evoStage');
        if(!stage) return;
        stage.innerHTML = `
            <div class="evo-new-creature evo-reveal">
                <img src="${newImg}">
            </div>
            <div class="evo-title">EVOLVED!</div>
            <div class="evo-newname">${newName}</div>
            <div class="evo-stats-compare">
                <div class="evo-stat-box">
                    <div class="evo-stat-label">HP</div>
                    <span class="evo-stat-old">${oldStats.hp}</span>
                    <span class="evo-stat-arrow">→</span>
                    <span class="evo-stat-new">${newStats.hp}</span>
                </div>
                <div class="evo-stat-box">
                    <div class="evo-stat-label">ATK</div>
                    <span class="evo-stat-old">${oldStats.atk}</span>
                    <span class="evo-stat-arrow">→</span>
                    <span class="evo-stat-new">${newStats.atk}</span>
                </div>
                <div class="evo-stat-box">
                    <div class="evo-stat-label">DEF</div>
                    <span class="evo-stat-old">${oldStats.def}</span>
                    <span class="evo-stat-arrow">→</span>
                    <span class="evo-stat-new">${newStats.def}</span>
                </div>
            </div>
            <button class="btn btn-primary" style="margin-top:30px" onclick="closeEvolutionSequence()">Continue</button>
        `;
        spawnConfetti();
    }, 2500);
}

function closeEvolutionSequence(){
    const seq = document.getElementById('evoSequence');
    if(seq) seq.remove();
    
    // Check if there are more pending level-ups
    if(state.pendingLevelUps && state.pendingLevelUps.length > 0){
        showNextLevelUp(); // Continue showing remaining level-ups
    } else {
        // All done, return to adventure
        state.pendingLevelUps = null;
        if(state.battle){
            state.battle = null;
        }
        currentScreen = 'adventure';
        renderNav();
        renderMain();
    }
}

function showEvo(s,lv){
    const c=CREATURES[s.cid];
    const oldLv = lv - 1; // Approximate old level
    const oldEvo = getEvo(s.cid, oldLv);
    const newEvo = getEvo(s.cid, lv);
    
    // Use enhanced sequence if actually evolving
    if(newEvo > oldEvo){
        showEvolutionSequence(s, oldLv, lv);
        return;
    }
    
    // Fallback to simple overlay
    document.querySelector('#evoOverlay .overlay-content').innerHTML=`
        <div class="evo-creature"><img src="${getImg(s.cid,lv)}"></div>
        <h2 class="evo-text">${s.name||'Hero'}'s ${c.name} evolved!</h2>
        <p style="color:#aaa">Now at Evolution Stage ${getEvo(s.cid,lv)+1}!</p>
        <button class="btn btn-primary" style="margin-top:15px" onclick="closeOverlay('evo')">Continue</button>
    `;
    document.getElementById('evoOverlay').classList.add('active');
}

function closeOverlay(id){document.getElementById(id+'Overlay').classList.remove('active')}

// INTRO
function showIntro(){
    if(state.introSeen)return;
    
    document.querySelector('#introOverlay .overlay-content').innerHTML=`
        <div class="intro-creator"><img src="${G}/TheCreator/TheCreator.png"></div>
        <h2 class="intro-title">Mr. Gabe, The Creator</h2>
        <div class="intro-text">${STORY_INTRO.replace(/\n\n/g,'</p><p style="margin-top:10px">')}</div>
        <button class="btn btn-primary" onclick="startJourney()">Begin Your Journey</button>
    `;
    document.getElementById('introOverlay').classList.add('active');
}

function startJourney(){
    state.introSeen=true;
    addStoryLog("Mr. Gabe, The Creator, has called forth new Legends to face the coming darkness...",'chapter');
    addStoryLog(CHAPTERS[1].name+" - "+CHAPTERS[1].desc,'chapter');
    save();
    closeOverlay('intro');
    renderMain();
}

// SAVE/LOAD UI
function saveGame(){save();alert('✅ Game Saved!')}
function loadGame(){load();renderMain();alert('✅ Game Loaded!')}
function resetGame(){
    if(!confirm('⚠️ Reset ALL progress? This cannot be undone!'))return;
    state={students:[],activeIds:[],quests:{},totalXP:0,defeated:[],battle:null,log:[],storyLog:[],chapter:1,adventureCount:0,challengeLocked:false,introSeen:false};
    nextId=1;
    localStorage.removeItem('legendsWildV6');
    renderMain();
    alert('Game Reset!');
}

// INIT
document.addEventListener('DOMContentLoaded',()=>{
    load();
    renderNav();
    renderMain();
    
    // Show intro if first time
    if(!state.introSeen&&state.students.length===0){
        setTimeout(showIntro,500);
    }
    
    console.log('🎮 Legends of the Wild v6.0 - Adventure Update!');
});
