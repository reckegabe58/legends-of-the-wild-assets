    0%,100%{opacity:0.6}
    50%{opacity:1}
}
.levelup-creature{
    width:180px;
    height:180px;
    margin:0 auto 20px;
    animation:levelupBounce 0.8s ease-out;
}
@keyframes levelupBounce{
    0%{transform:scale(0.3) translateY(-50px);opacity:0}
    60%{transform:scale(1.2) translateY(0);opacity:1}
    100%{transform:scale(1) translateY(0);opacity:1}
}
.levelup-creature img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 30px rgba(232,184,74,.6));
}
.levelup-text{
    font-family:'Uncial Antiqua',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 0 40px var(--gold),0 0 20px var(--gold);
    margin:10px 0;
}
.levelup-name{
    font-family:'Fredoka One',cursive;
    font-size:1.3rem;
    color:var(--txt);
    margin:8px 0;
}
.levelup-level{
    font-family:'Cinzel',serif;
    font-size:1.1rem;
    color:var(--gold);
    margin:5px 0 20px;
}
.levelup-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin:25px 0;
}
.stat-change{
    background:rgba(0,0,0,.3);
    border:1px solid rgba(232,184,74,.3);
    border-radius:10px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.stat-label{
    font-family:'Cinzel',serif;
    font-size:0.75rem;
    color:var(--txt-muted);
    text-transform:uppercase;
    letter-spacing:1px;
    min-width:32px;
}
/* Color-coded stat labels */
.stat-change:nth-child(1) .stat-label{color:#4ade80} /* HP = Green */
.stat-change:nth-child(1) .stat-new{color:#4ade80}
.stat-change:nth-child(2) .stat-label{color:#f87171} /* ATK = Red */
.stat-change:nth-child(2) .stat-new{color:#f87171}
.stat-change:nth-child(3) .stat-label{color:#60a5fa} /* DEF = Blue */
.stat-change:nth-child(3) .stat-new{color:#60a5fa}
.stat-change:nth-child(4) .stat-label{color:#fbbf24} /* SPD = Yellow */
.stat-change:nth-child(4) .stat-new{color:#fbbf24}
.stat-old{
    font-size:0.9rem;
    color:var(--txt-dim);
}
.stat-arrow{
    font-size:0.8rem;
    color:var(--gold);
}
.stat-new{
    font-family:'Cinzel',serif;
    font-size:1rem;
    font-weight:700;
}

/* Large Intro Screen - Creator takes up 80% */
#introOverlay .overlay-content{
    width:90%;
    max-width:700px;
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    background:linear-gradient(180deg,rgba(30,25,45,.98) 0%,rgba(20,15,35,.98) 100%);
    border:3px solid var(--gold);
    box-shadow:0 0 60px rgba(255,200,50,.3),inset 0 0 100px rgba(255,200,50,.05)
}
.intro-creator{width:220px;height:220px;margin:0 auto 24px;filter:drop-shadow(0 0 50px rgba(255,200,50,.5))}
.intro-creator img{width:100%;height:100%;object-fit:contain;animation:floatCreator 3s infinite ease-in-out}
@keyframes floatCreator{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.intro-title{font-family:'Uncial Antiqua',cursive;font-size:2rem;color:var(--gold-lt);margin-bottom:16px;text-shadow:0 0 30px rgba(255,200,50,.5)}
.intro-text{font-size:1rem;line-height:1.8;color:var(--txt);margin-bottom:24px;max-width:550px}
.intro-text p{margin-bottom:12px}

@media(max-width:600px){
    .students-grid.s2,.students-grid.s3{grid-template-columns:1fr}
    .team-member{min-width:85px}
    .creature-name-hero{font-size:1.4rem}
}

/* ============================================
   LEVEL UP CELEBRATION
   ============================================ */
.levelup-overlay{
    position:fixed;inset:0;z-index:2000;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.85);
    animation:levelupFadeIn .3s ease-out;
}
@keyframes levelupFadeIn{from{opacity:0}to{opacity:1}}

.levelup-container{
    text-align:center;
    position:relative;
    animation:levelupBounce .6s cubic-bezier(.36,1.4,.6,1);
}
@keyframes levelupBounce{
    0%{transform:scale(0) rotate(-10deg)}
    50%{transform:scale(1.1) rotate(5deg)}
    100%{transform:scale(1) rotate(0)}
}

.levelup-ring{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:150px;height:150px;
    border:3px solid var(--gold);
    border-radius:50%;
    animation:ringExpand 1s ease-out forwards;
}
@keyframes ringExpand{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1}
    100%{transform:translate(-50%,-50%) scale(3);opacity:0}
}

.levelup-text{
    font-family:'Uncial Antiqua',cursive;
    font-size:2.5rem;
    color:var(--gold-lt);
    text-shadow:0 0 30px var(--gold),0 0 60px var(--gold);
    animation:levelupGlow 1s ease-in-out infinite alternate;
}
@keyframes levelupGlow{
    from{text-shadow:0 0 30px var(--gold),0 0 60px var(--gold)}
    to{text-shadow:0 0 50px var(--gold-lt),0 0 100px var(--gold)}
}

.levelup-level{
    font-family:'Fredoka One',sans-serif;
    font-size:4rem;
    color:#fff;
    text-shadow:0 0 40px rgba(255,255,255,.8);
    animation:levelPop .5s cubic-bezier(.36,1.4,.6,1) .3s both;
}
@keyframes levelPop{
    0%{transform:scale(0);opacity:0}
    100%{transform:scale(1);opacity:1}
}

/* Duplicate removed - using grid layout from line 2201 */

.levelup-stat{
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.3);
    border-radius:10px;padding:8px 16px;
}
.levelup-stat-label{font-size:.65rem;color:#888}
.levelup-stat-value{font-family:'Fredoka One',sans-serif;font-size:1.3rem;color:var(--green)}
.levelup-stat-value::before{content:'+';}

/* ============================================
   XP/COIN GAIN POPUPS
   ============================================ */
.gain-popup{
    position:fixed;
    font-family:'Fredoka One',sans-serif;
    font-size:1.4rem;
    padding:8px 16px;
    border-radius:20px;
    pointer-events:none;
    z-index:1500;
    animation:gainPopup 1.5s ease-out forwards;
}
.gain-popup.xp{
    background:linear-gradient(135deg,#9333ea,#7c3aed);
    color:#fff;
    box-shadow:0 4px 20px rgba(147,51,234,.5);
}
.gain-popup.coins{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:#fff;
    box-shadow:0 4px 20px rgba(245,158,11,.5);
}
.gain-popup.xp::before{content:'✨ +';}
.gain-popup.coins::before{content:'🪙 +';}

@keyframes gainPopup{
    0%{transform:translateY(0) scale(0.5);opacity:0}
    20%{transform:translateY(-10px) scale(1.1);opacity:1}
    80%{transform:translateY(-50px) scale(1);opacity:1}
    100%{transform:translateY(-80px) scale(0.8);opacity:0}
}

/* ============================================
   EVOLUTION SEQUENCE
   ============================================ */
.evo-sequence{
    position:fixed;inset:0;z-index:3000;
    display:flex;align-items:center;justify-content:center;
    background:#000;
}
.evo-stage{
    text-align:center;
    position:relative;
}
.evo-old-creature,.evo-new-creature{
    width:200px;height:200px;
    position:relative;
    margin:0 auto;
}
.evo-old-creature img,.evo-new-creature img{
    width:100%;height:100%;object-fit:contain;
}
.evo-glow{
    position:absolute;inset:-50px;
    background:radial-gradient(circle,rgba(255,255,255,.8) 0%,transparent 70%);
    animation:evoGlow 2s ease-in-out;
}
@keyframes evoGlow{
    0%{transform:scale(0);opacity:0}
    50%{transform:scale(1.5);opacity:1}
    100%{transform:scale(2);opacity:0}
}
.evo-particles{
    position:absolute;inset:-100px;
    pointer-events:none;
}
.evo-particle{
    position:absolute;
    width:8px;height:8px;
    background:var(--gold);
    border-radius:50%;
    animation:evoParticle 1.5s ease-out forwards;
}
@keyframes evoParticle{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.evo-flash{
    position:fixed;inset:0;
    background:#fff;
    animation:evoFlash .5s ease-out forwards;
    pointer-events:none;
}
@keyframes evoFlash{
    0%{opacity:1}
    100%{opacity:0}
}
.evo-morph{animation:evoMorph 1s ease-in-out}
@keyframes evoMorph{
    0%{filter:brightness(1) blur(0)}
    40%{filter:brightness(3) blur(10px);transform:scale(1.2)}
    60%{filter:brightness(5) blur(15px);transform:scale(0.8)}
    100%{filter:brightness(1) blur(0);transform:scale(1)}
}
.evo-reveal{animation:evoReveal .8s cubic-bezier(.36,1.4,.6,1)}
@keyframes evoReveal{
    0%{transform:scale(0) rotate(-180deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}
}
.evo-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 0 30px var(--gold);
    animation:evoTitle 1s ease-out .5s both;
}
@keyframes evoTitle{
    from{transform:translateY(30px);opacity:0}
    to{transform:translateY(0);opacity:1}
}
.evo-newname{
    font-family:'Fredoka One',sans-serif;
    font-size:1.8rem;
    color:#fff;
    margin-top:10px;
    animation:evoTitle 1s ease-out .7s both;
}
.evo-stats-compare{
    display:flex;justify-content:center;gap:25px;margin-top:25px;
    animation:evoTitle 1s ease-out .9s both;
}
.evo-stat-box{text-align:center}
.evo-stat-label{font-size:.75rem;color:#888}
.evo-stat-arrow{color:var(--green);margin:0 8px}
.evo-stat-old{color:#888;text-decoration:line-through}
.evo-stat-new{color:var(--green);font-weight:bold}

/* Confetti */
.confetti-container{
    position:fixed;inset:0;pointer-events:none;z-index:2500;overflow:hidden;
}
.confetti{
    position:absolute;
    width:10px;height:10px;
    animation:confettiFall 3s linear forwards;
}
@keyframes confettiFall{
    0%{transform:translateY(-100px) rotate(0deg);opacity:1}
    100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ============================================
   SCREEN TRANSITIONS
   ============================================ */
.screen-transition{
    animation:screenFadeIn .35s ease-out;
}
@keyframes screenFadeIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

/* Card stagger animation - only on initial load via class */
.card.animate-in{animation:cardAppear .4s ease-out both}
.students-grid.animate-cards .card:nth-child(1){animation-delay:.03s}
.students-grid.animate-cards .card:nth-child(2){animation-delay:.06s}
.students-grid.animate-cards .card:nth-child(3){animation-delay:.09s}
.students-grid.animate-cards .card:nth-child(4){animation-delay:.12s}
.students-grid.animate-cards .card:nth-child(5){animation-delay:.15s}
.students-grid.animate-cards .card:nth-child(6){animation-delay:.18s}

@keyframes cardAppear{
    from{opacity:0;transform:translateY(20px) scale(0.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* Battle enter animation - only on initial enter */
.battle-container.animate-in{animation:battleEnter .4s ease-out}
@keyframes battleEnter{
    from{opacity:0;transform:scale(0.97)}
    to{opacity:1;transform:scale(1)}
}

/* Stat icon images - Preserve natural aspect ratio */
.mini-stat .stat-icon-img{
    height:20px; /* Fixed height only */
    width:auto; /* Let width scale naturally */
    object-fit:contain;
    margin-right:4px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
    vertical-align:middle;
}


/* ============================================
   SHOP SYSTEM STYLES
   ============================================ */

.shop-container{
    max-width:1400px;
    margin:0 auto;
    padding:20px;
}

/* Shop Header */
.shop-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.4);
    padding:20px 30px;
    border-radius:15px;
    border:1px solid rgba(232,184,74,.3);
    margin-bottom:25px;
}

.shop-student-selector{
    display:flex;
    align-items:center;
    gap:12px;
}

.shop-student-selector label{
    font-family:'Cinzel',serif;
    color:var(--gold);
    font-size:1rem;
}

.shop-select{
    font-family:'Cinzel',serif;
    background:rgba(0,0,0,.6);
    color:var(--txt);
    border:2px solid rgba(232,184,74,.4);
    padding:10px 20px;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    transition:all .2s;
}

.shop-select:hover{
    border-color:var(--gold);
    box-shadow:0 0 15px rgba(232,184,74,.3);
}

.shop-coins{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(232,184,74,.1);
    padding:12px 25px;
    border-radius:12px;
    border:2px solid var(--gold);
}

.coin-icon{
    font-size:2rem;
}

.coin-amount{
    font-family:'Fredoka One',cursive;
    font-size:2rem;
    color:var(--gold-lt);
    text-shadow:0 2px 8px rgba(232,184,74,.6);
}

.coin-label{
    font-family:'Cinzel',serif;
    color:var(--gold);
    font-size:.9rem;
}

/* Category Tabs */
.shop-categories{
    display:flex;
    gap:12px;
    margin-bottom:25px;
    justify-content:center;
}

.shop-cat-btn{
    font-family:'Cinzel',serif;
    background:rgba(0,0,0,.5);
    color:var(--txt-muted);
    border:2px solid rgba(255,255,255,.2);
    padding:15px 30px;
    border-radius:12px;
    font-size:1rem;
    cursor:pointer;
    transition:all .2s;
}

.shop-cat-btn:hover{
    border-color:rgba(232,184,74,.5);
    color:var(--txt);
    transform:translateY(-2px);
}

.shop-cat-btn.active{
    background:linear-gradient(135deg,rgba(232,184,74,.2),rgba(212,168,75,.1));
    border-color:var(--gold);
    color:var(--gold-lt);
    box-shadow:0 0 20px rgba(232,184,74,.3);
}

/* Items Grid */
.shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:10px;
}

/* Item Card */
.shop-item-card{
    position:relative;
    background:linear-gradient(135deg,rgba(30,25,45,.95),rgba(20,15,35,.98));
    border:2px solid;
    border-radius:15px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:all .3s;
    cursor:default;
}

.shop-item-card:hover:not(.locked){
    transform:translateY(-5px);
    box-shadow:0 10px 30px currentColor !important;
}

.shop-item-card.locked{
    opacity:0.5;
    filter:grayscale(0.7);
}

/* Rarity Badge */
.shop-item-rarity{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 20px;
    border-radius:20px;
    font-family:'Cinzel',serif;
    font-size:.75rem;
    font-weight:700;
    color:#000;
    text-transform:uppercase;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
}

.shop-item-lock{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(0,0,0,.8);
    padding:6px 12px;
    border-radius:8px;
    font-size:.75rem;
    color:var(--txt-dim);
}

/* Item Content */
.shop-item-icon{
    font-size:4rem;
    margin:10px 0 15px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
}

.shop-item-name{
    font-family:'Fredoka One',cursive;
    font-size:1.2rem;
    color:var(--txt);
    text-align:center;
    margin-bottom:8px;
}

.shop-item-desc{
    font-size:.85rem;
    color:var(--txt-muted);
    text-align:center;
    margin-bottom:15px;
    min-height:40px;
    line-height:1.4;
}

/* Classroom Reward Progress */
.shop-classroom-progress{
    width:100%;
    margin-bottom:15px;
}

.shop-progress-bar{
    width:100%;
    height:12px;
    background:rgba(0,0,0,.5);
    border-radius:6px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    margin-bottom:8px;
}

.shop-progress-fill{
    height:100%;
    background:linear-gradient(90deg,#4ade80,#22c55e);
    border-radius:6px;
    transition:width .5s ease;
    box-shadow:0 0 10px rgba(74,222,128,.5);
}

.shop-progress-text{
    font-size:.85rem;
    color:var(--gold);
    text-align:center;
    font-family:'Cinzel',serif;
}

.shop-contributors{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:8px;
}

.shop-contributors span{
    width:28px;
    height:28px;
    background:rgba(232,184,74,.2);
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cinzel',serif;
    font-size:.75rem;
    color:var(--gold-lt);
    font-weight:700;
}

/* Price */
.shop-item-price{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:15px;
}

.price-amount{
    font-family:'Fredoka One',cursive;
    font-size:1.5rem;
    color:var(--gold-lt);
}

.price-coin{
    font-size:1.8rem;
}

/* Buy Button */
.shop-buy-btn{
    width:100%;
    font-family:'Cinzel',serif;
    font-size:1rem;
    padding:12px 24px;
    background:linear-gradient(135deg,var(--gold),var(--gold-lt));
    color:#000;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    transition:all .2s;
    box-shadow:0 4px 15px rgba(232,184,74,.3);
}

.shop-buy-btn:hover:not(.disabled){
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(232,184,74,.5);
    background:linear-gradient(135deg,var(--gold-lt),var(--gold));
}

.shop-buy-btn.disabled{
    background:rgba(100,100,100,.4);
    color:rgba(255,255,255,.3);
    cursor:not-allowed;
    box-shadow:none;
}

/* Toast notification */
.toast{
    position:fixed;
    top:80px;
    right:20px;
    background:rgba(0,0,0,.95);
    border:2px solid;
    padding:15px 25px;
    border-radius:12px;
    font-family:'Cinzel',serif;
    font-size:1rem;
    z-index:10000;
    animation:toastSlide .3s ease-out;
    box-shadow:0 8px 30px rgba(0,0,0,.8);
}

@keyframes toastSlide{
    from{transform:translateX(400px);opacity:0}
    to{transform:translateX(0);opacity:1}
}

.toast.success{
    border-color:#4ade80;
    color:#4ade80;
}

.toast.error{
    border-color:#f87171;
    color:#f87171;
}

/* ============================================
   INVENTORY SYSTEM STYLES
   ============================================ */

/* Inventory Button on Cards */
.inventory-btn{
    font-family:'Cinzel',serif;
    background:rgba(232,184,74,.15);
    color:var(--gold);
    border:2px solid rgba(232,184,74,.4);
    padding:10px 16px;
    border-radius:10px;
    font-size:.9rem;
    cursor:pointer;
    transition:all .2s;
    font-weight:600;
}

.inventory-btn:hover{
    background:rgba(232,184,74,.25);
    border-color:var(--gold);
    transform:translateY(-2px);
    box-shadow:0 4px 15px rgba(232,184,74,.3);
}

/* Inventory Modal Overlay */
.inventory-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10000;
    animation:fadeIn .2s ease-out;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.inventory-modal{
    background:linear-gradient(135deg,rgba(30,25,45,.98),rgba(20,15,35,.98));
    border:2px solid var(--gold);
    border-radius:20px;
    max-width:900px;
    width:90vw;
    max-height:80vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.9);
    animation:modalSlide .3s ease-out;
}

@keyframes modalSlide{
    from{transform:translateY(-50px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

.inventory-header{
    display:flex;

<body>
<div class="page-glow"></div>
<header class="header"><h1 class="title">Legends of the Wild</h1></header>
<nav class="nav" id="navBar"></nav>
<main class="main" id="mainContent"></main>

<!-- Overlays -->
<div class="overlay" id="introOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="victoryOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="defeatOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="evoOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="levelUpOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="eventOverlay"><div class="overlay-content"></div></div>
<div class="overlay" id="attendanceOverlay"><div class="overlay-content"></div></div>
<script>
const G='https://raw.githubusercontent.com/reckegabe58/legends-of-the-wild-assets/main';

// Aura colors by type
const AURA={Shadow:'#6b2d6b',Dark:'#4a1a4a',Fire:'#ff4500',Water:'#1e90ff',Ice:'#70d4e8',Nature:'#228b22',Earth:'#8b4513',Lightning:'#ffd700',Light:'#fffacd',Cosmic:'#9400d3',Void:'#4b0082',Psychic:'#ff69b4',Metal:'#708090',Poison:'#9acd32',Air:'#87ceeb',Wind:'#87ceeb',Bug:'#9acd32',Spirit:'#ff8c00',Ancient:'#daa520',Holy:'#fff8dc',Chaos:'#ff1493',Sound:'#00ced1'};
function getAura(t){return AURA[t.split('/')[0]]||'#6b4c9a'}

// Audio
let audioCtx=null;
let currentMusic=null;
let musicGain=null;
let musicType=null;

function initAudio(){
    if(!audioCtx){
        try{
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            musicGain=audioCtx.createGain();
            musicGain.connect(audioCtx.destination);
            musicGain.gain.value=0.15; // Music volume
        }catch(e){}
    }
}

// Sound effects
function playSound(type){
    try{initAudio();if(!audioCtx)return;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);gain.gain.value=0.1;
    if(type==='hit'){osc.frequency.value=150;osc.type='square';osc.start();osc.stop(audioCtx.currentTime+.08)}
    else if(type==='crit'){osc.frequency.value=220;osc.type='sawtooth';osc.start();setTimeout(()=>osc.frequency.value=330,40);setTimeout(()=>osc.frequency.value=440,80);osc.stop(audioCtx.currentTime+.15)}
    else if(type==='heal'){osc.frequency.value=523;osc.type='sine';osc.start();osc.stop(audioCtx.currentTime+.25)}
    else if(type==='coin'){osc.frequency.value=880;osc.type='sine';osc.start();setTimeout(()=>osc.frequency.value=1046,50);osc.stop(audioCtx.currentTime+.12)}
    else if(type==='levelup'){osc.frequency.value=400;osc.type='triangle';osc.start();setTimeout(()=>osc.frequency.value=600,100);osc.stop(audioCtx.currentTime+.3)}
    else if(type==='victory'){osc.frequency.value=523;osc.type='triangle';osc.start();setTimeout(()=>osc.frequency.value=659,100);setTimeout(()=>osc.frequency.value=784,200);osc.stop(audioCtx.currentTime+.4)}
    else if(type==='defeat'){osc.frequency.value=200;osc.type='sawtooth';osc.start();setTimeout(()=>osc.frequency.value=100,200);osc.stop(audioCtx.currentTime+.4)}
    }catch(e){}}

// Music system - procedural chiptune-style music
function playMusic(type){
    if(musicType===type)return; // Already playing
    initAudio();
    if(!audioCtx)return;
    
    stopMusic();
    musicType=type;
    
    const tempo = type==='boss' ? 140 : type==='battle' ? 120 : type==='adventure' ? 100 : 90;
    const beatLen = 60/tempo;
    
    // Note frequencies (C4 to B5)
    const notes={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,B5:988};
    
    // Different melodies for different contexts
    const melodies = {
        menu: ['E4','G4','C5','E5','D5','C5','G4','E4','F4','A4','C5','F5','E5','C5','A4','F4'],
        adventure: ['C5','E5','G5','E5','F5','D5','E5','C5','G4','C5','E5','G5','A5','G5','E5','C5'],
        battle: ['E4','E4','F4','G4','G4','F4','E4','D4','C4','C4','D4','E4','E4','D4','D4','E4'],
        boss: ['E4','E4','E4','C4','E4','G4','G4','G4','C5','B4','A4','G4','E4','C4','D4','E4']
    };
    
    // Bass patterns
    const bassPatterns = {
        menu: ['C3','G3','C3','G3','F3','C4','F3','C4'],
        adventure: ['C3','E3','G3','E3','F3','A3','G3','E3'],
        battle: ['C3','C3','G3','G3','A3','A3','G3','G3'],
        boss: ['C3','C3','C3','C3','A2','A2','B2','B2']
    };
    
    const melody = melodies[type] || melodies.menu;
    const bass = bassPatterns[type] || bassPatterns.menu;
    
    let noteIdx=0;
    let bassIdx=0;
    
    function playNote(freq,duration,wave='triangle',vol=0.12){
        if(!audioCtx||musicType!==type)return;
        const osc=audioCtx.createOscillator();
        const env=audioCtx.createGain();
        osc.connect(env);
        env.connect(musicGain);
        osc.type=wave;
        osc.frequency.value=freq;
        env.gain.setValueAtTime(vol,audioCtx.currentTime);
        env.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+duration*0.9);
        osc.start();
        osc.stop(audioCtx.currentTime+duration);
    }
    
    function musicLoop(){
        if(musicType!==type)return;
        
        // Play melody note
        const note=melody[noteIdx%melody.length];
        if(notes[note]) playNote(notes[note],beatLen*0.8,'triangle',type==='boss'?0.14:0.1);
        
        // Play bass on every 2nd beat
        if(noteIdx%2===0){
            const bassNote=bass[bassIdx%bass.length];
            const bassFreq=notes[bassNote]?notes[bassNote]/2:130;
            playNote(bassFreq,beatLen*1.5,'square',0.08);
            bassIdx++;
        }
        
        // Extra percussion for battle/boss
        if((type==='battle'||type==='boss')&&noteIdx%4===0){
            playNote(80,0.05,'square',0.06);
        }
        if(type==='boss'&&noteIdx%2===1){
            playNote(120,0.03,'sawtooth',0.04);
        }
        
        noteIdx++;
        currentMusic=setTimeout(musicLoop,beatLen*1000);
    }
    
    musicLoop();
}

function stopMusic(){
    if(currentMusic){
        clearTimeout(currentMusic);
        currentMusic=null;
    }
    musicType=null;
}

// Update music based on current screen
function updateMusic(){
    if(state.battle){
        const isBoss=state.battle.enemy?.isBoss;
        playMusic(isBoss?'boss':'battle');
    }else if(currentScreen==='adventure'){
        playMusic('adventure');
    }else{
        playMusic('menu');
    }
}

// ============================================
// PARTY SCALING SYSTEM - Adaptive Difficulty
// ============================================
// Scales enemy stats based on party size for balanced challenge
// Solo players get easier enemies, full classrooms get tougher encounters
function getPartyScaleFactor(){
    const partySize = getActiveStudents().filter(s=>s.cid).length;
    if(partySize <= 0) return 1.0; // Safety fallback
    
    // Base formula: PSF = partySize / 4
    // 1 student = 0.25, 4 students = 1.0, 8 students = 2.0, 11 students = 2.75
    return partySize / 4;
}

function scaleWildEnemy(baseHP, baseATK, baseDEF, baseSPD){
    const psf = getPartyScaleFactor();
    
    return {
        hp: Math.floor(baseHP * (0.7 + (psf * 0.5))),    // 70% solo → 100% at 4p → 150% at 8p
        atk: Math.floor(baseATK * (0.85 + (psf * 0.25))), // 85% solo → 110% at 4p → 135% at 8p
        def: Math.floor(baseDEF * (0.85 + (psf * 0.25))), // Same as ATK
        spd: Math.floor(baseSPD * (0.9 + (psf * 0.15)))   // 90% solo → 105% at 4p → 120% at 8p
    };
}

function scaleBoss(baseHP, baseATK, baseDEF, baseSPD){
    const psf = getPartyScaleFactor();
    
    return {
        hp: Math.floor(baseHP * (0.8 + (psf * 0.4))),     // 80% solo → 120% at 4p → 200% at 8p
        atk: Math.floor(baseATK * (0.9 + (psf * 0.2))),   // 90% solo → 110% at 4p → 130% at 8p
        def: Math.floor(baseDEF * (0.9 + (psf * 0.2))),   // Same as ATK
        spd: Math.floor(baseSPD * (0.95 + (psf * 0.1)))   // 95% solo → 105% at 4p → 115% at 8p
    };
}

function scaleBossMinion(baseHP, baseATK, baseDEF, baseSPD){
    const psf = getPartyScaleFactor();
    
    return {
        hp: Math.floor(baseHP * (0.75 + (psf * 0.35))),   // 75% solo → 110% at 4p → 145% at 8p
        atk: Math.floor(baseATK * (0.85 + (psf * 0.25))), // 85% solo → 110% at 4p → 135% at 8p
        def: Math.floor(baseDEF * (0.85 + (psf * 0.25))), // Same as ATK
        spd: Math.floor(baseSPD * (0.9 + (psf * 0.15)))   // 90% solo → 105% at 4p → 120% at 8p
    };
}

// UTILITY FUNCTIONS
function getLv(xp){for(let i=XP_TABLE.length-1;i>=0;i--)if(xp>=XP_TABLE[i])return i+1;return 1}
function getXPProg(xp){const l=getLv(xp);if(l>=50)return 100;return Math.min(100,((xp-XP_TABLE[l-1])/(XP_TABLE[l]-XP_TABLE[l-1]))*100)}
function getEvo(cid,lv){const c=CREATURES[cid];if(!c)return 0;let e=0;for(let i=0;i<c.evAt.length;i++)if(lv>=c.evAt[i])e=i+1;return e}
function getEvoClass(cid,lv){return 'evo'+(getEvo(cid,lv)+1)}
function getStats(cid,lv){const c=CREATURES[cid];if(!c)return{hp:100,atk:20,def:20,spd:20};const e=getEvo(cid,lv),b=1+(e*.15);return{hp:Math.floor((c.base.hp+c.grow.hp*(lv-1))*b),atk:Math.floor((c.base.atk+c.grow.atk*(lv-1))*b),def:Math.floor((c.base.def+c.grow.def*(lv-1))*b),spd:Math.floor((c.base.spd+c.grow.spd*(lv-1))*b)}}
function getImg(cid,lv){const c=CREATURES[cid];return c?G+'/Player_Creatures/'+c.imgs[getEvo(cid,lv)]:''}
function getMove(cid,lv,type){const c=CREATURES[cid];if(!c||!c.moves[type])return null;const a=c.moves[type].filter(m=>lv>=m.lv);return a.length?a[a.length-1]:null}
function getActiveStudents(){return state.students.filter(s=>state.activeIds.includes(s.id))}
function getAbsentStudents(){return state.students.filter(s=>!state.activeIds.includes(s.id))}
function getAvgLevel(){const active=getActiveStudents().filter(s=>s.cid);if(!active.length)return 1;return Math.floor(active.reduce((sum,s)=>sum+getLv(s.xp),0)/active.length)}
function getPartyPower(){const active=getActiveStudents().filter(s=>s.cid);if(!active.length)return 0;return active.reduce((sum,s)=>{const st=getStats(s.cid,getLv(s.xp));return sum+st.hp+st.atk+st.def+st.spd},0)}

// Boss fight eligibility - party power vs boss power
function canFightBoss(bid){
    const boss=BOSSES[bid];
    if(!boss) return false;
    const partyPower = getPartyPower();
    const avgLv = getAvgLevel();
    // Party needs at least 50% of boss level average and reasonable power
    const bossPower = boss.hp + boss.atk*5 + boss.def*3;
    return avgLv >= boss.lv * 0.5 && partyPower >= bossPower * 0.3;
}

// Check tier completion
function isTierComplete(tier){
    const tierBosses = tier === 1 ? TIER1_BOSSES : tier === 2 ? TIER2_BOSSES : tier === 3 ? TIER3_BOSSES : [];
    return tierBosses.every(bid => state.defeated.includes(bid));
}

// Check if nightmare phase is available
function canFightNightmarePhase(phase){
    if(phase === 0) return isTierComplete(1) && !state.defeated.includes('nightmare_p0');
    if(phase === 1) return isTierComplete(2) && state.defeated.includes('nightmare_p0') && !state.defeated.includes('nightmare_p1');
    if(phase === 2) return isTierComplete(3) && state.defeated.includes('nightmare_p1') && !state.defeated.includes('nightmare_p2');
    if(phase === 3) return state.defeated.includes('nightmare_p2') && !state.defeated.includes('nightmare_p3');
    if(phase === 4) return state.defeated.includes('nightmare_p3') && !state.defeated.includes('nightmare_p4');
    return false;
}

// Check if THE CREATOR is available (post-game)
function canFightCreator(){
    return state.defeated.includes('nightmare_p4') && !state.defeated.includes('the_creator');
}

// Chapter progression based on nightmare defeats
function getCurrentChapter(){
    if(state.defeated.includes('nightmare_p3')) return 5; // After Phase 3
    if(state.defeated.includes('nightmare_p2')) return 4; // After Phase 2
    if(state.defeated.includes('nightmare_p1')) return 3; // After Phase 1
    if(state.defeated.includes('nightmare_p0')) return 2; // After Phase 0
    return 1;
}

    const toast = document.createElement('div');

    document.body.appendChild(toast);
    
    setTimeout(() => {

    }, 3000);

function showErrorFeedback(elementId = null, message = '❌ Cannot do that!'){
    // Show toast
    showToast(message, 'error');
    
    // Screen shake
    const main = document.getElementById('mainContent');
    if(main){
        main.classList.add('error-shake');
        setTimeout(() => main.classList.remove('error-shake'), 400);
    }
    
    // Flash element if specified
    if(elementId){
        const element = document.getElementById(elementId);
        if(element){
            element.classList.add('error-flash');
            setTimeout(() => element.classList.remove('error-flash'), 400);
        }
    }
    
    // Error sound (use existing 'hit' sound as error)
    playSound('hit');
}

function flashElement(element, color = '#f87171'){
    if(!element) return;
    
    const originalBorder = element.style.border;
    const originalBoxShadow = element.style.boxShadow;
    
    element.style.border = `3px solid ${color}`;
    element.style.boxShadow = `0 0 20px ${color}`;
    element.classList.add('error-pulse');
    
    setTimeout(() => {
        element.style.border = originalBorder;
        element.style.boxShadow = originalBoxShadow;
        element.classList.remove('error-pulse');
    }, 400);
}

// Limited-time rotation system
function checkLimitedTimeRefresh(){
    const now = Date.now();
    
    // Initialize if never set
    if(!state.limitedTime.nextResetAt){
        initLimitedTimeRewards();
        return;
    }
    
    // Check if refresh needed
    if(now >= state.limitedTime.nextResetAt){
        refreshLimitedTimeRewards();
    }
}

function initLimitedTimeRewards(){
    // Set next reset to next Monday 9am
    const nextMonday = getNextMonday();
    state.limitedTime.nextResetAt = nextMonday.getTime();
    
    // Pick initial rewards
    refreshLimitedTimeRewards();
}

function refreshLimitedTimeRewards(){
    const currentChapter = getCurrentChapter();
    
    // Filter items by chapter
    const availableItems = SHOP_ITEMS.filter(i => 
        i.chapterMin <= currentChapter && 
        ['RARE', 'EPIC', 'LEGENDARY'].includes(i.rarity)
    );
    
    // Pick 3-5 random items
    const count = Math.min(5, Math.max(3, availableItems.length));
    const selected = [];
    const pool = [...availableItems];
    
    for(let i = 0; i < count && pool.length > 0; i++){
        const idx = Math.floor(Math.random() * pool.length);
        selected.push(pool[idx].id);
        pool.splice(idx, 1);
    }
    
    state.limitedTime.weeklyRewards = selected;
    
    // Set next reset
    const nextMonday = getNextMonday();
    state.limitedTime.nextResetAt = nextMonday.getTime();
    
    save();
}

function getNextMonday(){
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday, etc.
    const daysUntilMonday = dayOfWeek === 0 ? 1 : (8 - dayOfWeek);
    
    const nextMonday = new Date(now);
    nextMonday.setDate(now.getDate() + daysUntilMonday);
    nextMonday.setHours(9, 0, 0, 0); // 9:00 AM
    
    return nextMonday;
}

// Get remaining bosses for current tier
function getRemainingTierBosses(tier){
    const tierBosses = tier === 1 ? TIER1_BOSSES : tier === 2 ? TIER2_BOSSES : tier === 3 ? TIER3_BOSSES : [];
    return tierBosses.filter(bid => !state.defeated.includes(bid));
}

// Get available bosses for current chapter
function getAvailableBosses(){
    const ch = getCurrentChapter();
    const chData = CHAPTERS[ch];
    
    // Check for nightmare phase availability first
    for(let p = 0; p <= 4; p++){
        if(canFightNightmarePhase(p)) return [{id: `nightmare_p${p}`, ...BOSSES[`nightmare_p${p}`], isGate: true}];
    }
    
    // Check for Creator
    if(canFightCreator()) return [{id: 'the_creator', ...BOSSES.the_creator, isGate: true}];
    
    // Get tier bosses based on chapter
    let availableTier;
    if(ch === 1) availableTier = 1;
    else if(ch === 2) availableTier = 2;
    else if(ch === 3) availableTier = 3;
    else availableTier = 3; // Ch4+ can fight any tier
    
    // In chapter 4+, can fight bosses from multiple tiers (scaled)
    if(ch >= 4){
        const all = [...TIER1_BOSSES, ...TIER2_BOSSES, ...TIER3_BOSSES];
        return all.filter(bid => canFightBoss(bid)).map(bid => ({id: bid, ...BOSSES[bid]}));
    }
    
    const remaining = getRemainingTierBosses(availableTier);
    return remaining.filter(bid => canFightBoss(bid)).map(bid => ({id: bid, ...BOSSES[bid]}));
}

// SHOP SYSTEM MIGRATION - Initialize shop properties for old saves
function migrateShopSystem(){
    // Initialize state.shop if missing
    if(!state.shop){
        state.shop = {unlockedChapter: getCurrentChapter(), lastRefreshTs: Date.now()};
    }
    if(!state.shopConfig){
        state.shopConfig = {
            coinEconomyMultiplier: 1.0,
            realRewardPriceMultiplier: 1.0,
            chapterUnlocksEnabled: true,
            priceOverrides: {}
        };
    }
    if(!state.realRewardLog) state.realRewardLog = [];
    if(!state.shopLog) state.shopLog = [];
    if(!state.limitedTime){
        state.limitedTime = {nextResetAt: null, weeklyRewards: []};
    }
    if(!state.classroomRewards) state.classroomRewards = {};
    
    // Initialize student inventory/loadout for existing students
    state.students.forEach(s => {
        if(!s.inventory) s.inventory = {};
        if(!s.loadout) s.loadout = {charm: null, trinket: null};
        if(!s.coins) s.coins = 0;
        if(!s.xpBoostAdventures) s.xpBoostAdventures = 0;
        if(!s.coinBoostAdventures) s.coinBoostAdventures = 0;
    });
    
    // Initialize limited-time if never set
    if(!state.limitedTime.nextResetAt){
        initLimitedTimeRewards();
    }
}

let shopCategory = 'consumables'; // Track active category
let selectedStudent = null; // Track selected student for purchases

function renderShop(m){
    const active = getActiveStudents();
    if(!active.length){
        m.innerHTML = `<div class="no-students"><h3>No Active Students</h3><p>Add students in the Teacher panel first!</p></div>`;
        return;
    }
    
    // Auto-select first student if none selected
    if(!selectedStudent || !active.find(s => s.id === selectedStudent)){
        selectedStudent = active[0].id;
    }
    
    const student = state.students.find(s => s.id === selectedStudent);
    const currentChapter = getCurrentChapter();
    
    // Update shop chapter if needed
    if(state.shop.unlockedChapter < currentChapter){
        state.shop.unlockedChapter = currentChapter;
    }
    
    // Check if limited-time needs refresh
    checkLimitedTimeRefresh();
    
    let html = `
        <div class="shop-container">
            <h2 class="section-title">🛒 Arcane Shop</h2>
            
            <!-- Student Selector + Coin Display -->
            <div class="shop-header">
                <div class="shop-student-selector">
                    <label>Shopping for:</label>
                    <select onchange="selectShopStudent(this.value)" class="shop-select">
                        ${active.map(s => `<option value="${s.id}" ${s.id === selectedStudent ? 'selected' : ''}>${s.name || 'Student'}</option>`).join('')}
                    </select>
                </div>
                <div class="shop-coins">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-amount">${student.coins}</span>
                    <span class="coin-label">Coins</span>
                </div>
            </div>
            
            <!-- Category Tabs -->
            <div class="shop-categories">
                <button class="shop-cat-btn ${shopCategory === 'consumables' ? 'active' : ''}" onclick="selectShopCategory('consumables')">
                    ⚗️ Consumables
                </button>
                <button class="shop-cat-btn ${shopCategory === 'equipment' ? 'active' : ''}" onclick="selectShopCategory('equipment')">
                    🛡️ Equipment
                </button>
                <button class="shop-cat-btn ${shopCategory === 'real_rewards' ? 'active' : ''}" onclick="selectShopCategory('real_rewards')">
                    ⭐ Real Rewards
                </button>
                <button class="shop-cat-btn ${shopCategory === 'classroom' ? 'active' : ''}" onclick="selectShopCategory('classroom')">
                    🏫 Classroom
                </button>
            </div>
            
            <!-- Items Grid -->
            <div class="shop-grid">
    `;
    
    // Filter items by category
    let items = [];
    if(shopCategory === 'consumables'){
        items = SHOP_ITEMS.filter(i => i.type === 'consumable');
    } else if(shopCategory === 'equipment'){
        items = SHOP_ITEMS.filter(i => i.type === 'equipment');
    } else if(shopCategory === 'real_rewards'){
        items = REAL_REWARDS;
    } else if(shopCategory === 'classroom'){
        items = CLASSROOM_REWARDS;
    }
    
    // Render item cards
    items.forEach(item => {
        const rarity = RARITY[item.rarity];
        const locked = item.chapterMin > currentChapter;
        const canAfford = student.coins >= getItemPrice(item);
        const price = getItemPrice(item);
        
        // Check if classroom reward
        const isClassroom = item.type === 'classroom_reward';
        const contributions = state.classroomRewards[item.id]?.contributions || [];
        const totalRaised = contributions.reduce((sum, c) => sum + c.amount, 0);
        const progress = Math.min(100, (totalRaised / price) * 100);
        
        html += `
            <div class="shop-item-card ${locked ? 'locked' : ''}" style="border-color: ${rarity.color}; box-shadow: 0 0 15px ${rarity.glow};">
                <div class="shop-item-rarity" style="background: ${rarity.color};">${rarity.name}</div>
                ${locked ? '<div class="shop-item-lock">🔒 Ch.' + item.chapterMin + '</div>' : ''}

                <div class="shop-item-name">${item.name}</div>

                    <button class="shop-buy-btn ${canAfford ? '' : 'disabled'}" 
                        ${canAfford ? `onclick="buyItem('${item.id}')"` : `onclick="showErrorFeedback(null, '❌ Not enough coins! Need ${price - student.coins} more.')" disabled`}>

    html += `

// Shop helper functions
function selectShopStudent(studentId){
    selectedStudent = parseInt(studentId);
    renderMain();
}

function selectShopCategory(category){
    shopCategory = category;
    renderMain();
}

function getItemPrice(item){
    // Check for price overrides
    if(state.shopConfig.priceOverrides[item.id]){
        return state.shopConfig.priceOverrides[item.id];
    }
    
    // Apply multipliers
    let price = item.cost;
    if(item.type === 'real_reward'){
        price *= state.shopConfig.realRewardPriceMultiplier;
    }
    
    return Math.floor(price);
}

function buyItem(itemId){
    const student = state.students.find(s => s.id === selectedStudent);
    if(!student) return;
    
    // Find item in all catalogs
    const item = [...SHOP_ITEMS, ...REAL_REWARDS].find(i => i.id === itemId);
    if(!item) return;
    
    const price = getItemPrice(item);
    
    // Check affordability with visual feedback
    if(student.coins < price){
        showErrorFeedback(null, `❌ Not enough coins! Need ${price - student.coins} more.`);
        
        // Flash the coin display
        const coinDisplay = document.querySelector('.shop-coins');
        if(coinDisplay) flashElement(coinDisplay, '#f87171');
        
        return;
    }
    
    // Confirmation
    const confirmMsg = item.type === 'real_reward' ? 
        `Redeem "${item.name}" for ${price} coins?\n\nYou'll need to fulfill this reward manually.` :
        `Buy "${item.name}" for ${price} coins?`;
    
    if(!confirm(confirmMsg)) return;
    
    // Deduct coins
    student.coins -= price;
    
    // Add to inventory or log
    if(item.type === 'real_reward'){
        // Log real reward purchase
        state.realRewardLog.push({
            id: Date.now().toString(), // String for consistency
            studentId: student.id,
            studentName: student.name || 'Student',
            rewardId: item.id,
            rewardName: item.name,
            cost: price,
            timestamp: new Date().toLocaleString(),
            completed: false,
            notes: `Redeemed by: ${student.name || 'Student'}`
        });
        showToast(`✅ ${item.name} redeemed! Check Teacher panel to fulfill.`, 'success');
    } else {
        // Add to inventory
        student.inventory[itemId] = (student.inventory[itemId] || 0) + 1;
        showToast(`✅ Purchased ${item.name}!`, 'success');
        playSound('coin');
    }
    
    // Log purchase
    state.shopLog.push({
        timestamp: new Date().toLocaleString(),
        studentId: student.id,
        studentName: student.name || 'Student',
        itemId: item.id,
        itemName: item.name,
        cost: price,
        type: item.type
    });
    
    save();
    renderMain();
}

function contributeToClassroom(rewardId){
    const student = state.students.find(s => s.id === selectedStudent);
    if(!student) return;
    
    const reward = CLASSROOM_REWARDS.find(r => r.id === rewardId);
    if(!reward) return;
    
    const price = getItemPrice(reward);
    const currentContributions = state.classroomRewards[rewardId]?.contributions || [];
    const totalRaised = currentContributions.reduce((sum, c) => sum + c.amount, 0);
    const remaining = price - totalRaised;
    
    // Prompt for contribution amount
    const maxContrib = Math.min(student.coins, remaining);
    const amount = prompt(`Contribute to "${reward.name}"\n\nYou have: ${student.coins} 🪙\nStill needed: ${remaining} 🪙\n\nEnter amount (max ${maxContrib}):`);
    
    if(!amount || isNaN(amount)) return;
    const contrib = Math.min(maxContrib, Math.max(1, parseInt(amount)));
    
    if(contrib > student.coins){
        showErrorFeedback(null, `❌ Not enough coins! You only have ${student.coins}.`);
        
        const coinDisplay = document.querySelector('.shop-coins');
        if(coinDisplay) flashElement(coinDisplay, '#f87171');
        
        return;
    }
    
    // Deduct coins
    student.coins -= contrib;
    
    // Add contribution
    if(!state.classroomRewards[rewardId]){
        state.classroomRewards[rewardId] = {contributions: [], totalRaised: 0};
    }
    
    state.classroomRewards[rewardId].contributions.push({
        studentId: student.id,
        name: student.name || 'Student',
        amount: contrib,
        timestamp: new Date().toLocaleString()
    });
    
    state.classroomRewards[rewardId].totalRaised = (state.classroomRewards[rewardId].totalRaised || 0) + contrib;
    
    showToast(`✅ Contributed ${contrib} 🪙 to ${reward.name}!`, 'success');
    playSound('coin');
    
    // Check if fully funded
    const newTotal = currentContributions.reduce((sum, c) => sum + c.amount, 0) + contrib;
    if(newTotal >= price){
        showToast(`🎉 ${reward.name} is fully funded! Check Teacher panel to redeem.`, 'success');
    }
    
    save();
    renderMain();
}

function openInventory(studentId){
    const student = state.students.find(s => s.id === studentId);
    if(!student) return;
    
    const items = Object.entries(student.inventory || {})
        .filter(([id, qty]) => qty > 0)
        .map(([id, qty]) => {
            const item = [...SHOP_ITEMS, ...REAL_REWARDS].find(i => i.id === id);
            return {id, qty, item};
        })
        .filter(x => x.item); // Only show items that still exist in catalog
    
    let html = `
        <div class="inventory-overlay" onclick="closeInventory(event)">
            <div class="inventory-modal" onclick="event.stopPropagation()">
                <div class="inventory-header">
                    <h2>🎒 ${student.name || 'Student'}'s Inventory</h2>
                    <button class="inventory-close" onclick="closeInventory()">✕</button>
                </div>
                
                ${items.length === 0 ? `
                    <div class="inventory-empty">
                        <div style="font-size:4rem;margin-bottom:20px">📦</div>
                        <h3>Inventory Empty</h3>
                        <p>Visit the Shop to buy items!</p>
                    </div>
                ` : `
                    <div class="inventory-grid">
                        ${items.map(({id, qty, item}) => {
                            const rarity = RARITY[item.rarity];
                            const canUse = canUseItem(student, item);
                            
                            return `
                                <div class="inventory-item" style="border-color:${rarity.color}">
                                    <div class="inventory-item-qty">×${qty}</div>
                                    <div class="inventory-item-icon">${item.icon}</div>
                                    <div class="inventory-item-name">${item.name}</div>
                                    <div class="inventory-item-desc">${item.desc}</div>
                                    ${canUse ? `
                                        <button class="inventory-use-btn" onclick="useItem(${studentId}, '${id}')">
                                            Use
                                        </button>
                                    ` : `
                                        <div class="inventory-use-disabled">
                                            ${getUseRestriction(student, item)}
                                        </div>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `}
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeInventory(event){
    if(event && event.target.className !== 'inventory-overlay' && event.target.className !== 'inventory-close') return;
    const overlay = document.querySelector('.inventory-overlay');
    if(overlay) overlay.remove();
}

function canUseItem(student, item){
    // Real rewards can't be "used" - they're redeemed at purchase
    if(item.type === 'real_reward') return false;
    
    // Equipment must be equipped, not "used"
    if(item.type === 'equipment') return false;
    
    // Check if student has a creature
    if(!student.cid) return false;
    
    // Battle-only items (check if in battle)
    if(item.effect.type === 'revive') return true; // Revive works outside battle
    
    // All consumables can be used outside battle
    return true;
}

function getUseRestriction(student, item){
    if(item.type === 'real_reward') return 'Redeemed';
    if(item.type === 'equipment') return 'Equip in Battle';
    if(!student.cid) return 'Need Creature';
    return 'Cannot Use';
}

function useItem(studentId, itemId){
    const student = state.students.find(s => s.id === studentId);
    if(!student || !student.inventory[itemId]) return;
    
    const item = [...SHOP_ITEMS, ...REAL_REWARDS].find(i => i.id === itemId);
    if(!item) return;
    
    // Check if can use
    if(!canUseItem(student, item)){
        showErrorFeedback(null, '❌ Cannot use this item right now!');
        return;
    }
    
    // Apply item effect
    const success = applyItemEffect(student, item);
    
    if(success){
        // Consume item
        student.inventory[itemId]--;
        if(student.inventory[itemId] <= 0){
            delete student.inventory[itemId];
        }
        
        save();
        
        // Close and reopen inventory to refresh
        closeInventory();
        setTimeout(() => openInventory(studentId), 100);
        
        playSound('levelup'); // Use existing sound
    }
}

function applyItemEffect(student, item){
    const effect = item.effect;
    const lv = getLv(student.xp);
    const stats = getStats(student.cid, lv);
    
    // Create a temporary member object for effect application
    let tempMember = {
        name: student.name,
        cid: student.cid,
        lv: lv,
        maxHp: stats.hp,
        curHp: stats.hp, // Assume full HP outside battle
        focus: 50, // Assume some focus
        focusMax: 100,
        st: stats
    };
    
    switch(effect.type){
        case 'heal':
            const healAmount = Math.floor(tempMember.maxHp * effect.value);
            tempMember.curHp = Math.min(tempMember.maxHp, tempMember.curHp + healAmount);
            showToast(`✅ Healed ${student.name} for ${healAmount} HP!`, 'success');
            // Note: This doesn't persist outside battle, but that's OK - just a demo
            return true;
            
        case 'focus':
            tempMember.focus = Math.min(tempMember.focusMax, tempMember.focus + effect.value);
            showToast(`✅ Restored ${effect.value} Focus!`, 'success');
            return true;
            
        case 'heal_focus':
            const hpHeal = Math.floor(tempMember.maxHp * effect.hpPercent);
            tempMember.curHp = Math.min(tempMember.maxHp, tempMember.curHp + hpHeal);
            tempMember.focus = Math.min(tempMember.focusMax, tempMember.focus + effect.focus);
            showToast(`✅ Healed ${hpHeal} HP and ${effect.focus} Focus!`, 'success');
            return true;
            
        case 'revive':
            showToast('❌ Revive can only be used in battle on KO\'d allies!', 'error');
            return false;
            
        case 'level_up':
            // RARE CANDY - Force level up
            if(lv >= 50){
                showToast('❌ Already at max level!', 'error');
                return false;
            }
            
            // Set XP to start of next level
            const nextLevelXP = XP_TABLE[lv]; // XP_TABLE[lv] is the XP needed for level lv+1
            student.xp = nextLevelXP;
            
            showToast(`✨ ${student.name} leveled up to Level ${lv + 1}!`, 'success');
            playSound('victory');
            
            // Show level-up popup if function exists
            if(typeof showLevelUpPopup === 'function'){
                const oldStats = getStats(student.cid, lv);
                const newStats = getStats(student.cid, lv + 1);
                setTimeout(() => {
                    showLevelUpPopup(student, lv, lv + 1, oldStats, newStats);
                }, 500);
            }
            
            renderMain();
            return true;
            
        case 'xp_multiplier':
            student.xpBoostAdventures = effect.adventures;
            showToast(`✅ ${effect.value}x XP for next ${effect.adventures} adventures!`, 'success');
            return true;
            
        case 'coin_boost':
            student.coinBoostAdventures = effect.adventures;
            showToast(`✅ +20% coins for next ${effect.adventures} adventures!`, 'success');
            return true;
            
        case 'defend_buff':
        case 'crit_buff':
        case 'damage_buff':
        case 'party_shield':
        case 'focus_regen_buff':
            showToast('✅ Buff applied! Will take effect in next battle.', 'success');
            // TODO: Store buff on student for battle
            return true;
            
        default:
            showToast('Item effect not yet implemented!', 'error');
            return false;
    }
}

function getUsableBattleItems(member){
    if(!member || !member.id) return [];
    
    const student = state.students.find(s => s.id === member.id);
    if(!student || !student.inventory) return [];
    
    const b = state.battle;
    if(!b) return [];
    
    // Get items from inventory
    const items = Object.entries(student.inventory)
        .filter(([id, qty]) => qty > 0)
        .map(([id, qty]) => {
            const item = SHOP_ITEMS.find(i => i.id === id);
            return {id, qty, item};
        })
        .filter(x => x.item && x.item.type === 'consumable') // Only consumables in battle
        .filter(x => {
            // Filter by battle-usability
            const effect = x.item.effect.type;
            
            // Always usable in battle
            if(['heal', 'focus', 'heal_focus', 'defend_buff', 'crit_buff', 'damage_buff', 'party_shield', 'focus_regen_buff'].includes(effect)){
                return true;
            }
            
            // Revive only if there are KO'd allies
            if(effect === 'revive'){
                return b.team.some(m => m.curHp <= 0);
            }
            
            // Others not usable in battle
            return false;
        });
    
    return items;
}

function openBattleItems(){
    if(!state.battle || processing){
        if(processing) showErrorFeedback(null, '⏳ Wait for turn to finish!');
        return;
    }
    
    const cur = battleQueue[turnIdx];
    if(!cur || cur.type !== 'player'){
        showErrorFeedback(null, '❌ Not your turn!');
        return;
    }
    
    const activeMember = state.battle.team[cur.idx];
    if(!activeMember) return;
    
    const items = getUsableBattleItems(activeMember);
    if(items.length === 0){
        showErrorFeedback(null, '❌ No usable items in battle!');
        return;
    }
    
    const student = state.students.find(s => s.id === activeMember.id);
    if(!student) return;
    
    let html = `
        <div class="battle-items-overlay" onclick="closeBattleItems(event)">
            <div class="battle-items-modal" onclick="event.stopPropagation()">
                <div class="battle-items-header">
                    <h3>🎒 Use Item</h3>
                    <button class="battle-items-close" onclick="closeBattleItems()">✕</button>
                </div>
                
                <div class="battle-items-grid">
                    ${items.map(({id, qty, item}) => {
                        const rarity = RARITY[item.rarity];
                        
                        return `
                            <div class="battle-item-card" style="border-color:${rarity.color}" onclick="selectBattleItem('${id}')">
                                <div class="battle-item-qty">×${qty}</div>
                                <div class="battle-item-icon">${item.icon}</div>
                                <div class="battle-item-name">${item.name}</div>
                                <div class="battle-item-desc">${item.desc}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeBattleItems(event){
    if(event && event.target.className !== 'battle-items-overlay' && event.target.className !== 'battle-items-close') return;
    const overlay = document.querySelector('.battle-items-overlay');
    if(overlay) overlay.remove();
}

function selectBattleItem(itemId){
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    const effect = item.effect.type;
    
    // Close items menu
    closeBattleItems();
    
    // If needs target selection, open target selector
    if(['heal', 'heal_focus', 'revive'].includes(effect)){
        openBattleItemTargetSelector(itemId);
    } else {
        // Apply immediately to self or party
        useBattleItem(itemId, null);
    }
}

function openBattleItemTargetSelector(itemId){
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    const b = state.battle;
    const effect = item.effect.type;
    
    // Filter targets based on item
    let targets = [];
    if(effect === 'revive'){
        targets = b.team.filter(m => m.curHp <= 0);
    } else {
        targets = b.team.filter(m => m.curHp > 0);
    }
    
    let html = `
        <div class="battle-items-overlay" onclick="closeBattleItemTargets(event)">
            <div class="battle-items-modal" onclick="event.stopPropagation()">
                <div class="battle-items-header">
                    <h3>Select Target</h3>
                    <button class="battle-items-close" onclick="closeBattleItemTargets()">✕</button>
                </div>
                
                <div class="battle-target-grid">
                    ${targets.map((m, idx) => {
                        const realIdx = b.team.indexOf(m);
                        const hpPct = (m.curHp / m.maxHp) * 100;
                        
                        return `
                            <div class="battle-target-card" onclick="useBattleItem('${itemId}', ${realIdx})">
                                <div class="battle-target-portrait">
                                    <img src="${getImg(m.cid, m.lv)}" alt="${m.name}">
                                </div>
                                <div class="battle-target-name">${m.name || 'Legend'}</div>
                                <div class="battle-target-hp">
                                    <div class="battle-target-hp-bar">
                                        <div class="battle-target-hp-fill" style="width:${hpPct}%"></div>
                                    </div>
                                    <div class="battle-target-hp-text">${m.curHp} / ${m.maxHp}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeBattleItemTargets(event){
    if(event && event.target.className !== 'battle-items-overlay' && event.target.className !== 'battle-items-close') return;
    const overlay = document.querySelector('.battle-items-overlay');
    if(overlay) overlay.remove();
}

function useBattleItem(itemId, targetIdx){
    const b = state.battle;
    if(!b) return;
    
    const cur = battleQueue[turnIdx];
    if(!cur || cur.type !== 'player') return;
    
    const activeMember = b.team[cur.idx];
    const student = state.students.find(s => s.id === activeMember.id);
    if(!student || !student.inventory[itemId]) return;
    
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if(!item) return;
    
    // Close any overlays
    closeBattleItemTargets();
    closeBattleItems();
    
    // Apply effect
    const effect = item.effect;
    const target = targetIdx !== null ? b.team[targetIdx] : activeMember;
    
    switch(effect.type){
        case 'heal':
            const healAmount = Math.floor(target.maxHp * effect.value);
            target.chipHp = target.curHp;
            target.curHp = Math.min(target.maxHp, target.curHp + healAmount);
            
            const healTargetEl = document.getElementById('arenaC' + targetIdx);
            if(healTargetEl){
                showItemAnimation(healTargetEl, 'heal');
                showFloatingDamage(healTargetEl, healAmount, 'heal');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} +${healAmount} HP`, 'heal');
            playSound('heal');
            break;
            
        case 'focus':
            target.focus = Math.min(target.focusMax, target.focus + effect.value);
            
            const focusTargetEl = document.getElementById('arenaC' + (targetIdx !== null ? targetIdx : cur.idx));
            if(focusTargetEl){
                showItemAnimation(focusTargetEl, 'focus');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! +${effect.value} Focus`, 'info');
            playSound('heal');
            break;
            
        case 'heal_focus':
            const hpHeal = Math.floor(target.maxHp * effect.hpPercent);
            target.chipHp = target.curHp;
            target.curHp = Math.min(target.maxHp, target.curHp + hpHeal);
            target.focus = Math.min(target.focusMax, target.focus + effect.focus);
            
            const comboTargetEl = document.getElementById('arenaC' + targetIdx);
            if(comboTargetEl){
                showItemAnimation(comboTargetEl, 'heal_focus');
                showFloatingDamage(comboTargetEl, hpHeal, 'heal');
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} +${hpHeal} HP, +${effect.focus} Focus`, 'heal');
            playSound('heal');
            break;
            
        case 'revive':
            const reviveAmount = Math.floor(target.maxHp * effect.value);
            target.curHp = reviveAmount;
            target.chipHp = 0;
            
            const reviveTargetEl = document.getElementById('arenaC' + targetIdx);
            if(reviveTargetEl){
                reviveTargetEl.classList.remove('knocked-out');
                showItemAnimation(reviveTargetEl, 'revive');
                
                // Delay floating text so animation is visible first
                setTimeout(() => {
                    showFloatingDamage(reviveTargetEl, 'REVIVED!', 'heal');
                }, 300);
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! ${target.name} revived with ${reviveAmount} HP!`, 'heal');
            playSound('victory');
            break;
            
        case 'defend_buff':
        case 'crit_buff':
        case 'damage_buff':
        case 'party_shield':
        case 'focus_regen_buff':
            // Store buff on member (will be used in combat calculations)
            if(!activeMember.buffs) activeMember.buffs = {};
            activeMember.buffs[effect.type] = {value: effect.value, turns: effect.turns || 1};
            
            const buffTargetEl = document.getElementById('arenaC' + cur.idx);
            if(buffTargetEl){
                showItemAnimation(buffTargetEl, effect.type);
            }
            
            addLog(`${item.icon} ${student.name} used ${item.name}! Buff applied!`, 'info');
            playSound('heal');
            break;
    }
    
    // Consume item
    student.inventory[itemId]--;
    if(student.inventory[itemId] <= 0){
        delete student.inventory[itemId];
    }
    
    save();
    
    // End turn after item use
    turnIdx++;
    renderMain();
    setTimeout(nextTurn, 600);
}

function renderAdventure(m){

    const atmosphereTexts = ADVENTURE_STORIES[regionKey] || ADVENTURE_STORIES.forest;

function completeRedemption(redemptionId){
    const redemption = state.realRewardLog.find(r => r.id === redemptionId);
    if(!redemption) return;
    
    if(confirm(`Mark "${redemption.rewardName}" for ${redemption.studentName} as complete?`)){
        redemption.completed = true;
        redemption.completedAt = new Date().toLocaleString();
        
        showToast(`✅ Marked ${redemption.rewardName} as complete!`, 'success');
        save();
        renderMain();
    }
}

function saveEconomySettings(){
    const coinMult = parseFloat(document.getElementById('coinMultiplier').value);
    const rewardMult = parseFloat(document.getElementById('rewardMultiplier').value);
    
    if(isNaN(coinMult) || isNaN(rewardMult)){
        showToast('❌ Invalid values!', 'error');
        return;
    }
    
    state.shopConfig.coinEconomyMultiplier = coinMult;
    state.shopConfig.realRewardPriceMultiplier = rewardMult;
    
    showToast('✅ Economy settings saved!', 'success');
    save();
}

function redeemClassroomReward(rewardId){
    const reward = CLASSROOM_REWARDS.find(r => r.id === rewardId);
    if(!reward) return;
    
    const contrib = state.classroomRewards[rewardId];
    if(!contrib) return;
    
    const total = contrib.contributions.reduce((sum, c) => sum + c.amount, 0);
    const price = getItemPrice(reward);
    
    if(total < price){
        showToast('❌ Not fully funded yet!', 'error');
        return;
    }
    
    if(confirm(`Redeem "${reward.name}" for the class?\n\nThis will log the redemption and reset contributions.`)){
        // Create redemption log entry
        state.realRewardLog.push({
            id: Date.now().toString(),
            studentId: 'CLASS',
            studentName: 'Whole Class',
            rewardId: reward.id,
            rewardName: reward.name,
            cost: price,
            timestamp: new Date().toLocaleString(),
            completed: false,
            notes: `Contributors: ${contrib.contributions.map(c => c.name).join(', ')}`
        });
        
        // Reset classroom reward
        delete state.classroomRewards[rewardId];
        
        showToast(`🎉 ${reward.name} redeemed for the class!`, 'success');
        playSound('victory');
        save();
        renderMain();
    }
}

// ADVENTURE SYSTEM - New Boss-Gated Progression
function startAdventure(){
    initAudio();
    state.adventureCount++;
    
    const avgLv = getAvgLevel();
    const ch = getCurrentChapter();
    const chData = CHAPTERS[ch];
    
    // Calculate boss encounter chance based on level vs chapter expectations
    const bossChanceInfo = calculateBossChance(avgLv, ch);
    
    // Check if special boss (Nightmare/Creator) is available - but it's still RANDOM chance
    const specialBoss = checkSpecialBossAvailable();
    if(specialBoss){
        // Special bosses have their own chance to appear (not forced!)
        const specialChance = bossChanceInfo.specialChance;
        if(Math.random() * 100 < specialChance){
            triggerSpecialBoss(specialBoss);
            return;
        }
    }
    
    // Determine event type with dynamic boss chance
    const roll = Math.random() * 100;
    let eventType;
    
    // Event distribution adjusts based on boss chance
    const bossChance = bossChanceInfo.tierBossChance;
    const wildChance = Math.max(30, 55 - bossChance * 0.5); // Wild decreases as boss increases
    const treasureChance = 15;
    const specialEventChance = 15;
    
    if(roll < wildChance) eventType = 'wild';
    else if(roll < wildChance + treasureChance) eventType = 'treasure';
    else if(roll < wildChance + treasureChance + specialEventChance) eventType = 'special';
    else eventType = 'boss';
    
    // Check if boss is available and party can fight it
    if(eventType === 'boss'){
        const available = getAvailableBosses().filter(b => canFightBoss(b.id));
        if(!available.length) eventType = 'wild';
    }
    
    // Execute event
    if(eventType === 'wild') startWildEncounter(avgLv, ch);
    else if(eventType === 'treasure') treasureEvent(ch, avgLv);
    else if(eventType === 'special') specialEvent(ch, avgLv);
    else if(eventType === 'boss') startBossEncounter(ch);
}

// Calculate boss encounter chances based on party level vs chapter
function calculateBossChance(avgLv, chapter){
    // Get the tier for current chapter
    const tierForChapter = chapter <= 1 ? 1 : chapter <= 2 ? 2 : 3;
    
    // Get expected level range for this tier's bosses
    const tierBosses = tierForChapter === 1 ? TIER1_BOSSES : tierForChapter === 2 ? TIER2_BOSSES : TIER3_BOSSES;
    const avgBossLv = tierBosses.reduce((sum, bid) => sum + BOSSES[bid].lv, 0) / tierBosses.length;
    
    // How over-leveled is the party?
    const levelRatio = avgLv / avgBossLv;
    
    // Base chance starts low, increases as party levels
    // At 50% of boss level: 5% chance
    // At 100% of boss level: 15% chance
    // At 150% of boss level: 35% chance
    // At 200%+ of boss level: 60% chance (soft cap to force progression)
    let tierBossChance;
    if(levelRatio < 0.5) tierBossChance = 3;
    else if(levelRatio < 0.75) tierBossChance = 5 + (levelRatio - 0.5) * 40;  // 5-15%
    else if(levelRatio < 1.0) tierBossChance = 15 + (levelRatio - 0.75) * 40; // 15-25%
    else if(levelRatio < 1.25) tierBossChance = 25 + (levelRatio - 1.0) * 40; // 25-35%
    else if(levelRatio < 1.5) tierBossChance = 35 + (levelRatio - 1.25) * 60; // 35-50%
    else tierBossChance = Math.min(70, 50 + (levelRatio - 1.5) * 40);         // 50-70% cap
    
    // Special boss (Nightmare) chance - only if tier is complete
    // Starts at 10%, scales up to 50% if way over-leveled
    let specialChance = 0;
    const specialAvailable = checkSpecialBossAvailable();
    if(specialAvailable){
        const nightmarePhase = specialAvailable.phase || 0;
        const nightmareLv = BOSSES[specialAvailable.id]?.lv || 25;
        const specialRatio = avgLv / nightmareLv;
        
        if(specialRatio < 0.8) specialChance = 10;
        else if(specialRatio < 1.0) specialChance = 10 + (specialRatio - 0.8) * 50;  // 10-20%
        else if(specialRatio < 1.3) specialChance = 20 + (specialRatio - 1.0) * 50;  // 20-35%
        else specialChance = Math.min(60, 35 + (specialRatio - 1.3) * 50);           // 35-60% cap
    }
    
    // Count remaining bosses - higher chance if fewer remain
    const remaining = getRemainingTierBosses(tierForChapter).length;
    if(remaining === 1) tierBossChance *= 1.3; // 30% bonus for last boss
    if(remaining === 0 && specialAvailable) specialChance *= 1.5; // 50% bonus for Nightmare
    
    return {
        tierBossChance: Math.min(70, tierBossChance),
        specialChance: Math.min(60, specialChance),
        levelRatio: levelRatio,
        tierForChapter: tierForChapter
    };
}

// Check if a special boss (Nightmare/Creator) is available
function checkSpecialBossAvailable(){
    // Check Nightmare phases in order - only available if previous tier complete
    for(let p = 0; p <= 4; p++){
        if(canFightNightmarePhase(p)){
            return {type: 'nightmare', phase: p, id: `nightmare_p${p}`};
        }
    }
    // Check Creator (post-game)
    if(canFightCreator()){
        return {type: 'creator', id: 'the_creator'};
    }
    return null;
}

    const boss = BOSSES[special.id];
    const ch = getCurrentChapter();
    
    let narrative, title;
    
    if(special.type === 'nightmare'){
        const phaseNarratives = {
