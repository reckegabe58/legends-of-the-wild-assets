<!DOCTYPE html>
<!-- Legends of the Wild v54.6 - Enhanced Animations & Heal Scaling -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends of the Wild v54.6</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* ============================================
   BASE STYLES - Warm Amber/Sunset Theme
   Adventure golden hour feeling
   ============================================ */
:root{
    --page-bg-1:#3d3028;--page-bg-2:#2e2420;--page-bg-3:#221a16;
    --gold:#e8b84a;--gold-lt:#f8d888;
    --txt:#f5f0e8;--txt-dim:#d0c8bc;--txt-muted:#a09080;
    --red:#e85555;--green:#50c870;--blue:#5090d0;--ice:#70d4e8
}

*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',sans-serif;
    color:var(--txt);
    min-height:100vh;
    background:linear-gradient(160deg,#4a3c30 0%,#362a22 40%,#241c18 100%)
}
.page-glow{
    position:fixed;inset:0;z-index:-1;
    background:radial-gradient(ellipse at 30% 20%,rgba(232,184,74,.1) 0%,transparent 50%),
               radial-gradient(ellipse at 70% 80%,rgba(200,120,60,.08) 0%,transparent 45%),
               radial-gradient(ellipse at 50% 50%,rgba(255,200,100,.05) 0%,transparent 60%);
    pointer-events:none
}

/* Header & Nav */
.header{text-align:center;padding:18px 12px;background:linear-gradient(180deg,rgba(0,0,0,.15),transparent)}
.title{font-family:'Uncial Antiqua',cursive;font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--gold-lt);text-shadow:0 0 30px rgba(232,184,74,.5),0 2px 4px rgba(0,0,0,.4)}
.nav{display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap;background:rgba(0,0,0,.15);border-bottom:1px solid rgba(255,220,150,.1)}
.nav-btn{font-family:'Cinzel',serif;font-size:.8rem;padding:12px 18px;background:rgba(0,0,0,.2);border:1px solid rgba(255,220,150,.15);color:var(--txt-dim);cursor:pointer;border-radius:10px;transition:.2s}
.nav-btn:hover{border-color:var(--gold);color:var(--gold-lt);background:rgba(232,184,74,.1)}
.nav-btn.active{border-color:var(--gold);color:var(--gold-lt);background:rgba(232,184,74,.15);box-shadow:0 0 20px rgba(232,184,74,.2)}
.main{max-width:1200px;margin:0 auto;padding:24px}
.section-title{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold-lt);text-align:center;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid rgba(255,220,150,.12);text-shadow:0 0 20px rgba(232,184,74,.3)}

/* ============================================
   CREATURE CARDS - Per-Card Element Theming
   Uses CSS custom properties set via inline style
   ============================================ */
.students-grid{display:grid;gap:24px}
.students-grid.s1{grid-template-columns:1fr;max-width:400px;margin:0 auto}
.students-grid.s2{grid-template-columns:repeat(2,1fr);justify-items:center}
.students-grid.s3{grid-template-columns:repeat(3,1fr);justify-items:center}
.students-grid.s4,.students-grid.s5,.students-grid.s6{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));justify-items:center}

/* Card Base - Brighter, colorful backgrounds */
.card{
    --card-accent:#a88beb;--card-accent-lt:#c9b8f0;--card-accent-glow:rgba(168,139,235,.4);
    background:linear-gradient(165deg,#4a4270 0%,#3a3460 100%);
    border:2px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:0;position:relative;overflow:hidden;
    box-shadow:0 8px 32px rgba(0,0,0,.2),0 0 60px var(--card-accent-glow);
    transition:all .3s;
    width:fit-content; /* Allow natural sizing based on content */
    max-width:470px; /* Prevent cards from getting too wide */
    min-width:340px; /* Ensure minimum card width for Evo 1 */
}
.card::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 0%,var(--card-accent-glow) 0%,transparent 50%);
    opacity:.6;pointer-events:none
}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 80px var(--card-accent-glow)}

/* Element Themes - Brighter colors */
.card[data-element="fire"]{--card-accent:#ff8c42;--card-accent-lt:#ffb380;--card-accent-glow:rgba(255,140,66,.45);background:linear-gradient(165deg,#5c4035,#4a3028)}
.card[data-element="water"]{--card-accent:#5dadec;--card-accent-lt:#8ec8f5;--card-accent-glow:rgba(93,173,236,.45);background:linear-gradient(165deg,#354a5c,#283848)}
.card[data-element="earth"]{--card-accent:#c9a86c;--card-accent-lt:#e0c99a;--card-accent-glow:rgba(201,168,108,.45);background:linear-gradient(165deg,#4a4538,#3a3528)}
.card[data-element="nature"]{--card-accent:#6bcb77;--card-accent-lt:#98e5a0;--card-accent-glow:rgba(107,203,119,.45);background:linear-gradient(165deg,#3a4a3a,#2a3a2a)}
.card[data-element="lightning"]{--card-accent:#ffd43b;--card-accent-lt:#ffe066;--card-accent-glow:rgba(255,212,59,.5);background:linear-gradient(165deg,#4a4535,#3a3525)}
.card[data-element="ice"]{--card-accent:#74d0f1;--card-accent-lt:#a8e4f8;--card-accent-glow:rgba(116,208,241,.45);background:linear-gradient(165deg,#3a4a55,#2a3a45)}
.card[data-element="shadow"]{--card-accent:#9775fa;--card-accent-lt:#b89bf7;--card-accent-glow:rgba(151,117,250,.5);background:linear-gradient(165deg,#403850,#302840)}
.card[data-element="dark"]{--card-accent:#9775fa;--card-accent-lt:#b89bf7;--card-accent-glow:rgba(151,117,250,.5);background:linear-gradient(165deg,#403850,#302840)}
.card[data-element="light"]{--card-accent:#fcc419;--card-accent-lt:#ffe066;--card-accent-glow:rgba(252,196,25,.5);background:linear-gradient(165deg,#4a4540,#3a3530)}
.card[data-element="void"]{--card-accent:#9c36b5;--card-accent-lt:#be4bdb;--card-accent-glow:rgba(156,54,181,.5);background:linear-gradient(165deg,#402848,#301838)}
.card[data-element="poison"]{--card-accent:#a9e34b;--card-accent-lt:#c5f06c;--card-accent-glow:rgba(169,227,75,.45);background:linear-gradient(165deg,#3a4530,#2a3520)}
.card[data-element="metal"]{--card-accent:#adb5bd;--card-accent-lt:#ced4da;--card-accent-glow:rgba(173,181,189,.4);background:linear-gradient(165deg,#404550,#303540)}
.card[data-element="air"]{--card-accent:#91d5ff;--card-accent-lt:#b5e3ff;--card-accent-glow:rgba(145,213,255,.45);background:linear-gradient(165deg,#3a4550,#2a3540)}
.card[data-element="psychic"]{--card-accent:#f783ac;--card-accent-lt:#faa2c1;--card-accent-glow:rgba(247,131,172,.45);background:linear-gradient(165deg,#4a3545,#3a2535)}
.card[data-element="chaos"]{--card-accent:#ff6b9d;--card-accent-lt:#ff8fb3;--card-accent-glow:rgba(255,107,157,.45);background:linear-gradient(165deg,#4a3040,#3a2030)}
.card[data-element="cosmic"]{--card-accent:#b197fc;--card-accent-lt:#d0bfff;--card-accent-glow:rgba(177,151,252,.5);background:linear-gradient(165deg,#352850,#251840)}
.card[data-element="sound"]{--card-accent:#63e6be;--card-accent-lt:#96f2d7;--card-accent-glow:rgba(99,230,190,.45);background:linear-gradient(165deg,#304540,#203530)}
.card[data-element="holy"]{--card-accent:#ffe066;--card-accent-lt:#fff3b0;--card-accent-glow:rgba(255,224,102,.5);background:linear-gradient(165deg,#4a4530,#3a3520)}

/* Mythical Element - Divine Norse Ice/Lightning Theme */
.card[data-element="mythical"]{
    --card-accent:#7dd3fc;--card-accent-lt:#bae6fd;--card-accent-glow:rgba(125,211,252,.6);
    background:linear-gradient(165deg,#1e3a5f 0%,#0f2847 50%,#1a1a3e 100%);
    border:2px solid rgba(125,211,252,.4);
    box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 80px rgba(125,211,252,.5),0 0 120px rgba(56,189,248,.3);
    animation:mythicalCardPulse 4s ease-in-out infinite;
}
.card[data-element="mythical"]::before{
    background:radial-gradient(ellipse at 50% 0%,rgba(125,211,252,.4) 0%,rgba(56,189,248,.2) 30%,transparent 60%);
    opacity:.8;
}
.card[data-element="mythical"]::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);
    animation:mythicalShimmer 3s linear infinite;
    pointer-events:none;
}
@keyframes mythicalCardPulse{
    0%,100%{box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 80px rgba(125,211,252,.5),0 0 120px rgba(56,189,248,.3)}
    50%{box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 100px rgba(125,211,252,.7),0 0 160px rgba(56,189,248,.5)}
}
@keyframes mythicalShimmer{
    0%{background-position:-200% 0}
    100%{background-position:200% 0}
}

/* Top Pills - Cleaner two-row layout */
.card-pills{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px 14px;
    position:relative;
    z-index:1;
}
.card-pills-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}
.pill{
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:5px 11px;
    font-size:.78rem;
    color:var(--txt-dim);
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
}
.pill.boost-active{
    background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(234,179,8,.15));
    border-color:rgba(251,191,36,.5);
    color:var(--gold-lt);
    font-weight:600;
    animation:boostPulse 2s ease-in-out infinite;
}
@keyframes boostPulse{
    0%, 100%{box-shadow:0 0 5px rgba(251,191,36,.3)}
    50%{box-shadow:0 0 15px rgba(251,191,36,.6)}
}
.pill .icon{font-size:1.1rem} /* Larger icons - 28px equivalent */
.pill .pill-label{
    font-size:.68rem;
    color:var(--txt-muted);
    text-transform:uppercase;
    letter-spacing:.4px;
}
.pill .val{
    font-family:'Cinzel',serif;
    font-weight:600;
    color:var(--txt);
    font-size:.82rem;
}
.pill.lv{
    border-color:var(--card-accent);
    background:rgba(168,139,235,.15);
    padding:6px 13px;
}
.pill.lv .val{color:var(--card-accent-lt);font-size:.88rem}

/* Element badge - positioned top right */
.element-badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.4);
    border:1px solid var(--card-accent);
    border-radius:12px;
    padding:4px 10px;
    display:flex;
    align-items:center;
    gap:4px;
    font-size:.72rem;
    color:var(--card-accent-lt);
    box-shadow:0 0 15px var(--card-accent-glow);
    z-index:2;
}
.element-badge .icon{font-size:1rem}

/* XP Bar */
.xp-bar{height:3px;background:rgba(0,0,0,.3);margin:0 16px;border-radius:2px}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--card-accent),var(--card-accent-lt));border-radius:2px;transition:.4s}

/* Creature Name - Single, prominent, playful */
.creature-name{
    font-family:'Fredoka One','Bubblegum Sans',cursive,sans-serif;
    font-size:1.5rem;
    color:var(--card-accent-lt);
    text-align:center;
    padding:8px 0 4px;
    text-shadow:0 2px 10px var(--card-accent-glow),0 0 30px var(--card-accent-glow);
    letter-spacing:1px;
    position:relative;z-index:1
}

/* Creature Hero Section - CREATURE IS THE HERO */
.creature-hero{display:flex;justify-content:center;padding:16px 0 24px;position:relative;min-height:220px}
.creature-frame{
    position:relative;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.1) 0%,transparent 70%);
    display:flex;align-items:center;justify-content:center
}
.creature-frame::before{
    content:'';position:absolute;inset:-10px;border-radius:50%;
    border:3px solid var(--card-accent);opacity:.35;
    box-shadow:0 0 50px var(--card-accent-glow),inset 0 0 50px var(--card-accent-glow)
}
.creature-img{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--card-accent-glow) 0%,transparent 70%)}
.creature-img img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5));transition:all .3s ease-out}

/* CARD EVOLUTION SCALING - MUCH LARGER
   Creature takes 55-65% of card space
   Evo 1: Starting size
   Evo 2: +45%
   Evo 3: +100%
   Evo 4: +160% - MASSIVE
*/
.creature-frame.evo1{width:160px;height:160px}
.creature-img.evo1{width:148px;height:148px}
.creature-frame.evo1::before{border-width:2px;opacity:.28}

.creature-frame.evo2{width:230px;height:230px;box-shadow:0 0 60px var(--card-accent-glow)}
.creature-img.evo2{width:212px;height:212px}
.creature-frame.evo2::before{border-width:3px;opacity:.4}
.creature-img.evo2 img{filter:drop-shadow(0 0 12px var(--card-accent-glow)) drop-shadow(0 6px 20px rgba(0,0,0,.5))}

.creature-frame.evo3{width:320px;height:320px;box-shadow:0 0 80px var(--card-accent-glow),0 0 130px var(--card-accent-glow)}
.creature-img.evo3{width:296px;height:296px}
.creature-frame.evo3::before{border-width:4px;opacity:.5}
.creature-img.evo3 img{filter:drop-shadow(0 0 22px var(--card-accent-glow)) drop-shadow(0 8px 25px rgba(0,0,0,.5)) brightness(1.08)}

.creature-frame.evo4{width:420px;height:420px;box-shadow:0 0 100px var(--card-accent-glow),0 0 180px var(--card-accent-glow)}
.creature-img.evo4{width:390px;height:390px}
.creature-frame.evo4::before{border-width:5px;opacity:.65;animation:evo4FramePulse 2s ease-in-out infinite}
.creature-img.evo4 img{filter:drop-shadow(0 0 35px var(--card-accent-glow)) drop-shadow(0 10px 30px rgba(0,0,0,.5)) brightness(1.15);animation:evo4CreaturePulse 2.8s ease-in-out infinite}
@keyframes evo4FramePulse{0%,100%{opacity:.65;box-shadow:0 0 50px var(--card-accent-glow),inset 0 0 50px var(--card-accent-glow)}50%{opacity:.85;box-shadow:0 0 80px var(--card-accent-glow),inset 0 0 80px var(--card-accent-glow)}}
@keyframes evo4CreaturePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* ============================================
   IDLE CREATURE ANIMATIONS - Element-specific
   ============================================ */
@keyframes creatureFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}
@keyframes creatureBreathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.02)}
}
@keyframes auraGlow{
    0%,100%{opacity:.5;transform:scale(1)}
    50%{opacity:.7;transform:scale(1.03)}
}

/* Default idle animation for all creatures */
.creature-img img{
    animation:creatureFloat 3s ease-in-out infinite,creatureBreathe 4s ease-in-out infinite;
}
.creature-frame::before{
    animation:auraGlow 3s ease-in-out infinite;
}

/* Element-specific idle effects */
@keyframes fireFlicker{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(255,100,0,.3)) brightness(1)}
    25%{filter:drop-shadow(0 4px 18px rgba(255,130,0,.4)) brightness(1.05)}
    50%{filter:drop-shadow(0 4px 20px rgba(255,80,0,.35)) brightness(1.03)}
    75%{filter:drop-shadow(0 4px 16px rgba(255,110,0,.38)) brightness(1.04)}
}
@keyframes waterShimmer{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(0,150,255,.25)) brightness(1)}
    50%{filter:drop-shadow(0 4px 22px rgba(100,200,255,.4)) brightness(1.08)}
}
@keyframes electricSpark{
    0%,85%,100%{filter:drop-shadow(0 4px 15px rgba(255,220,0,.2)) brightness(1)}
    90%{filter:drop-shadow(0 0 20px rgba(255,255,100,.6)) brightness(1.15)}
}
@keyframes iceGlisten{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(100,220,255,.25)) brightness(1)}
    50%{filter:drop-shadow(0 4px 18px rgba(200,240,255,.4)) brightness(1.1)}
}
@keyframes shadowPulse{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(100,0,150,.3)) brightness(.97)}
    50%{filter:drop-shadow(0 4px 25px rgba(150,50,200,.45)) brightness(1)}
}
@keyframes leafRustle{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(50,200,80,.25)) brightness(1);transform:scale(1) rotate(0deg)}
    25%{transform:scale(1.01) rotate(.5deg)}
    75%{transform:scale(1.01) rotate(-.5deg)}
}
@keyframes holyGlow{
    0%,100%{filter:drop-shadow(0 4px 15px rgba(255,220,100,.3)) brightness(1.03)}
    50%{filter:drop-shadow(0 0 25px rgba(255,240,150,.5)) brightness(1.12)}
}

.card[data-element="fire"] .creature-img img{
    animation:creatureFloat 3s ease-in-out infinite,fireFlicker 2s ease-in-out infinite;
}
.card[data-element="water"] .creature-img img{
    animation:creatureFloat 2.5s ease-in-out infinite,waterShimmer 3s ease-in-out infinite;
}
.card[data-element="lightning"] .creature-img img{
    animation:creatureFloat 3s ease-in-out infinite,electricSpark 4s ease-in-out infinite;
}
.card[data-element="ice"] .creature-img img{
    animation:creatureFloat 4s ease-in-out infinite,iceGlisten 2.5s ease-in-out infinite;
}
.card[data-element="shadow"] .creature-img img,
.card[data-element="dark"] .creature-img img,
.card[data-element="void"] .creature-img img{
    animation:creatureFloat 4s ease-in-out infinite,shadowPulse 3s ease-in-out infinite;
}
.card[data-element="nature"] .creature-img img{
    animation:creatureFloat 3.5s ease-in-out infinite,leafRustle 4s ease-in-out infinite;
}
.card[data-element="light"] .creature-img img,
.card[data-element="holy"] .creature-img img,
.card[data-element="cosmic"] .creature-img img{
    animation:creatureFloat 3s ease-in-out infinite,holyGlow 2.5s ease-in-out infinite;
}

/* Mythical Element - Divine Norse Rune Glow with Ice/Lightning effects */
@keyframes mythicalAura{
    0%,100%{
        filter:drop-shadow(0 4px 20px rgba(125,211,252,.4)) drop-shadow(0 0 30px rgba(56,189,248,.3)) brightness(1.05);
    }
    25%{
        filter:drop-shadow(0 4px 25px rgba(125,211,252,.6)) drop-shadow(0 0 40px rgba(255,255,150,.4)) brightness(1.15);
    }
    50%{
        filter:drop-shadow(0 4px 30px rgba(56,189,248,.5)) drop-shadow(0 0 50px rgba(125,211,252,.5)) brightness(1.1);
    }
    75%{
        filter:drop-shadow(0 4px 25px rgba(255,255,200,.4)) drop-shadow(0 0 40px rgba(56,189,248,.4)) brightness(1.12);
    }
}
@keyframes mythicalRunePulse{
    0%,100%{transform:translateY(0) scale(1)}
    25%{transform:translateY(-6px) scale(1.02)}
    50%{transform:translateY(-10px) scale(1.03)}
    75%{transform:translateY(-6px) scale(1.02)}
}
.card[data-element="mythical"] .creature-img img{
    animation:mythicalRunePulse 4s ease-in-out infinite,mythicalAura 3s ease-in-out infinite;
}
.card[data-element="mythical"] .creature-frame::before{
    animation:mythicalFrameGlow 3s ease-in-out infinite;
}
@keyframes mythicalFrameGlow{
    0%,100%{opacity:.6;box-shadow:0 0 40px rgba(125,211,252,.5),inset 0 0 30px rgba(56,189,248,.3)}
    50%{opacity:.9;box-shadow:0 0 60px rgba(125,211,252,.7),inset 0 0 50px rgba(56,189,248,.5)}
}

/* Empty State */
.creature-empty{width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.15);border:3px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.creature-empty span{font-size:3.5rem;color:rgba(255,255,255,.2)}

/* Mini Stat Bar - Compact horizontal with text labels */
.mini-stats{display:flex;justify-content:center;gap:8px;padding:0 12px 12px;position:relative;z-index:1;flex-wrap:wrap}
.mini-stat{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);border-radius:10px;padding:4px 8px}
.mini-stat .stat-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.mini-stat.hp .stat-label{color:#f87171}
.mini-stat.atk .stat-label{color:#fbbf24}
.mini-stat.def .stat-label{color:#60a5fa}
.mini-stat.spd .stat-label{color:#4ade80}
.mini-stat .val{font-family:'Cinzel',serif;font-size:.8rem;font-weight:600;color:var(--txt)}

/* Evolution label under creature name */
.creature-evo-label{
    text-align:center;
    font-size:.75rem;
    color:var(--txt-muted);
    font-style:italic;
    margin-top:-4px;
    padding-bottom:4px
}

/* Nature Badge - Shows creature's nature and stat modifiers */
.nature-badge{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin:4px 16px 8px;padding:4px 10px;
    background:rgba(0,0,0,.3);border-radius:12px;
    font-size:.7rem;border:1px solid rgba(255,255,255,.15)
}
.nature-name{font-weight:600;text-transform:capitalize}

/* ============================================
   BATTLE SCREEN - Refined + Focus System
   Arena (~68%): Combat stage, creatures centered
   UI (~32%): Retro RPG horizontal HUD
   ============================================ */

.battle-container{
    height:80vh; /* v54.6: Expanded from 75vh for less overlap */
    max-height:80vh;
    background-size:cover;
    background-position:center;
    border-radius:12px;
    position:relative;
    overflow:visible;
    /* Changed to visible so bottom UI elements show */
}
.battle-container::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.25) 50%,rgba(0,0,0,.9) 100%);
    pointer-events:none;
    z-index:0;
}
/* Removed universal relative positioning that broke absolute elements */
.battle-arena{
    position:relative;
    z-index:1;
}

/* Battle Header - Compact */
.battle-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 24px;
    background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,.4),rgba(0,0,0,.75));
    flex-shrink:0;
}
.battle-type{
    font-family:'Uncial Antiqua',cursive;
    font-size:1.2rem;
    color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.5);
}
.turn-info{
    font-family:'Cinzel',serif;
    font-size:1rem;
    color:#fff;
    background:rgba(255,255,255,.1);
    padding:8px 20px;
    border-radius:20px;
    font-weight:600;
}

/* ============================================
   ARENA - 68% - Creatures in battle stance
   ============================================ */
.battle-arena{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 60px;
    z-index:1;
}

/* ============================================
   V43 COMBAT UI REDESIGN
   Turn order at top, horizontal party at bottom
   ============================================ */

/* Turn Order Tracker */
.turn-order-bar{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px; /* v54.1: Increased gap for name readability */
    background:rgba(0,0,0,.9);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:6px 14px 20px 14px; /* v54.1: Added bottom padding for names */
    z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,.8);
}
.turn-order-portrait{
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.15);
    overflow:visible; /* v54.1: Changed to show names below */
    background:rgba(0,0,0,.4);
    position:relative;
    transition:all .25s ease;
}
.turn-order-portrait.active{
    border-color:rgba(168,139,235,.8);
    box-shadow:0 0 12px rgba(168,139,235,.6);
    transform:scale(1.15);
    z-index:10;
}
.turn-order-portrait.enemy{
    border-color:rgba(255,255,255,.15);
}
.turn-order-portrait.enemy.active{
    border-color:rgba(248,113,113,.7);
    box-shadow:0 0 12px rgba(248,113,113,.5);
}
.turn-order-portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%; /* v54.1: Clip image to circle since parent has overflow:visible */
}
.turn-order-portrait.ko{
    opacity:0.25;
    filter:grayscale(1);
}
/* v54.1: Turn order names */
.turn-order-name{
    position:absolute;
    bottom:-16px;
    left:50%;
    transform:translateX(-50%);
    font-size:.55rem;
    color:#ccc;
    white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
    font-family:'Cinzel',serif;
}
.turn-order-portrait.active .turn-order-name{
    color:var(--purple-lt);
    font-weight:bold;
}
.turn-order-portrait.enemy .turn-order-name{
    color:#f87171;
}

/* v54.5: Arena team indicators - subtle border colors */
.turn-order-portrait.arena-team-red{
    border-color:rgba(231,76,60,.6);
}
.turn-order-portrait.arena-team-blue{
    border-color:rgba(52,152,219,.6);
}
.turn-order-portrait.arena-team-red .turn-order-name{
    color:#e74c3c;
}
.turn-order-portrait.arena-team-blue .turn-order-name{
    color:#3498db;
}

/* Party HUD CSS Removed - now using stats overlay on creatures */

/* Move Buttons - Absolute bottom now (no party HUD) */
.move-buttons-container{
    position:absolute;
    bottom:30px; /* Much lower - at true bottom */
    left:50%;
    transform:translateX(-50%);
    display:flex !important;
    gap:12px;
    z-index:998;
}

/* Player Arena - Middle-left, vertically centered */
.player-arena{
    display:flex;
    gap:40px; /* Increased from 20px - more breathing room for HP/Focus bars */
    align-items:center;
    justify-content:flex-start;
    padding-left:8%;
    padding-bottom:80px; /* v54.6: Added padding to prevent overlap with move buttons */
}

/* Solo/Duo party - more centered with bigger creatures */
.player-arena.solo-party{
    padding-left:15%;
}
.player-arena.small-party{
    padding-left:12%;
}

/* Columns for staggered formation */
.arena-column{
    display:flex;
    flex-direction:column;
    gap:40px; /* Bars are -18px below, need 30+ gap to prevent overlap */
    align-items:center;
}
.arena-column.col-2{margin-top:55px} /* Offset down by half unit */
.arena-column.col-3{margin-top:28px}

/* Arena Creature */
.arena-creature{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:all .2s;
}
.arena-creature.ko{opacity:.15;filter:grayscale(.9)}

/* Heal Target Mode - Visual feedback for clickable allies */
.arena-creature.heal-target{
    cursor:pointer;
    animation:heal-target-pulse 1s ease-in-out infinite;
}
.arena-creature.heal-target .arena-frame{
    box-shadow:0 0 20px 8px rgba(74,222,128,.6), 0 0 40px 15px rgba(74,222,128,.3);
    border-color:#4ade80;
}
.arena-creature.heal-target::after{
    content:'💚';
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.5rem;
    animation:heal-heart-bounce 0.6s ease-in-out infinite;
    z-index:100;
}
@keyframes heal-target-pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
}
@keyframes heal-heart-bounce{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-8px)}
}

/* Creature Stats Overlay - HP and Focus above creature */
/* Minimalist HP/Focus Bars - Pokemon Style (below creature, no numbers) */
.creature-bars-minimal{
    position:absolute;
    bottom:-18px; /* Closer to creature feet - was -35px */
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:2px; /* Tighter gap between HP/Focus */
    z-index:5;
    width:70%; /* Slightly narrower */
    min-width:50px;
    max-width:90px;
}

.minimal-bar{
    height:5px; /* Thin bars */
    background:rgba(0,0,0,.6);
    border-radius:3px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
}

.minimal-bar-fill{
    height:100%;
    transition:width .3s ease;
    border-radius:2px;
}

.minimal-bar-fill.hp-fill-minimal{
    background:linear-gradient(90deg,#ef4444,#dc2626);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.3);
}

.minimal-bar-fill.focus-fill-minimal{
    background:linear-gradient(90deg,#3b82f6,#2563eb);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.3);
}

/* Turn indicator: Glow circle under active creature */
.arena-creature.active::before{
    content:'';
    position:absolute;
    bottom:-12px;
    left:50%;
    transform:translateX(-50%);
    width:110%;
    height:30px;
    background:radial-gradient(ellipse,rgba(255,220,100,.35) 0%,rgba(255,220,100,.15) 40%,transparent 70%);
    border-radius:50%;
    animation:glowPulse 1.5s ease-in-out infinite;
}
@keyframes glowPulse{
    0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.05)}
}

/* Subtle green ground circle for non-active (depth) */
.ground-circle{
    position:absolute;
    bottom:-8px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    height:20px;
    background:radial-gradient(ellipse,rgba(80,200,120,.15) 0%,rgba(80,200,120,.05) 50%,transparent 70%);
    border-radius:50%;
    z-index:0;
}
.arena-creature.active .ground-circle{display:none} /* Hide when active glow shows */

.arena-frame{position:relative;z-index:1;transition:all .2s}
.arena-frame img{
    display:block;
    object-fit:contain;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));
    transition:all .2s;
    animation:creatureIdle 3s ease-in-out infinite;
}

/* Idle animation for combat creatures - gentle breathing/floating */
@keyframes creatureIdle{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-4px) scale(1.02)}
}

/* Active creature has more pronounced idle */
.arena-creature.active .arena-frame img{
    animation:creatureIdleActive 2s ease-in-out infinite;
}
@keyframes creatureIdleActive{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-6px) scale(1.03)}
}

/* Enemy idle animation */
.enemy-frame img{
    animation:enemyIdle 2.5s ease-in-out infinite;
}
@keyframes enemyIdle{
    0%,100%{transform:translateY(0) scale(1)}
    25%{transform:translateY(-3px) scale(1.01)}
    75%{transform:translateY(2px) scale(0.99)}
}

/* Boss has more menacing idle */
.enemy-frame.tier1 img,
.enemy-frame.tier2 img,
.enemy-frame.tier3 img,
.enemy-frame.tier4 img,
.enemy-frame.nightmare img{
    animation:bossIdle 3s ease-in-out infinite;
}
@keyframes bossIdle{
    0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 8px 25px rgba(0,0,0,.5))}
    50%{transform:translateY(-8px) scale(1.02);filter:drop-shadow(0 12px 35px rgba(255,50,50,.3))}
}

/* Solo party (1-2) - EXTRA BIG creatures */
.player-arena.solo-party .arena-frame.evo1 img{width:160px;height:160px}
.player-arena.solo-party .arena-frame.evo2 img{width:190px;height:190px;filter:drop-shadow(0 0 20px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.player-arena.solo-party .arena-frame.evo3 img{width:220px;height:220px;filter:drop-shadow(0 0 25px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.player-arena.solo-party .arena-frame.evo4 img{width:250px;height:250px;filter:drop-shadow(0 0 32px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}

/* Small party (3) - Big creatures */
.player-arena.small-party .arena-frame.evo1 img{width:140px;height:140px}
.player-arena.small-party .arena-frame.evo2 img{width:165px;height:165px;filter:drop-shadow(0 0 18px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.player-arena.small-party .arena-frame.evo3 img{width:190px;height:190px;filter:drop-shadow(0 0 22px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.player-arena.small-party .arena-frame.evo4 img{width:210px;height:210px;filter:drop-shadow(0 0 28px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}

/* Default party (4-6) - Standard sizing */
.arena-frame.evo1 img{width:120px;height:120px}
.arena-frame.evo2 img{width:140px;height:140px;filter:drop-shadow(0 0 15px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.arena-frame.evo3 img{width:160px;height:160px;filter:drop-shadow(0 0 20px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.arena-frame.evo4 img{width:180px;height:180px;filter:drop-shadow(0 0 28px var(--card-glow)) drop-shadow(0 8px 20px rgba(0,0,0,.5))}

/* Medium party (4-6) - slightly smaller */
.player-arena.medium-party .arena-frame.evo1 img{width:100px;height:100px}
.player-arena.medium-party .arena-frame.evo2 img{width:115px;height:115px}
.player-arena.medium-party .arena-frame.evo3 img{width:135px;height:135px}
.player-arena.medium-party .arena-frame.evo4 img{width:155px;height:155px}

/* Large party (7+) - compact */
.player-arena.large-party .arena-frame.evo1 img{width:80px;height:80px}
.player-arena.large-party .arena-frame.evo2 img{width:95px;height:95px}
.player-arena.large-party .arena-frame.evo3 img{width:110px;height:110px}
.player-arena.large-party .arena-frame.evo4 img{width:130px;height:130px}

/* Turn indicator: Arrow above active creature */
.active-arrow{
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.4rem;
    color:#ffd700;
    text-shadow:0 0 12px rgba(255,215,0,.8),0 2px 4px rgba(0,0,0,.5);
    animation:bounceArrow .6s ease-in-out infinite;
    z-index:10;
}
@keyframes bounceArrow{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(8px)}
}

/* Enemy attack telegraph - target pulse */
.arena-creature.targeted{
    animation:targetPulsePlayer .4s ease-out;
}
.arena-creature.targeted::after{
    content:'⊕';
    position:absolute;
    top:-35px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.5rem;
    color:#ff6b6b;
    text-shadow:0 0 10px rgba(255,100,100,.8);
    animation:targetMarkerFade .4s ease-out forwards;
}
@keyframes targetPulsePlayer{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.3) drop-shadow(0 0 15px rgba(255,100,100,.5))}
}
@keyframes targetMarkerFade{
    0%{opacity:1;transform:translateX(-50%) scale(1.2)}
    100%{opacity:0;transform:translateX(-50%) scale(0.8)}
}

/* Hit recoil animation */
.arena-creature.hit-recoil{
    animation:hitRecoil .2s ease-out;
}
@keyframes hitRecoil{
    0%{transform:translateX(0)}
    30%{transform:translateX(-6px)}
    60%{transform:translateX(4px)}
    100%{transform:translateX(0)}
}

/* ============================================
   ENEMY SIDE - Right, depth layered
   ============================================ */

.enemy-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:all .2s;
}

/* Enemy HP - Above sprite, thick and readable */
.enemy-hp-float{
    text-align:center;
    margin-bottom:6px;
    min-width:110px;
}
.enemy-hp-float .enemy-name{
    font-family:'Cinzel',serif;
    font-size:.85rem;
    color:#ff9999;
    text-shadow:0 0 8px rgba(255,100,100,.4);
    margin-bottom:3px;
    font-weight:600;
}
.enemy-hp-float .enemy-hp-bar{
    height:10px;
    background:rgba(0,0,0,.7);
    border:2px solid #ff6b6b;
    border-radius:5px;
    overflow:hidden;
    position:relative;
}
.enemy-hp-float .enemy-hp-chip{
    position:absolute;top:0;left:0;height:100%;
    background:rgba(255,100,100,.4);
    transition:width .6s ease-out .1s;
}
.enemy-hp-float .enemy-hp-fill{
    height:100%;
    background:linear-gradient(90deg,#7f1d1d,#ef4444);
    transition:width .4s ease-out;
    position:relative;z-index:1;
}

/* Enemy frame sizes - Boss dominates */
.enemy-frame{position:relative;transition:all .25s}
.enemy-frame img{
    width:100%;height:100%;
    object-fit:contain;
    filter:drop-shadow(0 8px 25px rgba(0,0,0,.5));
}

/* ADAPTIVE ENEMY SIZES - Never too small to see */
.enemy-frame.wild{width:160px;height:160px}
.enemy-frame.wild-small{width:135px;height:135px}
.enemy-frame.wild-tiny{width:115px;height:115px}
.enemy-frame.wild-solo{width:200px;height:200px}
.enemy-frame.minion{width:105px;height:105px}

/* Boss sizes - ALL BOSSES ARE MASSIVE */
.enemy-frame.tier1{width:320px;height:320px}
.enemy-frame.tier2{width:360px;height:360px}
.enemy-frame.tier3{width:400px;height:400px}
.enemy-frame.tier4{width:440px;height:440px}
.enemy-frame.nightmare{width:480px;height:480px}

/* Enemy arena - staggered columns like players */
.enemy-arena{
    display:flex;
    gap:35px; /* Increased from 20px */
    align-items:center;
    justify-content:flex-end;
    padding-right:3%;
}
.enemy-column{
    display:flex;
    flex-direction:column;
    gap:40px; /* Match player side */
    align-items:center;
}
.enemy-column.col-2{margin-top:50px}
.enemy-column.col-3{margin-top:25px}

/* Minion column - in front of boss (staggered) */
.minion-column{
    display:flex;
    flex-direction:column;
    gap:35px; /* Tighter for minions */
    align-items:center;
    margin-top:60px; /* Offset to stagger with boss */
}

/* Enemy targeting mode */
.enemy-unit.targetable{cursor:crosshair}
.enemy-unit.targetable .enemy-frame{
    animation:targetableGlow 1s ease-in-out infinite;
}
.enemy-unit.targetable:hover .enemy-frame{
    transform:scale(1.06);
    filter:drop-shadow(0 0 30px rgba(255,80,80,.5));
}
@keyframes targetableGlow{
    0%,100%{filter:drop-shadow(0 0 12px rgba(255,100,100,.25))}
    50%{filter:drop-shadow(0 0 28px rgba(255,100,100,.45))}
}

/* Minion row */
.minion-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;max-width:320px}
.minion-row .enemy-unit:nth-child(even){margin-top:30px}

/* Summon Animation */
.summon-overlay{
    position:fixed;inset:0;z-index:2500;
    background:rgba(0,0,0,.85);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    animation:summonFadeIn .3s ease-out;
}
@keyframes summonFadeIn{from{opacity:0}to{opacity:1}}

.summon-title{
    font-family:'Uncial Antiqua',cursive;
    font-size:2rem;
    color:#ff6b6b;
    text-shadow:0 0 30px rgba(255,100,100,.8),0 0 60px rgba(255,50,50,.5);
    margin-bottom:30px;
    animation:summonPulse 1s ease-in-out infinite;
}
@keyframes summonPulse{
    0%,100%{transform:scale(1);text-shadow:0 0 30px rgba(255,100,100,.8)}
    50%{transform:scale(1.05);text-shadow:0 0 50px rgba(255,100,100,1)}
}

.summon-portal{
    width:200px;height:200px;
    position:relative;
    animation:portalSpin 2s linear infinite;
}
@keyframes portalSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.summon-portal::before{
    content:'';
    position:absolute;inset:0;
    border:4px solid transparent;
    border-top-color:#ff6b6b;
    border-right-color:#a855f7;
    border-radius:50%;
    animation:portalGlow 1s ease-in-out infinite alternate;
}
@keyframes portalGlow{
    0%{box-shadow:0 0 20px rgba(255,100,100,.5),inset 0 0 30px rgba(168,85,247,.3)}
    100%{box-shadow:0 0 50px rgba(255,100,100,.8),inset 0 0 60px rgba(168,85,247,.6)}
}

.summon-portal::after{
    content:'';
    position:absolute;
    top:20%;left:20%;right:20%;bottom:20%;
    background:radial-gradient(circle,rgba(168,85,247,.6) 0%,rgba(255,100,100,.3) 50%,transparent 70%);
    border-radius:50%;
    animation:portalCore 1.5s ease-in-out infinite;
}
@keyframes portalCore{
    0%,100%{transform:scale(1);opacity:.8}
    50%{transform:scale(1.2);opacity:1}
}

.summon-creatures{
    display:flex;gap:20px;margin-top:30px;
    animation:summonCreaturesAppear .5s ease-out .5s both;
}
@keyframes summonCreaturesAppear{
    from{opacity:0;transform:translateY(30px) scale(.8)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.summon-creature{
    width:80px;height:80px;
    animation:summonBounce .6s ease-out;
}
.summon-creature img{
    width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 15px rgba(255,100,100,.6));
}
@keyframes summonBounce{
    0%{transform:scale(0) rotate(-180deg);opacity:0}
    60%{transform:scale(1.2) rotate(10deg);opacity:1}
    100%{transform:scale(1) rotate(0)}
}

/* ============================================
   ELEMENTAL ATTACK EFFECTS
   ============================================ */
.element-effect{
    position:fixed;
    pointer-events:none;
    z-index:2000;
}

.element-fire{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(255,100,0,.95) 0%,rgba(255,50,0,.7) 40%,transparent 70%);
    filter:blur(8px);
    animation:fireBurst 0.7s ease-out forwards;
}
@keyframes fireBurst{
    0%{transform:scale(0.3);opacity:1}
    30%{transform:scale(1.3);opacity:1}
    100%{transform:scale(2.2);opacity:0}
}

.element-ice{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(150,220,255,.95) 0%,rgba(100,180,255,.7) 40%,transparent 70%);
    filter:blur(5px);
    animation:iceBurst 0.7s ease-out forwards;
}
@keyframes iceBurst{
    0%{transform:scale(0.3) rotate(0deg);opacity:1}
    50%{transform:scale(1.4) rotate(45deg);opacity:0.9}
    100%{transform:scale(2) rotate(90deg);opacity:0}
}

.element-nature{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(100,255,100,.95) 0%,rgba(50,200,50,.7) 40%,transparent 70%);
    filter:blur(6px);
    animation:natureBurst 0.7s ease-out forwards;
}
@keyframes natureBurst{
    0%{transform:scale(0.3);opacity:1}
    50%{transform:scale(1.5);opacity:0.8}
    100%{transform:scale(2);opacity:0}
}

.element-shadow, .element-void{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(80,0,120,.95) 0%,rgba(40,0,80,.7) 40%,transparent 70%);
    filter:blur(10px);
    animation:shadowBurst 0.8s ease-out forwards;
}
@keyframes shadowBurst{
    0%{transform:scale(0.3);opacity:1;filter:blur(10px)}
    50%{transform:scale(1.6);opacity:0.8;filter:blur(15px)}
    100%{transform:scale(2.2);opacity:0;filter:blur(25px)}
}

.element-earth{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(180,140,80,.95) 0%,rgba(120,80,40,.7) 40%,transparent 70%);
    filter:blur(6px);
    animation:earthBurst 0.6s ease-out forwards;
}
@keyframes earthBurst{
    0%{transform:scale(0.4) translateY(0);opacity:1}
    40%{transform:scale(1.4) translateY(-15px);opacity:1}
    100%{transform:scale(1.8) translateY(10px);opacity:0}
}

.element-poison{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(170,50,220,.95) 0%,rgba(120,20,170,.7) 40%,transparent 70%);
    filter:blur(8px);
    animation:poisonBurst 0.8s ease-out forwards;
}
@keyframes poisonBurst{
    0%{transform:scale(0.3);opacity:1}
    30%{transform:scale(1.2);opacity:1}
    60%{transform:scale(1.0);opacity:0.8}
    100%{transform:scale(1.7);opacity:0}
}

.element-water{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(50,150,255,.95) 0%,rgba(30,100,200,.7) 40%,transparent 70%);
    filter:blur(6px);
    animation:waterBurst 0.7s ease-out forwards;
}
@keyframes waterBurst{
    0%{transform:scale(0.3);opacity:1}
    50%{transform:scale(1.5);opacity:0.9}
    100%{transform:scale(2);opacity:0}
}

.element-lightning{
    width:100px;height:100px;
    background:radial-gradient(circle,rgba(255,255,100,.98) 0%,rgba(255,200,50,.7) 40%,transparent 70%);
    filter:blur(3px);
    animation:lightningBurst 0.4s ease-out forwards;
}
@keyframes lightningBurst{
    0%{transform:scale(0.2);opacity:1}
    20%{transform:scale(2);opacity:1}
    40%{transform:scale(0.8);opacity:0.9}
    60%{transform:scale(1.6);opacity:0.6}
    100%{transform:scale(2.2);opacity:0}
}

/* Impact flash on hit */
.impact-flash{
    position:fixed;
    width:80px;height:80px;
    border-radius:50%;
    pointer-events:none;
    z-index:2001;
    background:radial-gradient(circle,rgba(255,255,255,0.95) 0%,rgba(255,255,255,0) 70%);
    animation:impactFlash 0.2s ease-out forwards;
}
@keyframes impactFlash{
    0%{transform:scale(0.3);opacity:1}
    100%{transform:scale(2.5);opacity:0}
}

/* Slash effect for physical attacks */
.slash-effect{
    position:fixed;
    width:120px;height:120px;
    pointer-events:none;
    z-index:2000;
    animation:slashAnim 0.25s ease-out forwards;
}
@keyframes slashAnim{
    0%{opacity:0;transform:scale(0.5) rotate(-60deg)}
    30%{opacity:1;transform:scale(1.3) rotate(-15deg)}
    100%{opacity:0;transform:scale(1.6) rotate(15deg)}
}
.slash-effect::before{
    content:'';position:absolute;top:50%;left:0;width:100%;height:6px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),#fff,rgba(255,255,255,0.9),transparent);
    transform:translateY(-50%);border-radius:3px;
    box-shadow:0 0 15px #fff,0 0 30px rgba(255,255,255,0.6);
}
.slash-effect::after{
    content:'';position:absolute;top:45%;left:10%;width:80%;height:3px;
    background:linear-gradient(90deg,transparent,rgba(255,220,100,0.8),transparent);
    transform:translateY(-50%) rotate(8deg);border-radius:2px;
}

/* Heal burst effect */
.heal-burst{
    position:fixed;
    width:100px;height:100px;
    pointer-events:none;
    z-index:2000;
    background:radial-gradient(circle,rgba(100,255,150,0.9) 0%,rgba(50,200,100,0.5) 40%,transparent 70%);
    animation:healBurst 0.8s ease-out forwards;
}
@keyframes healBurst{
    0%{transform:scale(0.3);opacity:1}
    50%{transform:scale(1.4);opacity:0.8}
    100%{transform:scale(1.8) translateY(-30px);opacity:0}
}

/* ============================================
   COMBAT UI - Premium Fantasy RPG HUD
   Active creature as the star
   ============================================ */
.combat-ui{
    background:linear-gradient(180deg,rgba(15,10,25,.98),rgba(8,5,15,.99));
    border-top:1px solid rgba(255,200,100,.25);
    padding:10px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex-shrink:0;
    min-height:160px;
    max-height:30vh;
    box-shadow:inset 0 2px 20px rgba(0,0,0,.5);
}

/* ============================================
   ACTIVE CREATURE PANEL
   ============================================ */
.active-creature-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:8px 16px;
    min-height:90px;
    max-height:90px;
    background:linear-gradient(135deg,rgba(40,30,60,.9),rgba(25,18,40,.95));
    border:1px solid rgba(232,184,74,.4);
    border-radius:12px;
    box-shadow:0 0 25px rgba(232,184,74,.15),inset 0 1px 0 rgba(255,255,255,.08);
    position:relative;
    overflow:hidden;
}
.active-creature-panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,220,150,.4),transparent);
}
.active-creature-panel::after{
    content:'';position:absolute;inset:3px;border-radius:10px;
    border:1px solid rgba(255,255,255,.03);pointer-events:none;
}

/* Large Portrait - FIXED SIZE */
.active-portrait{
    width:70px;
    height:70px;
    min-width:70px;
    min-height:70px;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(0,0,0,.4),rgba(20,15,30,.6));
    box-shadow:0 4px 15px rgba(0,0,0,.5),inset 0 0 20px rgba(0,0,0,.3);
    flex-shrink:0;
    position:relative;
}
.active-portrait img{width:100%;height:100%;object-fit:contain}
.active-portrait::after{
    content:'';position:absolute;inset:0;
    border:2px solid rgba(232,184,74,.5);border-radius:10px;
    box-shadow:inset 0 0 10px rgba(232,184,74,.2);
}

/* Active creature info - FIXED WIDTH */
.active-info{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:180px;
    max-width:200px;
}
.active-name{
    font-family:'Cinzel',serif;
    font-size:1rem;
    color:#f8d888;
    font-weight:700;
    text-shadow:0 0 10px rgba(232,184,74,.4);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.active-level{
    font-size:.7rem;
    color:#a09080;
    margin-left:6px;
}

/* Thick HP Bar */
.active-hp-bar{
    width:100%;height:14px;
    background:rgba(0,0,0,.6);
    border-radius:7px;
    overflow:hidden;
    border:1px solid rgba(74,222,128,.35);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4);
    position:relative;
}
.active-hp-fill{
    height:100%;
    border-radius:6px;
    background:linear-gradient(180deg,#4ade80,#22c55e 50%,#16a34a);
    box-shadow:0 0 8px rgba(74,222,128,.4);
    transition:width .4s ease-out, background .3s ease;
}
/* HP bar color transitions based on HP% */
.active-hp-fill.hp-low{
    background:linear-gradient(180deg,#fbbf24,#f59e0b 50%,#d97706);
    box-shadow:0 0 8px rgba(251,191,36,.4);
}
.active-hp-fill.hp-critical{
    background:linear-gradient(180deg,#f87171,#ef4444 50%,#dc2626);
    box-shadow:0 0 8px rgba(248,113,113,.5);
    animation:criticalPulse 1.5s ease-in-out infinite;
}
@keyframes criticalPulse{
    0%,100%{opacity:1}
    50%{opacity:0.85}
}
.active-hp-bar::after{
    content:'HP';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:.55rem;color:rgba(255,255,255,.7);font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.active-hp-text{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    font-size:.6rem;color:#fff;font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
}

/* Thick Focus Bar */
.active-focus-bar{
    width:100%;height:10px;
    background:rgba(0,0,0,.6);
    border-radius:5px;
    overflow:hidden;
    border:1px solid rgba(96,165,250,.35);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4);
    position:relative;
}
.active-focus-fill{
    height:100%;
    border-radius:4px;
    background:linear-gradient(180deg,#60a5fa,#3b82f6 50%,#2563eb);
    box-shadow:0 0 8px rgba(96,165,250,.4);
    transition:width .4s ease-out, box-shadow .3s ease;
}
/* Focus full - ready for special! */
.active-focus-fill.focus-full{
    box-shadow:0 0 16px rgba(96,165,250,.8), 0 0 30px rgba(96,165,250,.5);
    animation:focusReady 2s ease-in-out infinite;
}
@keyframes focusReady{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.3)}
}
.active-focus-bar::after{
    content:'FP';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:.5rem;color:rgba(255,255,255,.6);font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
}

/* ============================================
   INACTIVE PARTY - Smaller, less prominent
   ============================================ */
.inactive-party{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:nowrap;
    overflow-x:auto;
}
.inactive-member{
    display:flex;
    align-items:center;
    gap:5px;
    background:rgba(20,15,35,.7);
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    padding:4px 8px;
    min-width:100px;
    max-width:130px;
    transition:all .2s;
}
.inactive-member.ko{opacity:.3;filter:grayscale(.8)}
.inactive-member.heal-target{border-color:#4ade80;cursor:pointer}

.inactive-portrait{
    width:32px;height:32px;
    border-radius:5px;
    overflow:hidden;
    background:rgba(0,0,0,.3);
    flex-shrink:0;
}
.inactive-portrait img{width:100%;height:100%;object-fit:contain}

.inactive-info{
    flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;
}
.inactive-name{
    font-size:.6rem;color:#ccc;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
}
.inactive-bars{display:flex;flex-direction:column;gap:2px}
.inactive-hp{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
.inactive-hp-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:3px}
.inactive-focus{height:4px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden}
.inactive-focus-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:2px}

/* Party Bar - Keep for backwards compat but hide when new UI active */
.party-bar{display:none}
.party-member{display:none}

/* ============================================
   MOVE BUTTONS - Slim, Game-Like
   ============================================ */
.move-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.move-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:10px 18px;
    background:linear-gradient(180deg,rgba(50,45,70,.95),rgba(30,26,50,.98));
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    cursor:pointer;
    transition:all .18s ease;
    min-width:100px;
    position:relative;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.move-btn::before{
    content:'';position:absolute;top:0;left:0;right:0;height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);
    pointer-events:none;
}
.move-btn:hover:not(:disabled){
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.3);
    box-shadow:0 8px 25px rgba(0,0,0,.45);
}
.move-btn:active:not(:disabled){
    transform:translateY(0px);
    box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.move-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
    filter:grayscale(0.6);
}

.move-btn img{width:20px;height:20px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.move-btn .move-name{
    font-family:'Cinzel',serif;
    font-size:.78rem;
    color:#fff;
    font-weight:700;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.move-btn .move-cost{
    font-size:.65rem;
    color:#60a5fa;
    margin-left:auto;
    font-weight:600;
}
.move-btn .move-cost.insufficient{color:#f87171;font-weight:700}

/* Button type colors */
.move-btn.attack{
    border-color:rgba(248,113,113,.35);
    background:linear-gradient(180deg,rgba(60,30,30,.95),rgba(40,18,18,.98));
}
.move-btn.attack:hover:not(:disabled){
    border-color:rgba(248,113,113,.6);
    box-shadow:0 0 15px rgba(248,113,113,.2),0 6px 20px rgba(0,0,0,.4);
}

.move-btn.defend{
    border-color:rgba(96,165,250,.35);
    background:linear-gradient(180deg,rgba(25,45,70,.95),rgba(15,28,50,.98));
}
.move-btn.defend:hover:not(:disabled){
    border-color:rgba(96,165,250,.6);
    box-shadow:0 0 15px rgba(96,165,250,.2),0 6px 20px rgba(0,0,0,.4);
}

.move-btn.heal{
    border-color:rgba(74,222,128,.35);
    background:linear-gradient(180deg,rgba(25,55,40,.95),rgba(15,35,25,.98));
}
.move-btn.heal:hover:not(:disabled){
    border-color:rgba(74,222,128,.6);
    box-shadow:0 0 15px rgba(74,222,128,.2),0 6px 20px rgba(0,0,0,.4);
}

.move-btn.special{
    border-color:rgba(251,191,36,.35);
    background:linear-gradient(180deg,rgba(55,45,25,.95),rgba(35,28,15,.98));
}
.move-btn.special:hover:not(:disabled){
    border-color:rgba(251,191,36,.6);
    box-shadow:0 0 15px rgba(251,191,36,.2),0 6px 20px rgba(0,0,0,.4);
}

/* ============================================
   ARENA - Active Creature Indicator
   Green pulse circle under active creature
   ============================================ */
.arena-creature.active-turn{position:relative}
.arena-creature.active-turn::before{
    content:'';
    position:absolute;
    bottom:-5px;left:50%;
    transform:translateX(-50%);
    width:90%;height:20px;
    background:radial-gradient(ellipse,rgba(100,200,120,.35) 0%,rgba(80,180,100,.15) 50%,transparent 70%);
    border-radius:50%;
    animation:activePulse 2s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
}
@keyframes activePulse{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.6}
    50%{transform:translateX(-50%) scale(1.15);opacity:.9}
}

/* Active arrow - more subtle */
.active-arrow{
    position:absolute;
    top:-20px;left:50%;
    transform:translateX(-50%);
    color:#f8d888;
    font-size:1rem;
    text-shadow:0 0 10px rgba(232,184,74,.6);
    animation:bounceArrow 1s ease-in-out infinite;
    z-index:10;
}

.move-btn.heal{border-color:rgba(74,222,128,.4);background:linear-gradient(180deg,#163d28,#0b2015)}
.move-btn.heal:hover:not(:disabled){box-shadow:0 0 20px rgba(74,222,128,.3),0 6px 20px rgba(0,0,0,.4)}

.move-btn.special{border-color:rgba(251,191,36,.4);background:linear-gradient(180deg,#5a410f,#332508)}
.move-btn.special:hover:not(:disabled){box-shadow:0 0 20px rgba(251,191,36,.3),0 6px 20px rgba(0,0,0,.4)}

/* AOE/ST Labels for Special Attacks */
.aoe-label,.st-label{
    display:inline-block;
    font-size:0.65rem;
    font-weight:700;
    padding:1px 5px;
    border-radius:3px;
    margin-left:4px;
    vertical-align:middle;
}
.aoe-label{
    background:linear-gradient(135deg,#f97316,#dc2626);
    color:#fff;
    box-shadow:0 0 6px rgba(249,115,22,0.4);
}
.st-label{
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    color:#fff;
    box-shadow:0 0 6px rgba(59,130,246,0.4);
}

/* Battle Log - Compact */
.battle-log{
    max-height:150px; /* v54.6: Reduced from 180px to minimize overlap */
    overflow-y:auto;
    scroll-behavior:smooth;
    background:rgba(0,0,0,.5); /* v54.6: Darker for better readability */
    border-radius:6px;
    padding:0; /* v54.6: Remove padding, header handles it */
    border:1px solid rgba(255,255,255,.1);
}
.log-entry{font-size:.7rem;color:#777;padding:2px 0}
.log-entry.log-dmg{color:#f87171}
.log-entry.log-heal{color:#4ade80}
.log-entry.log-def{color:#60a5fa}
.log-entry.log-spec{color:#fbbf24}
.log-entry.log-enemy{color:#ff9999}
.log-entry.log-focus{color:#60a5fa}
.log-entry.log-atk{color:#f87171}
.log-entry.log-info{color:#aaa}

/* v54.6: Collapsible Battle Log */
.battle-log-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 8px;
    background:rgba(0,0,0,.4);
    border-radius:6px 6px 0 0;
    cursor:pointer;
    user-select:none;
    border-bottom:1px solid rgba(255,255,255,.1);
}
.battle-log-header:hover{background:rgba(0,0,0,.5)}
.battle-log-title{font-size:.75rem;color:#888;font-family:'Cinzel',serif}
.battle-log-toggle{font-size:.8rem;color:#666;transition:transform .2s}
.battle-log.collapsed .battle-log-toggle{transform:rotate(180deg)}
.battle-log.collapsed .battle-log-content{display:none}
.battle-log-content{
    max-height:160px;
    overflow-y:auto;
    padding:6px 8px;
}

/* ============================================
   COMBAT ANIMATIONS - No flashes, impact only
   ============================================ */

/* Player attack dash - right toward enemy */
.anim-dash-right{animation:dashRight 200ms cubic-bezier(.25,.46,.45,.94)}
@keyframes dashRight{
    0%{transform:translateX(0) scale(1)}
    40%{transform:translateX(45px) scale(1.08)}
    100%{transform:translateX(0) scale(1)}
}

/* Enemy attack dash - left toward player */
.anim-dash-left{animation:dashLeft 200ms cubic-bezier(.25,.46,.45,.94)}
@keyframes dashLeft{
    0%{transform:translateX(0) scale(1)}
    40%{transform:translateX(-55px) scale(1.1)}
    100%{transform:translateX(0) scale(1)}
}

/* Special attack */
.anim-special-dash{animation:specialDash 280ms cubic-bezier(.25,.46,.45,.94)}
@keyframes specialDash{
    0%{transform:translateX(0) scale(1);filter:brightness(1)}
    35%{transform:translateX(55px) scale(1.12);filter:brightness(1.3)}
    100%{transform:translateX(0) scale(1);filter:brightness(1)}
}

/* ============================================
   IMPROVED ATTACK ANIMATIONS
   ============================================ */

/* Attack windup - charge before strike */
.anim-windup{animation:attackWindup 300ms ease-out}
@keyframes attackWindup{
    0%{transform:translateX(0) scale(1)}
    50%{transform:translateX(-15px) scale(0.95)}
    100%{transform:translateX(0) scale(1)}
}

/* Slam attack - powerful downward strike */
.anim-slam{animation:slamAttack 350ms cubic-bezier(.6,.04,.98,.34)}
@keyframes slamAttack{
    0%{transform:translateY(0) scale(1)}
    30%{transform:translateY(-20px) scale(1.1)}
    60%{transform:translateY(10px) scale(1.05)}
    100%{transform:translateY(0) scale(1)}
}

/* Spin attack */
.anim-spin{animation:spinAttack 400ms ease-out}
@keyframes spinAttack{
    0%{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(360deg) scale(1.15)}
    100%{transform:rotate(720deg) scale(1)}
}

/* Charge glow before special */
.anim-charge{animation:chargeUp 500ms ease-out}
@keyframes chargeUp{
    0%{filter:brightness(1);transform:scale(1)}
    50%{filter:brightness(1.5) drop-shadow(0 0 20px var(--card-glow, #fff));transform:scale(1.1)}
    100%{filter:brightness(1.2) drop-shadow(0 0 30px var(--card-glow, #fff));transform:scale(1.05)}
}

/* Impact flash on hit */
.anim-hit-flash{animation:hitFlash 150ms ease-out}
@keyframes hitFlash{
    0%{filter:brightness(1)}
    50%{filter:brightness(2) saturate(0.5)}
    100%{filter:brightness(1)}
}

/* Death fade */
.anim-death{animation:deathFade 600ms ease-out forwards}
@keyframes deathFade{
    0%{opacity:1;transform:scale(1)}
    50%{opacity:0.5;transform:scale(0.9) translateY(10px)}
    100%{opacity:0.1;transform:scale(0.7) translateY(20px);filter:grayscale(1)}
}

/* Victory bounce */
.anim-victory{animation:victoryBounce 500ms ease-out}
@keyframes victoryBounce{
    0%,100%{transform:translateY(0) scale(1)}
    25%{transform:translateY(-15px) scale(1.05)}
    50%{transform:translateY(0) scale(1)}
    75%{transform:translateY(-8px) scale(1.02)}
}

/* ============================================
   PROJECTILE ANIMATIONS
   ============================================ */
.projectile{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:30px;
    height:30px;
    border-radius:50%;
}

.projectile.fire{
    background:radial-gradient(circle,#ff6b00 0%,#ff4500 50%,transparent 70%);
    box-shadow:0 0 20px #ff6b00,0 0 40px #ff4500;
    animation:projectileFly 400ms ease-in forwards,fireFlicker 100ms infinite;
}

.projectile.ice{
    background:radial-gradient(circle,#b3e5fc 0%,#4fc3f7 50%,transparent 70%);
    box-shadow:0 0 15px #4fc3f7,0 0 30px #81d4fa;
    animation:projectileFly 400ms ease-in forwards,iceSparkle 150ms infinite;
}

.projectile.nature{
    background:radial-gradient(circle,#81c784 0%,#4caf50 50%,transparent 70%);
    box-shadow:0 0 15px #4caf50,0 0 25px #81c784;
    animation:projectileFly 400ms ease-in forwards;
}

.projectile.shadow,.projectile.void{
    background:radial-gradient(circle,#7b1fa2 0%,#4a148c 50%,transparent 70%);
    box-shadow:0 0 20px #9c27b0,0 0 40px #7b1fa2;
    animation:projectileFly 400ms ease-in forwards,shadowPulse 200ms infinite;
}

.projectile.earth{
    background:radial-gradient(circle,#a1887f 0%,#795548 50%,transparent 70%);
    box-shadow:0 0 15px #795548;
    animation:projectileFly 350ms ease-in forwards;
}

.projectile.poison{
    background:radial-gradient(circle,#ce93d8 0%,#9c27b0 50%,transparent 70%);
    box-shadow:0 0 15px #9c27b0,0 0 25px #7b1fa2;
    animation:projectileFly 400ms ease-in forwards,poisonBubble 100ms infinite;
}

.projectile.water{
    background:radial-gradient(circle,#4fc3f7 0%,#0288d1 50%,transparent 70%);
    box-shadow:0 0 15px #0288d1,0 0 30px #4fc3f7;
    animation:projectileFly 380ms ease-in forwards;
}

.projectile.lightning{
    background:radial-gradient(circle,#ffeb3b 0%,#ffc107 50%,transparent 70%);
    box-shadow:0 0 20px #ffeb3b,0 0 40px #ffc107;
    animation:projectileFly 250ms ease-in forwards,lightningFlash 50ms infinite;
}

/* Mythical Projectile - Divine Runic Ice/Lightning Orb */
.projectile.mythical{
    background:radial-gradient(circle,#ffffff 0%,#7dd3fc 30%,#38bdf8 60%,transparent 75%);
    box-shadow:0 0 25px #7dd3fc,0 0 50px #38bdf8,0 0 80px rgba(255,255,200,.4);
    animation:projectileFly 320ms ease-in forwards,mythicalProjectilePulse 80ms infinite;
    width:40px;
    height:40px;
}
.projectile.mythical::before{
    content:'';
    position:absolute;
    inset:-5px;
    background:radial-gradient(circle,transparent 40%,rgba(255,255,150,.3) 60%,transparent 80%);
    border-radius:50%;
    animation:runeOrbit 200ms linear infinite;
}
@keyframes mythicalProjectilePulse{
    0%,100%{filter:brightness(1) hue-rotate(0deg)}
    50%{filter:brightness(1.4) hue-rotate(15deg)}
}
@keyframes runeOrbit{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

@keyframes projectileFly{
    0%{transform:scale(0.5);opacity:1}
    70%{transform:scale(1.2);opacity:1}
    100%{transform:scale(0.3);opacity:0}
}

@keyframes fireFlicker{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.3)}
}

@keyframes iceSparkle{
    0%,100%{filter:brightness(1) hue-rotate(0deg)}
    50%{filter:brightness(1.2) hue-rotate(10deg)}
}

@keyframes shadowPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

@keyframes poisonBubble{
    0%,100%{border-radius:50%}
    50%{border-radius:45%}
}

@keyframes lightningFlash{
    0%,100%{opacity:1}
    50%{opacity:0.7}
}

/* ============================================
   IMPACT EFFECTS
   ============================================ */
.impact-effect{
    position:fixed;
    pointer-events:none;
    z-index:2400;
    animation:impactBurst 400ms ease-out forwards;
}

@keyframes impactBurst{
    0%{transform:scale(0.3);opacity:1}
    50%{transform:scale(1.5);opacity:0.8}
    100%{transform:scale(2);opacity:0}
}

.impact-effect.crit{
    animation:critImpact 500ms ease-out forwards;
}

@keyframes critImpact{
    0%{transform:scale(0.5);opacity:1}
    30%{transform:scale(2);opacity:1}
    100%{transform:scale(3);opacity:0}
}

/* Slash effect */
.slash-effect{
    position:fixed;
    pointer-events:none;
    z-index:2400;
    width:100px;
    height:20px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
    transform-origin:center;
    animation:slashSwipe 200ms ease-out forwards;
}

@keyframes slashSwipe{
    0%{transform:scaleX(0) rotate(-15deg);opacity:1}
    50%{transform:scaleX(1) rotate(-15deg);opacity:1}
    100%{transform:scaleX(1.2) rotate(-15deg);opacity:0}
}

/* Hit shake - subtle, on impact only */
.anim-hit-shake{animation:hitShake 160ms ease-out}
@keyframes hitShake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
}

/* Crit shake - stronger */
.anim-crit-shake{animation:critShake 220ms ease-out}
@keyframes critShake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-8px,-2px)}
    40%{transform:translate(8px,2px)}
    60%{transform:translate(-5px,-1px)}
    80%{transform:translate(5px,1px)}
}

/* Heal glow */
.anim-heal{animation:healGlow 450ms ease-out}
@keyframes healGlow{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.25) drop-shadow(0 0 15px rgba(74,222,128,.4))}
}

/* Defend shimmer */
.anim-defend{animation:defendShimmer 320ms ease-out}
@keyframes defendShimmer{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.15) drop-shadow(0 0 12px rgba(96,165,250,.4))}
}

/* Screen shake - ONLY on major boss impacts */
.battle-container.screen-shake{animation:screenShake 200ms ease-out}
@keyframes screenShake{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}
    75%{transform:translate(-2px,1px)}
}

/* v54.6: Wave/Tsunami animation - sweeps across screen */
.wave-attack{
    position:fixed;
    left:0;
    right:0;
    height:200px;
    top:calc(50% - 50px);
    background:linear-gradient(to top,rgba(59,130,246,0.7),rgba(147,197,253,0.4),transparent);
    pointer-events:none;
    z-index:2000;
    animation:waveSweep 1.2s ease-out forwards;
}
.wave-attack::before{
    content:'';
    position:absolute;
    left:0;right:0;top:0;
    height:30px;
    background:linear-gradient(to bottom,rgba(255,255,255,0.6),transparent);
    border-radius:50% 50% 0 0;
}
@keyframes waveSweep{
    0%{transform:translateX(-100%) scaleY(0.5);opacity:0}
    15%{opacity:1;transform:translateX(-70%) scaleY(1)}
    85%{opacity:1;transform:translateX(70%) scaleY(1)}
    100%{transform:translateX(100%) scaleY(0.5);opacity:0}
}
@keyframes waveSweepReverse{
    0%{transform:translateX(100%) scaleY(0.5);opacity:0}
    15%{opacity:1;transform:translateX(70%) scaleY(1)}
    85%{opacity:1;transform:translateX(-70%) scaleY(1)}
    100%{transform:translateX(-100%) scaleY(0.5);opacity:0}
}

/* ============================================
   MYTHICAL CREATURE SPECIAL ANIMATIONS
   Divine Norse Runic Effects
   ============================================ */

/* Cosmic Frost Nova - Full screen frost explosion with runes */
.cosmic-frost-nova{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:3500;
    background:radial-gradient(circle at center,
        rgba(255,255,255,0) 0%,
        rgba(125,211,252,0.2) 20%,
        rgba(56,189,248,0.4) 40%,
        rgba(125,211,252,0.6) 60%,
        rgba(255,255,255,0.3) 80%,
        transparent 100%);
    animation:cosmicFrostExpand 1.5s ease-out forwards;
}
.cosmic-frost-nova::before{
    content:'';position:absolute;inset:0;
    background:repeating-conic-gradient(from 0deg,
        transparent 0deg,rgba(255,255,255,.1) 5deg,
        transparent 10deg,rgba(125,211,252,.15) 15deg,
        transparent 20deg);
    animation:runeSpinSlow 2s linear;
}
.cosmic-frost-nova::after{
    content:'';position:absolute;
    top:50%;left:50%;
    width:300px;height:300px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(125,211,252,.6) 30%,transparent 70%);
    border-radius:50%;
    animation:cosmicCoreFlash 0.8s ease-out;
}
@keyframes cosmicFrostExpand{
    0%{opacity:0;transform:scale(0)}
    20%{opacity:1;transform:scale(0.5)}
    60%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(2)}
}
@keyframes runeSpinSlow{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(180deg)}
}
@keyframes cosmicCoreFlash{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1}
    50%{transform:translate(-50%,-50%) scale(2);opacity:1}
    100%{transform:translate(-50%,-50%) scale(4);opacity:0}
}

/* Ragnarok Thunderstrike - Lightning from sky with screen shake */
.ragnarok-thunder{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:3400;
    overflow:hidden;
}
.ragnarok-thunder::before{
    content:'';position:absolute;
    top:0;left:50%;
    width:8px;
    height:100vh;
    background:linear-gradient(180deg,
        rgba(255,255,200,1) 0%,
        rgba(125,211,252,0.9) 30%,
        rgba(56,189,248,0.7) 60%,
        rgba(255,255,150,0.5) 100%);
    transform:translateX(-50%);
    box-shadow:0 0 60px 30px rgba(255,255,200,.8),
               0 0 120px 60px rgba(125,211,252,.5),
               0 0 200px 100px rgba(56,189,248,.3);
    animation:thunderBolt 0.6s ease-out forwards;
}
.ragnarok-thunder::after{
    content:'';position:absolute;inset:0;
    background:rgba(255,255,200,.3);
    animation:thunderFlash 0.4s ease-out forwards;
}
@keyframes thunderBolt{
    0%{opacity:0;height:0}
    10%{opacity:1;height:100vh}
    40%{opacity:1;width:20px}
    70%{opacity:0.8;width:4px}
    100%{opacity:0;width:2px}
}
@keyframes thunderFlash{
    0%{opacity:0}
    20%{opacity:0.5}
    40%{opacity:0.2}
    60%{opacity:0.4}
    100%{opacity:0}
}

/* Northern Tempest - Swirling ice/wind effect */
.northern-tempest{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:3300;
    overflow:hidden;
}
.northern-tempest::before{
    content:'';position:absolute;
    top:50%;left:50%;
    width:150vmax;height:150vmax;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,
        transparent 0deg,
        rgba(125,211,252,.3) 30deg,
        transparent 60deg,
        rgba(255,255,255,.2) 90deg,
        transparent 120deg,
        rgba(56,189,248,.25) 150deg,
        transparent 180deg,
        rgba(125,211,252,.3) 210deg,
        transparent 240deg,
        rgba(255,255,255,.2) 270deg,
        transparent 300deg,
        rgba(56,189,248,.25) 330deg,
        transparent 360deg);
    animation:tempestSpin 1.5s ease-in-out forwards;
}
@keyframes tempestSpin{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(0);opacity:0}
    30%{transform:translate(-50%,-50%) rotate(180deg) scale(1);opacity:1}
    70%{transform:translate(-50%,-50%) rotate(540deg) scale(1.2);opacity:1}
    100%{transform:translate(-50%,-50%) rotate(720deg) scale(1.5);opacity:0}
}

/* Divine Icy Rebirth - Healing aura with rising runes */
.divine-rebirth{
    position:fixed;
    pointer-events:none;
    z-index:3200;
    width:200px;height:200px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(125,211,252,.6) 0%,
        rgba(56,189,248,.3) 40%,
        transparent 70%);
    box-shadow:0 0 60px rgba(125,211,252,.5),
               0 0 120px rgba(56,189,248,.3);
    animation:divineAuraRise 1.2s ease-out forwards;
}
.divine-rebirth::before{
    content:'ᚱᚢᚾᛖ';
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:2rem;
    color:rgba(255,255,255,.8);
    text-shadow:0 0 20px rgba(125,211,252,1);
    animation:runeFloat 1.2s ease-out;
}
@keyframes divineAuraRise{
    0%{transform:scale(0.5) translateY(50px);opacity:0}
    40%{transform:scale(1.2) translateY(-20px);opacity:1}
    100%{transform:scale(1.5) translateY(-80px);opacity:0}
}
@keyframes runeFloat{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
    100%{opacity:0;transform:translate(-50%,-100%) scale(1)}
}

/* Absolute Rune Aegis - Defensive barrier with rune circle */
.rune-aegis{
    position:fixed;
    pointer-events:none;
    z-index:3100;
    width:180px;height:180px;
    border:4px solid rgba(125,211,252,.8);
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(56,189,248,.2) 0%,
        rgba(125,211,252,.1) 50%,
        transparent 70%);
    box-shadow:0 0 30px rgba(125,211,252,.6),
               inset 0 0 40px rgba(56,189,248,.3);
    animation:aegisAppear 0.8s ease-out forwards;
}
.rune-aegis::before{
    content:'';position:absolute;inset:10px;
    border:2px solid rgba(255,255,255,.4);
    border-radius:50%;
    animation:aegisInnerSpin 1s linear;
}
.rune-aegis::after{
    content:'';position:absolute;inset:-15px;
    border:2px dashed rgba(125,211,252,.5);
    border-radius:50%;
    animation:aegisOuterSpin 1.5s linear;
}
@keyframes aegisAppear{
    0%{transform:scale(0);opacity:0}
    40%{transform:scale(1.3);opacity:1}
    70%{transform:scale(0.9);opacity:1}
    100%{transform:scale(1);opacity:0}
}
@keyframes aegisInnerSpin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(-180deg)}
}
@keyframes aegisOuterSpin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

/* v54.5: Shield pop animation for defend */
@keyframes shieldPop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* Critical hit flash - dramatic white screen flash */
.crit-flash{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.25);
    pointer-events:none;
    z-index:3000;
    animation:critFlash 300ms ease-out forwards;
}
@keyframes critFlash{
    0%{opacity:0}
    30%{opacity:1}
    100%{opacity:0}
}

/* HP bar damage flash */
.pm-hp-bar.anim-damage{animation:barDamageFlash 250ms ease-out}
@keyframes barDamageFlash{
    0%,100%{box-shadow:none}
    50%{box-shadow:0 0 12px rgba(255,100,100,.6)}
}

/* HP bar heal flash */
.pm-hp-bar.anim-heal{animation:barHealFlash 250ms ease-out}
@keyframes barHealFlash{
    0%,100%{box-shadow:none}
    50%{box-shadow:0 0 12px rgba(74,222,128,.6)}
}

/* Focus bar change */
.pm-focus-bar.anim-spend{animation:focusSpend 300ms ease-out}
@keyframes focusSpend{
    0%,100%{box-shadow:none}
    50%{box-shadow:0 0 10px rgba(96,165,250,.5)}
}

/* Floating Damage Numbers */
.damage-float{
    position:fixed;
    font-family:'Fredoka One',cursive;
    font-size:1.8rem;
    font-weight:700;
    pointer-events:none;
    z-index:100;
    animation:damageFloatUp .85s ease-out forwards;
    text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;
}
.damage-float.damage{color:#ff6b6b}
.damage-float.heal{color:#4ade80}
.damage-float.crit{color:#fbbf24;font-size:2.2rem;animation:damageFloatCrit .85s ease-out forwards}
@keyframes damageFloatUp{
    0%{opacity:1;transform:translateY(0) scale(.85)}
    20%{transform:translateY(-18px) scale(1.05)}
    100%{opacity:0;transform:translateY(-55px) scale(.9)}
}
@keyframes damageFloatCrit{
    0%{opacity:1;transform:translateY(0) scale(.85)}
    25%{transform:translateY(-25px) scale(1.2)}
    100%{opacity:0;transform:translateY(-65px) scale(1)}
}

/* Hit spark effect */
.hit-spark{
    position:fixed;
    width:40px;height:40px;
    pointer-events:none;
    z-index:99;
    animation:sparkBurst .3s ease-out forwards;
}
.hit-spark::before,.hit-spark::after{
    content:'';
    position:absolute;
    background:radial-gradient(circle,rgba(255,200,100,.9) 0%,rgba(255,150,50,.5) 40%,transparent 70%);
    border-radius:50%;
}
.hit-spark::before{
    width:100%;height:100%;
    top:0;left:0;
}
.hit-spark::after{
    width:60%;height:60%;
    top:20%;left:20%;
    background:radial-gradient(circle,#fff 0%,rgba(255,220,150,.8) 50%,transparent 70%);
}
@keyframes sparkBurst{
    0%{transform:scale(0);opacity:1}
    50%{transform:scale(1.2);opacity:1}
    100%{transform:scale(0.5);opacity:0}
}

/* ============================================
   v54.6: ENHANCED ATTACK ANIMATIONS
   Multi-slash, element trails, combos
   ============================================ */

/* Multi-slash effect - diagonal slashes for heavy attacks */
.multi-slash{
    position:fixed;
    pointer-events:none;
    z-index:2500;
    width:120px;
    height:120px;
}
.multi-slash .slash-line{
    position:absolute;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.9) 20%,rgba(255,255,255,1) 50%,rgba(255,255,255,0.9) 80%,transparent 100%);
    border-radius:2px;
    transform-origin:center;
    opacity:0;
    filter:drop-shadow(0 0 8px rgba(255,255,255,0.8));
}
.multi-slash .slash-line:nth-child(1){
    top:30%;left:0;
    transform:rotate(-45deg);
    animation:slashAppear 150ms 0ms ease-out forwards;
}
.multi-slash .slash-line:nth-child(2){
    top:50%;left:0;
    transform:rotate(45deg);
    animation:slashAppear 150ms 80ms ease-out forwards;
}
.multi-slash .slash-line:nth-child(3){
    top:70%;left:0;
    transform:rotate(-15deg);
    animation:slashAppear 150ms 160ms ease-out forwards;
}
@keyframes slashAppear{
    0%{opacity:0;transform:rotate(var(--rot,-45deg)) scaleX(0)}
    30%{opacity:1;transform:rotate(var(--rot,-45deg)) scaleX(1.2)}
    100%{opacity:0;transform:rotate(var(--rot,-45deg)) scaleX(1.5) translateX(30px)}
}

/* Element trail particles */
.element-trail{
    position:fixed;
    pointer-events:none;
    z-index:2450;
    width:12px;
    height:12px;
    border-radius:50%;
    animation:trailFade 400ms ease-out forwards;
}
.element-trail.fire{
    background:radial-gradient(circle,#ff9500,#ff4500);
    box-shadow:0 0 12px #ff6b00,0 0 24px #ff4500;
}
.element-trail.ice{
    background:radial-gradient(circle,#b3e5fc,#4fc3f7);
    box-shadow:0 0 10px #4fc3f7,0 0 20px #81d4fa;
}
.element-trail.nature{
    background:radial-gradient(circle,#a5d6a7,#4caf50);
    box-shadow:0 0 10px #4caf50,0 0 18px #81c784;
}
.element-trail.lightning{
    background:radial-gradient(circle,#fff59d,#ffeb3b);
    box-shadow:0 0 15px #ffeb3b,0 0 30px #ffc107;
}
.element-trail.water{
    background:radial-gradient(circle,#81d4fa,#0288d1);
    box-shadow:0 0 10px #0288d1,0 0 20px #4fc3f7;
}
.element-trail.earth{
    background:radial-gradient(circle,#d7ccc8,#8d6e63);
    box-shadow:0 0 8px #795548;
}
.element-trail.shadow,.element-trail.void{
    background:radial-gradient(circle,#ce93d8,#7b1fa2);
    box-shadow:0 0 12px #9c27b0,0 0 24px #7b1fa2;
}
.element-trail.poison{
    background:radial-gradient(circle,#e1bee7,#9c27b0);
    box-shadow:0 0 10px #9c27b0;
}
.element-trail.mythical{
    background:radial-gradient(circle,#ffffff,#7dd3fc);
    box-shadow:0 0 15px #7dd3fc,0 0 30px #38bdf8,0 0 45px rgba(255,255,200,.5);
}
@keyframes trailFade{
    0%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(0.3)}
}

/* Combo indicator */
.combo-indicator{
    position:fixed;
    pointer-events:none;
    z-index:2600;
    font-family:'Fredoka One',cursive;
    font-size:1.4rem;
    font-weight:bold;
    color:#fbbf24;
    text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 20px rgba(251,191,36,0.6);
    animation:comboPopIn 600ms ease-out forwards;
}
@keyframes comboPopIn{
    0%{opacity:0;transform:scale(0.5) translateY(10px)}
    40%{opacity:1;transform:scale(1.3) translateY(-15px)}
    100%{opacity:0;transform:scale(1) translateY(-40px)}
}

/* Lightning strike effect */
.lightning-strike{
    position:fixed;
    pointer-events:none;
    z-index:2550;
    width:60px;
    height:200px;
    background:linear-gradient(180deg,
        rgba(255,255,150,0) 0%,
        rgba(255,255,100,0.9) 10%,
        rgba(255,255,255,1) 50%,
        rgba(255,255,100,0.9) 90%,
        rgba(255,255,150,0) 100%);
    clip-path:polygon(45% 0%,55% 0%,60% 25%,70% 25%,40% 55%,55% 55%,30% 100%,35% 55%,20% 55%,50% 25%,40% 25%);
    animation:lightningStrike 300ms ease-out forwards;
    filter:drop-shadow(0 0 20px #ffeb3b) drop-shadow(0 0 40px #ffc107);
}
@keyframes lightningStrike{
    0%{opacity:0;transform:scaleY(0);transform-origin:top}
    20%{opacity:1;transform:scaleY(1)}
    50%{opacity:1}
