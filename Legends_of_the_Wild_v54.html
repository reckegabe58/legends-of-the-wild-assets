<script>
const G='https://raw.githubusercontent.com/reckegabe58/legends-of-the-wild-assets/main';

// Aura colors by type
const AURA={Shadow:'#6b2d6b',Dark:'#4a1a4a',Fire:'#ff4500',Water:'#1e90ff',Ice:'#70d4e8',Nature:'#228b22',Earth:'#8b4513',Lightning:'#ffd700',Light:'#fffacd',Cosmic:'#9400d3',Void:'#4b0082',Psychic:'#ff69b4',Metal:'#708090',Poison:'#9acd32',Air:'#87ceeb',Wind:'#87ceeb',Bug:'#9acd32',Spirit:'#ff8c00',Ancient:'#daa520',Holy:'#fff8dc',Chaos:'#ff1493',Sound:'#00ced1'};
function getAura(t){return AURA[t.split('/')[0]]||'#6b4c9a'}

// Audio
let audioCtx=null;
let currentMusic=null;
let musicGain=null;
let musicType=null;

function initAudio(){
    if(!audioCtx){
        try{
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            musicGain=audioCtx.createGain();
            musicGain.connect(audioCtx.destination);
            musicGain.gain.value=0.15; // Music volume
        }catch(e){}
    }
}

// Sound effects
function playSound(type){
    try{initAudio();if(!audioCtx)return;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);gain.gain.value=0.1;
    if(type==='hit'){osc.frequency.value=150;osc.type='square';osc.start();osc.stop(audioCtx.currentTime+.08)}
    else if(type==='crit'){osc.frequency.value=220;osc.type='sawtooth';osc.start();setTimeout(()=>osc.frequency.value=330,40);setTimeout(()=>osc.frequency.value=440,80);osc.stop(audioCtx.currentTime+.15)}
    else if(type==='heal'){osc.frequency.value=523;osc.type='sine';osc.start();osc.stop(audioCtx.currentTime+.25)}
    else if(type==='coin'){osc.frequency.value=880;osc.type='sine';osc.start();setTimeout(()=>osc.frequency.value=1046,50);osc.stop(audioCtx.currentTime+.12)}
    else if(type==='levelup'){osc.frequency.value=400;osc.type='triangle';osc.start();setTimeout(()=>osc.frequency.value=600,100);osc.stop(audioCtx.currentTime+.3)}
    else if(type==='victory'){osc.frequency.value=523;osc.type='triangle';osc.start();setTimeout(()=>osc.frequency.value=659,100);setTimeout(()=>osc.frequency.value=784,200);osc.stop(audioCtx.currentTime+.4)}
    else if(type==='defeat'){osc.frequency.value=200;osc.type='sawtooth';osc.start();setTimeout(()=>osc.frequency.value=100,200);osc.stop(audioCtx.currentTime+.4)}
    }catch(e){}}

// Music system - procedural chiptune-style music
function playMusic(type){
    if(musicType===type)return; // Already playing
    initAudio();
    if(!audioCtx)return;
    
    stopMusic();
    musicType=type;
    
    const tempo = type==='boss' ? 140 : type==='battle' ? 120 : type==='adventure' ? 100 : 90;
    const beatLen = 60/tempo;
    
    // Note frequencies (C4 to B5)
    const notes={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,B5:988};
    
    // Different melodies for different contexts
    const melodies = {
        menu: ['E4','G4','C5','E5','D5','C5','G4','E4','F4','A4','C5','F5','E5','C5','A4','F4'],
        adventure: ['C5','E5','G5','E5','F5','D5','E5','C5','G4','C5','E5','G5','A5','G5','E5','C5'],
        battle: ['E4','E4','F4','G4','G4','F4','E4','D4','C4','C4','D4','E4','E4','D4','D4','E4'],
        boss: ['E4','E4','E4','C4','E4','G4','G4','G4','C5','B4','A4','G4','E4','C4','D4','E4']
    };
    
    // Bass patterns
    const bassPatterns = {
        menu: ['C3','G3','C3','G3','F3','C4','F3','C4'],
        adventure: ['C3','E3','G3','E3','F3','A3','G3','E3'],
        battle: ['C3','C3','G3','G3','A3','A3','G3','G3'],
        boss: ['C3','C3','C3','C3','A2','A2','B2','B2']
    };
    
    const melody = melodies[type] || melodies.menu;
    const bass = bassPatterns[type] || bassPatterns.menu;
    
    let noteIdx=0;
    let bassIdx=0;
    
    function playNote(freq,duration,wave='triangle',vol=0.12){
        if(!audioCtx||musicType!==type)return;
        const osc=audioCtx.createOscillator();
        const env=audioCtx.createGain();
        osc.connect(env);
        env.connect(musicGain);
        osc.type=wave;
        osc.frequency.value=freq;
        env.gain.setValueAtTime(vol,audioCtx.currentTime);
        env.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+duration*0.9);
        osc.start();
        osc.stop(audioCtx.currentTime+duration);
    }
    
    function musicLoop(){
        if(musicType!==type)return;
        
        // Play melody note
        const note=melody[noteIdx%melody.length];
        if(notes[note]) playNote(notes[note],beatLen*0.8,'triangle',type==='boss'?0.14:0.1);
        
        // Play bass on every 2nd beat
        if(noteIdx%2===0){
            const bassNote=bass[bassIdx%bass.length];
            const bassFreq=notes[bassNote]?notes[bassNote]/2:130;
            playNote(bassFreq,beatLen*1.5,'square',0.08);
            bassIdx++;
        }
        
        // Extra percussion for battle/boss
        if((type==='battle'||type==='boss')&&noteIdx%4===0){
            playNote(80,0.05,'square',0.06);
        }
        if(type==='boss'&&noteIdx%2===1){
            playNote(120,0.03,'sawtooth',0.04);
        }
        
        noteIdx++;
        currentMusic=setTimeout(musicLoop,beatLen*1000);
    }
    
    musicLoop();
}

function stopMusic(){
    if(currentMusic){
        clearTimeout(currentMusic);
        currentMusic=null;
    }
    musicType=null;
}

// Update music based on current screen
function updateMusic(){
    if(state.battle){
        const isBoss=state.battle.enemy?.isBoss;
        playMusic(isBoss?'boss':'battle');
    }else if(currentScreen==='adventure'){
        playMusic('adventure');
    }else{
        playMusic('menu');
    }
}

// ============================================
// PARTY SCALING SYSTEM v54.3 - FULLY ADAPTIVE
// ============================================
// Designed for classroom play with 2-10 students
// Every party size gets a unique, balanced experience
// The game REACTS to current attendance dynamically

// Get current party size (students with assigned creatures)
function getPartySize(){
    return getActiveStudents().filter(s=>s.cid).length || 1;
}

// Party Size Tiers - defines the game experience
// TINY (1-2): Easy mode, learning the game
// SMALL (3-4): Standard challenge
// MEDIUM (5-6): Increased difficulty, teamwork matters
// LARGE (7-8): Hard mode, coordination required
// FULL CLASS (9-10): Epic mode, boss one-shots possible
function getPartyTier(){
    const size = getPartySize();
    if(size <= 2) return 'tiny';
    if(size <= 4) return 'small';
    if(size <= 6) return 'medium';
    if(size <= 8) return 'large';
    return 'full';
}

// ============================================
// DEBUG MODE - Toggle for combat logging
// ============================================
let DEBUG_MODE = false; // v54.6: Disabled for production (set to true for detailed combat logs)

function debugLog(category, ...args) {
    if (!DEBUG_MODE) return;
    const colors = {
        SCALING: 'color: #60a5fa; font-weight: bold',
        DAMAGE: 'color: #f87171; font-weight: bold',
        COMBAT: 'color: #4ade80; font-weight: bold',
        TURN: 'color: #fbbf24; font-weight: bold',
        BOSS: 'color: #a78bfa; font-weight: bold',
        PARTY: 'color: #22d3ee; font-weight: bold'
    };
    console.log(`%c[${category}]`, colors[category] || '', ...args);
}

// Scaling multipliers by party size - LOOKUP TABLE
// v54.4: REBALANCED - Enemies now scale MORE aggressively with ATK
// Goal: Enemies should deal 25-40% of player HP per hit in larger parties
const PARTY_SCALING = {
    // [HP, ATK, DEF, SPD] multipliers for each party size
    wild: {
        1:  [0.5,  0.6,  0.4,  0.85],  // Solo: Forgiving but can still hurt
        2:  [0.7,  0.9,  0.5,  0.95],  // Duo: Noticeable damage
        3:  [1.0,  1.3,  0.7,  1.0],   // Trio: Real threat - ATK boosted!
        4:  [1.3,  1.6,  0.85, 1.05],  // Squad: Dangerous encounters
        5:  [1.6,  2.0,  1.0,  1.1],   // Team: Very dangerous
        6:  [2.0,  2.4,  1.1,  1.15],  // Group: Each hit matters
        7:  [2.4,  2.8,  1.2,  1.2],   // Party: Punishing
        8:  [2.8,  3.2,  1.3,  1.25],  // Raid: Brutal
        9:  [3.2,  3.6,  1.4,  1.3],   // Full Class: Overwhelming
        10: [3.6,  4.0,  1.5,  1.35]   // Max: Legendary threat
    },
    boss: {
        1:  [0.6,  0.8,  0.5,  0.9],   // Solo: Manageable but scary
        2:  [0.9,  1.2,  0.7,  0.95],  // Duo: Real boss fight
        3:  [1.2,  1.6,  0.9,  1.0],   // Trio: Threatening
        4:  [1.6,  2.1,  1.0,  1.05],  // Squad: Tough fight
        5:  [2.0,  2.6,  1.1,  1.1],   // Team: Hard boss
        6:  [2.5,  3.1,  1.2,  1.15],  // Group: Very Hard
        // v54.6: Reduced ATK scaling for large parties (was 3.6-5.5x, now 3.0-4.0x)
        7:  [3.0,  3.0,  1.3,  1.2],   // Party: Epic boss
        8:  [3.2,  3.3,  1.4,  1.25],  // Raid: Raid boss
        9:  [3.4,  3.6,  1.5,  1.3],   // Full Class: World boss
        10: [3.6,  4.0,  1.6,  1.35]   // Max: Ultimate challenge
    },
    minion: {
        1:  [0.4,  0.5,  0.4,  0.95],  // Solo: Weak but annoying
        2:  [0.6,  0.8,  0.5,  1.0],   // Duo: Minor threat
        3:  [0.9,  1.1,  0.6,  1.05],  // Trio: Nuisance
        4:  [1.1,  1.4,  0.7,  1.1],   // Squad: Must handle
        5:  [1.4,  1.7,  0.8,  1.15],  // Team: Real threat
        6:  [1.7,  2.0,  0.9,  1.2],   // Group: Dangerous
        7:  [2.0,  2.4,  1.0,  1.25],  // Party: Deadly
        8:  [2.4,  2.8,  1.1,  1.3],   // Raid: Very dangerous
        9:  [2.8,  3.2,  1.2,  1.35],  // Full Class: Lethal
        10: [3.2,  3.6,  1.3,  1.4]    // Max: Must prioritize
    }
};

// Boss one-shot chance - ONLY for large parties (7+)
// v54.6: Reduced by ~50% to reduce frustration
function getBossOneShootChance(){
    const size = getPartySize();
    if(size < 7) return 0;      // No one-shots for small parties
    if(size === 7) return 0.04; // 4% chance (was 8%)
    if(size === 8) return 0.06; // 6% chance (was 12%)
    if(size === 9) return 0.08; // 8% chance (was 15%)
    return 0.10;                // 10% chance for 10 (was 18%)
}

// Boss devastating blow multiplier - scales with party size
function getBossDevastatingMult(){
    const size = getPartySize();
    if(size <= 4) return 1.5;   // Small party: 1.5x crit
    if(size <= 6) return 1.7;   // Medium party: 1.7x crit
    if(size <= 8) return 1.9;   // Large party: 1.9x crit
    return 2.1;                 // Full class: 2.1x crit (can one-shot)
}

// Enemy count in wild encounters - based on party size
function getWildEnemyCount(chapter){
    const size = getPartySize();
    let base = 1;

    // Base enemies by chapter
    if(chapter >= 5) base = 2;
    else if(chapter >= 3) base = 1;

    // Add enemies based on party size
    let bonus = 0;
    if(size >= 3) bonus = 1;
    if(size >= 5) bonus = 2;
    if(size >= 7) bonus = 3;
    if(size >= 9) bonus = 4;

    // Random variance
    const variance = Math.random() < 0.3 ? 1 : 0;

    return Math.min(6, base + bonus + variance); // Cap at 6 enemies
}

// Boss minion count - scales with party size
function getBossMinionCount(baseMinionCount){
    const size = getPartySize();
    if(size <= 2) return Math.max(1, baseMinionCount - 1);
    if(size <= 4) return baseMinionCount;
    if(size <= 6) return baseMinionCount + 1;
    if(size <= 8) return baseMinionCount + 2;
    return baseMinionCount + 3; // 9-10 players: lots of minions
}

// Scale wild enemy stats based on party size
function scaleWildEnemy(baseHP, baseATK, baseDEF, baseSPD){
    const size = Math.min(10, Math.max(1, getPartySize()));
    const scale = PARTY_SCALING.wild[size];

    const result = {
        hp: Math.floor(baseHP * scale[0]),
        atk: Math.floor(baseATK * scale[1]),
        def: Math.floor(baseDEF * scale[2]),
        spd: Math.floor(baseSPD * scale[3])
    };

    debugLog('SCALING', `WILD Enemy | Party: ${size} | Base ATK: ${baseATK} → Scaled: ${result.atk} (x${scale[1]}) | HP: ${baseHP} → ${result.hp}`);
    return result;
}

// Scale boss stats based on party size
function scaleBoss(baseHP, baseATK, baseDEF, baseSPD){
    const size = Math.min(10, Math.max(1, getPartySize()));
    const scale = PARTY_SCALING.boss[size];

    const result = {
        hp: Math.floor(baseHP * scale[0]),
        atk: Math.floor(baseATK * scale[1]),
        def: Math.floor(baseDEF * scale[2]),
        spd: Math.floor(baseSPD * scale[3])
    };

    debugLog('BOSS', `BOSS Scaling | Party: ${size} | Base ATK: ${baseATK} → Scaled: ${result.atk} (x${scale[1]}) | HP: ${baseHP} → ${result.hp}`);
    return result;
}

// Scale boss minion stats based on party size
function scaleBossMinion(baseHP, baseATK, baseDEF, baseSPD){
    const size = Math.min(10, Math.max(1, getPartySize()));
    const scale = PARTY_SCALING.minion[size];

    const result = {
        hp: Math.floor(baseHP * scale[0]),
        atk: Math.floor(baseATK * scale[1]),
        def: Math.floor(baseDEF * scale[2]),
        spd: Math.floor(baseSPD * scale[3])
    };

    debugLog('SCALING', `MINION Scaling | Party: ${size} | ATK: ${baseATK} → ${result.atk} | HP: ${baseHP} → ${result.hp}`);
    return result;
}

// XP scaling - less XP per person in large parties (shared)
function getXPMultiplier(){
    const size = getPartySize();
    if(size <= 2) return 1.2;   // Bonus for small party
    if(size <= 4) return 1.0;   // Standard
    if(size <= 6) return 0.85;  // Slight reduction
    if(size <= 8) return 0.7;   // Shared among many
    return 0.6;                 // Large party shares XP
}

// Coin scaling - more coins total for bigger parties, but split
function getCoinMultiplier(){
    const size = getPartySize();
    if(size <= 2) return 1.0;
    if(size <= 4) return 1.2;
    if(size <= 6) return 1.4;
    if(size <= 8) return 1.6;
    return 1.8;
}

// Legacy function for compatibility
function getPartyScaleFactor(){
    return getPartySize() / 4;
}

// ============================================
// FOCUS SYSTEM CONSTANTS (v54.1 Rebalancing)
// ============================================
const STARTING_FOCUS = 25;      // Reduced from 50 - prevents turn 1 special spam
const FOCUS_REGEN_PER_TURN = 10; // Increased from 5 - rewards survival, enables more specials over time
const MAX_FOCUS = 100;          // Maximum focus cap
const BASE_SPECIAL_COST = 35;   // v54.6: Reduced from 50 - makes specials usable earlier in battle

// ============================================
// NATURE SYSTEM (v54.3) - Creature Personalities
// ============================================
// Each creature has a nature that modifies their stats
// Total stat budget stays balanced (buffs = debuffs)
// Natures are assigned randomly on creature creation/migration
const NATURES = {
    // Balanced (no change)
    hardy:   { hp: 0,   atk: 0,   def: 0,   spd: 0,   desc: "A balanced and straightforward creature" },

    godtouched: { hp: +20, atk: +15, def: +15, spd: +10, desc: "Blessed by the Creator - divine power flows through this creature" }

// Nature category helper
function getNatureCategory(nature) {
    const offensive = ['adamant', 'brave', 'naughty', 'lonely', 'rash'];
    const defensive = ['bold', 'relaxed', 'impish', 'lax'];
    const speedy = ['timid', 'hasty', 'jolly', 'naive'];
    const bulky = ['calm', 'careful', 'sassy'];
    const godtouched = ['godtouched'];

    if(godtouched.includes(nature)) return 'godtouched';
    if(offensive.includes(nature)) return 'offensive';
    if(defensive.includes(nature)) return 'defensive';
    if(speedy.includes(nature)) return 'speedy';
    if(bulky.includes(nature)) return 'bulky';
    return 'balanced';
}

// Get random nature
function getRandomNature() {
    const natureKeys = Object.keys(NATURES);
    return natureKeys[Math.floor(Math.random() * natureKeys.length)];
}

// Format nature effects for display
function formatNatureEffects(nature) {
    const mods = NATURES[nature];
    if(!mods) return '';

    let effects = [];
    if(mods.hp > 0) effects.push(`<span class="stat-up">↑HP</span>`);
    if(mods.hp < 0) effects.push(`<span class="stat-down">↓HP</span>`);
    if(mods.atk > 0) effects.push(`<span class="stat-up">↑ATK</span>`);
    if(mods.atk < 0) effects.push(`<span class="stat-down">↓ATK</span>`);
    if(mods.def > 0) effects.push(`<span class="stat-up">↑DEF</span>`);
    if(mods.def < 0) effects.push(`<span class="stat-down">↓DEF</span>`);
    if(mods.spd > 0) effects.push(`<span class="stat-up">↑SPD</span>`);
    if(mods.spd < 0) effects.push(`<span class="stat-down">↓SPD</span>`);

    return effects.join(' ');
}

// ============================================
// DYNAMIC SPECIAL COST CALCULATION (v54.1)
// ============================================
// Calculates focus cost based on evolution, power, and effect type
// Formula: BASE_COST + (evoStage * 5) + powerMod + aoeMod + effectMod
// Range: 50-100 (clamped)
function calculateSpecialCost(evoStage, basePower, specialName, isHealingMove = false){
    let cost = BASE_SPECIAL_COST;

    // Evolution modifier: +5 per evolution stage (0-15 total for stages 0-3)
    const evoMod = Math.min(3, evoStage || 0) * 5;
    cost += evoMod;

    // Power modifier: +0 to +10 based on attack power (normalized to 50-150 range)
    const power = basePower || 80;
    const powerMod = Math.floor(Math.max(0, Math.min(10, (power - 50) / 10)));
    cost += powerMod;

    // AOE modifier: +15 for AOE attacks (they hit all enemies)
    if(specialName){
        const specialType = getSpecialType(specialName);
        if(specialType.isAOE){
            cost += 15;
        }
    }

    // Healing effect modifier: +10 for healing specials (very powerful utility)
    if(isHealingMove){
        cost += 10;
    }

    // v54.6: Clamp to valid range (35-85) - reduced from 50-100 for faster gameplay
    return Math.max(35, Math.min(85, cost));
}

// ============================================
// ENEMY DAMAGE ADJUSTMENT (v54.3 - Party Size Aware)
// ============================================
// Bosses: Devastating blows scale with party size
// v54.6: Get buff value for a team member
function getBuffValue(member, buffType){
    if(!member || !member.buffs) return 0;
    const buff = member.buffs.find(b => b.type === buffType);
    return buff ? buff.value : 0;
}

// v54.6: Check if any team member has party shield buff
function getPartyShieldValue(){
    if(!state.battle || !state.battle.team) return 0;
    for(const m of state.battle.team){
        if(m.curHp > 0 && m.buffs){
            const shield = m.buffs.find(b => b.type === 'party_shield');
            if(shield) return shield.value;
        }
    }
    return 0;
}

// Large parties (7+): One-shot mechanic enabled
// Wild enemies: Damage capped based on party size
// Returns: {damage: number, isDevastating: boolean, isOneShot: boolean}
function adjustEnemyDamage(baseDamage, enemy, target){
    let finalDamage = baseDamage;
    let isDevastating = false;
    let isOneShot = false;
    const partySize = getPartySize();

    if(enemy.isBoss){
        // ONE-SHOT MECHANIC: Only for large parties (7+)
        // Creates dramatic tension and punishes poor coordination
        const oneShotChance = getBossOneShootChance();
        if(oneShotChance > 0 && Math.random() < oneShotChance){
            // One-shot: Deal 999% of target's current HP
            finalDamage = Math.floor(target.curHp * 10);
            isDevastating = true;
            isOneShot = true;
            addLog(`💀 FATAL BLOW! ${enemy.name} strikes with lethal force!`, 'crit');
        }
        // DEVASTATING BLOW: Chance and multiplier scale with party size
        else if(Math.random() < 0.12){
            const devMult = getBossDevastatingMult();
            finalDamage = Math.floor(baseDamage * devMult);
            isDevastating = true;
        }
        // No damage cap for bosses - they're meant to be deadly
    } else {
        // WILD ENEMIES: Damage cap scales with party size
        // Small parties: 60% cap (forgiving)
        // Large parties: 85% cap (dangerous)
        let capPercent = 0.6;
        if(partySize >= 3) capPercent = 0.65;
        if(partySize >= 5) capPercent = 0.70;
        if(partySize >= 7) capPercent = 0.75;
        if(partySize >= 9) capPercent = 0.85;

        const maxDamage = Math.floor(target.maxHp * capPercent);
        finalDamage = Math.min(baseDamage, maxDamage);
    }

    // v54.6: Apply defend_buff (personal damage reduction)
    const defendBuff = getBuffValue(target, 'defend_buff');
    if(defendBuff > 0){
        finalDamage = Math.floor(finalDamage * (1 - defendBuff));
    }

    // v54.6: Apply party_shield (team-wide damage reduction)
    const partyShield = getPartyShieldValue();
    if(partyShield > 0){
        finalDamage = Math.floor(finalDamage * (1 - partyShield));
    }

    return { damage: Math.max(1, finalDamage), isDevastating, isOneShot };
}

// ============================================
// AOE SPECIAL DETECTION - Determines if special hits all enemies
// ============================================
// AOE specials do 65% damage but hit ALL enemies
// Returns {isAOE: boolean, damageMultiplier: number}
function getSpecialType(specialName){
    if(!specialName) return {isAOE: false, mult: 1.0};

    const name = specialName.toLowerCase();

    // AOE KEYWORDS - Attacks that hit everything
    const aoeKeywords = [
        'tsunami', 'whirlpool', 'hurricane', 'tempest', 'storm',
        'blizzard', 'avalanche', 'sandstorm', 'earthquake', 'quake',
        'eruption', 'meltdown', 'nova', 'burst', 'wave', 'fury',
        'plague', 'inferno', 'armageddon', 'extinction', 'apocalypse',
        'realm', 'falls', 'barrage', 'swarm', 'horde', 'flood',
        'shockwave', 'explosion', 'blast', 'rain', 'shower',
        'world', 'stampede', 'rampage', 'frenzy'
    ];

    // Check if name contains any AOE keyword
    const isAOE = aoeKeywords.some(kw => name.includes(kw));

    // AOE does 65% damage per target (balanced for hitting multiple)
    // Single target does full damage
    return {
        isAOE: isAOE,
        mult: isAOE ? 0.65 : 1.0,
        label: isAOE ? 'AOE' : 'ST'
    };
}

// UTILITY FUNCTIONS
function getLv(xp){for(let i=XP_TABLE.length-1;i>=0;i--)if(xp>=XP_TABLE[i])return i+1;return 1}
function getXPProg(xp){const l=getLv(xp);if(l>=50)return 100;return Math.min(100,((xp-XP_TABLE[l-1])/(XP_TABLE[l]-XP_TABLE[l-1]))*100)}
function getEvo(cid,lv){const c=CREATURES[cid];if(!c)return 0;let e=0;for(let i=0;i<c.evAt.length;i++)if(lv>=c.evAt[i])e=i+1;return e}
function getEvoClass(cid,lv){return 'evo'+(getEvo(cid,lv)+1)}
// v54.3: Modified to accept nature parameter for stat modifiers
function getStats(cid, lv, nature = null){
    const c = CREATURES[cid];
    if(!c) return {hp:100, atk:20, def:20, spd:20};

    const e = getEvo(cid, lv);
    const b = 1 + (e * 0.15); // Evolution bonus

    // Calculate base stats
    let stats = {
        hp: Math.floor((c.base.hp + c.grow.hp * (lv-1)) * b),
        atk: Math.floor((c.base.atk + c.grow.atk * (lv-1)) * b),
        def: Math.floor((c.base.def + c.grow.def * (lv-1)) * b),
        spd: Math.floor((c.base.spd + c.grow.spd * (lv-1)) * b)
    };

    // Apply nature modifiers if provided
    if(nature && NATURES[nature]){
        const mods = NATURES[nature];
        stats.hp = Math.floor(stats.hp * (1 + mods.hp / 100));
        stats.atk = Math.floor(stats.atk * (1 + mods.atk / 100));
        stats.def = Math.floor(stats.def * (1 + mods.def / 100));
        stats.spd = Math.floor(stats.spd * (1 + mods.spd / 100));
    }

    return stats;
}
function getImg(cid,lv){const c=CREATURES[cid];return c?G+'/Player_Creatures/'+c.imgs[getEvo(cid,lv)]:''}
function getMove(cid,lv,type){const c=CREATURES[cid];if(!c||!c.moves[type])return null;const a=c.moves[type].filter(m=>lv>=m.lv);return a.length?a[a.length-1]:null}
function getActiveStudents(){return state.students.filter(s=>state.activeIds.includes(s.id))}
function getAbsentStudents(){return state.students.filter(s=>!state.activeIds.includes(s.id))}
function getAvgLevel(){const active=getActiveStudents().filter(s=>s.cid);if(!active.length)return 1;return Math.floor(active.reduce((sum,s)=>sum+getLv(s.xp),0)/active.length)}
function getPartyPower(){const active=getActiveStudents().filter(s=>s.cid);if(!active.length)return 0;return active.reduce((sum,s)=>{const st=getStats(s.cid,getLv(s.xp),s.nature);return sum+st.hp+st.atk+st.def+st.spd},0)}

// Boss fight eligibility - party power vs boss power
function canFightBoss(bid){
    const boss=BOSSES[bid];
    if(!boss) return false;
    const partyPower = getPartyPower();
    const avgLv = getAvgLevel();
    // Party needs at least 50% of boss level average and reasonable power
    const bossPower = boss.hp + boss.atk*5 + boss.def*3;
    return avgLv >= boss.lv * 0.5 && partyPower >= bossPower * 0.3;
}

// Check tier completion
function isTierComplete(tier){
    const tierBosses = tier === 1 ? TIER1_BOSSES : tier === 2 ? TIER2_BOSSES : tier === 3 ? TIER3_BOSSES : [];
    return tierBosses.every(bid => state.defeated.includes(bid));
}

// Check if nightmare phase is available
function canFightNightmarePhase(phase){
    if(phase === 0) return isTierComplete(1) && !state.defeated.includes('nightmare_p0');
    if(phase === 1) return isTierComplete(2) && state.defeated.includes('nightmare_p0') && !state.defeated.includes('nightmare_p1');
    if(phase === 2) return isTierComplete(3) && state.defeated.includes('nightmare_p1') && !state.defeated.includes('nightmare_p2');
    if(phase === 3) return state.defeated.includes('nightmare_p2') && !state.defeated.includes('nightmare_p3');
    if(phase === 4) return state.defeated.includes('nightmare_p3') && !state.defeated.includes('nightmare_p4');
    return false;
}

// Check if THE CREATOR is available (post-game)
function canFightCreator(){
    return state.defeated.includes('nightmare_p4') && !state.defeated.includes('the_creator');
}

// Chapter progression based on nightmare defeats
function getCurrentChapter(){
    if(state.defeated.includes('nightmare_p3')) return 5; // After Phase 3
    if(state.defeated.includes('nightmare_p2')) return 4; // After Phase 2
    if(state.defeated.includes('nightmare_p1')) return 3; // After Phase 1
    if(state.defeated.includes('nightmare_p0')) return 2; // After Phase 0
    return 1;
}

// Limited-time rotation system
function checkLimitedTimeRefresh(){
    const now = Date.now();
    
    // Initialize if never set
    if(!state.limitedTime.nextResetAt){
        initLimitedTimeRewards();
        return;
    }
    
    // Check if refresh needed
    if(now >= state.limitedTime.nextResetAt){
        refreshLimitedTimeRewards();
    }
}

function initLimitedTimeRewards(){
    // Set next reset to next Monday 9am
    const nextMonday = getNextMonday();
    state.limitedTime.nextResetAt = nextMonday.getTime();
    
    // Pick initial rewards
    refreshLimitedTimeRewards();
}

function refreshLimitedTimeRewards(){
    const currentChapter = getCurrentChapter();
    
    // Filter items by chapter
    const availableItems = SHOP_ITEMS.filter(i => 
        i.chapterMin <= currentChapter && 
        ['RARE', 'EPIC', 'LEGENDARY'].includes(i.rarity)
    );
    
    // Pick 3-5 random items
    const count = Math.min(5, Math.max(3, availableItems.length));
    const selected = [];
    const pool = [...availableItems];
    
    for(let i = 0; i < count && pool.length > 0; i++){
        const idx = Math.floor(Math.random() * pool.length);
        selected.push(pool[idx].id);
        pool.splice(idx, 1);
    }
    
    state.limitedTime.weeklyRewards = selected;
    
    // Set next reset
    const nextMonday = getNextMonday();
    state.limitedTime.nextResetAt = nextMonday.getTime();
    
    save();
}

function getNextMonday(){
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday, etc.
    const daysUntilMonday = dayOfWeek === 0 ? 1 : (8 - dayOfWeek);
    
    const nextMonday = new Date(now);
    nextMonday.setDate(now.getDate() + daysUntilMonday);
    nextMonday.setHours(9, 0, 0, 0); // 9:00 AM
    
    return nextMonday;
}

// Get remaining bosses for current tier
function getRemainingTierBosses(tier){
    const tierBosses = tier === 1 ? TIER1_BOSSES : tier === 2 ? TIER2_BOSSES : tier === 3 ? TIER3_BOSSES : [];
    return tierBosses.filter(bid => !state.defeated.includes(bid));
}

// Get available bosses for current chapter
function getAvailableBosses(){
    const ch = getCurrentChapter();
    const chData = CHAPTERS[ch];
    
    // Check for nightmare phase availability first
    for(let p = 0; p <= 4; p++){
        if(canFightNightmarePhase(p)) return [{id: `nightmare_p${p}`, ...BOSSES[`nightmare_p${p}`], isGate: true}];
    }
    
    // Check for Creator
    if(canFightCreator()) return [{id: 'the_creator', ...BOSSES.the_creator, isGate: true}];
    
    // Get tier bosses based on chapter
    let availableTier;
    if(ch === 1) availableTier = 1;
    else if(ch === 2) availableTier = 2;
    else if(ch === 3) availableTier = 3;
    else availableTier = 3; // Ch4+ can fight any tier
    
    // In chapter 4+, can fight bosses from multiple tiers (scaled)
    if(ch >= 4){
        const all = [...TIER1_BOSSES, ...TIER2_BOSSES, ...TIER3_BOSSES];
        return all.filter(bid => canFightBoss(bid)).map(bid => ({id: bid, ...BOSSES[bid]}));
    }
    
    const remaining = getRemainingTierBosses(availableTier);
    return remaining.filter(bid => canFightBoss(bid)).map(bid => ({id: bid, ...BOSSES[bid]}));
}

function renderArenaLeaderboard(activeStudents){

    const sortedStudents = [...activeStudents].sort((a, b) => {
        const rA = getArenaRecord(a.id);

        const totalA = rA.wins + rA.losses || 1;
        const totalB = rB.wins + rB.losses || 1;
        return (rB.wins / totalB) - (rA.wins / totalA);
    });

    let html = `<div class="arena-leaderboard">
        <h2 class="arena-section-title">🏆 Arena Champions</h2>
        <div class="leaderboard-list">`;

    sortedStudents.slice(0, 5).forEach((s, idx) => {

        const c = CREATURES[s.cid];

        const total = record.wins + record.losses || 1;
        const winRate = Math.round((record.wins / total) * 100);
        const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];

        html += `<div class="leaderboard-entry ${idx === 0 ? 'champion' : ''}">

        </div>`;
    });

    if(sortedStudents.length === 0){
        html += `<div class="leaderboard-empty">No battles yet! Be the first to compete!</div>`;

    html += `</div></div>`;
    return html;
}

function selectArenaMode(mode){
    arenaSetup.mode = mode;
    arenaSetup.teams = [];
    arenaSetup.currentTeamPicking = 0;

    const modeData = ARENA_MODES[mode];
    const numTeams = mode === 'ffa' ? getActiveStudents().filter(s => s.cid).length : modeData.teams;

    // Initialize empty team arrays
    for(let i = 0; i < numTeams; i++){
        arenaSetup.teams.push([]);
    }

    arenaSetup.step = 'team1';
    renderMain();
}

function addToArenaTeam(studentId){
    const mode = ARENA_MODES[arenaSetup.mode];
    const currentTeam = arenaSetup.teams[arenaSetup.currentTeamPicking];

    if(currentTeam.length < mode.teamSize){
        currentTeam.push(studentId);
        renderMain();
    }
}

function removeFromArenaTeam(studentId){
    const currentTeam = arenaSetup.teams[arenaSetup.currentTeamPicking];
    const idx = currentTeam.indexOf(studentId);
    if(idx > -1){
        currentTeam.splice(idx, 1);
        renderMain();
    }
}

function arenaNextTeam(){
    const mode = ARENA_MODES[arenaSetup.mode];
    const isFFA = arenaSetup.mode === 'ffa';
    const totalTeams = isFFA ? arenaSetup.teams.length : mode.teams;

    arenaSetup.currentTeamPicking++;

    if(arenaSetup.currentTeamPicking >= totalTeams){
        arenaSetup.step = 'confirm';
    } else {
        arenaSetup.step = `team${arenaSetup.currentTeamPicking + 1}`;
    }

    renderMain();
}

function arenaGoBack(){
    if(arenaSetup.step === 'confirm'){
        arenaSetup.currentTeamPicking = arenaSetup.teams.length - 1;
        arenaSetup.step = `team${arenaSetup.currentTeamPicking + 1}`;
    } else if(arenaSetup.currentTeamPicking > 0){
        arenaSetup.currentTeamPicking--;
        arenaSetup.step = `team${arenaSetup.currentTeamPicking + 1}`;
    } else {
        arenaSetup.step = 'mode';
        arenaSetup.mode = null;
        arenaSetup.teams = [];
    }
    renderMain();
}

function resetArenaSetup(){
    arenaSetup = {
        mode: null,
        teams: [],
        step: 'mode',
        currentTeamPicking: 0
    };
}

// ============================================
// PVP COMBAT ENGINE
// ============================================
function startArenaBattle(){
    const activeStudents = getActiveStudents().filter(s => s.cid);
    const mode = ARENA_MODES[arenaSetup.mode];
    const isFFA = arenaSetup.mode === 'ffa';

    // Build combatants from setup
    const combatants = [];

    arenaSetup.teams.forEach((team, teamIdx) => {
        team.forEach(studentId => {
            const s = activeStudents.find(st => st.id === studentId);
            if(!s) return;

            const lv = getLv(s.xp);
            const st = getStats(s.cid, lv, s.nature);
            const c = CREATURES[s.cid];
            const evoIdx = getEvo(s.cid, lv);
            const creatureName = c?.names?.[evoIdx] || c?.name || 'Creature';

            combatants.push({
                ...s,
                lv: lv,
                team: isFFA ? studentId : teamIdx, // FFA: each player is their own team
                curHp: st.hp,
                maxHp: st.hp,
                st: st,
                def: false,
                cooldown: 0,
                focus: STARTING_FOCUS,
                focusMax: MAX_FOCUS,
                focusRegen: FOCUS_REGEN_PER_TURN,
                // v54.6: Store both player name and creature name for combat log
                ownerName: s.name || 'Player',
                creatureName: creatureName
            });
        });
    });

    // Initialize arena battle state
    arenaBattle = {
        mode: arenaSetup.mode,
        isFFA: isFFA,
        combatants: combatants,
        turnQueue: [],
        turnIdx: 0,
        log: [],
        selectedTarget: null,
        targetingMode: null,
        winner: null,
        processing: false
    };

    buildArenaTurnOrder();
    currentScreen = 'arenaBattle';
    renderNav();
    renderMain();

    // Play battle music
    updateMusic();
}

function buildArenaTurnOrder(){
    if(!arenaBattle) return;

    arenaBattle.turnQueue = [];

    arenaBattle.combatants.forEach((c, idx) => {
        if(c.curHp > 0){
            arenaBattle.turnQueue.push({ idx: idx, spd: c.st.spd });
        }
    });

    // Sort by speed (highest first)
    arenaBattle.turnQueue.sort((a, b) => b.spd - a.spd);
    arenaBattle.turnIdx = 0;
}

function getAliveCombatants(){
    return arenaBattle.combatants.filter(c => c.curHp > 0);
}

function getAliveTeams(){
    const alive = getAliveCombatants();
    const teams = new Set(alive.map(c => c.team));
    return [...teams];
}

function checkArenaVictory(){
    const aliveTeams = getAliveTeams();

    if(aliveTeams.length <= 1){
        // We have a winner (or draw if 0)
        if(aliveTeams.length === 1){
            arenaBattle.winner = aliveTeams[0];
        } else {
            arenaBattle.winner = 'draw';
        }
        return true;
    }
    return false;
}

function arenaNextTurn(){
    if(!arenaBattle) return;
    if(arenaBattle.processing) return;

    // Check for victory
    if(checkArenaVictory()){
        setTimeout(() => showArenaVictory(), 500);
        return;
    }

    // Advance turn index
    arenaBattle.turnIdx++;

    // Rebuild queue if exhausted
    if(arenaBattle.turnIdx >= arenaBattle.turnQueue.length){
        buildArenaTurnOrder();
    }

    // Skip dead combatants
    let cur = arenaBattle.turnQueue[arenaBattle.turnIdx];
    let safetyCounter = 0;
    while(cur && arenaBattle.combatants[cur.idx].curHp <= 0){
        arenaBattle.turnIdx++;
        if(arenaBattle.turnIdx >= arenaBattle.turnQueue.length){
            buildArenaTurnOrder();
        }
        cur = arenaBattle.turnQueue[arenaBattle.turnIdx];
        safetyCounter++;
        if(safetyCounter > 50) break;
    }

    if(!cur) return;

    // Focus regen at start of turn
    const combatant = arenaBattle.combatants[cur.idx];
    if(combatant.curHp > 0){
        const oldFocus = combatant.focus;
        combatant.focus = Math.min(combatant.focusMax, combatant.focus + combatant.focusRegen);
        if(combatant.focus > oldFocus){
            arenaBattle.log.unshift({ t: 'focus', m: `🔷 ${combatant.creatureName} (${combatant.ownerName}) regains Focus` });
        }

        // Reduce cooldowns
        if(combatant.cooldown > 0) combatant.cooldown--;
    }

    arenaBattle.processing = false;
    renderMain();
}

// v54.5: Arena action with full battle animations
function doArenaAction(action){
    if(!arenaBattle || arenaBattle.processing) return;

    const cur = arenaBattle.turnQueue[arenaBattle.turnIdx];
    if(!cur) return;

    const attacker = arenaBattle.combatants[cur.idx];
    if(attacker.curHp <= 0) { arenaNextTurn(); return; }

    const c = CREATURES[attacker.cid];
    const attackerType = c?.type || 'fire';

    // Get valid targets (alive enemies)
    const validTargets = arenaBattle.combatants.filter(t => t.curHp > 0 && t.team !== attacker.team);

    if(validTargets.length === 0){
        if(checkArenaVictory()){
            setTimeout(() => showArenaVictory(), 500);
        }
        return;
    }

    // Target selection for attacks
    if((action === 'atk' || action === 'spec') && validTargets.length > 1 && arenaBattle.selectedTarget === null){
        arenaBattle.targetingMode = action;
        renderMain();
        return;
    }

    arenaBattle.processing = true;

    // Get target
    let target;
    if(arenaBattle.selectedTarget !== null){
        target = arenaBattle.combatants[arenaBattle.selectedTarget];
    } else {
        target = validTargets[0];
    }

    // Clear targeting
    arenaBattle.targetingMode = null;
    arenaBattle.selectedTarget = null;

    const move = getMove(attacker.cid, attacker.lv, action);
    const targetIdx = arenaBattle.combatants.indexOf(target);

    // v54.5: Get correct element IDs based on team
    const getArenaEl = (idx, combatant) => {
        if(combatant.team === 0){
            return document.getElementById(`arenaC${idx}`);
        } else {
            return document.getElementById(`enemy${idx}`);
        }
    };
    const getArenaFrame = (idx, combatant) => {
        if(combatant.team === 0){
            return document.getElementById(`c${idx}`);
        } else {
            return document.getElementById(`enemyImg${idx}`);
        }
    };

    const attackerEl = getArenaEl(cur.idx, attacker);
    const attackerFrame = getArenaFrame(cur.idx, attacker);
    const targetEl = getArenaEl(targetIdx, target);
    const targetFrame = getArenaFrame(targetIdx, target);
    const arena = document.getElementById('battleArena');

    attacker.def = false;

    console.log('[ARENA] Action:', action, 'Attacker:', attacker.name, 'Target:', target?.name);

    if(action === 'atk'){
        // Basic attack - PvP balanced damage
        const dmgMult = move ? move.p : 1.0;
        const rawDmg = Math.floor(attacker.st.atk * dmgMult * 0.8);
        const defReduction = target.def ? 0.5 : 1.0;
        const finalDmg = Math.max(1, Math.floor((rawDmg - target.st.def * 0.2) * defReduction)); // v54.6: balanced DEF

        // v54.6: Get move name and animation type for enhanced animations
        const moveName = move?.n || 'Attack';
        const element = attackerType.toLowerCase();
        const attackAnimType = typeof getAttackAnimationType === 'function' ? getAttackAnimationType(moveName, element) : 'slash';

        // v54.5: Full attack animation sequence
        // 1. DASH toward enemy
        const dashDir = attacker.team === 0 ? 'anim-dash-right' : 'anim-dash-left';
        if(attackerFrame) attackerFrame.classList.add(dashDir);

        setTimeout(() => {
            if(attackerFrame) attackerFrame.classList.remove(dashDir);

            // 2. Fire projectile with enhanced animations
            if(attackerFrame && targetFrame){
                // v54.6: Show element trail particles
                if(typeof showElementTrail === 'function') showElementTrail(attackerFrame, targetFrame, element);

                // v54.6: For beam-type attacks, show beam
                if(attackAnimType === 'beam' && typeof showBeamAttack === 'function'){
                    showBeamAttack(attackerFrame, targetFrame, element);
                }

                fireProjectile(attackerFrame, targetFrame, element, () => {
                    // 3. On impact - damage + effects
                    target.curHp = Math.max(0, target.curHp - finalDmg);

                    // Screen shake
                    if(arena) {
                        arena.classList.add('screen-shake');
                        setTimeout(() => arena.classList.remove('screen-shake'), 300);
                    }

                    // Impact effect
                    showImpactEffect(targetFrame, false, element);

                    // v54.6: Move-name based attack animation
                    if(typeof showAttackAnimationByType === 'function'){
                        showAttackAnimationByType(targetFrame, moveName, element, false);
                    }

                    // Hit shake + damage number
                    if(targetEl) targetEl.classList.add('hit-shake');
                    showArenaDamageV2(targetIdx, target, finalDmg, false);

                    arenaBattle.log.unshift({ t: 'atk', m: `⚔️ ${attacker.creatureName} (${attacker.ownerName}) hits ${target.creatureName} (${target.ownerName}) for ${finalDmg} dmg!` });

                    setTimeout(() => {
                        if(targetEl) targetEl.classList.remove('hit-shake');
                        arenaBattle.processing = false;
                        renderMain();
                        arenaNextTurn();
                    }, 400);
                });
            } else {
                // Fallback if elements not found
                target.curHp = Math.max(0, target.curHp - finalDmg);
                arenaBattle.log.unshift({ t: 'atk', m: `⚔️ ${attacker.creatureName} (${attacker.ownerName}) hits ${target.creatureName} (${target.ownerName}) for ${finalDmg} dmg!` });
                arenaBattle.processing = false;
                renderMain();
                arenaNextTurn();
            }
        }, 250);

    } else if(action === 'def'){
        // Defend - Gain focus and reduce incoming damage
        attacker.def = true;
        attacker.focus = Math.min(attacker.focusMax, attacker.focus + 5);

        // v54.6: Enhanced defend animation with name-based variants
        const defMove = getMove(attacker.cid, attacker.lv, 'def');
        const defMoveName = defMove?.n || 'Defend';
        const element = attackerType.toLowerCase();

        if(attackerEl) attackerEl.classList.add('defend-glow');

        // Use name-based defend animation if available
        if(typeof showDefendAnimation === 'function'){
            showDefendAnimation(attackerFrame, defMoveName, element);
        } else {
            showDefendEffect(attackerFrame);
        }

        arenaBattle.log.unshift({ t: 'def', m: `🛡️ ${attacker.creatureName} (${attacker.ownerName}) uses ${defMoveName}!` });

        setTimeout(() => {
            if(attackerEl) attackerEl.classList.remove('defend-glow');
            arenaBattle.processing = false;
            renderMain();
            arenaNextTurn();
        }, 600);

    } else if(action === 'heal'){
        // Heal move
        const healMove = getMove(attacker.cid, attacker.lv, 'heal');
        if(!healMove || attacker.focus < (healMove.f || 0)){
            arenaBattle.processing = false;
            return;
        }

        attacker.focus -= healMove.f || 0;

        // v54.6: Enhanced heal with level scaling
        const baseHealPct = healMove.p || 0.3;
        const levelBonus = 1 + (attacker.lv * 0.015); // +1.5% per level
        let healAmt = Math.floor(attacker.maxHp * baseHealPct * levelBonus);

        // v54.6: Emergency heal bonus (+25% when below 30% HP)
        const isEmergency = attacker.curHp < attacker.maxHp * 0.3;
        if(isEmergency) healAmt = Math.floor(healAmt * 1.25);

        attacker.curHp = Math.min(attacker.maxHp, attacker.curHp + healAmt);

        // v54.6: Enhanced heal animation with name-based variants
        const healMoveName = healMove?.n || 'Heal';
        const element = attackerType.toLowerCase();

        if(attackerEl) attackerEl.classList.add('heal-glow');

        // Use name-based heal animation if available
        if(typeof showHealAnimationByType === 'function'){
            showHealAnimationByType(attackerFrame, healMoveName, element, isEmergency);
        } else {
            showHealEffect(attackerFrame);
        }
        showArenaHealV2(cur.idx, attacker, healAmt);

        arenaBattle.log.unshift({ t: 'heal', m: `💚 ${attacker.creatureName} (${attacker.ownerName}) uses ${healMoveName} - ${healAmt} HP!${isEmergency?' (Emergency!)':''}` });

        setTimeout(() => {
            if(attackerEl) attackerEl.classList.remove('heal-glow');
            arenaBattle.processing = false;
            renderMain();
            arenaNextTurn();
        }, 700);

    } else if(action === 'spec'){
        // Special attack
        const specMove = getMove(attacker.cid, attacker.lv, 'spec');
        if(!specMove) { arenaBattle.processing = false; return; }

        const evoStage = getEvo(attacker.cid, attacker.lv);
        const specCost = calculateSpecialCost(evoStage, specMove.p * 100, specMove.n, false);

        if(attacker.focus < specCost || attacker.cooldown > 0){
            arenaBattle.processing = false;
            return;
        }

        attacker.focus -= specCost;
        attacker.cooldown = 3;

        const specType = getSpecialType(specMove.n);
        const isAOE = specType.isAOE;
        const dmgMult = specMove.p;
        const rawDmg = Math.floor(attacker.st.atk * dmgMult * 1.2);

        // v54.6: Get animation type for specials
        const element = attackerType.toLowerCase();
        const specAnimType = typeof getAttackAnimationType === 'function' ? getAttackAnimationType(specMove.n, element) : 'projectile';

        // v54.5: Special charge-up animation
        if(attackerFrame) attackerFrame.classList.add('special-charge');

        setTimeout(() => {
            // Special dash
            const dashDir = attacker.team === 0 ? 'anim-special-dash' : 'anim-dash-left';
            if(attackerFrame) {
                attackerFrame.classList.remove('special-charge');
                attackerFrame.classList.add(dashDir);
            }

            setTimeout(() => {
                if(attackerFrame) attackerFrame.classList.remove(dashDir);

                if(isAOE){
                    // v54.5: AOE - screen shake + hit all enemies
                    if(arena) {
                        arena.classList.add('screen-shake');
                        setTimeout(() => arena.classList.remove('screen-shake'), 400);
                    }

                    // v54.6: Show beam for AOE beam-type attacks
                    if(specAnimType === 'beam' && typeof showBeamAttack === 'function' && validTargets.length > 0){
                        const firstTarget = validTargets[0];
                        const firstFrame = getArenaFrame(arenaBattle.combatants.indexOf(firstTarget), firstTarget);
                        showBeamAttack(attackerFrame, firstFrame, element);
                    }

                    validTargets.forEach((t, i) => {
                        const tIdx = arenaBattle.combatants.indexOf(t);
                        const aoeDmg = Math.floor(rawDmg * 0.7);
                        const defReduction = t.def ? 0.5 : 1.0;
                        const finalDmg = Math.max(1, Math.floor((aoeDmg - t.st.def * 0.25) * defReduction));
                        t.curHp = Math.max(0, t.curHp - finalDmg);

                        const tEl = getArenaEl(tIdx, t);
                        const tFrame = getArenaFrame(tIdx, t);

                        setTimeout(() => {
                            if(tEl) tEl.classList.add('hit-shake');
                            showImpactEffect(tFrame, true, element);
                            // v54.6: Use name-based animation
                            if(typeof showAttackAnimationByType === 'function'){
                                showAttackAnimationByType(tFrame, specMove.n, element, true);
                            }
                            showArenaDamageV2(tIdx, t, finalDmg, true);
                        }, i * 100);
                    });
                    arenaBattle.log.unshift({ t: 'spec', m: `⚡ ${attacker.creatureName} (${attacker.ownerName}) uses ${specMove.n} - AoE!` });
                } else {
                    // v54.5: Single target special with projectile
                    if(attackerFrame && targetFrame){
                        // v54.6: Show element trail
                        if(typeof showElementTrail === 'function') showElementTrail(attackerFrame, targetFrame, element);

                        // v54.6: For beam-type specials, show beam
                        if(specAnimType === 'beam' && typeof showBeamAttack === 'function'){
                            showBeamAttack(attackerFrame, targetFrame, element);
                        }

                        fireProjectile(attackerFrame, targetFrame, element, () => {
                            const defReduction = target.def ? 0.5 : 1.0;
                            const finalDmg = Math.max(1, Math.floor((rawDmg - target.st.def * 0.2) * defReduction)); // v54.6: balanced DEF
                            target.curHp = Math.max(0, target.curHp - finalDmg);

                            // Big screen shake for special
                            if(arena) {
                                arena.classList.add('screen-shake');
                                setTimeout(() => arena.classList.remove('screen-shake'), 400);
                            }

                            showImpactEffect(targetFrame, true, element);
                            // v54.6: Use name-based animation
                            if(typeof showAttackAnimationByType === 'function'){
                                showAttackAnimationByType(targetFrame, specMove.n, element, true);
                            }
                            if(targetEl) targetEl.classList.add('hit-shake');
                            showArenaDamageV2(targetIdx, target, finalDmg, true);
                            arenaBattle.log.unshift({ t: 'spec', m: `⚡ ${attacker.creatureName} (${attacker.ownerName}) uses ${specMove.n} on ${target.creatureName} (${target.ownerName}) - ${finalDmg} dmg!` });
                        });
                    }
                }

                setTimeout(() => {
                    document.querySelectorAll('.hit-shake').forEach(el => el.classList.remove('hit-shake'));
                    arenaBattle.processing = false;
                    renderMain();
                    arenaNextTurn();
                }, 600);
            }, 300);
        }, 500);
    }
}

// ============================================
// ARENA BATTLE UI - v54.5: Visually matches main battle UI
// ============================================
function renderArenaBattle(m){
    if(!arenaBattle){
        currentScreen = 'arena';
        renderArena(m);
        return;
    }

    console.log('[ARENA] Rendering arena battle UI (v54.5 unified styling)');

    const cur = arenaBattle.turnQueue[arenaBattle.turnIdx];
    const activeCombatant = cur ? arenaBattle.combatants[cur.idx] : null;
    const isTargeting = arenaBattle.targetingMode !== null;
    const activeIdx = cur ? cur.idx : -1;

    // Use same container class as main battle
    let html = `<div class="battle-container" id="battleArena" style="background-image:url('${G}/Backgrounds/Backgrounds_VolcanoArena.png')">`;

    // Header - same structure as main battle
    html += `<div class="battle-header">
        <div class="battle-type">⚔️ ${ARENA_MODES[arenaBattle.mode].name.toUpperCase()}</div>
        <button onclick="forfeitArenaBattle()" style="background:#f87171;color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:.7rem;">🏳️ Forfeit</button>
    </div>`;

    // Turn order bar - same structure as main battle
    html += `<div class="turn-order-bar">`;
    const upcomingTurns = arenaBattle.turnQueue.slice(arenaBattle.turnIdx, Math.min(arenaBattle.turnIdx + 7, arenaBattle.turnQueue.length));
    upcomingTurns.forEach((turn, offset) => {
        const combatant = arenaBattle.combatants[turn.idx];
        const isActive = offset === 0;
        const isKO = combatant.curHp <= 0;
        // Add team indicator as subtle border color
        const teamClass = arenaBattle.isFFA ? '' : (combatant.team === 0 ? 'arena-team-red' : 'arena-team-blue');

        let portraitClass = `turn-order-portrait player ${teamClass}`;
        if(isActive) portraitClass += ' active';
        if(isKO) portraitClass += ' ko';

        const displayName = (combatant.name || 'Hero').length > 8 ?
            (combatant.name || 'Hero').substring(0, 7) + '…' :
            (combatant.name || 'Hero');

        html += `<div class="${portraitClass}">
            <img src="${getImg(combatant.cid, combatant.lv)}" onerror="this.style.opacity='0.3'">
            <span class="turn-order-name">${displayName}</span>
        </div>`;
    });
    html += `</div>`;

    // Battle Arena - same structure as main battle
    html += `<div class="battle-arena">`;

    if(arenaBattle.isFFA){
        // FFA - Use player-arena layout for all combatants
        const partySize = arenaBattle.combatants.length;
        const numColumns = partySize <= 3 ? 1 : partySize <= 6 ? 2 : 3;

        let partyClass = 'player-arena';
        if(partySize <= 2) partyClass += ' solo-party';
        else if(partySize === 3) partyClass += ' small-party';
        else if(partySize <= 6) partyClass += ' medium-party';
        else partyClass += ' large-party';

        html += `<div class="${partyClass}" style="width:100%">`;

        // Distribute into columns
        const columns = [[],[],[]];
        arenaBattle.combatants.forEach((combatant, i) => {
            const colIdx = i % numColumns;
            columns[colIdx].push({...combatant, idx: i});
        });

// FIREWORKS ANIMATION
// ============================================
let fireworksActive = false;
let fireworksParticles = [];
let fireworksAnimFrame = null;
let fireworksInterval = null; // v54.4: Store interval globally for proper cleanup

function startFireworks(){
    const canvas = document.getElementById('fireworksCanvas');
    if(!canvas){
        console.warn('Fireworks canvas not found');
        return;
    }

    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Clear any existing fireworks
    stopFireworks();

    fireworksActive = true;
    fireworksParticles = [];

    // Launch fireworks at intervals - v54.4: Store globally for cleanup
    fireworksInterval = setInterval(() => {
        if(!fireworksActive){
            clearInterval(fireworksInterval);
            fireworksInterval = null;
            return;
        }
        launchFirework(canvas, ctx);
    }, 400);

    // Initial burst
    for(let i = 0; i < 5; i++){
        setTimeout(() => launchFirework(canvas, ctx), i * 100);
    }

    // Animation loop
    function animate(){
        if(!fireworksActive) return;

        // v54.4: CLEAR canvas instead of filling with black (was causing black screen bug)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        fireworksParticles = fireworksParticles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05; // gravity
            p.life -= 0.02;
            p.size *= 0.98;

            if(p.life <= 0) return false;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
            ctx.fill();

            // Trail
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3);
            ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${p.life * 0.5})`;
            ctx.lineWidth = p.size * 0.5;
            ctx.stroke();

            return true;
        });

        fireworksAnimFrame = requestAnimationFrame(animate);
    }

    animate();
}

function launchFirework(canvas, ctx){
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = canvas.height * 0.3 + Math.random() * canvas.height * 0.3;
    const hue = Math.random() * 360;
    const particleCount = 50 + Math.floor(Math.random() * 30);

    for(let i = 0; i < particleCount; i++){
        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.5;
        const speed = 2 + Math.random() * 4;

        fireworksParticles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            hue: hue + Math.random() * 30 - 15,
            life: 1,
            size: 3 + Math.random() * 2
        });
    }
}

function stopFireworks(){
    fireworksActive = false;

    // v54.4: Clear animation frame
    if(fireworksAnimFrame){
        cancelAnimationFrame(fireworksAnimFrame);
        fireworksAnimFrame = null;
    }

    // v54.4: Clear interval - THIS WAS MISSING!
    if(fireworksInterval){
        clearInterval(fireworksInterval);
        fireworksInterval = null;
    }

    fireworksParticles = [];
    debugLog('COMBAT', 'Fireworks stopped');
}

// v54.4: REST FUNCTION - Restore all HP and Focus for the party
function restParty(){
    const active = getActiveStudents().filter(s => s.cid);
    if(!active.length) return;

    let healedCount = 0;
    active.forEach(s => {
        const lv = getLv(s.xp);
        const st = getStats(s.cid, lv, s.nature);
        const wasWounded = s.curHp !== undefined && s.curHp < st.hp;

        // Restore to full HP and starting focus
        s.curHp = st.hp;
        s.curFocus = STARTING_FOCUS;

        if(wasWounded) healedCount++;
    });

    save();
    renderMain();

    // Show feedback
    if(healedCount > 0){
        addStoryLog(`💤 The party rested! ${healedCount} creature${healedCount > 1 ? 's' : ''} fully healed.`, 'special');
    }

    debugLog('PARTY', `REST: ${active.length} creatures restored to full HP and ${STARTING_FOCUS} Focus`);
}

// Check if any party member needs healing
function partyNeedsRest(){
    const active = getActiveStudents().filter(s => s.cid);
    return active.some(s => {
        if(s.curHp === undefined) return false;
        const lv = getLv(s.xp);
        const st = getStats(s.cid, lv, s.nature);
        return s.curHp < st.hp;
    });
}

let shopCategory = 'consumables'; // Track active category
let selectedStudent = null; // Track selected student for purchases

function renderShop(m){
    const active = getActiveStudents();
    if(!active.length){
        m.innerHTML = `<div class="no-students"><h3>No Active Students</h3><p>Add students in the Teacher panel first!</p></div>`;
        return;
    }
    
    // Auto-select first student if none selected
    if(!selectedStudent || !active.find(s => s.id === selectedStudent)){
        selectedStudent = active[0].id;
    }
    
    const student = state.students.find(s => s.id === selectedStudent);
    const currentChapter = getCurrentChapter();
    
    // Update shop chapter if needed
    if(state.shop.unlockedChapter < currentChapter){
        state.shop.unlockedChapter = currentChapter;
    }
    
    // Check if limited-time needs refresh
    checkLimitedTimeRefresh();
    
    let html = `
        <div class="shop-container">
            <h2 class="section-title">🛒 Arcane Shop</h2>
            
            <!-- Student Selector + Coin Display -->
            <div class="shop-header">
                <div class="shop-student-selector">
                    <label>Shopping for:</label>
                    <select onchange="selectShopStudent(this.value)" class="shop-select">
                        ${active.map(s => `<option value="${s.id}" ${s.id === selectedStudent ? 'selected' : ''}>${s.name || 'Student'}</option>`).join('')}
                    </select>
                </div>
                <div class="shop-coins">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-amount">${student.coins}</span>
                    <span class="coin-label">Coins</span>
                </div>
            </div>
            
            <!-- Category Tabs -->
            <div class="shop-categories">
                <button class="shop-cat-btn ${shopCategory === 'consumables' ? 'active' : ''}" onclick="selectShopCategory('consumables')">
                    ⚗️ Consumables
                </button>
                <button class="shop-cat-btn ${shopCategory === 'equipment' ? 'active' : ''}" onclick="selectShopCategory('equipment')">
                    🛡️ Equipment
                </button>
                <button class="shop-cat-btn ${shopCategory === 'real_rewards' ? 'active' : ''}" onclick="selectShopCategory('real_rewards')">
                    ⭐ Real Rewards
                </button>
                <button class="shop-cat-btn ${shopCategory === 'classroom' ? 'active' : ''}" onclick="selectShopCategory('classroom')">
                    🏫 Classroom
                </button>
            </div>
            
            <!-- Items Grid -->
            <div class="shop-grid">
    `;
    
    // Filter items by category
    let items = [];
    if(shopCategory === 'consumables'){
        items = SHOP_ITEMS.filter(i => i.type === 'consumable');
    } else if(shopCategory === 'equipment'){
        items = SHOP_ITEMS.filter(i => i.type === 'equipment');
    } else if(shopCategory === 'real_rewards'){
        items = REAL_REWARDS;
    } else if(shopCategory === 'classroom'){
        items = CLASSROOM_REWARDS;
    }
    
    // Render item cards
    items.forEach(item => {
        const rarity = RARITY[item.rarity];
        const locked = item.chapterMin > currentChapter;
        const canAfford = student.coins >= getItemPrice(item);
        const price = getItemPrice(item);
        
        // Check if classroom reward
        const isClassroom = item.type === 'classroom_reward';
        const contributions = state.classroomRewards[item.id]?.contributions || [];
        const totalRaised = contributions.reduce((sum, c) => sum + c.amount, 0);
        const progress = Math.min(100, (totalRaised / price) * 100);
        
        html += `
            <div class="shop-item-card ${locked ? 'locked' : ''}" style="border-color: ${rarity.color}; box-shadow: 0 0 15px ${rarity.glow};">
                <div class="shop-item-rarity" style="background: ${rarity.color};">${rarity.name}</div>
                ${locked ? '<div class="shop-item-lock">🔒 Ch.' + item.chapterMin + '</div>' : ''}
                
                <div class="shop-item-icon">${item.icon}</div>
                <div class="shop-item-name">${item.name}</div>
                <div class="shop-item-desc">${item.desc}</div>
                
                ${isClassroom ? `
                    <div class="shop-classroom-progress">
                        <div class="shop-progress-bar">
                            <div class="shop-progress-fill" style="width:${progress}%"></div>
                        </div>
                        <div class="shop-progress-text">${totalRaised} / ${price} 🪙</div>
                        ${contributions.length > 0 ? `
                            <div class="shop-contributors">
                                ${contributions.slice(0, 3).map(c => `<span title="${c.name}: ${c.amount}">${c.name.charAt(0)}</span>`).join('')}
                                ${contributions.length > 3 ? `<span>+${contributions.length - 3}</span>` : ''}
                            </div>
                        ` : ''}
                    </div>
                ` : ''}
                
                <div class="shop-item-price">
                    <span class="price-amount">${price}</span>
                    <span class="price-coin">🪙</span>
                </div>
                
                ${locked ? '' : (isClassroom ? `
                    <button class="shop-buy-btn ${canAfford ? '' : 'disabled'}" 
                        ${canAfford ? `onclick="contributeToClassroom('${item.id}')"` : `onclick="showErrorFeedback(null, '❌ Not enough 🪙! Need ${price - student.coins} more.')" disabled`}>
                        Contribute
                    </button>
                ` : `
                    <button class="shop-buy-btn ${canAfford ? '' : 'disabled'}" 
                        ${canAfford ? `onclick="buyItem('${item.id}')"` : `onclick="showErrorFeedback(null, '❌ Not enough 🪙! Need ${price - student.coins} more.')" disabled`}>
                        ${item.type === 'real_reward' ? 'Redeem' : 'Buy'}
                    </button>
                `)}
            </div>
        `;
    });
    
    html += `
            </div>
        </div>
    `;
    
    m.innerHTML = html;
}

// Shop helper functions
function selectShopStudent(studentId){
    selectedStudent = parseInt(studentId);
    renderMain();
}

function selectShopCategory(category){
    shopCategory = category;
    renderMain();
}

function getItemPrice(item){
    // Check for price overrides
    if(state.shopConfig.priceOverrides[item.id]){
        return state.shopConfig.priceOverrides[item.id];
    }

    // ============================================
    // TIERED PRICE MULTIPLIERS (Economy Rebalancing)
    // ============================================
    // With coin splitting, prices adjusted to maintain balance:
    // - Battle items: 2x (frequently purchased, strategic spending)
    // - Real rewards: 1.5x common, 2x rare (special treats, attainable)
    // - Classroom rewards: 1.5x (group effort, fair contribution)

    let price = item.cost;

    if(item.type === 'consumable' || item.type === 'equipment'){
        // Battle items - moderate increase
        price *= 2;
    } else if(item.type === 'real_reward'){
        // Real-life rewards - scaled by rarity
        if(item.rarity === 'LEGENDARY' || item.rarity === 'EPIC'){
            price *= 2; // Rare rewards
        } else {
            price *= 1.5; // Common rewards
        }
        // Also apply teacher multiplier if set
        price *= state.shopConfig.realRewardPriceMultiplier;
    } else if(item.type === 'classroom_reward'){
        // Classroom rewards - shared cost
        price *= 1.5;
    }

    return Math.floor(price);
}

function buyItem(itemId){
    const student = state.students.find(s => s.id === selectedStudent);
    if(!student) return;
    
    // Find item in all catalogs
    const item = [...SHOP_ITEMS, ...REAL_REWARDS].find(i => i.id === itemId);
    if(!item) return;
    
    const price = getItemPrice(item);
    
    // Check affordability with visual feedback
    if(student.coins < price){
        showErrorFeedback(null, `❌ Not enough 🪙! Need ${price - student.coins} more.`);
        
        // Flash the coin display
        const coinDisplay = document.querySelector('.shop-coins');
        if(coinDisplay) flashElement(coinDisplay, '#f87171');
        
        return;
    }
    
    // Confirmation
    const confirmMsg = item.type === 'real_reward' ? 
        `Redeem "${item.name}" for ${price} 🪙?\n\nYou'll need to fulfill this reward manually.` :
        `Buy "${item.name}" for ${price} 🪙?`;
    
    if(!confirm(confirmMsg)) return;
    
    // Deduct coins
    student.coins -= price;
    
    // Add to inventory or log
    if(item.type === 'real_reward'){
        // Log real reward purchase
        state.realRewardLog.push({
            id: Date.now().toString(), // String for consistency
            studentId: student.id,
            studentName: student.name || 'Student',
            rewardId: item.id,
            rewardName: item.name,
            cost: price,
            timestamp: new Date().toLocaleString(),
            completed: false,
            notes: `Redeemed by: ${student.name || 'Student'}`
        });
        showToast(`✅ ${item.name} redeemed! Check Teacher panel to fulfill.`, 'success');
    } else {
        // Add to inventory
        student.inventory[itemId] = (student.inventory[itemId] || 0) + 1;
        showToast(`✅ Purchased ${item.name}!`, 'success');
        playSound('coin');
    }
    
    // Log purchase
    state.shopLog.push({
        timestamp: new Date().toLocaleString(),
        studentId: student.id,
        studentName: student.name || 'Student',
        itemId: item.id,
        itemName: item.name,
        cost: price,
        type: item.type
    });
    
    save();
    renderMain();
}

function contributeToClassroom(rewardId){
    const student = state.students.find(s => s.id === selectedStudent);
    if(!student) return;
    
    const reward = CLASSROOM_REWARDS.find(r => r.id === rewardId);
    if(!reward) return;
    
    const price = getItemPrice(reward);
    const currentContributions = state.classroomRewards[rewardId]?.contributions || [];
    const totalRaised = currentContributions.reduce((sum, c) => sum + c.amount, 0);
    const remaining = price - totalRaised;
    
    // Prompt for contribution amount
    const maxContrib = Math.min(student.coins, remaining);
    const amount = prompt(`Contribute to "${reward.name}"\n\nYou have: ${student.coins} 🪙\nStill needed: ${remaining} 🪙\n\nEnter amount (max ${maxContrib}):`);
    
    if(!amount || isNaN(amount)) return;
    const contrib = Math.min(maxContrib, Math.max(1, parseInt(amount)));
    
    if(contrib > student.coins){
        showErrorFeedback(null, `❌ Not enough 🪙! You only have ${student.coins}.`);
        
        const coinDisplay = document.querySelector('.shop-coins');
        if(coinDisplay) flashElement(coinDisplay, '#f87171');
        
        return;
    }
    
    // Deduct coins
    student.coins -= contrib;
    
    // Add contribution
    if(!state.classroomRewards[rewardId]){
        state.classroomRewards[rewardId] = {contributions: [], totalRaised: 0};
    }
    
    state.classroomRewards[rewardId].contributions.push({
        studentId: student.id,
        name: student.name || 'Student',
        amount: contrib,
        timestamp: new Date().toLocaleString()
    });
    
    state.classroomRewards[rewardId].totalRaised = (state.classroomRewards[rewardId].totalRaised || 0) + contrib;
    
    showToast(`✅ Contributed ${contrib} 🪙 to ${reward.name}!`, 'success');
    playSound('coin');
    
    // Check if fully funded
    const newTotal = currentContributions.reduce((sum, c) => sum + c.amount, 0) + contrib;
    if(newTotal >= price){
        showToast(`🎉 ${reward.name} is fully funded! Check Teacher panel to redeem.`, 'success');
    }
    
    save();
    renderMain();
}

                                    ${canUse ? `
                                        <button class="inventory-use-btn" onclick="useItem(${studentId}, '${id}')">
                                            Use
                                        </button>
                                    ` : `
                                        <div class="inventory-use-disabled">
                                            ${getUseRestriction(student, item)}
                                        </div>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `}
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', html);
}

function closeInventory(event){
    if(event && event.target.className !== 'inventory-overlay' && event.target.className !== 'inventory-close') return;
    const overlay = document.querySelector('.inventory-overlay');
    if(overlay) overlay.remove();
}

function canUseItem(student, item){
    // Real rewards can't be "used" - they're redeemed at purchase
    if(item.type === 'real_reward') return false;
    
    // Equipment must be equipped, not "used"
    if(item.type === 'equipment') return false;
    
    // Check if student has a creature
    if(!student.cid) return false;
    
    // Battle-only items (check if in battle)
    if(item.effect.type === 'revive') return true; // Revive works outside battle
    
    // All consumables can be used outside battle
    return true;
}

function getUseRestriction(student, item){
    if(item.type === 'real_reward') return 'Redeemed';
    if(item.type === 'equipment') return 'Equip in Battle';
    if(!student.cid) return 'Need Creature';
    return 'Cannot Use';
}

function useItem(studentId, itemId){
    const student = state.students.find(s => s.id === studentId);
    if(!student || !student.inventory[itemId]) return;
    
    const item = [...SHOP_ITEMS, ...REAL_REWARDS].find(i => i.id === itemId);
    if(!item) return;
    
    // Check if can use
    if(!canUseItem(student, item)){
        showErrorFeedback(null, '❌ Cannot use this item right now!');
        return;
    }
    
    // Apply item effect
    const success = applyItemEffect(student, item);
    
    if(success){
        // Consume item
        student.inventory[itemId]--;
        if(student.inventory[itemId] <= 0){
            delete student.inventory[itemId];
        }
        
        save();
        
        // Close and reopen inventory to refresh
        closeInventory();
        setTimeout(() => openInventory(studentId), 100);
        
        playSound('levelup'); // Use existing sound
    }
}

function applyItemEffect(student, item){
    const effect = item.effect;
    const lv = getLv(student.xp);
    const stats = getStats(student.cid, lv, student.nature);
    
    // Create a temporary member object for effect application
    let tempMember = {
        name: student.name,
        cid: student.cid,
        lv: lv,
        maxHp: stats.hp,
        curHp: stats.hp, // Assume full HP outside battle
        focus: STARTING_FOCUS, // v54.1 - use constants
        focusMax: MAX_FOCUS,
        st: stats
    };
    
    switch(effect.type){
        case 'heal':
            const healAmount = Math.floor(tempMember.maxHp * effect.value);
            tempMember.curHp = Math.min(tempMember.maxHp, tempMember.curHp + healAmount);
            showToast(`✅ Healed ${student.name} for ${healAmount} HP!`, 'success');
            // Note: This doesn't persist outside battle, but that's OK - just a demo
            return true;
            
        case 'focus':
            tempMember.focus = Math.min(tempMember.focusMax, tempMember.focus + effect.value);
            showToast(`✅ Restored ${effect.value} Focus!`, 'success');
            return true;
            
        case 'heal_focus':
            const hpHeal = Math.floor(tempMember.maxHp * effect.hpPercent);
            tempMember.curHp = Math.min(tempMember.maxHp, tempMember.curHp + hpHeal);
            tempMember.focus = Math.min(tempMember.focusMax, tempMember.focus + effect.focus);
            showToast(`✅ Healed ${hpHeal} HP and ${effect.focus} Focus!`, 'success');
            return true;
            
        case 'revive':
            showToast('❌ Revive can only be used in battle on KO\'d allies!', 'error');
            return false;
            
        case 'level_up':
            // RARE CANDY - Force level up
            if(lv >= 50){
                showToast('❌ Already at max level!', 'error');
                return false;
            }
            
            // Set XP to start of next level
            const nextLevelXP = XP_TABLE[lv]; // XP_TABLE[lv] is the XP needed for level lv+1
            student.xp = nextLevelXP;
            
            showToast(`✨ ${student.name} leveled up to Level ${lv + 1}!`, 'success');
            playSound('victory');
            
            // Show level-up popup if function exists
            if(typeof showLevelUpPopup === 'function'){
                const oldStats = getStats(student.cid, lv, student.nature);
                const newStats = getStats(student.cid, lv + 1, student.nature);
                setTimeout(() => {
                    showLevelUpPopup(student, lv, lv + 1, oldStats, newStats);
                }, 500);
            }
            
            renderMain();
            return true;
            
        case 'xp_multiplier':
            student.xpBoostAdventures = effect.adventures;
            showToast(`✅ ${effect.value}x XP for next ${effect.adventures} adventures!`, 'success');
            return true;
            
        case 'coin_boost':
            student.coinBoostAdventures = effect.adventures;
            showToast(`✅ +20% 🪙 for next ${effect.adventures} adventures!`, 'success');
            return true;
            
        case 'defend_buff':
        case 'crit_buff':
        case 'damage_buff':
        case 'party_shield':
        case 'focus_regen_buff':
            // v54.6: Store buff on student for next battle
            if(!student.buffs) student.buffs = [];
            student.buffs.push({
                type: effect.type,
                value: effect.value,
                turns: effect.turns || 0,
                battles: effect.battles || 1
            });
            const buffNames = {
                'defend_buff': '🛡️ Defense Up',
                'crit_buff': '⚡ Crit Chance Up',
                'damage_buff': '⚔️ Damage Up',
                'party_shield': '🔰 Party Shield',
                'focus_regen_buff': '🔷 Focus Regen Up'
            };
            showToast(`✅ ${buffNames[effect.type] || 'Buff'} applied! Will take effect in next battle.`, 'success');
            return true;
            
        default:
            showToast('Item effect not yet implemented!', 'error');
            return false;
    }
}
